<!doctype html>
<!-- Modello della presentazione: build.js sostituisce i testi (segnaposti tra doppie graffe, da
     STRINGS in build.js) e i dati e scrive docs/<lingua>/<file>.html. Non
     modificare la pagina generata. -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Browser · Guida</title>
<link rel="icon" href="../../assets/icon.png">
<style>
  :root {
    --bg: #141414; --sheet: #1b1b1b; --line: #2c2c2c; --text: #e8e8e8; --muted: #9a9a9a;
    --accent: #f0a030; --accent-text: #f5b750; --on-accent: #111; --mark: #e5262b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, sans-serif; }
  a { color: var(--accent-text); }
  code { font-family: ui-monospace, monospace; font-size: .9em; padding: 1px 5px; border-radius: 4px; background: #262626; }
  strong { color: #fff; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Numeri come nelle schermate: bianco su cerchio rosso. */
  .num { display: inline-flex; align-items: center; justify-content: center; width: 1.45em; height: 1.45em;
         margin: 0 .1em; border-radius: 50%; background: var(--mark); color: #fff; border: 2px solid #fff;
         font-size: .72em; font-weight: 700; line-height: 1; vertical-align: .12em; }

  /* ---------- menu ---------- */
  #menu { max-width: 1100px; margin: 0 auto; padding: 48px 32px 64px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { height: 56px; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; color: var(--muted); }
  .legend { margin: 28px 0 32px; padding: 12px 16px; border-left: 3px solid var(--mark); background: var(--sheet);
            color: #cfcfcf; border-radius: 0 6px 6px 0; }
  .legend .box { display: inline-block; width: 1.3em; height: .9em; border: 2px solid var(--mark); border-radius: 4px; vertical-align: -.05em; }
  #guides { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
            list-style: none; margin: 0; padding: 0; counter-reset: guide; }
  #guides a { display: flex; flex-direction: column; height: 100%; padding: 18px 20px; border: 1px solid var(--line);
              border-radius: 10px; background: var(--sheet); color: inherit; text-decoration: none;
              transition: border-color .15s, transform .15s; }
  #guides a:hover, #guides a:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  #guides .n { color: var(--accent-text); font-weight: 700; font-size: 14px; }
  #guides h2 { margin: 4px 0 8px; font-size: 19px; font-weight: 600; line-height: 1.3; }
  #guides p { margin: 0 0 14px; color: #bdbdbd; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #guides .count { margin-top: auto; }
  #guides .count { color: var(--muted); font-size: 13px; }

  /* ---------- slide ---------- */
  #deck { display: flex; flex-direction: column; height: 100%; }
  #deck header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: #0e0e0e; }
  #deck header .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid #3a3a3a;
         border-radius: 6px; background: #232323; text-decoration: none; color: var(--text); white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  #slide { flex: 1; min-height: 0; padding: 28px 36px; overflow: auto; }
  #slide.with-image { display: grid; grid-template-columns: minmax(300px, 36%) 1fr; gap: 36px; align-items: center; }
  #slide.text-only { display: flex; align-items: center; justify-content: center; }
  #slide .text { max-height: 100%; overflow: auto; }
  #slide.text-only .text { max-width: 760px; font-size: 19px; }
  #slide .section { margin: 0 0 4px; color: var(--accent-text); font-size: 14px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  #slide h2 { margin: 0 0 14px; font-size: 26px; font-weight: 600; line-height: 1.25; }
  #slide.intro h2 { font-size: 34px; }
  #slide p { margin: 0 0 12px; }
  #slide ul { margin: 0 0 12px; padding-left: 1.2em; }
  #slide li { margin-bottom: 8px; }
  #slide blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--sheet); border-radius: 0 6px 6px 0; color: #d4d4d4; }
  #slide figure { margin: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  #slide figure img { display: block; max-width: 100%; max-height: calc(100% - 2.2em); margin: 0 auto; object-fit: contain;
                      border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); cursor: zoom-in; }
  #slide figcaption { margin-top: 10px; text-align: center; color: var(--muted); font-size: 14px; }
  #deck footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); background: #0e0e0e; }
  #dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; background: #444; }
  #dots button[aria-current="true"] { background: var(--accent); }
  #pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  #slide.enter { animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateX(var(--from, 16px)); } }

  /* Immagine a tutto schermo */
  #zoom { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
          padding: 24px; background: rgba(0, 0, 0, .88); cursor: zoom-out; }
  #zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  @media (max-width: 820px) {
    #slide.with-image { grid-template-columns: 1fr; align-items: start; }
    #slide figure { height: auto; }
    #slide figure img { max-height: none; }
    #dots { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #slide.enter { animation: none; } #guides a { transition: none; } }
</style>
</head>
<body>

<main id="menu" hidden>
  <div class="brand">
    <img src="../../assets/logo.png" alt="">
    <div>
      <h1>Overlay Browser</h1>
      <p>Guida all'uso, passo per passo</p>
    </div>
  </div>
  <p class="legend">Nelle schermate gli elementi citati nel testo sono evidenziati da un riquadro rosso <span class="box"></span>; i numeri come <span class="num">1</span> nel testo indicano l'elemento con lo stesso numero nella schermata.</p>
  <ol id="guides"></ol>
</main>

<div id="deck" hidden>
  <header>
    <a class="btn" href="#" title="Torna all'elenco delle guide (Esc)">☰ Guide</a>
    <span class="title" id="guide-title"></span>
    <span id="pos"></span>
  </header>
  <section id="slide" aria-live="polite"></section>
  <footer>
    <button class="btn" id="prev" title="Slide precedente (←)">← Indietro</button>
    <div id="dots" role="tablist"></div>
    <button class="btn primary" id="next" title="Slide successiva (→)">Avanti →</button>
  </footer>
</div>

<div id="zoom" hidden><img alt=""></div>

<script>
const DATA = {"guides":[{"id":"getting-started","title":"Primo avvio: i siti del tuo gioco a portata di mano","intro":"In questa guida apri Overlay Browser mentre giochi (qui con \u003cstrong>Tiny Glade\u003c/strong>), aggiungi un paio di siti utili e impari a mostrarli e nasconderli senza lasciare il gioco.","slides":[{"heading":null,"html":"\u003cp>In questa guida apri Overlay Browser mentre giochi (qui con \u003cstrong>Tiny Glade\u003c/strong>), aggiungi un paio di siti utili e impari a mostrarli e nasconderli senza lasciare il gioco.\u003c/p>","image":null,"intro":true},{"heading":"1. Avvia l'app","html":"\u003cp>Avvia Overlay Browser: la finestra \u003cstrong>resta nascosta\u003c/strong> e l'app si mette in attesa nell'area di notifica, vicino all'orologio. Non compare nella barra delle applicazioni né in Alt+Tab.\u003c/p>\u003cp>Poi avvia il gioco, in modalità finestra o finestra senza bordi.\u003c/p>","image":null},{"heading":"2. Apri l'overlay sopra il gioco","html":"\u003cp>Mentre giochi premi \u003cstrong>Win+F10\u003c/strong> (Super+F10 su Linux, Cmd+Shift+Spazio su macOS). L'overlay compare sopra il gioco e si apre sulla \u003cstrong>Home\u003c/strong>.\u003c/p>\u003cp>L'overlay ha riconosciuto il gioco: in cima c'è la lista \u003cstrong>Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, \u003cem>attiva\u003c/em> e ancora \u003cem>nuova\u003c/em>. Ogni gioco ha la sua lista di siti, creata quando ci aggiungi il primo sito. Tra le \u003cem>Altre liste\u003c/em> c'è la lista \u003cstrong>Generale\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, usata quando non è aperto nessun gioco; \u003cstrong>Usa\u003c/strong> la rende attiva a mano.\u003c/p>","image":{"src":"img/getting-started/01-empty-home.png","alt":"La Home aperta sopra Tiny Glade, con la lista del gioco ancora vuota"}},{"heading":"3. Aggiungi un sito","html":"\u003cp>Clicca \u003cstrong>+\u003c/strong> \u003cspan class=\"num\">1\u003c/span> nella barra in alto, scrivi l'indirizzo del sito \u003cspan class=\"num\">2\u003c/span> (basta anche \u003ccode>tinyglade.com\u003c/code>) e premi \u003cstrong>Aggiungi\u003c/strong> \u003cspan class=\"num\">3\u003c/span>.\u003c/p>","image":{"src":"img/getting-started/02-add-site.png","alt":"La finestra per aggiungere un sito, con l'indirizzo tinyglade.com"}},{"heading":"3. Aggiungi un sito","html":"\u003cp>Il sito si apre subito nel suo \u003cstrong>tab\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, che prende il nome dal titolo della pagina; la \u003cstrong>×\u003c/strong> lo chiude. Sotto c'è la barra di navigazione, come in un browser: \u003cstrong>indietro, avanti e ricarica\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, l'\u003cstrong>indirizzo\u003c/strong> della pagina \u003cspan class=\"num\">3\u003c/span> (puoi scriverne un altro e premere Invio) e \u003cstrong>Fissa\u003c/strong> \u003cspan class=\"num\">4\u003c/span>, che trasforma in un nuovo tab una pagina che hai raggiunto navigando.\u003c/p>","image":{"src":"img/getting-started/03-site-open.png","alt":"Il sito ufficiale di Tiny Glade aperto nel suo tab"}},{"heading":"4. Aggiungine altri dalla Home","html":"\u003cp>Torna alla \u003cstrong>Home\u003c/strong>: qui vedi i siti della lista. Clicca il \u003cstrong>nome di un sito\u003c/strong> \u003cspan class=\"num\">1\u003c/span> per aprirlo, \u003cstrong>Modifica\u003c/strong> \u003cspan class=\"num\">2\u003c/span> per cambiarne l'indirizzo (Invio per salvare, Esc per annullare) o \u003cstrong>Rimuovi\u003c/strong> \u003cspan class=\"num\">3\u003c/span> per toglierlo dalla lista. Per aggiungere un sito scrivi l'indirizzo nel \u003cstrong>campo sotto la lista\u003c/strong> \u003cspan class=\"num\">4\u003c/span> e premi \u003cem>Aggiungi\u003c/em>: qui abbiamo aggiunto la pagina Steam del gioco.\u003c/p>","image":{"src":"img/getting-started/04-home-with-sites.png","alt":"La Home con i due siti della lista di Tiny Glade"}},{"heading":"5. Passa da un sito all'altro","html":"\u003cp>Ogni sito ha il suo tab nella barra: qui il \u003cstrong>sito ufficiale\u003c/strong> \u003cspan class=\"num\">1\u003c/span> e la \u003cstrong>pagina Steam\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, quella aperta adesso. Cambiando tab e tornando indietro ritrovi la pagina esattamente dove l'avevi lasciata.\u003c/p>","image":{"src":"img/getting-started/05-two-tabs.png","alt":"La pagina Steam di Tiny Glade nel secondo tab"}},{"heading":"6. Torna a giocare","html":"\u003cp>Premi di nuovo \u003cstrong>Win+F10\u003c/strong> per nascondere l'overlay, oppure clicca sulla finestra del gioco: di default l'overlay si nasconde da solo quando perde il focus (si può disattivare dalle Impostazioni).\u003c/p>\u003cp>La prossima volta che apri l'overlay sopra Tiny Glade ritrovi la sua lista, aperta sull'ultimo tab che stavi guardando. Sopra un altro gioco vedrai invece la lista di quel gioco.\u003c/p>","image":null}]},{"id":"free-browsing","title":"Navigazione libera: cerca, trova, fissa","intro":"Il tab \u003cstrong>Naviga\u003c/strong> serve per cercare e aprire qualsiasi pagina senza aggiungerla alla lista. Quando trovi una pagina che vuoi tenere, \u003cstrong>Fissa\u003c/strong> la trasforma in un tab della lista del gioco.","slides":[{"heading":null,"html":"\u003cp>Il tab \u003cstrong>Naviga\u003c/strong> serve per cercare e aprire qualsiasi pagina senza aggiungerla alla lista. Quando trovi una pagina che vuoi tenere, \u003cstrong>Fissa\u003c/strong> la trasforma in un tab della lista del gioco.\u003c/p>\u003cp>Qui continuiamo l'esempio di \u003ca href=\"#getting-started\">Primo avvio\u003c/a>: l'overlay è aperto sopra \u003cstrong>Tiny Glade\u003c/strong>, la cui lista ha già due siti, e cerchiamo una wiki del gioco.\u003c/p>","image":null,"intro":true},{"heading":"1. Apri il tab Naviga","html":"\u003cp>Clicca \u003cstrong>Naviga\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, subito dopo Home. Nel \u003cstrong>campo indirizzo\u003c/strong> \u003cspan class=\"num\">2\u003c/span> puoi scrivere un indirizzo (basta anche \u003ccode>example.com\u003c/code>) oppure un testo qualsiasi da cercare. Come esempio l'overlay propone il \u003cstrong>nome del gioco\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: cliccalo per cercarlo.\u003c/p>","image":{"src":"img/free-browsing/01-browse.png","alt":"Il tab Naviga vuoto, con il campo indirizzo e l'esempio di ricerca \"Tiny Glade\""}},{"heading":"2. Cerca","html":"\u003cp>Scrivi \u003ccode>tiny glade wiki\u003c/code> e premi Invio. La ricerca si apre nel tab, e nel \u003cstrong>campo indirizzo\u003c/strong> \u003cspan class=\"num\">1\u003c/span> compare l'indirizzo della pagina dei risultati.\u003c/p>\u003cp>Il motore di ricerca si sceglie nelle Impostazioni (sezione \u003cem>Comportamento\u003c/em>): Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage o un indirizzo personalizzato. Qui usiamo DuckDuckGo.\u003c/p>\u003cp>Clicca il risultato che ti interessa, qui \u003cstrong>Tiny Glade Wiki\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/02-results.png","alt":"I risultati della ricerca \"tiny glade wiki\", con il link alla Tiny Glade Wiki"}},{"heading":"3. Fissa la pagina","html":"\u003cp>La pagina si apre nel tab Naviga e puoi usarla come in un browser: \u003cstrong>Indietro\u003c/strong> \u003cspan class=\"num\">1\u003c/span> ti riporta ai risultati della ricerca. Per tenerla, clicca \u003cstrong>Fissa\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/03-page-found.png","alt":"La Tiny Glade Wiki aperta nel tab Naviga"}},{"heading":"3. Fissa la pagina","html":"\u003cp>L'overlay chiede conferma: clicca \u003cstrong>Fissa\u003c/strong>.\u003c/p>","image":{"src":"img/free-browsing/04-confirm.png","alt":"La conferma: fissare \"Tiny Glade Wiki\" come nuovo tab della lista \"Tiny Glade\"?"}},{"heading":"4. La pagina è un tab della lista","html":"\u003cp>La pagina, con la sua cronologia, diventa un \u003cstrong>nuovo tab\u003c/strong> \u003cspan class=\"num\">1\u003c/span> in fondo alla lista di Tiny Glade, e da ora la trovi ogni volta che apri l'overlay sopra il gioco. \u003cstrong>Fissa\u003c/strong> \u003cspan class=\"num\">2\u003c/span> ora è disattivato: la pagina è già nella lista.\u003c/p>","image":{"src":"img/free-browsing/05-pinned.png","alt":"La Tiny Glade Wiki nel suo nuovo tab, con Fissa disattivato"}},{"heading":"4. La pagina è un tab della lista","html":"\u003cp>Fissa funziona anche nei tab dei siti: se da un sito raggiungi una pagina che vuoi tenere a parte, Fissa la aggiunge come nuovo tab subito dopo quello del sito. Quando una pagina è già uno dei tab della lista, quel tab viene evidenziato e Fissa è disattivato.\u003c/p>","image":null},{"heading":"5. Il tab Naviga è di nuovo libero","html":"\u003cp>Tornando su \u003cstrong>Naviga\u003c/strong> lo ritrovi vuoto, pronto per una nuova ricerca: la pagina fissata si è spostata nel suo tab. Mentre navighi, il pulsante \u003cstrong>Ritorna alla pagina iniziale\u003c/strong> \u003cspan class=\"num\">1\u003c/span> chiude la pagina aperta e torna alla pagina vuota.\u003c/p>","image":{"src":"img/free-browsing/06-browse-again.png","alt":"Il tab Naviga di nuovo vuoto"}},{"heading":"5. Il tab Naviga è di nuovo libero","html":"\u003cp>Nelle Impostazioni (sezione \u003cem>Comportamento\u003c/em>) puoi anche scegliere una \u003cstrong>pagina iniziale\u003c/strong> per il tab Naviga, aperta al posto della pagina vuota.\u003c/p>","image":null},{"heading":"Indirizzi di altri siti dai tab dei siti","html":"\u003cp>Anche nei tab dei siti puoi scrivere nel campo indirizzo. Un indirizzo dello stesso sito si apre nel tab; un indirizzo di un altro sito, o una ricerca, si apre invece nel tab Naviga, dopo una conferma, così il tab del sito resta sulla sua pagina.\u003c/p>","image":null}]},{"id":"lists-per-game","title":"Una lista per ogni gioco","intro":"Overlay Browser riconosce il gioco sopra cui lo apri e mostra i siti di quel gioco: ogni gioco ha la sua \u003cstrong>lista\u003c/strong>. In questa guida, dopo Primo avvio e Navigazione libera, la lista di \u003cstrong>Tiny Glade\u003c/strong> ha già tre siti; ora giochiamo a \u003cstrong>Brotato\u003c/strong>.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser riconosce il gioco sopra cui lo apri e mostra i siti di quel gioco: ogni gioco ha la sua \u003cstrong>lista\u003c/strong>. In questa guida, dopo \u003ca href=\"#getting-started\">Primo avvio\u003c/a> e \u003ca href=\"#free-browsing\">Navigazione libera\u003c/a>, la lista di \u003cstrong>Tiny Glade\u003c/strong> ha già tre siti; ora giochiamo a \u003cstrong>Brotato\u003c/strong>.\u003c/p>","image":null,"intro":true},{"heading":"1. Un nuovo gioco, una nuova lista","html":"\u003cp>Apri l'overlay mentre giochi a Brotato. In cima alla Home c'è la \u003cstrong>lista di Brotato\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, \u003cem>attiva\u003c/em> e ancora \u003cem>nuova\u003c/em>: accanto al nome vedi il programma riconosciuto e il numero di siti. Aggiungi un sito nel \u003cstrong>campo sotto la lista\u003c/strong> \u003cspan class=\"num\">2\u003c/span> (o con il \u003cstrong>+\u003c/strong> nella barra in alto): la lista viene creata con il primo sito. La \u003cstrong>lista di Tiny Glade\u003c/strong> \u003cspan class=\"num\">3\u003c/span> è tra le \u003cem>Altre liste\u003c/em>, chiusa: cliccala per vederne i siti.\u003c/p>","image":{"src":"img/lists-per-game/01-brotato-new.png","alt":"La Home aperta sopra Brotato: la sua lista nuova e, tra le altre liste, quella di Tiny Glade"}},{"heading":"1. Un nuovo gioco, una nuova lista","html":"\u003cp>Qui aggiungiamo la wiki di Brotato e la sua pagina Steam. Nella barra ora ci sono i loro tab, e solo quelli: i siti di Tiny Glade non compaiono.\u003c/p>","image":{"src":"img/lists-per-game/02-brotato-wiki.png","alt":"I tab della lista di Brotato"}},{"heading":"2. Ogni gioco ritrova i suoi siti","html":"\u003cp>Torna a Tiny Glade e apri l'overlay: nella barra ci sono i \u003cstrong>tab di Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, e la \u003cstrong>lista di Tiny Glade\u003c/strong> \u003cspan class=\"num\">2\u003c/span> è quella attiva. La \u003cstrong>lista di Brotato\u003c/strong> \u003cspan class=\"num\">3\u003c/span> è passata tra le \u003cem>Altre liste\u003c/em>; \u003cstrong>Usa\u003c/strong> \u003cspan class=\"num\">4\u003c/span> la renderebbe attiva a mano (vedi il passo 4). Ogni lista si riapre sull'ultimo tab che stavi guardando.\u003c/p>","image":{"src":"img/lists-per-game/03-tiny-glade.png","alt":"La Home aperta sopra Tiny Glade, con i suoi tab e la lista di Brotato tra le altre"}},{"heading":"3. La lista Generale","html":"\u003cp>Le liste non sono solo per i giochi: l'overlay propone una lista per qualsiasi programma sopra cui lo apri. Quando non riconosce nessuna applicazione è attiva la \u003cstrong>lista Generale\u003c/strong>, un posto per i siti che non riguardano un programma in particolare. Funziona come le altre, ma non si può rimuovere.\u003c/p>","image":{"src":"img/lists-per-game/04-general.png","alt":"La lista Generale, attiva quando non viene riconosciuta nessuna applicazione"}},{"heading":"4. Scegliere una lista a mano","html":"\u003cp>A volte vuoi i siti di un altro gioco: ad esempio stai guardando la wiki di Brotato mentre è aperto Tiny Glade. Clicca \u003cstrong>Usa\u003c/strong> accanto alla lista che vuoi (\u003cspan class=\"num\">4\u003c/span> nella schermata del passo 2).\u003c/p>\u003cp>La lista diventa attiva e resta quella \u003cstrong>scelta a mano\u003c/strong> \u003cspan class=\"num\">1\u003c/span> anche quando apri l'overlay sopra altri giochi, finché non clicchi \u003cstrong>Torna a Tiny Glade\u003c/strong>, dove Tiny Glade è il gioco sopra cui è aperto l'overlay in quel momento. Nella barra ci sono i \u003cstrong>tab della lista scelta\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/lists-per-game/05-chosen-by-hand.png","alt":"La lista di Brotato scelta a mano mentre l'overlay è aperto sopra Tiny Glade"}},{"heading":"5. Riordinare tab e siti","html":"\u003cp>Trascina un tab nella barra per spostarlo: qui la Tiny Glade Wiki viene portata al primo posto.\u003c/p>","image":{"src":"img/lists-per-game/06-drag.png","alt":"Il tab della Tiny Glade Wiki trascinato al primo posto"}},{"heading":"5. Riordinare tab e siti","html":"\u003cp>Allo stesso modo puoi trascinare i siti nella Home: l'ordine della Home e quello dei tab sono lo stesso.\u003c/p>","image":null},{"heading":"6. Rimuovere una lista","html":"\u003cp>\u003cstrong>Rimuovi lista\u003c/strong>, accanto al nome di una lista, la elimina con tutti i suoi siti, dopo una conferma:\u003c/p>","image":{"src":"img/lists-per-game/07-remove-list.png","alt":"La conferma: rimuovere la lista \"Brotato\" e tutti i suoi siti?"}},{"heading":"6. Rimuovere una lista","html":"\u003cp>Se poi aggiungi un sito mentre giochi di nuovo a Brotato, la sua lista viene creata da capo.\u003c/p>","image":null}]},{"id":"bookmarks","title":"Importare ed esportare i bookmark","intro":"Hai già i siti dei tuoi giochi tra i bookmark del browser? Puoi importarli nelle liste di Overlay Browser senza riscriverli, ed esportare le liste in un file di bookmark da aprire in qualsiasi browser.","slides":[{"heading":null,"html":"\u003cp>Hai già i siti dei tuoi giochi tra i bookmark del browser? Puoi importarli nelle liste di Overlay Browser senza riscriverli, ed esportare le liste in un file di bookmark da aprire in qualsiasi browser.\u003c/p>\u003cp>Qui l'overlay è aperto sopra \u003cstrong>Brotato\u003c/strong>, la cui lista è ancora vuota, e la lista di \u003cstrong>Tiny Glade\u003c/strong> ha già tre siti (vedi \u003ca href=\"#lists-per-game\">Una lista per ogni gioco\u003c/a>).\u003c/p>","image":null,"intro":true},{"heading":"1. La sezione Bookmark della Home","html":"\u003cp>In fondo alla \u003cstrong>Home\u003c/strong> c'è la sezione \u003cem>Bookmark\u003c/em>, con \u003cstrong>Importa bookmark…\u003c/strong> \u003cspan class=\"num\">1\u003c/span> ed \u003cstrong>Esporta bookmark…\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/bookmarks/01-bookmarks-section.png","alt":"La sezione Bookmark in fondo alla Home"}},{"heading":"2. Scegli i bookmark da importare","html":"\u003cp>Clicca \u003cstrong>Importa bookmark…\u003c/strong>. Nella finestra:\u003c/p>\u003cul>\u003cli>\u003cstrong>Da\u003c/strong> \u003cspan class=\"num\">1\u003c/span>: il browser da cui leggere i bookmark, uno per ogni profilo. L'overlay li trova da solo: Chrome, Edge, Brave, Opera, Vivaldi, Chromium, Firefox, LibreWolf e altri browser simili; Firefox può restare aperto. La volta successiva ripropone il browser scelto l'ultima volta.\u003c/li>\u003cli>\u003cstrong>File…\u003c/strong> \u003cspan class=\"num\">2\u003c/span>: importa invece un file HTML di bookmark, esportato da qualsiasi browser dal suo gestore dei bookmark. Su macOS è l'unico modo: esporta prima i bookmark dal browser.\u003c/li>\u003cli>\u003cstrong>Cerca\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: trova bookmark e cartelle per nome o indirizzo.\u003c/li>\u003cli>\u003cstrong>Le caselle\u003c/strong> \u003cspan class=\"num\">4\u003c/span>: spunta i singoli bookmark o intere cartelle; \u003cem>Tutti i bookmark\u003c/em> li seleziona tutti. Qui spuntiamo la cartella \u003cem>Brotato\u003c/em>.\u003c/li>\u003cli>\u003cstrong>Nella lista\u003c/strong> \u003cspan class=\"num\">5\u003c/span>: la lista in cui aggiungerli, all'inizio quella attiva. Se è ancora \u003cem>nuova\u003c/em>, come qui quella di Brotato, viene creata con i siti importati.\u003c/li>\u003cli>\u003cstrong>Aggiungi\u003c/strong> \u003cspan class=\"num\">6\u003c/span>: il pulsante dice quanti siti aggiungerai.\u003c/li>\u003c/ul>","image":{"src":"img/bookmarks/02-import.png","alt":"La finestra di importazione con la cartella Brotato spuntata"}},{"heading":"2. Scegli i bookmark da importare","html":"\u003cp>I bookmark diventano siti della lista, con il loro nome:\u003c/p>","image":{"src":"img/bookmarks/03-imported.png","alt":"I tre siti importati nella lista di Brotato"}},{"heading":"3. Importare dal \"+\"","html":"\u003cp>Puoi importare anche dal \u003cstrong>+\u003c/strong> nella barra in alto, nella scheda \u003cstrong>Bookmark\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, accanto a \u003cem>Indirizzo\u003c/em>: qui i siti vanno sempre nella lista attiva. La \u003cstrong>ricerca\u003c/strong> \u003cspan class=\"num\">2\u003c/span> trova i bookmark; quelli il cui indirizzo è \u003cstrong>già nella lista\u003c/strong> \u003cspan class=\"num\">3\u003c/span> sono grigi e non si possono scegliere, quindi importare due volte non crea doppioni.\u003c/p>","image":{"src":"img/bookmarks/04-plus-bookmarks.png","alt":"La scheda Bookmark del \"+\", con i bookmark già nella lista non selezionabili"}},{"heading":"4. Esportare le liste","html":"\u003cp>\u003cstrong>Esporta bookmark…\u003c/strong>, nella sezione \u003cem>Bookmark\u003c/em> della Home, salva i siti delle liste in un file HTML di bookmark, che qualsiasi browser può importare. Ogni lista diventa una cartella. All'inizio sono scelti \u003cstrong>tutti i bookmark\u003c/strong> \u003cspan class=\"num\">1\u003c/span>; nell'\u003cstrong>elenco\u003c/strong> \u003cspan class=\"num\">2\u003c/span> puoi togliere liste o siti. \u003cstrong>Esporta\u003c/strong> \u003cspan class=\"num\">3\u003c/span> chiede dove salvare il file.\u003c/p>","image":{"src":"img/bookmarks/05-export.png","alt":"La finestra di esportazione con le liste di Brotato e Tiny Glade"}}]},{"id":"customizing","title":"Personalizzare l'overlay","intro":"Dalla pagina \u003cstrong>Impostazioni\u003c/strong> scegli la combinazione di tasti, come si comporta l'overlay, il suo aspetto e la lingua. Ogni modifica si applica subito e viene ricordata.","slides":[{"heading":null,"html":"\u003cp>Dalla pagina \u003cstrong>Impostazioni\u003c/strong> scegli la combinazione di tasti, come si comporta l'overlay, il suo aspetto e la lingua. Ogni modifica si applica subito e viene ricordata.\u003c/p>","image":null,"intro":true},{"heading":"1. La combinazione di tasti","html":"\u003cp>Apri il tab \u003cstrong>Impostazioni\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, in alto a destra (oppure \u003cem>Impostazioni\u003c/em> dal menu dell'icona nell'area di notifica). Nella sezione \u003cem>Tastiera\u003c/em> vedi la \u003cstrong>combinazione attuale\u003c/strong> \u003cspan class=\"num\">2\u003c/span> che mostra e nasconde l'overlay. \u003cstrong>Cambia\u003c/strong> \u003cspan class=\"num\">3\u003c/span> ne registra una nuova; \u003cstrong>Ripristina predefinita\u003c/strong> \u003cspan class=\"num\">4\u003c/span> torna a quella di default (Win+F10, Super+F10 su Linux, Cmd+Shift+Spazio su macOS).\u003c/p>","image":{"src":"img/customizing/01-shortcut.png","alt":"La pagina Impostazioni, sezione Tastiera"}},{"heading":"1. La combinazione di tasti","html":"\u003cp>Dopo \u003cstrong>Cambia\u003c/strong>, premi la combinazione che preferisci, ad esempio \u003ccode>Ctrl+Shift+O\u003c/code>; Esc annulla.\u003c/p>","image":{"src":"img/customizing/02-new-combination.png","alt":"L'overlay in attesa della nuova combinazione"}},{"heading":"1. La combinazione di tasti","html":"\u003cp>Sono ammessi i tasti F1–F24 da soli, oppure qualunque tasto insieme a Ctrl, Alt, Shift o Win (Super su Linux, Cmd su macOS). Se la combinazione è già usata da un altro programma compare un messaggio e resta quella precedente.\u003c/p>\u003cblockquote>\u003cstrong>Attenzione in gioco:\u003c/strong> la combinazione arriva anche al gioco, oltre che all'overlay. Scegline una che nel gioco non è assegnata a nessun comando, altrimenti aprendo l'overlay attiverai anche quel comando.\u003c/blockquote>","image":null},{"heading":"2. Il comportamento","html":"\u003cp>Nella sezione \u003cem>Comportamento\u003c/em>:\u003c/p>\u003cul>\u003cli>\u003cstrong>Nascondi l'overlay quando perde il focus\u003c/strong> \u003cspan class=\"num\">1\u003c/span>: attivo di default, l'overlay si nasconde da solo quando clicchi sul gioco o su un'altra finestra. Disattivalo se vuoi tenerlo visibile mentre giochi; in quel caso si nasconde solo con la combinazione di tasti. La stessa opzione è anche nel menu dell'icona nell'area di notifica.\u003c/li>\u003cli>\u003cstrong>Pagina iniziale della navigazione libera\u003c/strong> \u003cspan class=\"num\">2\u003c/span>: la pagina che il tab Naviga apre all'inizio. Vuota: nessuna pagina (vedi \u003ca href=\"#free-browsing\">Navigazione libera\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Motore di ricerca\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: quello usato dal tab Naviga per i testi che non sono indirizzi: Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage, oppure \u003cem>Personalizzato\u003c/em>, un indirizzo di ricerca con \u003ccode>%s\u003c/code> al posto del testo cercato.\u003c/li>\u003c/ul>\u003cp>Qui c'è anche \u003cem>Controlla se ci sono nuove versioni\u003c/em>, che segnala nella Home quando esce una nuova versione (non c'è nella versione del Microsoft Store, che si aggiorna da sola).\u003c/p>","image":{"src":"img/customizing/03-behavior.png","alt":"La sezione Comportamento delle Impostazioni"}},{"heading":"3. L'aspetto e la lingua","html":"\u003cp>Nella sezione \u003cem>Aspetto\u003c/em>:\u003c/p>\u003cul>\u003cli>\u003cstrong>Colore d'accento\u003c/strong> \u003cspan class=\"num\">1\u003c/span>: il colore dei tab fissi, dei pulsanti principali e dei dettagli dell'interfaccia.\u003c/li>\u003cli>\u003cstrong>Tab fissi\u003c/strong> \u003cspan class=\"num\">2\u003c/span>: Home, Naviga e Impostazioni con icona e nome, oppure \u003cem>Solo icona\u003c/em> per lasciare più spazio ai tab dei siti.\u003c/li>\u003cli>\u003cstrong>Opacità della finestra\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: con valori più bassi la finestra diventa trasparente e si intravede il gioco dietro (dal 30% al 100%, cioè opaca).\u003c/li>\u003c/ul>\u003cp>Nella sezione \u003cem>Lingua\u003c/em>, \u003cstrong>Lingua dell'interfaccia\u003c/strong> \u003cspan class=\"num\">4\u003c/span>: di default \u003cem>Lingua di sistema\u003c/em>, cioè quella del sistema se è tra quelle dell'app (italiano, inglese, francese, portoghese, russo, spagnolo e tedesco), altrimenti l'inglese.\u003c/p>","image":{"src":"img/customizing/04-appearance.png","alt":"Le sezioni Aspetto e Lingua delle Impostazioni"}},{"heading":"3. L'aspetto e la lingua","html":"\u003cp>Ecco l'overlay con il colore d'accento blu e i \u003cstrong>tab fissi solo con l'icona\u003c/strong> \u003cspan class=\"num\">1\u003c/span> \u003cspan class=\"num\">2\u003c/span>. L'opacità non si vede nella schermata, che riprende solo la finestra e non il gioco dietro.\u003c/p>","image":{"src":"img/customizing/05-customized.png","alt":"L'overlay con accento blu e tab fissi solo icona"}},{"heading":"Le altre sezioni","html":"\u003cp>Più in basso, la sezione \u003cem>Memoria\u003c/em> dice quanta memoria usa l'app e dopo quanto tempo chiudere le pagine che non stai guardando; la sezione \u003cem>Diagnostica\u003c/em> serve a raccogliere informazioni da allegare a una segnalazione di problemi.\u003c/p>","image":null}]},{"id":"memory","title":"Memoria e pagine chiuse","intro":"Ogni pagina aperta in Overlay Browser occupa memoria, come in un browser, anche quando non la stai guardando: le pagine delle altre liste restano aperte finché non vengono chiuse. Per non sottrarre memoria al gioco, l'overlay \u003cstrong>chiude da solo le pagine che non usi da un po'\u003c/strong>, e dalle Impostazioni puoi vedere quanta memoria usa e chiuderle a mano.","slides":[{"heading":null,"html":"\u003cp>Ogni pagina aperta in Overlay Browser occupa memoria, come in un browser, anche quando non la stai guardando: le pagine delle altre liste restano aperte finché non vengono chiuse. Per non sottrarre memoria al gioco, l'overlay \u003cstrong>chiude da solo le pagine che non usi da un po'\u003c/strong>, e dalle Impostazioni puoi vedere quanta memoria usa e chiuderle a mano.\u003c/p>\u003cp>Qui le liste di \u003cstrong>Tiny Glade\u003c/strong> e di \u003cstrong>Brotato\u003c/strong> hanno diverse pagine aperte (vedi \u003ca href=\"#lists-per-game\">Una lista per ogni gioco\u003c/a>).\u003c/p>","image":null,"intro":true},{"heading":"1. Perché una pagina si ricarica","html":"\u003cp>Le pagine che non stai guardando (gli altri tab, le pagine delle altre liste, e tutte mentre l'overlay è nascosto) restano aperte per un certo tempo, poi vengono chiuse. Riaprendo il tab, la pagina \u003cstrong>si ricarica dall'ultimo indirizzo visitato\u003c/strong>: ritrovi la pagina, ma ad esempio non il punto in cui l'avevi scorsa né un modulo compilato a metà.\u003c/p>\u003cp>La pagina che stai guardando non viene mai chiusa.\u003c/p>","image":null},{"heading":"2. La sezione Memoria","html":"\u003cp>Apri le \u003cstrong>Impostazioni\u003c/strong> e scorri fino alla sezione \u003cem>Memoria\u003c/em>:\u003c/p>\u003cul>\u003cli>\u003cstrong>Chiudi le pagine non usate dopo\u003c/strong> \u003cspan class=\"num\">1\u003c/span>: il tempo dopo cui una pagina non usata viene chiusa, da 5 a 60 minuti (di default 30). Con meno memoria libera, o con giochi pesanti, conviene un tempo più breve.\u003c/li>\u003cli>\u003cstrong>Memoria usata\u003c/strong> \u003cspan class=\"num\">2\u003c/span>: la memoria di tutta l'app.\u003c/li>\u003cli>\u003cstrong>Chiudi tutte le pagine\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: chiude subito tutte le pagine aperte, di tutte le liste.\u003c/li>\u003cli>\u003cstrong>I processi dell'app\u003c/strong> \u003cspan class=\"num\">4\u003c/span>: l'interfaccia dell'overlay, il processo principale, la grafica (GPU) e gli altri processi. Questa memoria c'è sempre.\u003c/li>\u003cli>\u003cstrong>Le pagine, raggruppate per lista\u003c/strong> \u003cspan class=\"num\">5\u003c/span>: per ogni lista, la memoria delle sue pagine aperte. \u003cstrong>Chiudi\u003c/strong> chiude tutte le pagine di quella lista.\u003c/li>\u003c/ul>","image":{"src":"img/memory/01-memory.png","alt":"La sezione Memoria delle Impostazioni, con le liste di Tiny Glade e Brotato"}},{"heading":"3. Le pagine di una lista","html":"\u003cp>Clicca il nome di una lista per vederne le pagine aperte, ognuna con la memoria che usa e il tempo che manca alla sua chiusura. \u003cstrong>Chiudi\u003c/strong> accanto alla lista \u003cspan class=\"num\">1\u003c/span> chiude tutte le sue pagine; \u003cstrong>Chiudi\u003c/strong> accanto a una pagina \u003cspan class=\"num\">2\u003c/span> chiude solo quella.\u003c/p>","image":{"src":"img/memory/02-pages.png","alt":"Le pagine aperte della lista di Tiny Glade, ognuna con il suo pulsante Chiudi"}},{"heading":"3. Le pagine di una lista","html":"\u003cp>Alcune pagine condividono lo stesso processo, ad esempio pagine dello stesso sito in liste diverse: compaiono in una riga sola, fuori dai gruppi, e si chiudono insieme, perché la memoria si libera solo chiudendole tutte.\u003c/p>","image":null},{"heading":"4. Dopo la chiusura","html":"\u003cp>Qui abbiamo chiuso le pagine di Brotato: il suo gruppo è sparito e la memoria usata è scesa. I tab di Brotato restano nella sua lista: la prossima volta che li apri, le pagine si ricaricano.\u003c/p>","image":{"src":"img/memory/03-closed.png","alt":"La sezione Memoria dopo aver chiuso le pagine di Brotato"}}]},{"id":"new-versions","title":"Nuove versioni","intro":"Overlay Browser controlla da solo se è uscita una nuova versione e te la segnala; non si aggiorna da solo: scarichi tu la nuova versione quando vuoi.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser controlla da solo se è uscita una nuova versione e te la segnala; non si aggiorna da solo: scarichi tu la nuova versione quando vuoi.\u003c/p>","image":null,"intro":true},{"heading":"1. L'avviso di una nuova versione","html":"\u003cp>Quando esce una nuova versione, sotto la barra in alto compare una \u003cstrong>striscia\u003c/strong> \u003cspan class=\"num\">1\u003c/span> con il suo numero. \u003cstrong>Scarica\u003c/strong> \u003cspan class=\"num\">2\u003c/span> apre nel browser del sistema la pagina della nuova versione, da cui scaricare il file per il tuo sistema (vedi l'installazione nel \u003ca href=\"../../README-it.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a>). La \u003cstrong>×\u003c/strong> \u003cspan class=\"num\">3\u003c/span> chiude la striscia: per quella versione non ricompare.\u003c/p>\u003cp>La nuova versione resta indicata anche in cima alla \u003cstrong>Home\u003c/strong> \u003cspan class=\"num\">4\u003c/span>, accanto alla versione che stai usando: cliccala per aprire la stessa pagina.\u003c/p>","image":{"src":"img/new-versions/01-new-version.png","alt":"La striscia della nuova versione sotto la barra e la versione indicata nella Home"}},{"heading":"1. L'avviso di una nuova versione","html":"\u003cp>Dopo aver chiuso la striscia, la nuova versione resta nella Home finché non installi l'aggiornamento:\u003c/p>","image":{"src":"img/new-versions/02-strip-closed.png","alt":"La Home con la nuova versione indicata accanto a quella in uso"}},{"heading":"2. Quando controlla","html":"\u003cp>L'app controlla poco dopo l'avvio e poi ogni 6 ore, sulle release del progetto su GitHub. Se usi una versione beta, ti segnala anche le beta più recenti; altrimenti solo le versioni definitive.\u003c/p>\u003cp>Per non ricevere gli avvisi, disattiva \u003cstrong>Controlla se ci sono nuove versioni\u003c/strong> nelle \u003cstrong>Impostazioni\u003c/strong>, sezione \u003cem>Comportamento\u003c/em>. Nella versione del Microsoft Store l'opzione non c'è: gli aggiornamenti arrivano dallo Store.\u003c/p>","image":{"src":"img/new-versions/03-option.png","alt":"L'opzione Controlla se ci sono nuove versioni nelle Impostazioni"}}]},{"id":"signing-in","title":"Accedere a un sito e i cookie","intro":"Molti siti dei giochi (forum, wiki, strumenti per le build) funzionano meglio, o solo, se accedi con il tuo account. Nell'overlay si accede come in un browser, e l'accesso viene ricordato. Se un sito non funziona più bene, o vuoi uscire dall'account, puoi eliminarne i cookie.","slides":[{"heading":null,"html":"\u003cp>Molti siti dei giochi (forum, wiki, strumenti per le build) funzionano meglio, o solo, se accedi con il tuo account. Nell'overlay si accede come in un browser, e l'accesso viene ricordato. Se un sito non funziona più bene, o vuoi uscire dall'account, puoi eliminarne i cookie.\u003c/p>\u003cp>Qui la lista di \u003cstrong>Tiny Glade\u003c/strong> ha anche un forum. Il forum è un \u003cstrong>sito d'esempio\u003c/strong>, creato per questa guida: l'accesso funziona come quello dei siti veri, ad esempio con \u003cem>Continua con Google\u003c/em>.\u003c/p>","image":null,"intro":true},{"heading":"1. Accedi con il tuo account","html":"\u003cp>Apri il tab del sito e clicca il pulsante per accedere, qui \u003cstrong>Continua con un account\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/01-forum.png","alt":"Il forum d'esempio aperto nel suo tab, con il pulsante per accedere"}},{"heading":"1. Accedi con il tuo account","html":"\u003cp>Il sito apre la sua \u003cstrong>finestra di accesso\u003c/strong> sopra l'overlay, come in un browser. Inserisci i tuoi dati e conferma.\u003c/p>","image":{"src":"img/signing-in/02-sign-in-window.png","alt":"La finestra di accesso aperta dal sito sopra l'overlay"}},{"heading":"1. Accedi con il tuo account","html":"\u003cp>La finestra di accesso fa parte dell'overlay: resta sopra di esso, si nasconde e ricompare insieme all'overlay, e passare dall'una all'altro non lo nasconde. Quando si chiude, alla fine dell'accesso, l'overlay torna attivo.\u003c/p>","image":null},{"heading":"2. L'accesso viene ricordato","html":"\u003cp>Finito l'accesso, la finestra si chiude e il sito mostra il tuo \u003cstrong>account\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/03-signed-in.png","alt":"Il forum con l'accesso fatto: in alto il nome dell'utente"}},{"heading":"2. L'accesso viene ricordato","html":"\u003cp>L'accesso resta anche quando chiudi l'overlay o riavvii l'app, come in un browser. I siti sono gli stessi per tutte le liste: se accedi a un sito nella lista di un gioco, risulti già dentro anche nelle altre liste che hanno quel sito.\u003c/p>","image":null},{"heading":"3. Elimina i cookie di un sito","html":"\u003cp>I cookie sono i dati che un sito salva per ricordarsi di te, tra cui l'accesso. Eliminarli serve per \u003cstrong>uscire da un account\u003c/strong> (ad esempio per accedere con un altro) o quando un sito \u003cstrong>non funziona più bene\u003c/strong>.\u003c/p>\u003cp>Nel tab del sito clicca \u003cstrong>…\u003c/strong> (\u003cem>Altre operazioni\u003c/em>), a destra dell'indirizzo, e scegli \u003cstrong>Elimina i cookie di forum.example\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/04-menu.png","alt":"Il menu Altre operazioni con la voce Elimina i cookie di forum.example"}},{"heading":"3. Elimina i cookie di un sito","html":"\u003cp>L'overlay chiede conferma: clicca \u003cstrong>Elimina\u003c/strong>. Vengono eliminati i cookie del sito e dei suoi sottodomini, non quelli degli altri siti.\u003c/p>","image":{"src":"img/signing-in/05-confirm.png","alt":"La conferma: eliminare i cookie di forum.example e dei suoi sottodomini?"}},{"heading":"4. La pagina si ricarica","html":"\u003cp>Dopo l'eliminazione la pagina si ricarica: non sei più dentro all'account e il sito propone di nuovo di \u003cstrong>accedere\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/06-signed-out.png","alt":"Il forum ricaricato dopo l'eliminazione dei cookie, di nuovo senza accesso"}}]},{"id":"links-and-menu","title":"Link, nuovi tab e menu contestuale","intro":"In un browser molti link si aprono in un nuovo tab. Nell'overlay i tab sono i siti della lista, quindi questi link vanno dove servono: nel tab del sito da cui vengono, oppure, dopo una domanda, in un nuovo tab. Il tasto destro apre il menu per aprire un link in un nuovo tab, copiare link, immagini e testo.","slides":[{"heading":null,"html":"\u003cp>In un browser molti link si aprono in un nuovo tab. Nell'overlay i tab sono i siti della lista, quindi questi link vanno dove servono: nel tab del sito da cui vengono, oppure, dopo una domanda, in un nuovo tab. Il tasto destro apre il menu per aprire un link in un nuovo tab, copiare link, immagini e testo.\u003c/p>\u003cp>Qui la lista di \u003cstrong>Tiny Glade\u003c/strong> ha anche un forum, un \u003cstrong>sito d'esempio\u003c/strong> creato per questa guida (vedi \u003ca href=\"#signing-in\">Accedere a un sito e i cookie\u003c/a>).\u003c/p>","image":null,"intro":true},{"heading":"1. Un link che il sito apre in un nuovo tab","html":"\u003cp>Alcuni link sono fatti per aprirsi in un nuovo tab, come questa discussione del forum. Lo stesso vale per i link cliccati con Ctrl o con il tasto centrale del mouse.\u003c/p>","image":{"src":"img/links-and-menu/01-link.png","alt":"Il forum d'esempio, con il link a una discussione"}},{"heading":"2. Lo stesso sito: nel suo tab","html":"\u003cp>Se il link porta allo stesso sito, si apre nel \u003cstrong>tab del sito\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, al posto della pagina di prima: nell'\u003cstrong>indirizzo\u003c/strong> \u003cspan class=\"num\">2\u003c/span> ora c'è quello della discussione. Con \u003cstrong>Indietro\u003c/strong> torni alla pagina precedente.\u003c/p>","image":{"src":"img/links-and-menu/02-same-tab.png","alt":"La discussione aperta nel tab del forum"}},{"heading":"2. Lo stesso sito: nel suo tab","html":"\u003cp>Se la lista ha più tab dello stesso sito, il link si apre in quello da cui viene.\u003c/p>","image":null},{"heading":"3. Un altro sito: la domanda","html":"\u003cp>Se il link porta a un sito che non ha un tab nella lista, qui le guide della comunità su Steam, l'overlay chiede se aggiungerlo alla lista: \u003cstrong>Aggiungi\u003c/strong> lo aggiunge come nuovo sito e lo apre; \u003cstrong>Annulla\u003c/strong> lascia tutto com'è.\u003c/p>","image":{"src":"img/links-and-menu/03-other-site.png","alt":"La domanda: aggiungere alla lista il sito che la pagina vuole aprire in un nuovo tab?"}},{"heading":"3. Un altro sito: la domanda","html":"\u003cp>I link aperti dal tab \u003cstrong>Naviga\u003c/strong> restano invece nel tab Naviga (vedi \u003ca href=\"#free-browsing\">Navigazione libera\u003c/a>).\u003c/p>","image":null},{"heading":"4. Il tasto destro su un link","html":"\u003cp>Il tasto destro su un link apre il menu con \u003cstrong>Apri link in un nuovo tab\u003c/strong> \u003cspan class=\"num\">1\u003c/span> e \u003cstrong>Copia link\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, che copia l'indirizzo del link.\u003c/p>","image":{"src":"img/links-and-menu/04-link-menu.png","alt":"Il menu del tasto destro su un link: Apri link in un nuovo tab, Copia link"}},{"heading":"4. Il tasto destro su un link","html":"\u003cp>\u003cstrong>Apri link in un nuovo tab\u003c/strong> chiede conferma prima di aggiungere il link alla lista: clicca \u003cstrong>Aggiungi\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/05-confirm-tab.png","alt":"La conferma: aggiungere il link come nuovo tab della lista Tiny Glade?"}},{"heading":"4. Il tasto destro su un link","html":"\u003cp>Il link diventa un \u003cstrong>nuovo tab\u003c/strong>, subito dopo quello da cui viene, e si apre. Se un tab della lista è già su quell'indirizzo, l'overlay mostra quel tab invece di aggiungerne un altro.\u003c/p>","image":{"src":"img/links-and-menu/06-new-tab.png","alt":"La discussione aperta nel nuovo tab, subito dopo quello del forum"}},{"heading":"5. Il tasto destro su immagini e testo","html":"\u003cp>Su un'immagine il menu ha \u003cstrong>Copia immagine\u003c/strong>, per incollarla altrove, ad esempio in una chat. Sul testo di una pagina ci sono \u003cstrong>Copia\u003c/strong>, per il testo selezionato, e \u003cstrong>Seleziona tutto\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/07-image-menu.png","alt":"Il menu del tasto destro su un'immagine, con Copia immagine"}},{"heading":"5. Il tasto destro su immagini e testo","html":"\u003cp>Nei campi di testo, come quello per rispondere nel forum o l'indirizzo dei tab, il menu ha \u003cstrong>Annulla\u003c/strong>, \u003cstrong>Ripeti\u003c/strong>, \u003cstrong>Taglia\u003c/strong>, \u003cstrong>Copia\u003c/strong>, \u003cstrong>Incolla\u003c/strong> e \u003cstrong>Seleziona tutto\u003c/strong>. Le voci che in quel momento non servono, ad esempio \u003cem>Copia\u003c/em> senza testo selezionato, sono in grigio.\u003c/p>","image":{"src":"img/links-and-menu/08-field-menu.png","alt":"Il menu del tasto destro in un campo di testo"}}]},{"id":"troubleshooting","title":"Risoluzione dei problemi","intro":"Qui trovi le soluzioni ai problemi più comuni e come raccogliere le informazioni utili per segnalarne uno. Per i dettagli di ogni sistema (Windows, Linux, macOS) la guida rimanda al README.","slides":[{"heading":null,"html":"\u003cp>Qui trovi le soluzioni ai problemi più comuni e come raccogliere le informazioni utili per segnalarne uno. Per i dettagli di ogni sistema (Windows, Linux, macOS) la guida rimanda al \u003ca href=\"../../README-it.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. La combinazione di tasti non funziona","html":"\u003cul>\u003cli>\u003cstrong>È già usata da un altro programma.\u003c/strong> Se la scegli nelle Impostazioni, l'overlay te lo dice («combinazione non valida o già in uso») e resta quella precedente: scegline un'altra (vedi \u003ca href=\"#customizing\">Personalizzare l'overlay\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Il gioco la usa per un suo comando.\u003c/strong> La combinazione arriva anche al gioco: scegline una che nel gioco non fa nulla.\u003c/li>\u003cli>\u003cstrong>Linux con Wayland.\u003c/strong> La combinazione non viene vista mentre è attiva una finestra Wayland nativa: serve una sessione X11 (vedi \u003cem>Linux\u003c/em> nel \u003ca href=\"../../README-it.md#linux\" target=\"_blank\" rel=\"noopener\">README\u003c/a>).\u003c/li>\u003cli>\u003cstrong>macOS e tasti funzione.\u003c/strong> Di default F1–F12 regolano luminosità, volume e così via: premili insieme a \u003cstrong>fn\u003c/strong>, oppure cambia l'impostazione della tastiera (vedi \u003cem>macOS\u003c/em> nel \u003ca href=\"../../README-it.md#macos\" target=\"_blank\" rel=\"noopener\">README\u003c/a>).\u003c/li>\u003c/ul>\u003cp>Puoi sempre mostrare l'overlay anche dall'icona nell'area di notifica.\u003c/p>","image":null},{"heading":"2. Non trovo l'icona dell'app","html":"\u003cp>L'app non compare nella barra delle applicazioni né in Alt+Tab: sta nell'area di notifica, vicino all'orologio.\u003c/p>\u003cul>\u003cli>\u003cstrong>Windows:\u003c/strong> se non la vedi, clicca sulla freccia \u003cstrong>^\u003c/strong> e trascina l'icona sulla barra per tenerla sempre visibile.\u003c/li>\u003cli>\u003cstrong>Linux con GNOME:\u003c/strong> serve l'estensione \u003cem>AppIndicator and KStatusNotifierItem Support\u003c/em>. In alcuni ambienti il clic sull'icona apre il menu invece di mostrare la finestra: usa la voce \u003cem>Mostra\u003c/em>.\u003c/li>\u003cli>\u003cstrong>macOS:\u003c/strong> l'icona è nella barra dei menu, in alto a destra.\u003c/li>\u003c/ul>","image":null},{"heading":"3. L'overlay non compare sopra il gioco, o non è trasparente","html":"\u003cul>\u003cli>\u003cstrong>Il gioco copre l'overlay.\u003c/strong> Alcuni giochi a schermo intero &quot;esclusivo&quot; coprono qualsiasi finestra: imposta il gioco in modalità \u003cem>finestra senza bordi\u003c/em> (borderless).\u003c/li>\u003cli>\u003cstrong>La finestra non è trasparente (Linux).\u003c/strong> La trasparenza richiede un window manager con il compositing attivo (Cinnamon, KDE, GNOME, Xfce con il compositing): senza, la finestra resta opaca.\u003c/li>\u003c/ul>","image":null},{"heading":"4. Un sito non funziona bene o una pagina si ricarica","html":"\u003cul>\u003cli>\u003cstrong>Un sito non funziona più bene, o vuoi uscire da un account:\u003c/strong> elimina i cookie del sito dal menu \u003cstrong>…\u003c/strong> (vedi \u003ca href=\"#signing-in\">Accedere a un sito e i cookie\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Una pagina si ricarica quando torni al suo tab:\u003c/strong> le pagine non usate vengono chiuse dopo un po' per liberare memoria (vedi \u003ca href=\"#memory\">Memoria e pagine chiuse\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Vuoi ripartire da zero:\u003c/strong> chiudi l'app ed elimina il file delle preferenze (vedi \u003cem>Preferenze e disinstallazione\u003c/em> nel \u003ca href=\"../../README-it.md#preferenze-e-disinstallazione\" target=\"_blank\" rel=\"noopener\">README\u003c/a>).\u003c/li>\u003c/ul>","image":null},{"heading":"5. Raccogli le informazioni per una segnalazione","html":"\u003cp>Se un problema resta, puoi segnalarlo nella pagina delle \u003ca href=\"https://github.com/siculo/overlay-browser/issues\" target=\"_blank\" rel=\"noopener\">segnalazioni del progetto\u003c/a>. Il file di log dell'app aiuta a capire cosa è successo.\u003c/p>\u003cp>Nelle \u003cstrong>Impostazioni\u003c/strong>, sezione \u003cem>Diagnostica\u003c/em>:\u003c/p>\u003cul>\u003cli>\u003cstrong>Log dettagliato\u003c/strong> \u003cspan class=\"num\">1\u003c/span>: normalmente il log registra solo errori e crash, con le impostazioni correnti. Attivato, registra anche cosa fai nell'app (tab, siti, liste, impostazioni) e cosa succede all'overlay (aperture e chiusure, focus, combinazione di tasti, app in primo piano). Attivalo, poi ripeti quello che causa il problema.\u003c/li>\u003cli>\u003cstrong>Mostra il file di log\u003c/strong> \u003cspan class=\"num\">2\u003c/span>: apre la cartella con il file \u003ccode>overlay.log\u003c/code>, da allegare alla segnalazione.\u003c/li>\u003cli>\u003cstrong>Svuota il log\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: cancella il contenuto del log, ad esempio per registrare solo il problema da segnalare.\u003c/li>\u003c/ul>","image":{"src":"img/troubleshooting/01-diagnostics.png","alt":"La sezione Diagnostica delle Impostazioni"}},{"heading":"5. Raccogli le informazioni per una segnalazione","html":"\u003cp>Il log non contiene mai i tasti che premi né la tua navigazione: niente indirizzi o titoli delle pagine. I siti sono indicati solo con la loro posizione nella lista.\u003c/p>\u003cp>\u003cstrong>Svuota il log\u003c/strong> chiede conferma prima di cancellarlo:\u003c/p>","image":{"src":"img/troubleshooting/02-empty-log.png","alt":"La conferma: svuotare il file di log?"}}]}],"strings":{"docTitle":"Overlay Browser · Guida","subtitle":"Guida all'uso, passo per passo","legend":"Nelle schermate gli elementi citati nel testo sono evidenziati da un riquadro rosso \u003cspan class=\"box\">\u003c/span>; i numeri come \u003cspan class=\"num\">1\u003c/span> nel testo indicano l'elemento con lo stesso numero nella schermata.","menu":"Guide","menuTitle":"Torna all'elenco delle guide (Esc)","prev":"Indietro","prevTitle":"Slide precedente (←)","next":"Avanti","nextTitle":"Slide successiva (→)","prevGuide":"Guida precedente","nextGuide":"Prossima guida: {title}","backToGuides":"Torna alle guide","guideOf":"Guida {n} di {total}","step":"Passo {n}","slideOne":"1 slide","slideOther":"{count} slide"}};
const S = DATA.strings;   // testi della pagina nella lingua delle guide
const $ = (id) => document.getElementById(id);
const guides = DATA.guides;
const plural = (n) => (n === 1 ? S.slideOne : S.slideOther.replace('{count}', n));

// ---------- menu ----------
$('guides').replaceChildren(...guides.map((g, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${g.id}"><span class="n">${i + 1}</span><h2></h2><p>${g.intro}</p><span class="count">${plural(g.slides.length)}</span></a>`;
  li.querySelector('h2').textContent = g.title;
  return li;
}));

// ---------- slide ----------
// Indirizzo: #<guida>/<numero> (da 1); #<guida> = prima slide; vuoto = menu.
let current = null, index = 0;

function route() {
  const [id, n] = decodeURIComponent(location.hash.slice(1)).split('/');
  const g = guides.find((x) => x.id === id);
  closeZoom();
  if (!g) { showMenu(); return; }
  const i = Math.min(Math.max((Number(n) || 1) - 1, 0), g.slides.length - 1);
  const dir = g === current ? Math.sign(i - index) : 0;
  current = g;
  index = i;
  renderSlide(dir);
}

function showMenu() {
  current = null;
  $('deck').hidden = true;
  $('menu').hidden = false;
  document.title = S.docTitle;
}

const go = (i) => { location.hash = `${current.id}/${i + 1}`; };

function renderSlide(dir) {
  const g = current, s = g.slides[index];
  const gi = guides.indexOf(g), nextGuide = guides[gi + 1];
  $('menu').hidden = true;
  $('deck').hidden = false;
  document.title = `${g.title} · Overlay Browser`;
  $('guide-title').textContent = g.title;
  $('pos').textContent = `${index + 1} / ${g.slides.length}`;

  const el = $('slide');
  el.className = s.image ? 'with-image' : 'text-only';
  if (s.intro) el.classList.add('intro');
  const text = document.createElement('div');
  text.className = 'text';
  if (s.intro) {
    text.innerHTML = `<p class="section">${S.guideOf.replace('{n}', gi + 1).replace('{total}', guides.length)}</p><h2></h2>${s.html}`;
    text.querySelector('h2').textContent = g.title;
  } else {
    text.innerHTML = `<p class="section"></p><h2></h2>${s.html}`;
    const m = s.heading.match(/^(\d+)\.\s+(.*)$/);
    text.querySelector('.section').textContent = m ? S.step.replace('{n}', m[1]) : '';
    text.querySelector('h2').textContent = m ? m[2] : s.heading;
  }
  const parts = [text];
  if (s.image) {
    const fig = document.createElement('figure');
    fig.innerHTML = '<img><figcaption></figcaption>';
    fig.querySelector('img').src = s.image.src;
    fig.querySelector('img').alt = s.image.alt;
    fig.querySelector('figcaption').textContent = s.image.alt;
    fig.querySelector('img').onclick = () => openZoom(s.image);
    parts.push(fig);
  }
  el.replaceChildren(...parts);
  el.scrollTop = 0;
  el.classList.remove('enter');
  el.style.setProperty('--from', `${dir * 16}px`);
  if (dir) { void el.offsetWidth; el.classList.add('enter'); }

  $('dots').replaceChildren(...g.slides.map((x, i) => {
    const b = document.createElement('button');
    b.title = x.intro ? g.title : x.heading;
    b.setAttribute('aria-current', String(i === index));
    b.onclick = () => go(i);
    return b;
  }));
  $('prev').disabled = index === 0 && gi === 0;
  $('prev').textContent = index === 0 && gi > 0 ? `← ${S.prevGuide}` : `← ${S.prev}`;
  const last = index === g.slides.length - 1;
  $('next').textContent = !last ? `${S.next} →` : nextGuide ? `${S.nextGuide.replace('{title}', nextGuide.title)} →` : S.backToGuides;
}

function next() {
  if (index < current.slides.length - 1) return go(index + 1);
  const g = guides[guides.indexOf(current) + 1];
  location.hash = g ? g.id : '';
}
function prev() {
  if (index > 0) return go(index - 1);
  const g = guides[guides.indexOf(current) - 1];
  if (g) location.hash = `${g.id}/${g.slides.length}`;
}
$('next').onclick = next;
$('prev').onclick = prev;

// ---------- immagine a tutto schermo ----------
function openZoom(image) {
  $('zoom').querySelector('img').src = image.src;
  $('zoom').querySelector('img').alt = image.alt;
  $('zoom').hidden = false;
}
function closeZoom() { $('zoom').hidden = true; }
$('zoom').onclick = closeZoom;

// ---------- tastiera ----------
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!$('zoom').hidden) { if (e.key === 'Escape') closeZoom(); return; }
  if (!current) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) next();
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) prev();
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(current.slides.length - 1);
  else if (e.key === 'Escape') location.hash = '';
  else return;
  e.preventDefault();
});

window.addEventListener('hashchange', route);
route();
</script>
</body>
