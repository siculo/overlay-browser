<!doctype html>
<!-- Modello della presentazione: build.js sostituisce i testi (segnaposti tra doppie graffe, da
     STRINGS in build.js) e i dati e scrive docs/<lingua>/<file>.html. Non
     modificare la pagina generata. -->
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Browser · Guia</title>
<link rel="icon" href="../../assets/icon.png">
<style>
  :root {
    --bg: #141414; --sheet: #1b1b1b; --line: #2c2c2c; --text: #e8e8e8; --muted: #9a9a9a;
    --accent: #f0a030; --accent-text: #f5b750; --on-accent: #111; --mark: #e5262b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, sans-serif; }
  a { color: var(--accent-text); }
  code { font-family: ui-monospace, monospace; font-size: .9em; padding: 1px 5px; border-radius: 4px; background: #262626; }
  strong { color: #fff; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Numeri come nelle schermate: bianco su cerchio rosso. */
  .num { display: inline-flex; align-items: center; justify-content: center; width: 1.45em; height: 1.45em;
         margin: 0 .1em; border-radius: 50%; background: var(--mark); color: #fff; border: 2px solid #fff;
         font-size: .72em; font-weight: 700; line-height: 1; vertical-align: .12em; }

  /* ---------- menu ---------- */
  #menu { max-width: 1100px; margin: 0 auto; padding: 48px 32px 64px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { height: 56px; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; color: var(--muted); }
  .legend { margin: 28px 0 32px; padding: 12px 16px; border-left: 3px solid var(--mark); background: var(--sheet);
            color: #cfcfcf; border-radius: 0 6px 6px 0; }
  .legend .box { display: inline-block; width: 1.3em; height: .9em; border: 2px solid var(--mark); border-radius: 4px; vertical-align: -.05em; }
  #guides { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
            list-style: none; margin: 0; padding: 0; counter-reset: guide; }
  #guides a { display: flex; flex-direction: column; height: 100%; padding: 18px 20px; border: 1px solid var(--line);
              border-radius: 10px; background: var(--sheet); color: inherit; text-decoration: none;
              transition: border-color .15s, transform .15s; }
  #guides a:hover, #guides a:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  #guides .n { color: var(--accent-text); font-weight: 700; font-size: 14px; }
  #guides h2 { margin: 4px 0 8px; font-size: 19px; font-weight: 600; line-height: 1.3; }
  #guides p { margin: 0 0 14px; color: #bdbdbd; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #guides .count { margin-top: auto; }
  #guides .count { color: var(--muted); font-size: 13px; }

  /* ---------- slide ---------- */
  #deck { display: flex; flex-direction: column; height: 100%; }
  #deck header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: #0e0e0e; }
  #deck header .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid #3a3a3a;
         border-radius: 6px; background: #232323; text-decoration: none; color: var(--text); white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  #slide { flex: 1; min-height: 0; padding: 28px 36px; overflow: auto; }
  #slide.with-image { display: grid; grid-template-columns: minmax(300px, 36%) 1fr; gap: 36px; align-items: center; }
  #slide.text-only { display: flex; align-items: center; justify-content: center; }
  #slide .text { max-height: 100%; overflow: auto; }
  #slide.text-only .text { max-width: 760px; font-size: 19px; }
  #slide .section { margin: 0 0 4px; color: var(--accent-text); font-size: 14px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  #slide h2 { margin: 0 0 14px; font-size: 26px; font-weight: 600; line-height: 1.25; }
  #slide.intro h2 { font-size: 34px; }
  #slide p { margin: 0 0 12px; }
  #slide ul { margin: 0 0 12px; padding-left: 1.2em; }
  #slide li { margin-bottom: 8px; }
  #slide blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--sheet); border-radius: 0 6px 6px 0; color: #d4d4d4; }
  #slide figure { margin: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  #slide figure img { display: block; max-width: 100%; max-height: calc(100% - 2.2em); margin: 0 auto; object-fit: contain;
                      border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); cursor: zoom-in; }
  #slide figcaption { margin-top: 10px; text-align: center; color: var(--muted); font-size: 14px; }
  #deck footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); background: #0e0e0e; }
  #dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; background: #444; }
  #dots button[aria-current="true"] { background: var(--accent); }
  #pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  #slide.enter { animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateX(var(--from, 16px)); } }

  /* Immagine a tutto schermo */
  #zoom { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
          padding: 24px; background: rgba(0, 0, 0, .88); cursor: zoom-out; }
  #zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  @media (max-width: 820px) {
    #slide.with-image { grid-template-columns: 1fr; align-items: start; }
    #slide figure { height: auto; }
    #slide figure img { max-height: none; }
    #dots { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #slide.enter { animation: none; } #guides a { transition: none; } }
</style>
</head>
<body>

<main id="menu" hidden>
  <div class="brand">
    <img src="../../assets/logo.png" alt="">
    <div>
      <h1>Overlay Browser</h1>
      <p>Guia de uso, passo a passo</p>
    </div>
  </div>
  <p class="legend">Nas capturas de tela, os elementos citados no texto são destacados por um quadro vermelho <span class="box"></span>; números como <span class="num">1</span> no texto indicam o elemento com o mesmo número na captura.</p>
  <ol id="guides"></ol>
</main>

<div id="deck" hidden>
  <header>
    <a class="btn" href="#" title="Voltar à lista de guias (Esc)">☰ Guias</a>
    <span class="title" id="guide-title"></span>
    <span id="pos"></span>
  </header>
  <section id="slide" aria-live="polite"></section>
  <footer>
    <button class="btn" id="prev" title="Slide anterior (←)">← Voltar</button>
    <div id="dots" role="tablist"></div>
    <button class="btn primary" id="next" title="Próximo slide (→)">Avançar →</button>
  </footer>
</div>

<div id="zoom" hidden><img alt=""></div>

<script>
const DATA = {"guides":[{"id":"getting-started","title":"Primeiros passos para ter os sites do seu jogo à mão","intro":"Neste guia, você abre o Overlay Browser enquanto joga \u003cstrong>Tiny Glade\u003c/strong>, adiciona dois sites úteis e aprende a exibi-los e ocultá-los sem sair do jogo.","slides":[{"heading":null,"html":"\u003cp>Neste guia, você abre o Overlay Browser enquanto joga \u003cstrong>Tiny Glade\u003c/strong>, adiciona dois sites úteis e aprende a exibi-los e ocultá-los sem sair do jogo.\u003c/p>","image":null,"intro":true},{"heading":"1. Inicie o aplicativo","html":"\u003cp>Inicie o Overlay Browser. A janela \u003cstrong>permanece oculta\u003c/strong> e o aplicativo fica na área de notificação, perto do relógio. Ele não aparece na barra de tarefas nem no Alt+Tab.\u003c/p>\u003cp>Em seguida, inicie o jogo no modo janela ou janela sem bordas.\u003c/p>","image":null},{"heading":"2. Abra o overlay sobre o jogo","html":"\u003cp>Enquanto joga, pressione \u003cstrong>Win+F10\u003c/strong> (Super+F10 no Linux, Cmd+Shift+Espaço no macOS). O overlay aparece sobre o jogo e abre em \u003cstrong>Início\u003c/strong>.\u003c/p>\u003cp>O overlay reconheceu o jogo. No topo aparece a lista \u003cstrong>Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, \u003cem>ativa\u003c/em> e ainda \u003cem>nova\u003c/em>. Cada jogo tem sua própria lista, criada quando você adiciona o primeiro site. Em \u003cem>Outras listas\u003c/em> fica a lista \u003cstrong>Geral\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, usada quando nenhum jogo está aberto. Clique em \u003cstrong>Usar\u003c/strong> para ativá-la manualmente.\u003c/p>","image":{"src":"img/getting-started/01-empty-home.png","alt":"Início aberto sobre Tiny Glade, com a lista do jogo ainda vazia"}},{"heading":"3. Adicione um site","html":"\u003cp>Clique em \u003cstrong>+\u003c/strong> \u003cspan class=\"num\">1\u003c/span> na barra superior, digite o \u003cstrong>endereço\u003c/strong> do site \u003cspan class=\"num\">2\u003c/span> (basta \u003ccode>tinyglade.com\u003c/code>) e clique em \u003cstrong>Adicionar\u003c/strong> \u003cspan class=\"num\">3\u003c/span>.\u003c/p>","image":{"src":"img/getting-started/02-add-site.png","alt":"Janela para adicionar um site com o endereço tinyglade.com"}},{"heading":"3. Adicione um site","html":"\u003cp>O site abre na própria \u003cstrong>aba\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, que recebe o título da página. Use \u003cstrong>×\u003c/strong> para fechá-la. Abaixo fica a barra de navegação, como em um navegador. Os botões \u003cstrong>Voltar\u003c/strong>, \u003cstrong>Avançar\u003c/strong> e \u003cstrong>Recarregar\u003c/strong> \u003cspan class=\"num\">2\u003c/span> controlam a página. No campo de \u003cstrong>endereço\u003c/strong> \u003cspan class=\"num\">3\u003c/span>, você pode digitar outro endereço e pressionar Enter. \u003cstrong>Fixar\u003c/strong> \u003cspan class=\"num\">4\u003c/span> transforma a página que você encontrou em uma nova aba.\u003c/p>","image":{"src":"img/getting-started/03-site-open.png","alt":"Site oficial de Tiny Glade aberto na própria aba"}},{"heading":"4. Adicione outros sites pelo Início","html":"\u003cp>Volte para \u003cstrong>Início\u003c/strong> para ver os sites da lista. Clique no \u003cstrong>nome do site\u003c/strong> \u003cspan class=\"num\">1\u003c/span> para abri-lo, em \u003cstrong>Editar\u003c/strong> \u003cspan class=\"num\">2\u003c/span> para mudar o endereço (Enter salva e Esc cancela) ou em \u003cstrong>Remover\u003c/strong> \u003cspan class=\"num\">3\u003c/span> para tirá-lo da lista. Para adicionar um site, digite o endereço no \u003cstrong>campo abaixo da lista\u003c/strong> \u003cspan class=\"num\">4\u003c/span> e clique em \u003cem>Adicionar\u003c/em>. Neste exemplo, adicionamos a página do jogo no Steam.\u003c/p>","image":{"src":"img/getting-started/04-home-with-sites.png","alt":"Início com os dois sites da lista de Tiny Glade"}},{"heading":"5. Alterne entre os sites","html":"\u003cp>Cada site tem sua própria aba. Aqui estão o \u003cstrong>site oficial\u003c/strong> \u003cspan class=\"num\">1\u003c/span> e a \u003cstrong>página do Steam\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, que está aberta agora. Ao voltar a uma aba, você encontra a página onde a deixou.\u003c/p>","image":{"src":"img/getting-started/05-two-tabs.png","alt":"Página de Tiny Glade no Steam aberta na segunda aba"}},{"heading":"6. Volte ao jogo","html":"\u003cp>Pressione \u003cstrong>Win+F10\u003c/strong> de novo para ocultar o overlay ou clique na janela do jogo. Por padrão, o overlay se oculta ao perder o foco. Você pode desativar isso nas Configurações.\u003c/p>\u003cp>Na próxima vez que abrir o overlay sobre Tiny Glade, você verá a lista dele na última aba que usou. Se abrir sobre outro jogo, verá a lista daquele jogo.\u003c/p>","image":null}]},{"id":"free-browsing","title":"Navegação livre para pesquisar, encontrar e fixar páginas","intro":"Na aba \u003cstrong>Navegar\u003c/strong>, você pode pesquisar e abrir qualquer página sem adicioná-la à lista. Se quiser guardar a página, \u003cstrong>Fixar\u003c/strong> a transforma em uma aba da lista do jogo.","slides":[{"heading":null,"html":"\u003cp>Na aba \u003cstrong>Navegar\u003c/strong>, você pode pesquisar e abrir qualquer página sem adicioná-la à lista. Se quiser guardar a página, \u003cstrong>Fixar\u003c/strong> a transforma em uma aba da lista do jogo.\u003c/p>\u003cp>Vamos continuar o exemplo de \u003ca href=\"#getting-started\">Primeiros passos\u003c/a>. O overlay está aberto sobre \u003cstrong>Tiny Glade\u003c/strong>, a lista já tem dois sites e vamos procurar uma wiki do jogo.\u003c/p>","image":null,"intro":true},{"heading":"1. Abra a aba Navegar","html":"\u003cp>Clique em \u003cstrong>Navegar\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, logo ao lado de Início. No \u003cstrong>campo de endereço\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, digite um endereço (basta \u003ccode>example.com\u003c/code>) ou o texto que quer pesquisar. O overlay sugere o \u003cstrong>nome do jogo\u003c/strong> \u003cspan class=\"num\">3\u003c/span> como exemplo. Clique nele para pesquisar.\u003c/p>","image":{"src":"img/free-browsing/01-browse.png","alt":"Aba Navegar vazia com o campo de endereço e a pesquisa de exemplo “Tiny Glade”"}},{"heading":"2. Pesquise","html":"\u003cp>Digite \u003ccode>tiny glade wiki\u003c/code> e pressione Enter. Os resultados abrem na aba. O \u003cstrong>campo de endereço\u003c/strong> \u003cspan class=\"num\">1\u003c/span> mostra o endereço da página de resultados.\u003c/p>\u003cp>Você escolhe o mecanismo de pesquisa nas Configurações, na seção \u003cem>Comportamento\u003c/em>. As opções são Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage ou um endereço personalizado. Aqui usamos o DuckDuckGo.\u003c/p>\u003cp>Clique no resultado que quiser, neste caso \u003cstrong>Tiny Glade Wiki\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/02-results.png","alt":"Resultados da pesquisa “tiny glade wiki” com o link para a Tiny Glade Wiki"}},{"heading":"3. Fixe a página","html":"\u003cp>A página abre na aba Navegar e funciona como em um navegador. \u003cstrong>Voltar\u003c/strong> \u003cspan class=\"num\">1\u003c/span> retorna aos resultados. Para guardar a página, clique em \u003cstrong>Fixar\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/03-page-found.png","alt":"Tiny Glade Wiki aberta na aba Navegar"}},{"heading":"3. Fixe a página","html":"\u003cp>O overlay pede confirmação. Clique em \u003cstrong>Fixar\u003c/strong>.\u003c/p>","image":{"src":"img/free-browsing/04-confirm.png","alt":"Confirmação para fixar a Tiny Glade Wiki como nova aba da lista Tiny Glade"}},{"heading":"4. A página vira uma aba da lista","html":"\u003cp>A página e seu histórico viram uma \u003cstrong>nova aba\u003c/strong> \u003cspan class=\"num\">1\u003c/span> no fim da lista de Tiny Glade. Ela estará lá sempre que você abrir o overlay sobre o jogo. \u003cstrong>Fixar\u003c/strong> \u003cspan class=\"num\">2\u003c/span> fica desativado porque a página já está na lista.\u003c/p>","image":{"src":"img/free-browsing/05-pinned.png","alt":"Tiny Glade Wiki na nova aba, com Fixar desativado"}},{"heading":"4. A página vira uma aba da lista","html":"\u003cp>Você também pode fixar páginas nas abas de sites. A nova aba aparece logo depois da aba de origem. Se a página já tiver uma aba na lista, essa aba fica destacada e Fixar fica desativado.\u003c/p>","image":null},{"heading":"5. A aba Navegar fica livre de novo","html":"\u003cp>Ao voltar a \u003cstrong>Navegar\u003c/strong>, você encontra a aba vazia, pronta para outra pesquisa. A página fixada foi para uma aba própria. Durante a navegação, \u003cstrong>Voltar à página inicial\u003c/strong> \u003cspan class=\"num\">1\u003c/span> fecha a página aberta e mostra a tela vazia.\u003c/p>","image":{"src":"img/free-browsing/06-browse-again.png","alt":"Aba Navegar vazia novamente"}},{"heading":"5. A aba Navegar fica livre de novo","html":"\u003cp>Nas Configurações, em \u003cem>Comportamento\u003c/em>, você pode definir a \u003cstrong>Página inicial da navegação livre\u003c/strong> para que ela abra no lugar da tela vazia.\u003c/p>","image":null},{"heading":"Endereços de outros sites nas abas de sites","html":"\u003cp>Você também pode digitar no campo de endereço de uma aba de site. Endereços do mesmo site abrem na própria aba. Endereços de outros sites e pesquisas abrem em Navegar após uma confirmação. A aba original mantém a página.\u003c/p>","image":null}]},{"id":"lists-per-game","title":"Uma lista por jogo","intro":"O Overlay Browser reconhece o jogo sobre o qual você o abre e mostra os sites desse jogo. Cada jogo tem a própria \u003cstrong>lista\u003c/strong>. Depois de Primeiros passos e Navegação livre, a lista de \u003cstrong>Tiny Glade\u003c/strong> já tem três sites. Agora vamos jogar \u003cstrong>Brotato\u003c/strong>.","slides":[{"heading":null,"html":"\u003cp>O Overlay Browser reconhece o jogo sobre o qual você o abre e mostra os sites desse jogo. Cada jogo tem a própria \u003cstrong>lista\u003c/strong>. Depois de \u003ca href=\"#getting-started\">Primeiros passos\u003c/a> e \u003ca href=\"#free-browsing\">Navegação livre\u003c/a>, a lista de \u003cstrong>Tiny Glade\u003c/strong> já tem três sites. Agora vamos jogar \u003cstrong>Brotato\u003c/strong>.\u003c/p>","image":null,"intro":true},{"heading":"1. Um jogo novo, uma lista nova","html":"\u003cp>Abra o overlay enquanto joga Brotato. No topo de Início aparece a \u003cstrong>lista de Brotato\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, \u003cem>ativa\u003c/em> e ainda \u003cem>nova\u003c/em>. Ao lado do nome você vê o programa reconhecido e o número de sites. Adicione um site no \u003cstrong>campo abaixo da lista\u003c/strong> \u003cspan class=\"num\">2\u003c/span> ou pelo \u003cstrong>+\u003c/strong> da barra superior. A lista é criada junto com o primeiro site. A \u003cstrong>lista de Tiny Glade\u003c/strong> \u003cspan class=\"num\">3\u003c/span> está recolhida em \u003cem>Outras listas\u003c/em>. Clique nela para ver seus sites.\u003c/p>","image":{"src":"img/lists-per-game/01-brotato-new.png","alt":"Início aberto sobre Brotato com sua lista nova e a de Tiny Glade entre as outras"}},{"heading":"1. Um jogo novo, uma lista nova","html":"\u003cp>Aqui adicionamos a wiki de Brotato e a página do jogo no Steam. A barra mostra apenas as abas de Brotato.\u003c/p>","image":{"src":"img/lists-per-game/02-brotato-wiki.png","alt":"Abas da lista de Brotato"}},{"heading":"2. Cada jogo recupera seus sites","html":"\u003cp>Volte a Tiny Glade e abra o overlay. A barra mostra as \u003cstrong>abas de Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span> e a \u003cstrong>lista de Tiny Glade\u003c/strong> \u003cspan class=\"num\">2\u003c/span> está ativa. A \u003cstrong>lista de Brotato\u003c/strong> \u003cspan class=\"num\">3\u003c/span> foi para \u003cem>Outras listas\u003c/em>. \u003cstrong>Usar\u003c/strong> \u003cspan class=\"num\">4\u003c/span> a ativa manualmente (veja o passo 4). Cada lista reabre na última aba que você usou.\u003c/p>","image":{"src":"img/lists-per-game/03-tiny-glade.png","alt":"Início aberto sobre Tiny Glade com suas abas e a lista de Brotato entre as outras"}},{"heading":"3. A lista Geral","html":"\u003cp>O overlay oferece uma lista para qualquer programa sobre o qual você o abra. Quando ele não reconhece um aplicativo, a \u003cstrong>lista Geral\u003c/strong> fica ativa. Ela serve para sites sem ligação com um programa específico. Funciona como as outras e não pode ser removida.\u003c/p>","image":{"src":"img/lists-per-game/04-general.png","alt":"Lista Geral ativa quando nenhum aplicativo é reconhecido"}},{"heading":"4. Escolha uma lista manualmente","html":"\u003cp>Você pode querer ver os sites de outro jogo, por exemplo a wiki de Brotato enquanto Tiny Glade está aberto. Clique em \u003cstrong>Usar\u003c/strong> ao lado da lista desejada (\u003cspan class=\"num\">4\u003c/span> na captura do passo 2).\u003c/p>\u003cp>A lista fica ativa como \u003cstrong>Lista escolhida manualmente\u003c/strong> \u003cspan class=\"num\">1\u003c/span> mesmo se você abrir o overlay sobre outros jogos. Clique em \u003cstrong>Voltar para Tiny Glade\u003c/strong> para voltar à lista do jogo sobre o qual o overlay está aberto naquele momento. A barra mostra as \u003cstrong>abas da lista escolhida\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/lists-per-game/05-chosen-by-hand.png","alt":"Lista de Brotato escolhida manualmente com o overlay aberto sobre Tiny Glade"}},{"heading":"5. Reordene abas e sites","html":"\u003cp>Arraste uma aba na barra para movê-la. Aqui a Tiny Glade Wiki passa para a primeira posição.\u003c/p>","image":{"src":"img/lists-per-game/06-drag.png","alt":"Aba da Tiny Glade Wiki sendo arrastada para a primeira posição"}},{"heading":"5. Reordene abas e sites","html":"\u003cp>Você também pode arrastar os sites em Início. A ordem dos sites e a das abas é a mesma.\u003c/p>","image":null},{"heading":"6. Remova uma lista","html":"\u003cp>\u003cstrong>Remover lista\u003c/strong>, ao lado do nome da lista, exclui a lista e todos os seus sites depois de pedir confirmação.\u003c/p>","image":{"src":"img/lists-per-game/07-remove-list.png","alt":"Confirmação para remover a lista Brotato e todos os seus sites"}},{"heading":"6. Remova uma lista","html":"\u003cp>Ao adicionar um site enquanto joga Brotato de novo, a lista será recriada.\u003c/p>","image":null}]},{"id":"bookmarks","title":"Importar e exportar favoritos","intro":"Você já tem os sites dos seus jogos nos favoritos do navegador? Importe-os para as listas do Overlay Browser sem digitar os endereços de novo. Você também pode exportar as listas para um arquivo de favoritos que pode ser importado em qualquer navegador.","slides":[{"heading":null,"html":"\u003cp>Você já tem os sites dos seus jogos nos favoritos do navegador? Importe-os para as listas do Overlay Browser sem digitar os endereços de novo. Você também pode exportar as listas para um arquivo de favoritos que pode ser importado em qualquer navegador.\u003c/p>\u003cp>Aqui o overlay está aberto sobre \u003cstrong>Brotato\u003c/strong>, cuja lista ainda está vazia. A lista de \u003cstrong>Tiny Glade\u003c/strong> já tem três sites. Veja \u003ca href=\"#lists-per-game\">Uma lista por jogo\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. A seção Favoritos em Início","html":"\u003cp>No fim de \u003cstrong>Início\u003c/strong> fica a seção \u003cem>Favoritos\u003c/em>, com \u003cstrong>Importar favoritos…\u003c/strong> \u003cspan class=\"num\">1\u003c/span> e \u003cstrong>Exportar favoritos…\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/bookmarks/01-bookmarks-section.png","alt":"Seção Favoritos no fim da página Início"}},{"heading":"2. Escolha os favoritos para importar","html":"\u003cp>Clique em \u003cstrong>Importar favoritos…\u003c/strong>. Na janela, você encontra estas opções.\u003c/p>\u003cul>\u003cli>\u003cstrong>De\u003c/strong> \u003cspan class=\"num\">1\u003c/span> seleciona o perfil do navegador de onde vêm os favoritos. O overlay detecta Chrome, Edge, Brave, Opera, Vivaldi, Chromium, Firefox, LibreWolf e navegadores semelhantes. O Firefox pode ficar aberto. Na próxima vez, o overlay oferece o último perfil escolhido.\u003c/li>\u003cli>\u003cstrong>Arquivo…\u003c/strong> \u003cspan class=\"num\">2\u003c/span> importa um arquivo HTML exportado pelo gerenciador de favoritos de um navegador. No macOS, esse é o único método. Primeiro exporte os favoritos pelo navegador.\u003c/li>\u003cli>\u003cstrong>Pesquisar nos favoritos…\u003c/strong> \u003cspan class=\"num\">3\u003c/span> encontra favoritos e pastas por nome ou endereço.\u003c/li>\u003cli>Use as \u003cstrong>caixas de seleção\u003c/strong> \u003cspan class=\"num\">4\u003c/span> para marcar favoritos ou pastas inteiras. \u003cem>Todos os favoritos\u003c/em> seleciona tudo. Aqui marcamos a pasta \u003cem>Brotato\u003c/em>.\u003c/li>\u003cli>\u003cstrong>Na lista\u003c/strong> \u003cspan class=\"num\">5\u003c/span> escolhe a lista de destino. A lista ativa vem selecionada. Se ainda estiver \u003cem>nova\u003c/em>, como a de Brotato, a lista é criada com os sites importados.\u003c/li>\u003cli>O botão \u003cstrong>Adicionar 3 sites\u003c/strong> \u003cspan class=\"num\">6\u003c/span> mostra quantos sites serão adicionados.\u003c/li>\u003c/ul>","image":{"src":"img/bookmarks/02-import.png","alt":"Janela de importação com a pasta Brotato marcada"}},{"heading":"2. Escolha os favoritos para importar","html":"\u003cp>Os favoritos viram sites da lista e mantêm seus nomes.\u003c/p>","image":{"src":"img/bookmarks/03-imported.png","alt":"Três sites importados para a lista de Brotato"}},{"heading":"3. Importe pelo botão “+”","html":"\u003cp>Você também pode importar pelo \u003cstrong>+\u003c/strong> na barra superior. Abra a aba \u003cstrong>Favoritos\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, ao lado de \u003cem>Endereço\u003c/em>. Os sites sempre entram na lista ativa. Use \u003cstrong>Pesquisar nos favoritos…\u003c/strong> \u003cspan class=\"num\">2\u003c/span> para encontrá-los. Um endereço que \u003cstrong>já está na lista\u003c/strong> \u003cspan class=\"num\">3\u003c/span> aparece em cinza e não pode ser selecionado. Assim, a importação não cria duplicatas.\u003c/p>","image":{"src":"img/bookmarks/04-plus-bookmarks.png","alt":"Aba Favoritos do diálogo “+” com os favoritos já presentes desativados"}},{"heading":"4. Exporte as listas","html":"\u003cp>\u003cstrong>Exportar favoritos…\u003c/strong>, na seção \u003cem>Favoritos\u003c/em> de Início, salva os sites em um arquivo HTML que qualquer navegador pode importar. Cada lista vira uma pasta. No início, \u003cstrong>Todos os favoritos\u003c/strong> \u003cspan class=\"num\">1\u003c/span> estão selecionados. Na \u003cstrong>lista\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, desmarque os sites ou listas que não quer exportar. \u003cstrong>Exportar 6 sites\u003c/strong> \u003cspan class=\"num\">3\u003c/span> pergunta onde salvar o arquivo.\u003c/p>","image":{"src":"img/bookmarks/05-export.png","alt":"Janela de exportação com as listas de Brotato e Tiny Glade"}}]},{"id":"customizing","title":"Personalize o overlay","intro":"Em \u003cstrong>Configurações\u003c/strong>, você escolhe a combinação de teclas, o comportamento, a aparência e o idioma. As mudanças valem imediatamente e ficam salvas.","slides":[{"heading":null,"html":"\u003cp>Em \u003cstrong>Configurações\u003c/strong>, você escolhe a combinação de teclas, o comportamento, a aparência e o idioma. As mudanças valem imediatamente e ficam salvas.\u003c/p>","image":null,"intro":true},{"heading":"1. A combinação de teclas","html":"\u003cp>Abra \u003cstrong>Configurações\u003c/strong> \u003cspan class=\"num\">1\u003c/span> no canto superior direito ou pelo menu do ícone na área de notificação. Na seção \u003cem>Teclado\u003c/em> aparece a \u003cstrong>combinação atual\u003c/strong> \u003cspan class=\"num\">2\u003c/span> que exibe e oculta o overlay. \u003cstrong>Alterar\u003c/strong> \u003cspan class=\"num\">3\u003c/span> registra uma nova. \u003cstrong>Restaurar padrão\u003c/strong> \u003cspan class=\"num\">4\u003c/span> recupera a combinação padrão (Win+F10, Super+F10 no Linux, Cmd+Shift+Espaço no macOS).\u003c/p>","image":{"src":"img/customizing/01-shortcut.png","alt":"Seção Teclado das Configurações"}},{"heading":"1. A combinação de teclas","html":"\u003cp>Depois de clicar em \u003cstrong>Alterar\u003c/strong>, pressione a combinação que preferir, por exemplo \u003ccode>Ctrl+Shift+O\u003c/code>. Esc cancela.\u003c/p>","image":{"src":"img/customizing/02-new-combination.png","alt":"Overlay aguardando a nova combinação de teclas"}},{"heading":"1. A combinação de teclas","html":"\u003cp>Você pode usar F1 a F24 sozinhas ou combinar outra tecla com Ctrl, Alt, Shift ou Win (Super no Linux, Cmd no macOS). Se outro programa já usar a combinação, aparece uma mensagem e a combinação anterior continua ativa.\u003c/p>\u003cblockquote>\u003cstrong>Durante o jogo.\u003c/strong> O jogo também recebe a combinação. Escolha uma que não esteja ligada a um comando do jogo para evitar executá-lo ao abrir o overlay.\u003c/blockquote>","image":null},{"heading":"2. Comportamento","html":"\u003cp>Na seção \u003cem>Comportamento\u003c/em>, você encontra estas opções.\u003c/p>\u003cul>\u003cli>\u003cstrong>Ocultar o overlay quando ele perder o foco\u003c/strong> \u003cspan class=\"num\">1\u003c/span> vem ativada. O overlay se oculta ao clicar no jogo ou em outra janela. Desative a opção se quiser que ele fique visível enquanto joga. A combinação de teclas continua ocultando o overlay. A opção também aparece no menu do ícone na área de notificação.\u003c/li>\u003cli>\u003cstrong>Página inicial da navegação livre\u003c/strong> \u003cspan class=\"num\">2\u003c/span> define a página que a aba Navegar abre primeiro. Deixe o campo vazio para abrir a aba sem página. Veja \u003ca href=\"#free-browsing\">Navegação livre\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Mecanismo de pesquisa\u003c/strong> \u003cspan class=\"num\">3\u003c/span> define onde pesquisar o texto digitado em Navegar. Escolha Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage ou \u003cem>Personalizado\u003c/em>. No endereço personalizado, use \u003ccode>%s\u003c/code> no lugar do texto da pesquisa.\u003c/li>\u003c/ul>\u003cp>A opção \u003cem>Procurar novas versões\u003c/em> avisa em Início quando sai uma nova versão. A edição da Microsoft Store recebe as atualizações pela loja.\u003c/p>","image":{"src":"img/customizing/03-behavior.png","alt":"Seção Comportamento das Configurações"}},{"heading":"3. Aparência e idioma","html":"\u003cp>Na seção \u003cem>Aparência\u003c/em>, você encontra estas opções.\u003c/p>\u003cul>\u003cli>\u003cstrong>Cor de destaque\u003c/strong> \u003cspan class=\"num\">1\u003c/span> muda a cor das abas fixas, dos botões principais e de outros detalhes.\u003c/li>\u003cli>\u003cstrong>Abas fixas\u003c/strong> \u003cspan class=\"num\">2\u003c/span> mostra Início, Navegar e Configurações com ícone e nome. \u003cem>Somente ícone\u003c/em> deixa mais espaço para as abas dos sites.\u003c/li>\u003cli>\u003cstrong>Opacidade da janela\u003c/strong> \u003cspan class=\"num\">3\u003c/span> vai de 30% a 100%. Com valores menores, você consegue ver o jogo atrás da janela.\u003c/li>\u003c/ul>\u003cp>Na seção \u003cem>Idioma\u003c/em>, o \u003cstrong>Idioma da interface\u003c/strong> \u003cspan class=\"num\">4\u003c/span> usa por padrão o \u003cem>Idioma do sistema\u003c/em> quando disponível (italiano, inglês, francês, português, russo, espanhol e alemão). Se o idioma não estiver disponível, o aplicativo usa inglês.\u003c/p>","image":{"src":"img/customizing/04-appearance.png","alt":"Seções Aparência e Idioma das Configurações"}},{"heading":"3. Aparência e idioma","html":"\u003cp>Aqui o overlay usa azul como cor de destaque e mostra \u003cstrong>somente os ícones das abas fixas\u003c/strong> \u003cspan class=\"num\">1\u003c/span> \u003cspan class=\"num\">2\u003c/span>. A captura inclui apenas a janela, então não mostra o jogo por trás nem o efeito da opacidade.\u003c/p>","image":{"src":"img/customizing/05-customized.png","alt":"Overlay com destaque azul e abas fixas que mostram somente os ícones"}},{"heading":"Outras seções","html":"\u003cp>Mais abaixo, \u003cem>Memória\u003c/em> mostra quanta memória o aplicativo usa e quando as páginas sem uso são fechadas. \u003cem>Diagnóstico\u003c/em> ajuda a coletar informações para relatar um problema.\u003c/p>","image":null}]},{"id":"memory","title":"Memória e páginas fechadas","intro":"Cada página aberta no Overlay Browser usa memória, como em um navegador, mesmo quando você não está olhando para ela. As páginas das outras listas também ficam abertas. Para deixar memória para o jogo, o overlay \u003cstrong>fecha automaticamente as páginas que você deixou de usar\u003c/strong>. Nas Configurações, você pode consultar o consumo de memória e fechar páginas manualmente.","slides":[{"heading":null,"html":"\u003cp>Cada página aberta no Overlay Browser usa memória, como em um navegador, mesmo quando você não está olhando para ela. As páginas das outras listas também ficam abertas. Para deixar memória para o jogo, o overlay \u003cstrong>fecha automaticamente as páginas que você deixou de usar\u003c/strong>. Nas Configurações, você pode consultar o consumo de memória e fechar páginas manualmente.\u003c/p>\u003cp>Neste exemplo, há várias páginas abertas nas listas de \u003cstrong>Tiny Glade\u003c/strong> e \u003cstrong>Brotato\u003c/strong>. Veja \u003ca href=\"#lists-per-game\">Uma lista por jogo\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Por que uma página recarrega","html":"\u003cp>As páginas que você não está vendo ficam abertas por um tempo e depois fecham. Isso se aplica às outras abas, às outras listas e a todas as páginas enquanto o overlay estiver oculto. Quando você reabre uma aba, a página \u003cstrong>recarrega a partir do último endereço visitado\u003c/strong>. Você recupera a página, mas pode perder a posição da rolagem ou um formulário preenchido pela metade.\u003c/p>\u003cp>A página que você está vendo continua aberta.\u003c/p>","image":null},{"heading":"2. A seção Memória","html":"\u003cp>Abra \u003cstrong>Configurações\u003c/strong> e role até \u003cem>Memória\u003c/em>.\u003c/p>\u003cul>\u003cli>\u003cstrong>Fechar as páginas não usadas após\u003c/strong> \u003cspan class=\"num\">1\u003c/span> define o tempo de espera de 5 a 60 minutos. O padrão é 30 minutos. Se houver pouca memória livre ou o jogo consumir muita memória, use um tempo menor.\u003c/li>\u003cli>\u003cstrong>Memória usada\u003c/strong> \u003cspan class=\"num\">2\u003c/span> mostra a memória de todo o aplicativo.\u003c/li>\u003cli>\u003cstrong>Fechar todas as páginas\u003c/strong> \u003cspan class=\"num\">3\u003c/span> fecha imediatamente as páginas abertas de todas as listas.\u003c/li>\u003cli>\u003cstrong>Processos do aplicativo\u003c/strong> \u003cspan class=\"num\">4\u003c/span> inclui a interface do overlay, o processo principal, os gráficos (GPU) e outros processos. Eles sempre usam memória.\u003c/li>\u003cli>\u003cstrong>Páginas agrupadas por lista\u003c/strong> \u003cspan class=\"num\">5\u003c/span> mostra a memória das páginas abertas de cada lista. \u003cstrong>Fechar\u003c/strong> fecha todas as páginas da lista.\u003c/li>\u003c/ul>","image":{"src":"img/memory/01-memory.png","alt":"Seção Memória das Configurações com as listas de Tiny Glade e Brotato"}},{"heading":"3. Páginas de uma lista","html":"\u003cp>Clique no nome da lista para ver as páginas abertas, quanta memória cada uma usa e quanto tempo falta para fechar. \u003cstrong>Fechar\u003c/strong> ao lado da lista \u003cspan class=\"num\">1\u003c/span> fecha todas as páginas dela. \u003cstrong>Fechar\u003c/strong> ao lado de uma página \u003cspan class=\"num\">2\u003c/span> fecha só aquela.\u003c/p>","image":{"src":"img/memory/02-pages.png","alt":"Páginas abertas da lista de Tiny Glade com seus botões Fechar"}},{"heading":"3. Páginas de uma lista","html":"\u003cp>Algumas páginas compartilham um processo, como páginas do mesmo site em listas diferentes. Elas aparecem em uma linha fora dos grupos e são fechadas juntas. A memória só é liberada quando todas fecham.\u003c/p>","image":null},{"heading":"4. Depois de fechar as páginas","html":"\u003cp>Aqui fechamos as páginas de Brotato. O grupo saiu da tabela e a memória usada diminuiu. As abas permanecem na lista e recarregam as páginas quando você as abre.\u003c/p>","image":{"src":"img/memory/03-closed.png","alt":"Seção Memória após fechar as páginas de Brotato"}}]},{"id":"new-versions","title":"Novas versões","intro":"O Overlay Browser verifica se há uma nova versão e avisa você. Você escolhe quando baixar e instalar a atualização.","slides":[{"heading":null,"html":"\u003cp>O Overlay Browser verifica se há uma nova versão e avisa você. Você escolhe quando baixar e instalar a atualização.\u003c/p>","image":null,"intro":true},{"heading":"1. O aviso de nova versão","html":"\u003cp>Quando sai uma nova versão, aparece uma \u003cstrong>faixa\u003c/strong> \u003cspan class=\"num\">1\u003c/span> abaixo da barra superior com o número da versão. \u003cstrong>Baixar\u003c/strong> \u003cspan class=\"num\">2\u003c/span> abre no navegador do sistema a página de onde você pode baixar o arquivo para seu sistema. Veja a instalação no \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a>. \u003cstrong>×\u003c/strong> \u003cspan class=\"num\">3\u003c/span> fecha a faixa em definitivo para essa versão.\u003c/p>\u003cp>A nova versão também aparece no topo de \u003cstrong>Início\u003c/strong> \u003cspan class=\"num\">4\u003c/span> ao lado da que você usa. Clique nela para abrir a mesma página.\u003c/p>","image":{"src":"img/new-versions/01-new-version.png","alt":"Faixa abaixo da barra e nova versão indicada em Início"}},{"heading":"1. O aviso de nova versão","html":"\u003cp>Depois de fechar a faixa, a nova versão continua em Início até você instalar a atualização.\u003c/p>","image":{"src":"img/new-versions/02-strip-closed.png","alt":"Início com a nova versão ao lado da versão em uso"}},{"heading":"2. Quando o aplicativo verifica","html":"\u003cp>O aplicativo consulta os lançamentos do projeto no GitHub logo após iniciar e a cada seis horas. Se você usa uma versão beta, ele também avisa sobre betas mais recentes. Nos demais casos, avisa apenas sobre versões finais.\u003c/p>\u003cp>Para parar de receber os avisos, desative \u003cstrong>Procurar novas versões\u003c/strong> em \u003cstrong>Configurações\u003c/strong>, na seção \u003cem>Comportamento\u003c/em>. A edição da Microsoft Store recebe atualizações pela loja e não oferece essa opção.\u003c/p>","image":{"src":"img/new-versions/03-option.png","alt":"Opção Procurar novas versões nas Configurações"}}]},{"id":"signing-in","title":"Entrar em um site e excluir seus cookies","intro":"Muitos sites de jogos, como fóruns, wikis ou ferramentas para planejar builds, funcionam melhor com uma conta ou exigem que você entre. No overlay, você entra como em um navegador e a sessão fica salva. Se um site parar de funcionar direito ou você quiser sair da conta, pode excluir os cookies dele.","slides":[{"heading":null,"html":"\u003cp>Muitos sites de jogos, como fóruns, wikis ou ferramentas para planejar builds, funcionam melhor com uma conta ou exigem que você entre. No overlay, você entra como em um navegador e a sessão fica salva. Se um site parar de funcionar direito ou você quiser sair da conta, pode excluir os cookies dele.\u003c/p>\u003cp>A lista de \u003cstrong>Tiny Glade\u003c/strong> também inclui um fórum. É um \u003cstrong>site de exemplo\u003c/strong> feito para este guia. O acesso funciona como em sites reais, por exemplo com \u003cem>Continuar com o Google\u003c/em>.\u003c/p>","image":null,"intro":true},{"heading":"1. Entre com sua conta","html":"\u003cp>Abra a aba do site e clique no botão de acesso, aqui \u003cstrong>Continuar com uma conta\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/01-forum.png","alt":"Fórum de exemplo aberto na aba com o botão de acesso"}},{"heading":"1. Entre com sua conta","html":"\u003cp>O site abre uma \u003cstrong>janela de acesso\u003c/strong> sobre o overlay. Digite seus dados e confirme.\u003c/p>","image":{"src":"img/signing-in/02-sign-in-window.png","alt":"Janela de acesso aberta pelo site sobre o overlay"}},{"heading":"1. Entre com sua conta","html":"\u003cp>A janela de acesso faz parte do overlay. Ela fica por cima e se oculta e reaparece junto com ele. Você pode alternar entre as janelas sem ocultá-las. Quando a janela de acesso fecha, o overlay volta a ficar ativo.\u003c/p>","image":null},{"heading":"2. A sessão fica salva","html":"\u003cp>Depois que você entra, a janela fecha e o site mostra sua \u003cstrong>conta\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/03-signed-in.png","alt":"Fórum com a sessão ativa e o nome de usuário no topo"}},{"heading":"2. A sessão fica salva","html":"\u003cp>Você continua na conta mesmo se fechar o overlay ou reiniciar o aplicativo. A mesma sessão vale em todas as listas onde esse site aparece.\u003c/p>","image":null},{"heading":"3. Exclua os cookies de um site","html":"\u003cp>Cookies são dados que o site salva para reconhecer você e manter sua sessão. Você pode excluí-los para \u003cstrong>sair da conta\u003c/strong>, por exemplo para trocar de conta, ou quando o \u003cstrong>site não funciona direito\u003c/strong>.\u003c/p>\u003cp>Na aba do site, clique em \u003cstrong>…\u003c/strong> (\u003cem>Mais ações\u003c/em>) à direita do endereço e escolha \u003cstrong>Excluir os cookies de forum.example\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/04-menu.png","alt":"Menu Mais ações com a opção Excluir os cookies de forum.example"}},{"heading":"3. Exclua os cookies de um site","html":"\u003cp>Quando o overlay pedir confirmação, clique em \u003cstrong>Excluir\u003c/strong>. Os cookies do site e dos subdomínios serão excluídos. Os outros sites mantêm seus cookies.\u003c/p>","image":{"src":"img/signing-in/05-confirm.png","alt":"Confirmação para excluir os cookies de forum.example e dos subdomínios"}},{"heading":"4. A página recarrega","html":"\u003cp>Depois da exclusão, a página recarrega. Você saiu da conta e o site oferece a opção de \u003cstrong>entrar\u003c/strong> novamente.\u003c/p>","image":{"src":"img/signing-in/06-signed-out.png","alt":"Fórum recarregado após a exclusão dos cookies, com a sessão encerrada"}}]},{"id":"links-and-menu","title":"Links, novas abas e menu de contexto","intro":"Em um navegador, muitos links abrem em uma nova aba. No overlay, as abas correspondem aos sites da lista. Esses links abrem na aba do site de origem ou, após confirmação, em uma nova aba. Com o botão direito, você pode abrir links em novas abas e copiar links, imagens ou texto.","slides":[{"heading":null,"html":"\u003cp>Em um navegador, muitos links abrem em uma nova aba. No overlay, as abas correspondem aos sites da lista. Esses links abrem na aba do site de origem ou, após confirmação, em uma nova aba. Com o botão direito, você pode abrir links em novas abas e copiar links, imagens ou texto.\u003c/p>\u003cp>A lista de \u003cstrong>Tiny Glade\u003c/strong> inclui um fórum, um \u003cstrong>site de exemplo\u003c/strong> para este guia. Veja \u003ca href=\"#signing-in\">Entrar em um site e excluir seus cookies\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Um link que o site abre em uma nova aba","html":"\u003cp>Alguns links são feitos para abrir em outra aba, como o desta discussão. O mesmo vale para links clicados com Ctrl ou com o botão do meio do mouse.\u003c/p>","image":{"src":"img/links-and-menu/01-link.png","alt":"Fórum de exemplo com o link para uma discussão"}},{"heading":"2. O mesmo site abre na própria aba","html":"\u003cp>Se o link levar ao mesmo site, ele abre na \u003cstrong>aba do site\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, no lugar da página anterior. O \u003cstrong>endereço\u003c/strong> \u003cspan class=\"num\">2\u003c/span> passa a mostrar o da discussão. \u003cstrong>Voltar\u003c/strong> recupera a página anterior.\u003c/p>","image":{"src":"img/links-and-menu/02-same-tab.png","alt":"Discussão aberta na aba do fórum"}},{"heading":"2. O mesmo site abre na própria aba","html":"\u003cp>Se a lista tiver várias abas do mesmo site, o link abre na aba de origem.\u003c/p>","image":null},{"heading":"3. Outro site pede confirmação","html":"\u003cp>Se o link levar a um site sem aba na lista, como os guias da comunidade no Steam, o overlay pergunta se você quer adicioná-lo à lista. \u003cstrong>Adicionar\u003c/strong> inclui e abre o site. \u003cstrong>Cancelar\u003c/strong> mantém a página atual.\u003c/p>","image":{"src":"img/links-and-menu/03-other-site.png","alt":"Pergunta sobre adicionar à lista o site que a página quer abrir em outra aba"}},{"heading":"3. Outro site pede confirmação","html":"\u003cp>Links abertos a partir de \u003cstrong>Navegar\u003c/strong> ficam nessa aba. Veja \u003ca href=\"#free-browsing\">Navegação livre\u003c/a>.\u003c/p>","image":null},{"heading":"4. Clique com o botão direito em um link","html":"\u003cp>Ao clicar com o botão direito em um link, o menu mostra \u003cstrong>Abrir link em nova aba\u003c/strong> \u003cspan class=\"num\">1\u003c/span> e \u003cstrong>Copiar link\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, que copia o endereço.\u003c/p>","image":{"src":"img/links-and-menu/04-link-menu.png","alt":"Menu de contexto do link com as opções para abrir e copiar"}},{"heading":"4. Clique com o botão direito em um link","html":"\u003cp>\u003cstrong>Abrir link em nova aba\u003c/strong> pede confirmação antes de incluir o link na lista. Clique em \u003cstrong>Adicionar\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/05-confirm-tab.png","alt":"Confirmação para adicionar o link como nova aba da lista Tiny Glade"}},{"heading":"4. Clique com o botão direito em um link","html":"\u003cp>O link abre em uma \u003cstrong>nova aba\u003c/strong> logo após a aba de origem. Se já houver uma aba com esse endereço, o overlay exibe a aba existente.\u003c/p>","image":{"src":"img/links-and-menu/06-new-tab.png","alt":"Discussão aberta em uma nova aba logo depois da aba do fórum"}},{"heading":"5. Clique com o botão direito em imagens e texto","html":"\u003cp>Em uma imagem, use \u003cstrong>Copiar imagem\u003c/strong> para colá-la, por exemplo, em uma conversa. No texto de uma página, aparecem \u003cstrong>Copiar\u003c/strong> para o texto selecionado e \u003cstrong>Selecionar tudo\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/07-image-menu.png","alt":"Menu de contexto de uma imagem, com Copiar imagem"}},{"heading":"5. Clique com o botão direito em imagens e texto","html":"\u003cp>Em campos de texto, como o campo de resposta do fórum ou o de endereço, aparecem \u003cstrong>Desfazer\u003c/strong>, \u003cstrong>Refazer\u003c/strong>, \u003cstrong>Recortar\u003c/strong>, \u003cstrong>Copiar\u003c/strong>, \u003cstrong>Colar\u003c/strong> e \u003cstrong>Selecionar tudo\u003c/strong>. Opções indisponíveis aparecem em cinza, como \u003cem>Copiar\u003c/em> quando não há texto selecionado.\u003c/p>","image":{"src":"img/links-and-menu/08-field-menu.png","alt":"Menu de contexto em um campo de texto"}}]},{"id":"troubleshooting","title":"Solução de problemas","intro":"Veja como resolver problemas comuns e coletar informações para relatá-los. Consulte o README para os detalhes de Windows, Linux e macOS.","slides":[{"heading":null,"html":"\u003cp>Veja como resolver problemas comuns e coletar informações para relatá-los. Consulte o \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a> para os detalhes de Windows, Linux e macOS.\u003c/p>","image":null,"intro":true},{"heading":"1. A combinação de teclas não funciona","html":"\u003cul>\u003cli>\u003cstrong>Outro programa já usa a combinação.\u003c/strong> Se você a escolher nas Configurações, o overlay avisa que a combinação é “inválida ou já em uso” e mantém a anterior. Escolha outra. Veja \u003ca href=\"#customizing\">Personalize o overlay\u003c/a>.\u003c/li>\u003cli>\u003cstrong>O jogo usa a combinação em um comando.\u003c/strong> A combinação também chega ao jogo. Escolha uma que não acione nada nele.\u003c/li>\u003cli>\u003cstrong>Linux com Wayland.\u003c/strong> A combinação não é detectada enquanto uma janela nativa do Wayland estiver ativa. Use uma sessão X11. Veja \u003cem>Linux\u003c/em> no \u003ca href=\"../../README.md#linux\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Teclas de função no macOS.\u003c/strong> Por padrão, F1 a F12 controlam brilho, volume e outros ajustes. Pressione-as junto com \u003cstrong>fn\u003c/strong> ou altere a configuração do teclado. Veja \u003cem>macOS\u003c/em> no \u003ca href=\"../../README.md#macos\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003c/ul>\u003cp>Você também pode exibir o overlay pelo ícone na área de notificação.\u003c/p>","image":null},{"heading":"2. Não encontro o ícone do aplicativo","html":"\u003cp>O aplicativo fica na área de notificação, perto do relógio. Ele não aparece na barra de tarefas nem no Alt+Tab.\u003c/p>\u003cul>\u003cli>\u003cstrong>Windows\u003c/strong> – Se o ícone estiver oculto, clique na seta \u003cstrong>^\u003c/strong> e arraste o ícone para a barra de tarefas para que fique visível.\u003c/li>\u003cli>\u003cstrong>Linux com GNOME\u003c/strong> – Você precisa da extensão \u003cem>AppIndicator and KStatusNotifierItem Support\u003c/em>. Se o clique no ícone abrir um menu, escolha \u003cem>Mostrar\u003c/em>.\u003c/li>\u003cli>\u003cstrong>macOS\u003c/strong> – O ícone fica no canto direito da barra de menus.\u003c/li>\u003c/ul>","image":null},{"heading":"3. O overlay não aparece sobre o jogo ou está opaco","html":"\u003cul>\u003cli>\u003cstrong>O jogo cobre o overlay.\u003c/strong> Alguns jogos em tela cheia exclusiva cobrem todas as janelas. Mude o jogo para o modo \u003cem>janela sem bordas\u003c/em>.\u003c/li>\u003cli>\u003cstrong>A janela está opaca no Linux.\u003c/strong> A transparência requer um gerenciador de janelas com composição ativa, como Cinnamon, KDE, GNOME ou Xfce com composição ativada.\u003c/li>\u003c/ul>","image":null},{"heading":"4. Um site falha ou a página recarrega","html":"\u003cul>\u003cli>\u003cstrong>O site não funciona direito ou você quer sair da conta.\u003c/strong> Exclua os cookies pelo menu \u003cstrong>…\u003c/strong>. Veja \u003ca href=\"#signing-in\">Entrar em um site e excluir seus cookies\u003c/a>.\u003c/li>\u003cli>\u003cstrong>A página recarrega ao voltar para a aba.\u003c/strong> Páginas sem uso são fechadas depois de um tempo para liberar memória. Veja \u003ca href=\"#memory\">Memória e páginas fechadas\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Você quer começar do zero.\u003c/strong> Feche o aplicativo e apague o arquivo de preferências. Veja \u003cem>Preferences and uninstalling\u003c/em> no \u003ca href=\"../../README.md#preferences-and-uninstalling\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003c/ul>","image":null},{"heading":"5. Colete informações para relatar um problema","html":"\u003cp>Se o problema persistir, relate-o na \u003ca href=\"https://github.com/siculo/overlay-browser/issues\" target=\"_blank\" rel=\"noopener\">página de problemas do projeto\u003c/a>. O arquivo de log ajuda a entender o que aconteceu.\u003c/p>\u003cp>Em \u003cstrong>Configurações\u003c/strong>, abra a seção \u003cem>Diagnóstico\u003c/em>.\u003c/p>\u003cul>\u003cli>\u003cstrong>Log detalhado\u003c/strong> \u003cspan class=\"num\">1\u003c/span> normalmente registra erros e falhas com as configurações atuais. Quando ativado, também registra o que você faz no aplicativo (abas, sites, listas e configurações) e o que acontece com o overlay (exibição, ocultação, foco, combinação de teclas e aplicativo em primeiro plano). Ative a opção e repita os passos que causam o problema.\u003c/li>\u003cli>\u003cstrong>Mostrar o arquivo de log\u003c/strong> \u003cspan class=\"num\">2\u003c/span> abre a pasta do arquivo \u003ccode>overlay.log\u003c/code> para você anexá-lo ao relato.\u003c/li>\u003cli>\u003cstrong>Esvaziar o log\u003c/strong> \u003cspan class=\"num\">3\u003c/span> apaga o conteúdo, por exemplo para registrar apenas o problema que você quer relatar.\u003c/li>\u003c/ul>","image":{"src":"img/troubleshooting/01-diagnostics.png","alt":"Seção Diagnóstico das Configurações"}},{"heading":"5. Colete informações para relatar um problema","html":"\u003cp>O log não guarda as teclas que você pressiona nem sua navegação, incluindo endereços e títulos de páginas. Os sites são identificados apenas pela posição na lista.\u003c/p>\u003cp>\u003cstrong>Esvaziar o log\u003c/strong> pede confirmação antes de apagar o conteúdo.\u003c/p>","image":{"src":"img/troubleshooting/02-empty-log.png","alt":"Confirmação para esvaziar o arquivo de log"}}]}],"strings":{"docTitle":"Overlay Browser · Guia","subtitle":"Guia de uso, passo a passo","legend":"Nas capturas de tela, os elementos citados no texto são destacados por um quadro vermelho \u003cspan class=\"box\">\u003c/span>; números como \u003cspan class=\"num\">1\u003c/span> no texto indicam o elemento com o mesmo número na captura.","menu":"Guias","menuTitle":"Voltar à lista de guias (Esc)","prev":"Voltar","prevTitle":"Slide anterior (←)","next":"Avançar","nextTitle":"Próximo slide (→)","prevGuide":"Guia anterior","nextGuide":"Próximo guia: {title}","backToGuides":"Voltar aos guias","guideOf":"Guia {n} de {total}","step":"Passo {n}","slideOne":"1 slide","slideOther":"{count} slides"}};
const S = DATA.strings;   // testi della pagina nella lingua delle guide
const $ = (id) => document.getElementById(id);
const guides = DATA.guides;
const plural = (n) => (n === 1 ? S.slideOne : S.slideOther.replace('{count}', n));

// ---------- menu ----------
$('guides').replaceChildren(...guides.map((g, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${g.id}"><span class="n">${i + 1}</span><h2></h2><p>${g.intro}</p><span class="count">${plural(g.slides.length)}</span></a>`;
  li.querySelector('h2').textContent = g.title;
  return li;
}));

// ---------- slide ----------
// Indirizzo: #<guida>/<numero> (da 1); #<guida> = prima slide; vuoto = menu.
let current = null, index = 0;

function route() {
  const [id, n] = decodeURIComponent(location.hash.slice(1)).split('/');
  const g = guides.find((x) => x.id === id);
  closeZoom();
  if (!g) { showMenu(); return; }
  const i = Math.min(Math.max((Number(n) || 1) - 1, 0), g.slides.length - 1);
  const dir = g === current ? Math.sign(i - index) : 0;
  current = g;
  index = i;
  renderSlide(dir);
}

function showMenu() {
  current = null;
  $('deck').hidden = true;
  $('menu').hidden = false;
  document.title = S.docTitle;
}

const go = (i) => { location.hash = `${current.id}/${i + 1}`; };

function renderSlide(dir) {
  const g = current, s = g.slides[index];
  const gi = guides.indexOf(g), nextGuide = guides[gi + 1];
  $('menu').hidden = true;
  $('deck').hidden = false;
  document.title = `${g.title} · Overlay Browser`;
  $('guide-title').textContent = g.title;
  $('pos').textContent = `${index + 1} / ${g.slides.length}`;

  const el = $('slide');
  el.className = s.image ? 'with-image' : 'text-only';
  if (s.intro) el.classList.add('intro');
  const text = document.createElement('div');
  text.className = 'text';
  if (s.intro) {
    text.innerHTML = `<p class="section">${S.guideOf.replace('{n}', gi + 1).replace('{total}', guides.length)}</p><h2></h2>${s.html}`;
    text.querySelector('h2').textContent = g.title;
  } else {
    text.innerHTML = `<p class="section"></p><h2></h2>${s.html}`;
    const m = s.heading.match(/^(\d+)\.\s+(.*)$/);
    text.querySelector('.section').textContent = m ? S.step.replace('{n}', m[1]) : '';
    text.querySelector('h2').textContent = m ? m[2] : s.heading;
  }
  const parts = [text];
  if (s.image) {
    const fig = document.createElement('figure');
    fig.innerHTML = '<img><figcaption></figcaption>';
    fig.querySelector('img').src = s.image.src;
    fig.querySelector('img').alt = s.image.alt;
    fig.querySelector('figcaption').textContent = s.image.alt;
    fig.querySelector('img').onclick = () => openZoom(s.image);
    parts.push(fig);
  }
  el.replaceChildren(...parts);
  el.scrollTop = 0;
  el.classList.remove('enter');
  el.style.setProperty('--from', `${dir * 16}px`);
  if (dir) { void el.offsetWidth; el.classList.add('enter'); }

  $('dots').replaceChildren(...g.slides.map((x, i) => {
    const b = document.createElement('button');
    b.title = x.intro ? g.title : x.heading;
    b.setAttribute('aria-current', String(i === index));
    b.onclick = () => go(i);
    return b;
  }));
  $('prev').disabled = index === 0 && gi === 0;
  $('prev').textContent = index === 0 && gi > 0 ? `← ${S.prevGuide}` : `← ${S.prev}`;
  const last = index === g.slides.length - 1;
  $('next').textContent = !last ? `${S.next} →` : nextGuide ? `${S.nextGuide.replace('{title}', nextGuide.title)} →` : S.backToGuides;
}

function next() {
  if (index < current.slides.length - 1) return go(index + 1);
  const g = guides[guides.indexOf(current) + 1];
  location.hash = g ? g.id : '';
}
function prev() {
  if (index > 0) return go(index - 1);
  const g = guides[guides.indexOf(current) - 1];
  if (g) location.hash = `${g.id}/${g.slides.length}`;
}
$('next').onclick = next;
$('prev').onclick = prev;

// ---------- immagine a tutto schermo ----------
function openZoom(image) {
  $('zoom').querySelector('img').src = image.src;
  $('zoom').querySelector('img').alt = image.alt;
  $('zoom').hidden = false;
}
function closeZoom() { $('zoom').hidden = true; }
$('zoom').onclick = closeZoom;

// ---------- tastiera ----------
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!$('zoom').hidden) { if (e.key === 'Escape') closeZoom(); return; }
  if (!current) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) next();
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) prev();
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(current.slides.length - 1);
  else if (e.key === 'Escape') location.hash = '';
  else return;
  e.preventDefault();
});

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
