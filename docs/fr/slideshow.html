<!doctype html>
<!-- Modello della presentazione: build.js sostituisce i testi (segnaposti tra doppie graffe, da
     STRINGS in build.js) e i dati e scrive docs/<lingua>/<file>.html. Non
     modificare la pagina generata. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Browser · Guide</title>
<link rel="icon" href="../../assets/icon.png">
<style>
  :root {
    --bg: #141414; --sheet: #1b1b1b; --line: #2c2c2c; --text: #e8e8e8; --muted: #9a9a9a;
    --accent: #f0a030; --accent-text: #f5b750; --on-accent: #111; --mark: #e5262b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, sans-serif; }
  a { color: var(--accent-text); }
  code { font-family: ui-monospace, monospace; font-size: .9em; padding: 1px 5px; border-radius: 4px; background: #262626; }
  strong { color: #fff; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Numeri come nelle schermate: bianco su cerchio rosso. */
  .num { display: inline-flex; align-items: center; justify-content: center; width: 1.45em; height: 1.45em;
         margin: 0 .1em; border-radius: 50%; background: var(--mark); color: #fff; border: 2px solid #fff;
         font-size: .72em; font-weight: 700; line-height: 1; vertical-align: .12em; }

  /* ---------- menu ---------- */
  #menu { max-width: 1100px; margin: 0 auto; padding: 48px 32px 64px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { height: 56px; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; color: var(--muted); }
  .legend { margin: 28px 0 32px; padding: 12px 16px; border-left: 3px solid var(--mark); background: var(--sheet);
            color: #cfcfcf; border-radius: 0 6px 6px 0; }
  .legend .box { display: inline-block; width: 1.3em; height: .9em; border: 2px solid var(--mark); border-radius: 4px; vertical-align: -.05em; }
  #guides { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
            list-style: none; margin: 0; padding: 0; counter-reset: guide; }
  #guides a { display: flex; flex-direction: column; height: 100%; padding: 18px 20px; border: 1px solid var(--line);
              border-radius: 10px; background: var(--sheet); color: inherit; text-decoration: none;
              transition: border-color .15s, transform .15s; }
  #guides a:hover, #guides a:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  #guides .n { color: var(--accent-text); font-weight: 700; font-size: 14px; }
  #guides h2 { margin: 4px 0 8px; font-size: 19px; font-weight: 600; line-height: 1.3; }
  #guides p { margin: 0 0 14px; color: #bdbdbd; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #guides .count { margin-top: auto; }
  #guides .count { color: var(--muted); font-size: 13px; }

  /* ---------- slide ---------- */
  #deck { display: flex; flex-direction: column; height: 100%; }
  #deck header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: #0e0e0e; }
  #deck header .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid #3a3a3a;
         border-radius: 6px; background: #232323; text-decoration: none; color: var(--text); white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  #slide { flex: 1; min-height: 0; padding: 28px 36px; overflow: auto; }
  #slide.with-image { display: grid; grid-template-columns: minmax(300px, 36%) 1fr; gap: 36px; align-items: center; }
  #slide.text-only { display: flex; align-items: center; justify-content: center; }
  #slide .text { max-height: 100%; overflow: auto; }
  #slide.text-only .text { max-width: 760px; font-size: 19px; }
  #slide .section { margin: 0 0 4px; color: var(--accent-text); font-size: 14px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  #slide h2 { margin: 0 0 14px; font-size: 26px; font-weight: 600; line-height: 1.25; }
  #slide.intro h2 { font-size: 34px; }
  #slide p { margin: 0 0 12px; }
  #slide ul { margin: 0 0 12px; padding-left: 1.2em; }
  #slide li { margin-bottom: 8px; }
  #slide blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--sheet); border-radius: 0 6px 6px 0; color: #d4d4d4; }
  #slide figure { margin: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  #slide figure img { display: block; max-width: 100%; max-height: calc(100% - 2.2em); margin: 0 auto; object-fit: contain;
                      border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); cursor: zoom-in; }
  #slide figcaption { margin-top: 10px; text-align: center; color: var(--muted); font-size: 14px; }
  #deck footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); background: #0e0e0e; }
  #dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; background: #444; }
  #dots button[aria-current="true"] { background: var(--accent); }
  #pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  #slide.enter { animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateX(var(--from, 16px)); } }

  /* Immagine a tutto schermo */
  #zoom { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
          padding: 24px; background: rgba(0, 0, 0, .88); cursor: zoom-out; }
  #zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  @media (max-width: 820px) {
    #slide.with-image { grid-template-columns: 1fr; align-items: start; }
    #slide figure { height: auto; }
    #slide figure img { max-height: none; }
    #dots { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #slide.enter { animation: none; } #guides a { transition: none; } }
</style>
</head>
<body>

<main id="menu" hidden>
  <div class="brand">
    <img src="../../assets/logo.png" alt="">
    <div>
      <h1>Overlay Browser</h1>
      <p>Guide d’utilisation, étape par étape</p>
    </div>
  </div>
  <p class="legend">Dans les captures d’écran, les éléments cités dans le texte sont mis en évidence par un cadre rouge <span class="box"></span> ; les numéros comme <span class="num">1</span> dans le texte indiquent l’élément portant le même numéro dans la capture.</p>
  <ol id="guides"></ol>
</main>

<div id="deck" hidden>
  <header>
    <a class="btn" href="#" title="Retour à la liste des guides (Échap)">☰ Guides</a>
    <span class="title" id="guide-title"></span>
    <span id="pos"></span>
  </header>
  <section id="slide" aria-live="polite"></section>
  <footer>
    <button class="btn" id="prev" title="Diapositive précédente (←)">← Précédent</button>
    <div id="dots" role="tablist"></div>
    <button class="btn primary" id="next" title="Diapositive suivante (→)">Suivant →</button>
  </footer>
</div>

<div id="zoom" hidden><img alt=""></div>

<script>
const DATA = {"guides":[{"id":"getting-started","title":"Premiers pas : les sites de ton jeu à portée de main","intro":"Dans ce guide, tu ouvres Overlay Browser pendant que tu joues (ici à \u003cstrong>Tiny Glade\u003c/strong>), tu ajoutes quelques sites utiles et tu apprends à les afficher et à les masquer sans quitter le jeu.","slides":[{"heading":null,"html":"\u003cp>Dans ce guide, tu ouvres Overlay Browser pendant que tu joues (ici à \u003cstrong>Tiny Glade\u003c/strong>), tu ajoutes quelques sites utiles et tu apprends à les afficher et à les masquer sans quitter le jeu.\u003c/p>","image":null,"intro":true},{"heading":"1. Lance l’application","html":"\u003cp>Lance Overlay Browser : la fenêtre \u003cstrong>reste masquée\u003c/strong> et l’application attend dans la zone de notification, près de l’horloge. Elle n’apparaît ni dans la barre des tâches ni dans Alt+Tab.\u003c/p>\u003cp>Lance ensuite le jeu, en mode fenêtré ou fenêtre sans bordure.\u003c/p>","image":null},{"heading":"2. Ouvre l’overlay par-dessus le jeu","html":"\u003cp>Pendant que tu joues, appuie sur \u003cstrong>Win+F10\u003c/strong> (Super+F10 sous Linux, Cmd+Shift+Espace sous macOS). L’overlay apparaît par-dessus le jeu et s’ouvre sur l’\u003cstrong>Accueil\u003c/strong>.\u003c/p>\u003cp>L’overlay a reconnu le jeu : en haut se trouve la liste \u003cstrong>Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, \u003cem>active\u003c/em> et encore \u003cem>nouvelle\u003c/em>. Chaque jeu a sa propre liste de sites, créée quand tu y ajoutes le premier site. Parmi les \u003cem>Autres listes\u003c/em> se trouve la liste \u003cstrong>Générale\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, utilisée quand aucun jeu n’est ouvert ; \u003cstrong>Utiliser\u003c/strong> la rend active à la main.\u003c/p>","image":{"src":"img/getting-started/01-empty-home.png","alt":"L’Accueil ouvert par-dessus Tiny Glade, avec la liste du jeu encore vide"}},{"heading":"3. Ajoute un site","html":"\u003cp>Clique sur \u003cstrong>+\u003c/strong> \u003cspan class=\"num\">1\u003c/span> dans la barre du haut, saisis l’adresse du site \u003cspan class=\"num\">2\u003c/span> (\u003ccode>tinyglade.com\u003c/code> suffit) et appuie sur \u003cstrong>Ajouter\u003c/strong> \u003cspan class=\"num\">3\u003c/span>.\u003c/p>","image":{"src":"img/getting-started/02-add-site.png","alt":"La fenêtre pour ajouter un site, avec l’adresse tinyglade.com"}},{"heading":"3. Ajoute un site","html":"\u003cp>Le site s’ouvre aussitôt dans son \u003cstrong>onglet\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, qui prend le nom du titre de la page ; le \u003cstrong>×\u003c/strong> le ferme. En dessous se trouve la barre de navigation, comme dans un navigateur : \u003cstrong>précédent, suivant et actualiser\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, l’\u003cstrong>adresse\u003c/strong> de la page \u003cspan class=\"num\">3\u003c/span> (tu peux en saisir une autre et appuyer sur Entrée) et \u003cstrong>Épingler\u003c/strong> \u003cspan class=\"num\">4\u003c/span>, qui transforme en nouvel onglet une page atteinte en naviguant.\u003c/p>","image":{"src":"img/getting-started/03-site-open.png","alt":"Le site officiel de Tiny Glade ouvert dans son onglet"}},{"heading":"4. Ajoutes-en d’autres depuis l’Accueil","html":"\u003cp>Reviens à l’\u003cstrong>Accueil\u003c/strong> : tu y vois les sites de la liste. Clique sur le \u003cstrong>nom d’un site\u003c/strong> \u003cspan class=\"num\">1\u003c/span> pour l’ouvrir, sur \u003cstrong>Modifier\u003c/strong> \u003cspan class=\"num\">2\u003c/span> pour changer son adresse (Entrée pour enregistrer, Échap pour annuler) ou sur \u003cstrong>Supprimer\u003c/strong> \u003cspan class=\"num\">3\u003c/span> pour le retirer de la liste. Pour ajouter un site, saisis son adresse dans le \u003cstrong>champ sous la liste\u003c/strong> \u003cspan class=\"num\">4\u003c/span> et appuie sur \u003cem>Ajouter\u003c/em> : ici nous avons ajouté la page Steam du jeu.\u003c/p>","image":{"src":"img/getting-started/04-home-with-sites.png","alt":"L’Accueil avec les deux sites de la liste de Tiny Glade"}},{"heading":"5. Passe d’un site à l’autre","html":"\u003cp>Chaque site a son onglet dans la barre : ici le \u003cstrong>site officiel\u003c/strong> \u003cspan class=\"num\">1\u003c/span> et la \u003cstrong>page Steam\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, celle qui est ouverte. Quand tu changes d’onglet puis reviens, tu retrouves la page exactement où tu l’avais laissée.\u003c/p>","image":{"src":"img/getting-started/05-two-tabs.png","alt":"La page Steam de Tiny Glade dans le deuxième onglet"}},{"heading":"6. Retourne au jeu","html":"\u003cp>Appuie de nouveau sur \u003cstrong>Win+F10\u003c/strong> pour masquer l’overlay, ou clique sur la fenêtre du jeu : par défaut l’overlay se masque tout seul quand il perd le focus (tu peux le désactiver dans les Paramètres).\u003c/p>\u003cp>La prochaine fois que tu ouvres l’overlay par-dessus Tiny Glade, tu retrouves sa liste, ouverte sur le dernier onglet que tu regardais. Par-dessus un autre jeu, tu verras la liste de ce jeu.\u003c/p>","image":null}]},{"id":"free-browsing","title":"Navigation libre : chercher, trouver, épingler","intro":"L’onglet \u003cstrong>Naviguer\u003c/strong> sert à chercher et ouvrir n’importe quelle page sans l’ajouter à la liste. Quand tu trouves une page que tu veux garder, \u003cstrong>Épingler\u003c/strong> la transforme en onglet de la liste du jeu.","slides":[{"heading":null,"html":"\u003cp>L’onglet \u003cstrong>Naviguer\u003c/strong> sert à chercher et ouvrir n’importe quelle page sans l’ajouter à la liste. Quand tu trouves une page que tu veux garder, \u003cstrong>Épingler\u003c/strong> la transforme en onglet de la liste du jeu.\u003c/p>\u003cp>Ici nous continuons l’exemple de \u003ca href=\"#getting-started\">Premiers pas\u003c/a> : l’overlay est ouvert par-dessus \u003cstrong>Tiny Glade\u003c/strong>, dont la liste a déjà deux sites, et nous cherchons un wiki du jeu.\u003c/p>","image":null,"intro":true},{"heading":"1. Ouvre l’onglet Naviguer","html":"\u003cp>Clique sur \u003cstrong>Naviguer\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, juste après Accueil. Dans le \u003cstrong>champ d’adresse\u003c/strong> \u003cspan class=\"num\">2\u003c/span> tu peux saisir une adresse (\u003ccode>example.com\u003c/code> suffit) ou n’importe quel texte à chercher. Comme exemple, l’overlay propose le \u003cstrong>nom du jeu\u003c/strong> \u003cspan class=\"num\">3\u003c/span> : clique dessus pour le chercher.\u003c/p>","image":{"src":"img/free-browsing/01-browse.png","alt":"L’onglet Naviguer vide, avec le champ d’adresse et l’exemple de recherche « Tiny Glade »"}},{"heading":"2. Cherche","html":"\u003cp>Saisis \u003ccode>tiny glade wiki\u003c/code> et appuie sur Entrée. La recherche s’ouvre dans l’onglet, et le \u003cstrong>champ d’adresse\u003c/strong> \u003cspan class=\"num\">1\u003c/span> affiche l’adresse de la page des résultats.\u003c/p>\u003cp>Le moteur de recherche se choisit dans les Paramètres (section \u003cem>Comportement\u003c/em>) : Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage ou une adresse personnalisée. Ici nous utilisons DuckDuckGo.\u003c/p>\u003cp>Clique sur le résultat qui t’intéresse, ici \u003cstrong>Tiny Glade Wiki\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/02-results.png","alt":"Les résultats de la recherche « tiny glade wiki », avec le lien vers le Tiny Glade Wiki"}},{"heading":"3. Épingle la page","html":"\u003cp>La page s’ouvre dans l’onglet Naviguer et tu peux l’utiliser comme dans un navigateur : \u003cstrong>Précédent\u003c/strong> \u003cspan class=\"num\">1\u003c/span> te ramène aux résultats de la recherche. Pour la garder, clique sur \u003cstrong>Épingler\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/03-page-found.png","alt":"Le Tiny Glade Wiki ouvert dans l’onglet Naviguer"}},{"heading":"3. Épingle la page","html":"\u003cp>L’overlay demande une confirmation : clique sur \u003cstrong>Épingler\u003c/strong>.\u003c/p>","image":{"src":"img/free-browsing/04-confirm.png","alt":"La confirmation : épingler « Tiny Glade Wiki » comme nouvel onglet de la liste « Tiny Glade » ?"}},{"heading":"4. La page est un onglet de la liste","html":"\u003cp>La page, avec son historique, devient un \u003cstrong>nouvel onglet\u003c/strong> \u003cspan class=\"num\">1\u003c/span> à la fin de la liste de Tiny Glade, et désormais tu la retrouves chaque fois que tu ouvres l’overlay par-dessus le jeu. \u003cstrong>Épingler\u003c/strong> \u003cspan class=\"num\">2\u003c/span> est maintenant désactivé : la page est déjà dans la liste.\u003c/p>","image":{"src":"img/free-browsing/05-pinned.png","alt":"Le Tiny Glade Wiki dans son nouvel onglet, avec Épingler désactivé"}},{"heading":"4. La page est un onglet de la liste","html":"\u003cp>Épingler fonctionne aussi dans les onglets des sites : si depuis un site tu atteins une page que tu veux garder à part, Épingler l’ajoute comme nouvel onglet juste après celui du site. Quand une page est déjà l’un des onglets de la liste, cet onglet est mis en évidence et Épingler est désactivé.\u003c/p>","image":null},{"heading":"5. L’onglet Naviguer est de nouveau libre","html":"\u003cp>En revenant sur \u003cstrong>Naviguer\u003c/strong>, tu le retrouves vide, prêt pour une nouvelle recherche : la page épinglée est passée dans son onglet. Pendant que tu navigues, le bouton \u003cstrong>Revenir à la page d’accueil\u003c/strong> \u003cspan class=\"num\">1\u003c/span> ferme la page ouverte et revient à la page vide.\u003c/p>","image":{"src":"img/free-browsing/06-browse-again.png","alt":"L’onglet Naviguer de nouveau vide"}},{"heading":"5. L’onglet Naviguer est de nouveau libre","html":"\u003cp>Dans les Paramètres (section \u003cem>Comportement\u003c/em>), tu peux aussi choisir une \u003cstrong>page d’accueil\u003c/strong> pour l’onglet Naviguer, ouverte à la place de la page vide.\u003c/p>","image":null},{"heading":"Adresses d’autres sites depuis les onglets des sites","html":"\u003cp>Tu peux aussi saisir une adresse dans le champ d’adresse des onglets des sites. Une adresse du même site s’ouvre dans l’onglet ; une adresse d’un autre site, ou une recherche, s’ouvre plutôt dans l’onglet Naviguer, après une confirmation, pour que l’onglet du site garde sa page.\u003c/p>","image":null}]},{"id":"lists-per-game","title":"Une liste par jeu","intro":"Overlay Browser reconnaît le jeu par-dessus lequel tu l’ouvres et affiche les sites de ce jeu : chaque jeu a sa propre \u003cstrong>liste\u003c/strong>. Dans ce guide, après Premiers pas et Navigation libre, la liste de \u003cstrong>Tiny Glade\u003c/strong> a déjà trois sites ; maintenant nous jouons à \u003cstrong>Brotato\u003c/strong>.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser reconnaît le jeu par-dessus lequel tu l’ouvres et affiche les sites de ce jeu : chaque jeu a sa propre \u003cstrong>liste\u003c/strong>. Dans ce guide, après \u003ca href=\"#getting-started\">Premiers pas\u003c/a> et \u003ca href=\"#free-browsing\">Navigation libre\u003c/a>, la liste de \u003cstrong>Tiny Glade\u003c/strong> a déjà trois sites ; maintenant nous jouons à \u003cstrong>Brotato\u003c/strong>.\u003c/p>","image":null,"intro":true},{"heading":"1. Un nouveau jeu, une nouvelle liste","html":"\u003cp>Ouvre l’overlay pendant que tu joues à Brotato. En haut de l’Accueil se trouve la \u003cstrong>liste de Brotato\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, \u003cem>active\u003c/em> et encore \u003cem>nouvelle\u003c/em> : à côté de son nom tu vois le programme reconnu et le nombre de sites. Ajoute un site dans le \u003cstrong>champ sous la liste\u003c/strong> \u003cspan class=\"num\">2\u003c/span> (ou avec le \u003cstrong>+\u003c/strong> de la barre du haut) : la liste est créée avec son premier site. La \u003cstrong>liste de Tiny Glade\u003c/strong> \u003cspan class=\"num\">3\u003c/span> est parmi les \u003cem>Autres listes\u003c/em>, repliée : clique dessus pour voir ses sites.\u003c/p>","image":{"src":"img/lists-per-game/01-brotato-new.png","alt":"L’Accueil ouvert par-dessus Brotato : sa nouvelle liste et, parmi les autres listes, celle de Tiny Glade"}},{"heading":"1. Un nouveau jeu, une nouvelle liste","html":"\u003cp>Ici nous ajoutons le wiki de Brotato et sa page Steam. La barre contient maintenant leurs onglets, et seulement eux : les sites de Tiny Glade n’apparaissent pas.\u003c/p>","image":{"src":"img/lists-per-game/02-brotato-wiki.png","alt":"Les onglets de la liste de Brotato"}},{"heading":"2. Chaque jeu retrouve ses sites","html":"\u003cp>Retourne à Tiny Glade et ouvre l’overlay : la barre contient les \u003cstrong>onglets de Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, et la \u003cstrong>liste de Tiny Glade\u003c/strong> \u003cspan class=\"num\">2\u003c/span> est la liste active. La \u003cstrong>liste de Brotato\u003c/strong> \u003cspan class=\"num\">3\u003c/span> est passée parmi les \u003cem>Autres listes\u003c/em> ; \u003cstrong>Utiliser\u003c/strong> \u003cspan class=\"num\">4\u003c/span> la rendrait active à la main (voir l’étape 4). Chaque liste se rouvre sur le dernier onglet que tu regardais.\u003c/p>","image":{"src":"img/lists-per-game/03-tiny-glade.png","alt":"L’Accueil ouvert par-dessus Tiny Glade, avec ses onglets et la liste de Brotato parmi les autres"}},{"heading":"3. La liste Générale","html":"\u003cp>Les listes ne sont pas seulement pour les jeux : l’overlay propose une liste pour n’importe quel programme par-dessus lequel tu l’ouvres. Quand il ne reconnaît aucune application, c’est la \u003cstrong>liste Générale\u003c/strong> qui est active, un endroit pour les sites qui ne concernent pas un programme en particulier. Elle fonctionne comme les autres, mais ne peut pas être supprimée.\u003c/p>","image":{"src":"img/lists-per-game/04-general.png","alt":"La liste Générale, active quand aucune application n’est reconnue"}},{"heading":"4. Choisir une liste à la main","html":"\u003cp>Parfois tu veux les sites d’un autre jeu : par exemple tu lis le wiki de Brotato alors que Tiny Glade est ouvert. Clique sur \u003cstrong>Utiliser\u003c/strong> à côté de la liste que tu veux (\u003cspan class=\"num\">4\u003c/span> dans la capture de l’étape 2).\u003c/p>\u003cp>La liste devient active et reste celle \u003cstrong>choisie à la main\u003c/strong> \u003cspan class=\"num\">1\u003c/span> même quand tu ouvres l’overlay par-dessus d’autres jeux, jusqu’à ce que tu cliques sur \u003cstrong>Revenir à Tiny Glade\u003c/strong>, où Tiny Glade est le jeu par-dessus lequel l’overlay est ouvert à ce moment-là. La barre contient les \u003cstrong>onglets de la liste choisie\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/lists-per-game/05-chosen-by-hand.png","alt":"La liste de Brotato choisie à la main alors que l’overlay est ouvert par-dessus Tiny Glade"}},{"heading":"5. Réordonner les onglets et les sites","html":"\u003cp>Fais glisser un onglet dans la barre pour le déplacer : ici le Tiny Glade Wiki est mis à la première place.\u003c/p>","image":{"src":"img/lists-per-game/06-drag.png","alt":"L’onglet du Tiny Glade Wiki glissé à la première place"}},{"heading":"5. Réordonner les onglets et les sites","html":"\u003cp>De la même façon, tu peux faire glisser les sites dans l’Accueil : l’ordre de l’Accueil et celui des onglets sont les mêmes.\u003c/p>","image":null},{"heading":"6. Supprimer une liste","html":"\u003cp>\u003cstrong>Supprimer la liste\u003c/strong>, à côté du nom d’une liste, la supprime avec tous ses sites, après une confirmation :\u003c/p>","image":{"src":"img/lists-per-game/07-remove-list.png","alt":"La confirmation : supprimer la liste « Brotato » et tous ses sites ?"}},{"heading":"6. Supprimer une liste","html":"\u003cp>Si tu ajoutes ensuite un site en jouant de nouveau à Brotato, sa liste est recréée.\u003c/p>","image":null}]},{"id":"bookmarks","title":"Importer et exporter les favoris","intro":"Tu as déjà les sites de tes jeux dans les favoris de ton navigateur ? Tu peux les importer dans les listes d’Overlay Browser sans les ressaisir, et exporter les listes dans un fichier de favoris à ouvrir dans n’importe quel navigateur.","slides":[{"heading":null,"html":"\u003cp>Tu as déjà les sites de tes jeux dans les favoris de ton navigateur ? Tu peux les importer dans les listes d’Overlay Browser sans les ressaisir, et exporter les listes dans un fichier de favoris à ouvrir dans n’importe quel navigateur.\u003c/p>\u003cp>Ici l’overlay est ouvert par-dessus \u003cstrong>Brotato\u003c/strong>, dont la liste est encore vide, et la liste de \u003cstrong>Tiny Glade\u003c/strong> a déjà trois sites (voir \u003ca href=\"#lists-per-game\">Une liste par jeu\u003c/a>).\u003c/p>","image":null,"intro":true},{"heading":"1. La section Favoris de l’Accueil","html":"\u003cp>En bas de l’\u003cstrong>Accueil\u003c/strong> se trouve la section \u003cem>Favoris\u003c/em>, avec \u003cstrong>Importer des favoris…\u003c/strong> \u003cspan class=\"num\">1\u003c/span> et \u003cstrong>Exporter des favoris…\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/bookmarks/01-bookmarks-section.png","alt":"La section Favoris en bas de l’Accueil"}},{"heading":"2. Choisis les favoris à importer","html":"\u003cp>Clique sur \u003cstrong>Importer des favoris…\u003c/strong>. Dans la fenêtre :\u003c/p>\u003cul>\u003cli>\u003cstrong>Depuis\u003c/strong> \u003cspan class=\"num\">1\u003c/span> : le navigateur dont lire les favoris, un par profil. L’overlay les trouve tout seul : Chrome, Edge, Brave, Opera, Vivaldi, Chromium, Firefox, LibreWolf et d’autres navigateurs similaires ; Firefox peut rester ouvert. La fois suivante, il repropose le dernier navigateur choisi.\u003c/li>\u003cli>\u003cstrong>Fichier…\u003c/strong> \u003cspan class=\"num\">2\u003c/span> : importe plutôt un fichier HTML de favoris, exporté depuis le gestionnaire de favoris de n’importe quel navigateur. Sous macOS c’est le seul moyen : exporte d’abord les favoris depuis le navigateur.\u003c/li>\u003cli>\u003cstrong>Rechercher\u003c/strong> \u003cspan class=\"num\">3\u003c/span> : trouve des favoris et des dossiers par nom ou par adresse.\u003c/li>\u003cli>\u003cstrong>Les cases\u003c/strong> \u003cspan class=\"num\">4\u003c/span> : coche des favoris un par un ou des dossiers entiers ; \u003cem>Tous les favoris\u003c/em> les sélectionne tous. Ici nous cochons le dossier \u003cem>Brotato\u003c/em>.\u003c/li>\u003cli>\u003cstrong>Dans la liste\u003c/strong> \u003cspan class=\"num\">5\u003c/span> : la liste où les ajouter, au départ la liste active. Si elle est encore \u003cem>nouvelle\u003c/em>, comme ici celle de Brotato, elle est créée avec les sites importés.\u003c/li>\u003cli>\u003cstrong>Ajouter\u003c/strong> \u003cspan class=\"num\">6\u003c/span> : le bouton indique combien de sites tu vas ajouter.\u003c/li>\u003c/ul>","image":{"src":"img/bookmarks/02-import.png","alt":"La fenêtre d’importation avec le dossier Brotato coché"}},{"heading":"2. Choisis les favoris à importer","html":"\u003cp>Les favoris deviennent des sites de la liste, avec leur nom :\u003c/p>","image":{"src":"img/bookmarks/03-imported.png","alt":"Les trois sites importés dans la liste de Brotato"}},{"heading":"3. Importer depuis le « + »","html":"\u003cp>Tu peux aussi importer depuis le \u003cstrong>+\u003c/strong> de la barre du haut, dans l’onglet \u003cstrong>Favoris\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, à côté d’\u003cem>Adresse\u003c/em> : ici les sites vont toujours dans la liste active. La \u003cstrong>recherche\u003c/strong> \u003cspan class=\"num\">2\u003c/span> trouve les favoris ; ceux dont l’adresse est \u003cstrong>déjà dans la liste\u003c/strong> \u003cspan class=\"num\">3\u003c/span> sont grisés et ne peuvent pas être choisis, donc importer deux fois ne crée pas de doublons.\u003c/p>","image":{"src":"img/bookmarks/04-plus-bookmarks.png","alt":"L’onglet Favoris du « + », avec les favoris déjà dans la liste non sélectionnables"}},{"heading":"4. Exporter les listes","html":"\u003cp>\u003cstrong>Exporter des favoris…\u003c/strong>, dans la section \u003cem>Favoris\u003c/em> de l’Accueil, enregistre les sites des listes dans un fichier HTML de favoris que n’importe quel navigateur peut importer. Chaque liste devient un dossier. Au départ \u003cstrong>tous les favoris\u003c/strong> \u003cspan class=\"num\">1\u003c/span> sont choisis ; dans la \u003cstrong>liste\u003c/strong> \u003cspan class=\"num\">2\u003c/span> tu peux retirer des listes ou des sites. \u003cstrong>Exporter\u003c/strong> \u003cspan class=\"num\">3\u003c/span> demande où enregistrer le fichier.\u003c/p>","image":{"src":"img/bookmarks/05-export.png","alt":"La fenêtre d’exportation avec les listes de Brotato et de Tiny Glade"}}]},{"id":"customizing","title":"Personnaliser l’overlay","intro":"Depuis la page \u003cstrong>Paramètres\u003c/strong>, tu choisis la combinaison de touches, le comportement de l’overlay, son apparence et sa langue. Chaque modification s’applique aussitôt et est mémorisée.","slides":[{"heading":null,"html":"\u003cp>Depuis la page \u003cstrong>Paramètres\u003c/strong>, tu choisis la combinaison de touches, le comportement de l’overlay, son apparence et sa langue. Chaque modification s’applique aussitôt et est mémorisée.\u003c/p>","image":null,"intro":true},{"heading":"1. La combinaison de touches","html":"\u003cp>Ouvre l’onglet \u003cstrong>Paramètres\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, en haut à droite (ou \u003cem>Paramètres\u003c/em> dans le menu de l’icône de la zone de notification). Dans la section \u003cem>Clavier\u003c/em>, tu vois la \u003cstrong>combinaison actuelle\u003c/strong> \u003cspan class=\"num\">2\u003c/span> qui affiche et masque l’overlay. \u003cstrong>Modifier\u003c/strong> \u003cspan class=\"num\">3\u003c/span> en enregistre une nouvelle ; \u003cstrong>Rétablir par défaut\u003c/strong> \u003cspan class=\"num\">4\u003c/span> revient à celle par défaut (Win+F10, Super+F10 sous Linux, Cmd+Shift+Espace sous macOS).\u003c/p>","image":{"src":"img/customizing/01-shortcut.png","alt":"La page Paramètres, section Clavier"}},{"heading":"1. La combinaison de touches","html":"\u003cp>Après \u003cstrong>Modifier\u003c/strong>, appuie sur la combinaison que tu préfères, par exemple \u003ccode>Ctrl+Shift+O\u003c/code> ; Échap annule.\u003c/p>","image":{"src":"img/customizing/02-new-combination.png","alt":"L’overlay en attente de la nouvelle combinaison"}},{"heading":"1. La combinaison de touches","html":"\u003cp>Les touches F1–F24 sont acceptées seules, sinon n’importe quelle touche avec Ctrl, Alt, Shift ou Win (Super sous Linux, Cmd sous macOS). Si la combinaison est déjà utilisée par un autre programme, un message apparaît et la précédente reste.\u003c/p>\u003cblockquote>\u003cstrong>Attention en jeu :\u003c/strong> la combinaison arrive aussi au jeu, pas seulement à l’overlay. Choisis-en une que le jeu n’attribue à aucune commande, sinon en ouvrant l’overlay tu déclencheras aussi cette commande.\u003c/blockquote>","image":null},{"heading":"2. Le comportement","html":"\u003cp>Dans la section \u003cem>Comportement\u003c/em> :\u003c/p>\u003cul>\u003cli>\u003cstrong>Masquer l’overlay quand il perd le focus\u003c/strong> \u003cspan class=\"num\">1\u003c/span> : activé par défaut, l’overlay se masque tout seul quand tu cliques sur le jeu ou sur une autre fenêtre. Désactive-le si tu veux le garder visible pendant que tu joues ; il ne se masque alors qu’avec la combinaison de touches. La même option se trouve aussi dans le menu de l’icône de la zone de notification.\u003c/li>\u003cli>\u003cstrong>Page d’accueil de la navigation libre\u003c/strong> \u003cspan class=\"num\">2\u003c/span> : la page que l’onglet Naviguer ouvre au départ. Vide : aucune page (voir \u003ca href=\"#free-browsing\">Navigation libre\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Moteur de recherche\u003c/strong> \u003cspan class=\"num\">3\u003c/span> : celui que l’onglet Naviguer utilise pour les textes qui ne sont pas des adresses : Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage, ou \u003cem>Personnalisé\u003c/em>, une adresse de recherche avec \u003ccode>%s\u003c/code> à la place du texte cherché.\u003c/li>\u003c/ul>\u003cp>Ici se trouve aussi \u003cem>Rechercher les nouvelles versions\u003c/em>, qui signale sur l’Accueil quand une nouvelle version sort (absent de la version du Microsoft Store, qui se met à jour toute seule).\u003c/p>","image":{"src":"img/customizing/03-behavior.png","alt":"La section Comportement des Paramètres"}},{"heading":"3. L’apparence et la langue","html":"\u003cp>Dans la section \u003cem>Apparence\u003c/em> :\u003c/p>\u003cul>\u003cli>\u003cstrong>Couleur d’accent\u003c/strong> \u003cspan class=\"num\">1\u003c/span> : la couleur des onglets fixes, des boutons principaux et des détails de l’interface.\u003c/li>\u003cli>\u003cstrong>Onglets fixes\u003c/strong> \u003cspan class=\"num\">2\u003c/span> : Accueil, Naviguer et Paramètres avec icône et nom, ou \u003cem>Icône seule\u003c/em> pour laisser plus de place aux onglets des sites.\u003c/li>\u003cli>\u003cstrong>Opacité de la fenêtre\u003c/strong> \u003cspan class=\"num\">3\u003c/span> : avec des valeurs plus basses, la fenêtre devient transparente et tu vois le jeu derrière (de 30 % à 100 %, c’est-à-dire opaque).\u003c/li>\u003c/ul>\u003cp>Dans la section \u003cem>Langue\u003c/em>, \u003cstrong>Langue de l’interface\u003c/strong> \u003cspan class=\"num\">4\u003c/span> : par défaut \u003cem>Langue du système\u003c/em>, c’est-à-dire celle du système si l’application l’a (italien, anglais, français, portugais, russe, espagnol et allemand), sinon l’anglais.\u003c/p>","image":{"src":"img/customizing/04-appearance.png","alt":"Les sections Apparence et Langue des Paramètres"}},{"heading":"3. L’apparence et la langue","html":"\u003cp>Voici l’overlay avec la couleur d’accent bleue et les \u003cstrong>onglets fixes avec l’icône seule\u003c/strong> \u003cspan class=\"num\">1\u003c/span> \u003cspan class=\"num\">2\u003c/span>. L’opacité ne se voit pas dans la capture, qui ne montre que la fenêtre et pas le jeu derrière.\u003c/p>","image":{"src":"img/customizing/05-customized.png","alt":"L’overlay avec l’accent bleu et les onglets fixes en icône seule"}},{"heading":"Les autres sections","html":"\u003cp>Plus bas, la section \u003cem>Mémoire\u003c/em> indique combien de mémoire l’application utilise et au bout de combien de temps fermer les pages que tu ne regardes pas ; la section \u003cem>Diagnostic\u003c/em> sert à recueillir des informations à joindre à un signalement de problème.\u003c/p>","image":null}]},{"id":"memory","title":"Mémoire et pages fermées","intro":"Chaque page ouverte dans Overlay Browser occupe de la mémoire, comme dans un navigateur, même quand tu ne la regardes pas : les pages des autres listes restent ouvertes jusqu’à ce qu’elles soient fermées. Pour ne pas prendre de mémoire au jeu, l’overlay \u003cstrong>ferme tout seul les pages que tu n’utilises plus depuis un moment\u003c/strong>, et dans les Paramètres tu peux voir combien de mémoire il utilise et les fermer à la main.","slides":[{"heading":null,"html":"\u003cp>Chaque page ouverte dans Overlay Browser occupe de la mémoire, comme dans un navigateur, même quand tu ne la regardes pas : les pages des autres listes restent ouvertes jusqu’à ce qu’elles soient fermées. Pour ne pas prendre de mémoire au jeu, l’overlay \u003cstrong>ferme tout seul les pages que tu n’utilises plus depuis un moment\u003c/strong>, et dans les Paramètres tu peux voir combien de mémoire il utilise et les fermer à la main.\u003c/p>\u003cp>Ici les listes de \u003cstrong>Tiny Glade\u003c/strong> et de \u003cstrong>Brotato\u003c/strong> ont plusieurs pages ouvertes (voir \u003ca href=\"#lists-per-game\">Une liste par jeu\u003c/a>).\u003c/p>","image":null,"intro":true},{"heading":"1. Pourquoi une page se recharge","html":"\u003cp>Les pages que tu ne regardes pas (les autres onglets, les pages des autres listes, et toutes lorsque l’overlay est masqué) restent ouvertes un certain temps, puis elles sont fermées. Quand tu rouvres l’onglet, la page \u003cstrong>se recharge depuis la dernière adresse visitée\u003c/strong> : tu retrouves la page, mais par exemple pas l’endroit où tu l’avais fait défiler ni un formulaire à moitié rempli.\u003c/p>\u003cp>La page que tu regardes n’est jamais fermée.\u003c/p>","image":null},{"heading":"2. La section Mémoire","html":"\u003cp>Ouvre les \u003cstrong>Paramètres\u003c/strong> et fais défiler jusqu’à la section \u003cem>Mémoire\u003c/em> :\u003c/p>\u003cul>\u003cli>\u003cstrong>Fermer les pages inutilisées après\u003c/strong> \u003cspan class=\"num\">1\u003c/span> : le temps au bout duquel une page inutilisée est fermée, de 5 à 60 minutes (30 par défaut). Avec moins de mémoire libre, ou avec des jeux gourmands, un temps plus court est préférable.\u003c/li>\u003cli>\u003cstrong>Mémoire utilisée\u003c/strong> \u003cspan class=\"num\">2\u003c/span> : la mémoire de toute l’application.\u003c/li>\u003cli>\u003cstrong>Fermer toutes les pages\u003c/strong> \u003cspan class=\"num\">3\u003c/span> : ferme aussitôt toutes les pages ouvertes, de toutes les listes.\u003c/li>\u003cli>\u003cstrong>Les processus de l’application\u003c/strong> \u003cspan class=\"num\">4\u003c/span> : l’interface de l’overlay, le processus principal, le graphisme (GPU) et les autres processus. Cette mémoire est toujours là.\u003c/li>\u003cli>\u003cstrong>Les pages, regroupées par liste\u003c/strong> \u003cspan class=\"num\">5\u003c/span> : pour chaque liste, la mémoire de ses pages ouvertes. \u003cstrong>Fermer\u003c/strong> ferme toutes les pages de cette liste.\u003c/li>\u003c/ul>","image":{"src":"img/memory/01-memory.png","alt":"La section Mémoire des Paramètres, avec les listes de Tiny Glade et de Brotato"}},{"heading":"3. Les pages d’une liste","html":"\u003cp>Clique sur le nom d’une liste pour voir ses pages ouvertes, chacune avec la mémoire qu’elle utilise et le temps restant avant sa fermeture. \u003cstrong>Fermer\u003c/strong> à côté de la liste \u003cspan class=\"num\">1\u003c/span> ferme toutes ses pages ; \u003cstrong>Fermer\u003c/strong> à côté d’une page \u003cspan class=\"num\">2\u003c/span> ferme seulement celle-ci.\u003c/p>","image":{"src":"img/memory/02-pages.png","alt":"Les pages ouvertes de la liste de Tiny Glade, chacune avec son bouton Fermer"}},{"heading":"3. Les pages d’une liste","html":"\u003cp>Certaines pages partagent le même processus, par exemple des pages du même site dans des listes différentes : elles apparaissent sur une seule ligne, hors des groupes, et se ferment ensemble, car la mémoire n’est libérée qu’en les fermant toutes.\u003c/p>","image":null},{"heading":"4. Après la fermeture","html":"\u003cp>Ici nous avons fermé les pages de Brotato : son groupe a disparu et la mémoire utilisée a baissé. Les onglets de Brotato restent dans sa liste : la prochaine fois que tu les ouvres, les pages se rechargent.\u003c/p>","image":{"src":"img/memory/03-closed.png","alt":"La section Mémoire après la fermeture des pages de Brotato"}}]},{"id":"new-versions","title":"Nouvelles versions","intro":"Overlay Browser vérifie tout seul si une nouvelle version est sortie et te la signale ; il ne se met pas à jour tout seul : c’est toi qui télécharges la nouvelle version quand tu veux.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser vérifie tout seul si une nouvelle version est sortie et te la signale ; il ne se met pas à jour tout seul : c’est toi qui télécharges la nouvelle version quand tu veux.\u003c/p>","image":null,"intro":true},{"heading":"1. L’avis d’une nouvelle version","html":"\u003cp>Quand une nouvelle version sort, un \u003cstrong>bandeau\u003c/strong> \u003cspan class=\"num\">1\u003c/span> avec son numéro apparaît sous la barre du haut. \u003cstrong>Télécharger\u003c/strong> \u003cspan class=\"num\">2\u003c/span> ouvre dans le navigateur du système la page de la nouvelle version, d’où télécharger le fichier pour ton système (voir l’installation dans le \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a>). Le \u003cstrong>×\u003c/strong> \u003cspan class=\"num\">3\u003c/span> ferme le bandeau : pour cette version il ne revient plus.\u003c/p>\u003cp>La nouvelle version est aussi indiquée en haut de l’\u003cstrong>Accueil\u003c/strong> \u003cspan class=\"num\">4\u003c/span>, à côté de la version que tu utilises : clique dessus pour ouvrir la même page.\u003c/p>","image":{"src":"img/new-versions/01-new-version.png","alt":"Le bandeau de la nouvelle version sous la barre et la version indiquée sur l’Accueil"}},{"heading":"1. L’avis d’une nouvelle version","html":"\u003cp>Après la fermeture du bandeau, la nouvelle version reste sur l’Accueil jusqu’à ce que tu installes la mise à jour :\u003c/p>","image":{"src":"img/new-versions/02-strip-closed.png","alt":"L’Accueil avec la nouvelle version indiquée à côté de celle utilisée"}},{"heading":"2. Quand il vérifie","html":"\u003cp>L’application vérifie peu après le démarrage, puis toutes les 6 heures, sur les versions publiées du projet sur GitHub. Si tu utilises une version bêta, elle te signale aussi les bêtas plus récentes ; sinon seulement les versions définitives.\u003c/p>\u003cp>Pour ne plus recevoir les avis, désactive \u003cstrong>Rechercher les nouvelles versions\u003c/strong> dans les \u003cstrong>Paramètres\u003c/strong>, section \u003cem>Comportement\u003c/em>. La version du Microsoft Store n’a pas cette option : ses mises à jour viennent du Store.\u003c/p>","image":{"src":"img/new-versions/03-option.png","alt":"L’option Rechercher les nouvelles versions dans les Paramètres"}}]},{"id":"signing-in","title":"Se connecter à un site et les cookies","intro":"Beaucoup de sites de jeux (forums, wikis, outils de builds) fonctionnent mieux, ou seulement, si tu te connectes avec ton compte. Dans l’overlay, on se connecte comme dans un navigateur, et la connexion est mémorisée. Si un site ne fonctionne plus bien, ou si tu veux te déconnecter du compte, tu peux supprimer ses cookies.","slides":[{"heading":null,"html":"\u003cp>Beaucoup de sites de jeux (forums, wikis, outils de builds) fonctionnent mieux, ou seulement, si tu te connectes avec ton compte. Dans l’overlay, on se connecte comme dans un navigateur, et la connexion est mémorisée. Si un site ne fonctionne plus bien, ou si tu veux te déconnecter du compte, tu peux supprimer ses cookies.\u003c/p>\u003cp>Ici la liste de \u003cstrong>Tiny Glade\u003c/strong> a aussi un forum. Le forum est un \u003cstrong>site d’exemple\u003c/strong>, créé pour ce guide : sa connexion fonctionne comme celle des vrais sites, par exemple \u003cem>Continuer avec Google\u003c/em>.\u003c/p>","image":null,"intro":true},{"heading":"1. Connecte-toi avec ton compte","html":"\u003cp>Ouvre l’onglet du site et clique sur le bouton pour te connecter, ici \u003cstrong>Continuer avec un compte\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/01-forum.png","alt":"Le forum d’exemple ouvert dans son onglet, avec le bouton pour se connecter"}},{"heading":"1. Connecte-toi avec ton compte","html":"\u003cp>Le site ouvre sa \u003cstrong>fenêtre de connexion\u003c/strong> par-dessus l’overlay, comme dans un navigateur. Saisis tes informations et confirme.\u003c/p>","image":{"src":"img/signing-in/02-sign-in-window.png","alt":"La fenêtre de connexion ouverte par le site par-dessus l’overlay"}},{"heading":"1. Connecte-toi avec ton compte","html":"\u003cp>La fenêtre de connexion fait partie de l’overlay : elle reste par-dessus, se masque et réapparaît avec l’overlay, et passer de l’une à l’autre ne le masque pas. Quand elle se ferme, à la fin de la connexion, l’overlay redevient actif.\u003c/p>","image":null},{"heading":"2. La connexion est mémorisée","html":"\u003cp>Une fois connecté, la fenêtre se ferme et le site affiche ton \u003cstrong>compte\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/03-signed-in.png","alt":"Le forum avec la connexion faite : en haut le nom de l’utilisateur"}},{"heading":"2. La connexion est mémorisée","html":"\u003cp>La connexion reste même quand tu fermes l’overlay ou redémarres l’application, comme dans un navigateur. Les sites sont les mêmes pour toutes les listes : si tu te connectes à un site dans la liste d’un jeu, tu es déjà connecté aussi dans les autres listes qui ont ce site.\u003c/p>","image":null},{"heading":"3. Supprime les cookies d’un site","html":"\u003cp>Les cookies sont les données qu’un site enregistre pour se souvenir de toi, dont la connexion. Les supprimer sert à \u003cstrong>te déconnecter d’un compte\u003c/strong> (par exemple pour te connecter avec un autre) ou quand un site \u003cstrong>ne fonctionne plus bien\u003c/strong>.\u003c/p>\u003cp>Dans l’onglet du site, clique sur \u003cstrong>…\u003c/strong> (\u003cem>Autres actions\u003c/em>), à droite de l’adresse, et choisis \u003cstrong>Supprimer les cookies de forum.example\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/04-menu.png","alt":"Le menu Autres actions avec l’élément Supprimer les cookies de forum.example"}},{"heading":"3. Supprime les cookies d’un site","html":"\u003cp>L’overlay demande une confirmation : clique sur \u003cstrong>Supprimer\u003c/strong>. Les cookies du site et de ses sous-domaines sont supprimés, pas ceux des autres sites.\u003c/p>","image":{"src":"img/signing-in/05-confirm.png","alt":"La confirmation : supprimer les cookies de forum.example et de ses sous-domaines ?"}},{"heading":"4. La page se recharge","html":"\u003cp>Après la suppression, la page se recharge : tu n’es plus connecté et le site propose de nouveau de \u003cstrong>te connecter\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/06-signed-out.png","alt":"Le forum rechargé après la suppression des cookies, de nouveau sans connexion"}}]},{"id":"links-and-menu","title":"Liens, nouveaux onglets et menu contextuel","intro":"Dans un navigateur, beaucoup de liens s’ouvrent dans un nouvel onglet. Dans l’overlay, les onglets sont les sites de la liste, donc ces liens vont là où ils sont utiles : dans l’onglet du site d’où ils viennent, ou, après une question, dans un nouvel onglet. Le clic droit ouvre le menu pour ouvrir un lien dans un nouvel onglet et copier liens, images et texte.","slides":[{"heading":null,"html":"\u003cp>Dans un navigateur, beaucoup de liens s’ouvrent dans un nouvel onglet. Dans l’overlay, les onglets sont les sites de la liste, donc ces liens vont là où ils sont utiles : dans l’onglet du site d’où ils viennent, ou, après une question, dans un nouvel onglet. Le clic droit ouvre le menu pour ouvrir un lien dans un nouvel onglet et copier liens, images et texte.\u003c/p>\u003cp>Ici la liste de \u003cstrong>Tiny Glade\u003c/strong> a aussi un forum, un \u003cstrong>site d’exemple\u003c/strong> créé pour ce guide (voir \u003ca href=\"#signing-in\">Se connecter à un site et les cookies\u003c/a>).\u003c/p>","image":null,"intro":true},{"heading":"1. Un lien que le site ouvre dans un nouvel onglet","html":"\u003cp>Certains liens sont faits pour s’ouvrir dans un nouvel onglet, comme cette discussion du forum. C’est pareil pour les liens cliqués avec Ctrl ou avec le bouton du milieu de la souris.\u003c/p>","image":{"src":"img/links-and-menu/01-link.png","alt":"Le forum d’exemple, avec le lien vers une discussion"}},{"heading":"2. Le même site : dans son onglet","html":"\u003cp>Si le lien mène au même site, il s’ouvre dans l’\u003cstrong>onglet du site\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, à la place de la page précédente : l’\u003cstrong>adresse\u003c/strong> \u003cspan class=\"num\">2\u003c/span> est maintenant celle de la discussion. Avec \u003cstrong>Précédent\u003c/strong>, tu reviens à la page précédente.\u003c/p>","image":{"src":"img/links-and-menu/02-same-tab.png","alt":"La discussion ouverte dans l’onglet du forum"}},{"heading":"2. Le même site : dans son onglet","html":"\u003cp>Si la liste a plusieurs onglets du même site, le lien s’ouvre dans celui d’où il vient.\u003c/p>","image":null},{"heading":"3. Un autre site : la question","html":"\u003cp>Si le lien mène à un site qui n’a pas d’onglet dans la liste, ici les guides de la communauté sur Steam, l’overlay demande s’il faut l’ajouter à la liste : \u003cstrong>Ajouter\u003c/strong> l’ajoute comme nouveau site et l’ouvre ; \u003cstrong>Annuler\u003c/strong> laisse tout tel quel.\u003c/p>","image":{"src":"img/links-and-menu/03-other-site.png","alt":"La question : ajouter à la liste le site que la page veut ouvrir dans un nouvel onglet ?"}},{"heading":"3. Un autre site : la question","html":"\u003cp>Les liens ouverts depuis l’onglet \u003cstrong>Naviguer\u003c/strong> restent en revanche dans l’onglet Naviguer (voir \u003ca href=\"#free-browsing\">Navigation libre\u003c/a>).\u003c/p>","image":null},{"heading":"4. Clic droit sur un lien","html":"\u003cp>Un clic droit sur un lien ouvre le menu avec \u003cstrong>Ouvrir le lien dans un nouvel onglet\u003c/strong> \u003cspan class=\"num\">1\u003c/span> et \u003cstrong>Copier le lien\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, qui copie l’adresse du lien.\u003c/p>","image":{"src":"img/links-and-menu/04-link-menu.png","alt":"Le menu du clic droit sur un lien : Ouvrir le lien dans un nouvel onglet, Copier le lien"}},{"heading":"4. Clic droit sur un lien","html":"\u003cp>\u003cstrong>Ouvrir le lien dans un nouvel onglet\u003c/strong> demande une confirmation avant d’ajouter le lien à la liste : clique sur \u003cstrong>Ajouter\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/05-confirm-tab.png","alt":"La confirmation : ajouter le lien comme nouvel onglet de la liste Tiny Glade ?"}},{"heading":"4. Clic droit sur un lien","html":"\u003cp>Le lien devient un \u003cstrong>nouvel onglet\u003c/strong>, juste après celui d’où il vient, et s’ouvre. Si un onglet de la liste est déjà sur cette adresse, l’overlay affiche cet onglet au lieu d’en ajouter un autre.\u003c/p>","image":{"src":"img/links-and-menu/06-new-tab.png","alt":"La discussion ouverte dans le nouvel onglet, juste après celui du forum"}},{"heading":"5. Clic droit sur les images et le texte","html":"\u003cp>Sur une image, le menu propose \u003cstrong>Copier l’image\u003c/strong>, pour la coller ailleurs, par exemple dans une discussion. Sur le texte d’une page, il y a \u003cstrong>Copier\u003c/strong>, pour le texte sélectionné, et \u003cstrong>Tout sélectionner\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/07-image-menu.png","alt":"Le menu du clic droit sur une image, avec Copier l’image"}},{"heading":"5. Clic droit sur les images et le texte","html":"\u003cp>Dans les champs de texte, comme celui de réponse du forum ou l’adresse des onglets, le menu propose \u003cstrong>Annuler\u003c/strong>, \u003cstrong>Rétablir\u003c/strong>, \u003cstrong>Couper\u003c/strong>, \u003cstrong>Copier\u003c/strong>, \u003cstrong>Coller\u003c/strong> et \u003cstrong>Tout sélectionner\u003c/strong>. Les éléments inutiles à ce moment-là, par exemple \u003cem>Copier\u003c/em> sans texte sélectionné, sont grisés.\u003c/p>","image":{"src":"img/links-and-menu/08-field-menu.png","alt":"Le menu du clic droit dans un champ de texte"}}]},{"id":"troubleshooting","title":"Résolution des problèmes","intro":"Tu trouveras ici les solutions aux problèmes les plus courants et comment recueillir les informations utiles pour en signaler un. Pour les détails de chaque système (Windows, Linux, macOS), le guide renvoie au README (en anglais).","slides":[{"heading":null,"html":"\u003cp>Tu trouveras ici les solutions aux problèmes les plus courants et comment recueillir les informations utiles pour en signaler un. Pour les détails de chaque système (Windows, Linux, macOS), le guide renvoie au \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a> (en anglais).\u003c/p>","image":null,"intro":true},{"heading":"1. La combinaison de touches ne fonctionne pas","html":"\u003cul>\u003cli>\u003cstrong>Elle est déjà utilisée par un autre programme.\u003c/strong> Si tu la choisis dans les Paramètres, l’overlay te le dit (« combinaison non valide ou déjà utilisée ») et la précédente reste : choisis-en une autre (voir \u003ca href=\"#customizing\">Personnaliser l’overlay\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Le jeu l’utilise pour une de ses commandes.\u003c/strong> La combinaison arrive aussi au jeu : choisis-en une qui ne fait rien dans le jeu.\u003c/li>\u003cli>\u003cstrong>Linux avec Wayland.\u003c/strong> La combinaison n’est pas vue tant qu’une fenêtre Wayland native est active : il faut une session X11 (voir \u003cem>Linux\u003c/em> dans le \u003ca href=\"../../README.md#linux\" target=\"_blank\" rel=\"noopener\">README\u003c/a>).\u003c/li>\u003cli>\u003cstrong>macOS et touches de fonction.\u003c/strong> Par défaut F1–F12 règlent la luminosité, le volume, etc. : appuie dessus avec \u003cstrong>fn\u003c/strong>, ou change le réglage du clavier (voir \u003cem>macOS\u003c/em> dans le \u003ca href=\"../../README.md#macos\" target=\"_blank\" rel=\"noopener\">README\u003c/a>).\u003c/li>\u003c/ul>\u003cp>Tu peux toujours afficher l’overlay aussi depuis l’icône de la zone de notification.\u003c/p>","image":null},{"heading":"2. Je ne trouve pas l’icône de l’application","html":"\u003cp>L’application n’apparaît ni dans la barre des tâches ni dans Alt+Tab : elle est dans la zone de notification, près de l’horloge.\u003c/p>\u003cul>\u003cli>\u003cstrong>Windows :\u003c/strong> si tu ne la vois pas, clique sur la flèche \u003cstrong>^\u003c/strong> et fais glisser l’icône sur la barre des tâches pour la garder toujours visible.\u003c/li>\u003cli>\u003cstrong>Linux avec GNOME :\u003c/strong> l’extension \u003cem>AppIndicator and KStatusNotifierItem Support\u003c/em> est nécessaire. Dans certains environnements, le clic sur l’icône ouvre le menu au lieu d’afficher la fenêtre : utilise l’élément \u003cem>Afficher\u003c/em>.\u003c/li>\u003cli>\u003cstrong>macOS :\u003c/strong> l’icône est dans la barre des menus, en haut à droite.\u003c/li>\u003c/ul>","image":null},{"heading":"3. L’overlay n’apparaît pas par-dessus le jeu, ou n’est pas transparent","html":"\u003cul>\u003cli>\u003cstrong>Le jeu recouvre l’overlay.\u003c/strong> Certains jeux en plein écran « exclusif » recouvrent toutes les fenêtres : mets le jeu en mode \u003cem>fenêtre sans bordure\u003c/em> (borderless).\u003c/li>\u003cli>\u003cstrong>La fenêtre n’est pas transparente (Linux).\u003c/strong> La transparence demande un gestionnaire de fenêtres avec la composition activée (Cinnamon, KDE, GNOME, Xfce avec la composition) : sans elle, la fenêtre reste opaque.\u003c/li>\u003c/ul>","image":null},{"heading":"4. Un site ne fonctionne pas bien ou une page se recharge","html":"\u003cul>\u003cli>\u003cstrong>Un site ne fonctionne plus bien, ou tu veux te déconnecter d’un compte :\u003c/strong> supprime les cookies du site depuis le menu \u003cstrong>…\u003c/strong> (voir \u003ca href=\"#signing-in\">Se connecter à un site et les cookies\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Une page se recharge quand tu reviens à son onglet :\u003c/strong> les pages inutilisées sont fermées au bout d’un moment pour libérer de la mémoire (voir \u003ca href=\"#memory\">Mémoire et pages fermées\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Tu veux repartir de zéro :\u003c/strong> quitte l’application et supprime le fichier des préférences (voir \u003cem>Preferences and uninstalling\u003c/em> dans le \u003ca href=\"../../README.md#preferences-and-uninstalling\" target=\"_blank\" rel=\"noopener\">README\u003c/a>).\u003c/li>\u003c/ul>","image":null},{"heading":"5. Recueille les informations pour un signalement","html":"\u003cp>Si un problème persiste, tu peux le signaler sur la \u003ca href=\"https://github.com/siculo/overlay-browser/issues\" target=\"_blank\" rel=\"noopener\">page des signalements du projet\u003c/a>. Le fichier journal de l’application aide à comprendre ce qui s’est passé.\u003c/p>\u003cp>Dans les \u003cstrong>Paramètres\u003c/strong>, section \u003cem>Diagnostic\u003c/em> :\u003c/p>\u003cul>\u003cli>\u003cstrong>Journal détaillé\u003c/strong> \u003cspan class=\"num\">1\u003c/span> : normalement le journal n’enregistre que les erreurs et les plantages, avec les réglages actuels. Activé, il enregistre aussi ce que tu fais dans l’application (onglets, sites, listes, réglages) et ce qui arrive à l’overlay (affichage et masquage, focus, combinaison de touches, application au premier plan). Active-le, puis refais ce qui cause le problème.\u003c/li>\u003cli>\u003cstrong>Afficher le fichier journal\u003c/strong> \u003cspan class=\"num\">2\u003c/span> : ouvre le dossier avec le fichier \u003ccode>overlay.log\u003c/code>, à joindre au signalement.\u003c/li>\u003cli>\u003cstrong>Vider le journal\u003c/strong> \u003cspan class=\"num\">3\u003c/span> : efface le contenu du journal, par exemple pour n’enregistrer que le problème à signaler.\u003c/li>\u003c/ul>","image":{"src":"img/troubleshooting/01-diagnostics.png","alt":"La section Diagnostic des Paramètres"}},{"heading":"5. Recueille les informations pour un signalement","html":"\u003cp>Le journal ne contient jamais les touches que tu appuies ni ta navigation : aucune adresse ni aucun titre de page. Les sites ne sont indiqués que par leur position dans la liste.\u003c/p>\u003cp>\u003cstrong>Vider le journal\u003c/strong> demande une confirmation avant de l’effacer :\u003c/p>","image":{"src":"img/troubleshooting/02-empty-log.png","alt":"La confirmation : vider le fichier journal ?"}}]}],"strings":{"docTitle":"Overlay Browser · Guide","subtitle":"Guide d’utilisation, étape par étape","legend":"Dans les captures d’écran, les éléments cités dans le texte sont mis en évidence par un cadre rouge \u003cspan class=\"box\">\u003c/span> ; les numéros comme \u003cspan class=\"num\">1\u003c/span> dans le texte indiquent l’élément portant le même numéro dans la capture.","menu":"Guides","menuTitle":"Retour à la liste des guides (Échap)","prev":"Précédent","prevTitle":"Diapositive précédente (←)","next":"Suivant","nextTitle":"Diapositive suivante (→)","prevGuide":"Guide précédent","nextGuide":"Guide suivant : {title}","backToGuides":"Retour aux guides","guideOf":"Guide {n} sur {total}","step":"Étape {n}","slideOne":"1 diapositive","slideOther":"{count} diapositives"}};
const S = DATA.strings;   // testi della pagina nella lingua delle guide
const $ = (id) => document.getElementById(id);
const guides = DATA.guides;
const plural = (n) => (n === 1 ? S.slideOne : S.slideOther.replace('{count}', n));

// ---------- menu ----------
$('guides').replaceChildren(...guides.map((g, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${g.id}"><span class="n">${i + 1}</span><h2></h2><p>${g.intro}</p><span class="count">${plural(g.slides.length)}</span></a>`;
  li.querySelector('h2').textContent = g.title;
  return li;
}));

// ---------- slide ----------
// Indirizzo: #<guida>/<numero> (da 1); #<guida> = prima slide; vuoto = menu.
let current = null, index = 0;

function route() {
  const [id, n] = decodeURIComponent(location.hash.slice(1)).split('/');
  const g = guides.find((x) => x.id === id);
  closeZoom();
  if (!g) { showMenu(); return; }
  const i = Math.min(Math.max((Number(n) || 1) - 1, 0), g.slides.length - 1);
  const dir = g === current ? Math.sign(i - index) : 0;
  current = g;
  index = i;
  renderSlide(dir);
}

function showMenu() {
  current = null;
  $('deck').hidden = true;
  $('menu').hidden = false;
  document.title = S.docTitle;
}

const go = (i) => { location.hash = `${current.id}/${i + 1}`; };

function renderSlide(dir) {
  const g = current, s = g.slides[index];
  const gi = guides.indexOf(g), nextGuide = guides[gi + 1];
  $('menu').hidden = true;
  $('deck').hidden = false;
  document.title = `${g.title} · Overlay Browser`;
  $('guide-title').textContent = g.title;
  $('pos').textContent = `${index + 1} / ${g.slides.length}`;

  const el = $('slide');
  el.className = s.image ? 'with-image' : 'text-only';
  if (s.intro) el.classList.add('intro');
  const text = document.createElement('div');
  text.className = 'text';
  if (s.intro) {
    text.innerHTML = `<p class="section">${S.guideOf.replace('{n}', gi + 1).replace('{total}', guides.length)}</p><h2></h2>${s.html}`;
    text.querySelector('h2').textContent = g.title;
  } else {
    text.innerHTML = `<p class="section"></p><h2></h2>${s.html}`;
    const m = s.heading.match(/^(\d+)\.\s+(.*)$/);
    text.querySelector('.section').textContent = m ? S.step.replace('{n}', m[1]) : '';
    text.querySelector('h2').textContent = m ? m[2] : s.heading;
  }
  const parts = [text];
  if (s.image) {
    const fig = document.createElement('figure');
    fig.innerHTML = '<img><figcaption></figcaption>';
    fig.querySelector('img').src = s.image.src;
    fig.querySelector('img').alt = s.image.alt;
    fig.querySelector('figcaption').textContent = s.image.alt;
    fig.querySelector('img').onclick = () => openZoom(s.image);
    parts.push(fig);
  }
  el.replaceChildren(...parts);
  el.scrollTop = 0;
  el.classList.remove('enter');
  el.style.setProperty('--from', `${dir * 16}px`);
  if (dir) { void el.offsetWidth; el.classList.add('enter'); }

  $('dots').replaceChildren(...g.slides.map((x, i) => {
    const b = document.createElement('button');
    b.title = x.intro ? g.title : x.heading;
    b.setAttribute('aria-current', String(i === index));
    b.onclick = () => go(i);
    return b;
  }));
  $('prev').disabled = index === 0 && gi === 0;
  $('prev').textContent = index === 0 && gi > 0 ? `← ${S.prevGuide}` : `← ${S.prev}`;
  const last = index === g.slides.length - 1;
  $('next').textContent = !last ? `${S.next} →` : nextGuide ? `${S.nextGuide.replace('{title}', nextGuide.title)} →` : S.backToGuides;
}

function next() {
  if (index < current.slides.length - 1) return go(index + 1);
  const g = guides[guides.indexOf(current) + 1];
  location.hash = g ? g.id : '';
}
function prev() {
  if (index > 0) return go(index - 1);
  const g = guides[guides.indexOf(current) - 1];
  if (g) location.hash = `${g.id}/${g.slides.length}`;
}
$('next').onclick = next;
$('prev').onclick = prev;

// ---------- immagine a tutto schermo ----------
function openZoom(image) {
  $('zoom').querySelector('img').src = image.src;
  $('zoom').querySelector('img').alt = image.alt;
  $('zoom').hidden = false;
}
function closeZoom() { $('zoom').hidden = true; }
$('zoom').onclick = closeZoom;

// ---------- tastiera ----------
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!$('zoom').hidden) { if (e.key === 'Escape') closeZoom(); return; }
  if (!current) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) next();
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) prev();
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(current.slides.length - 1);
  else if (e.key === 'Escape') location.hash = '';
  else return;
  e.preventDefault();
});

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
