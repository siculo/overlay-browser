<!doctype html>
<!-- Modello della presentazione: build.js sostituisce i testi (segnaposti tra doppie graffe, da
     STRINGS in build.js) e i dati e scrive docs/<lingua>/<file>.html. Non
     modificare la pagina generata. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Browser · Guía</title>
<link rel="icon" href="../../assets/icon.png">
<style>
  :root {
    --bg: #141414; --sheet: #1b1b1b; --line: #2c2c2c; --text: #e8e8e8; --muted: #9a9a9a;
    --accent: #f0a030; --accent-text: #f5b750; --on-accent: #111; --mark: #e5262b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, sans-serif; }
  a { color: var(--accent-text); }
  code { font-family: ui-monospace, monospace; font-size: .9em; padding: 1px 5px; border-radius: 4px; background: #262626; }
  strong { color: #fff; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Numeri come nelle schermate: bianco su cerchio rosso. */
  .num { display: inline-flex; align-items: center; justify-content: center; width: 1.45em; height: 1.45em;
         margin: 0 .1em; border-radius: 50%; background: var(--mark); color: #fff; border: 2px solid #fff;
         font-size: .72em; font-weight: 700; line-height: 1; vertical-align: .12em; }

  /* ---------- menu ---------- */
  #menu { max-width: 1100px; margin: 0 auto; padding: 48px 32px 64px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { height: 56px; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; color: var(--muted); }
  .legend { margin: 28px 0 32px; padding: 12px 16px; border-left: 3px solid var(--mark); background: var(--sheet);
            color: #cfcfcf; border-radius: 0 6px 6px 0; }
  .legend .box { display: inline-block; width: 1.3em; height: .9em; border: 2px solid var(--mark); border-radius: 4px; vertical-align: -.05em; }
  #guides { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
            list-style: none; margin: 0; padding: 0; counter-reset: guide; }
  #guides a { display: flex; flex-direction: column; height: 100%; padding: 18px 20px; border: 1px solid var(--line);
              border-radius: 10px; background: var(--sheet); color: inherit; text-decoration: none;
              transition: border-color .15s, transform .15s; }
  #guides a:hover, #guides a:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  #guides .n { color: var(--accent-text); font-weight: 700; font-size: 14px; }
  #guides h2 { margin: 4px 0 8px; font-size: 19px; font-weight: 600; line-height: 1.3; }
  #guides p { margin: 0 0 14px; color: #bdbdbd; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #guides .count { margin-top: auto; }
  #guides .count { color: var(--muted); font-size: 13px; }

  /* ---------- slide ---------- */
  #deck { display: flex; flex-direction: column; height: 100%; }
  #deck header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: #0e0e0e; }
  #deck header .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid #3a3a3a;
         border-radius: 6px; background: #232323; text-decoration: none; color: var(--text); white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  #slide { flex: 1; min-height: 0; padding: 28px 36px; overflow: auto; }
  #slide.with-image { display: grid; grid-template-columns: minmax(300px, 36%) 1fr; gap: 36px; align-items: center; }
  #slide.text-only { display: flex; align-items: center; justify-content: center; }
  #slide .text { max-height: 100%; overflow: auto; }
  #slide.text-only .text { max-width: 760px; font-size: 19px; }
  #slide .section { margin: 0 0 4px; color: var(--accent-text); font-size: 14px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  #slide h2 { margin: 0 0 14px; font-size: 26px; font-weight: 600; line-height: 1.25; }
  #slide.intro h2 { font-size: 34px; }
  #slide p { margin: 0 0 12px; }
  #slide ul { margin: 0 0 12px; padding-left: 1.2em; }
  #slide li { margin-bottom: 8px; }
  #slide blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--sheet); border-radius: 0 6px 6px 0; color: #d4d4d4; }
  #slide figure { margin: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  #slide figure img { display: block; max-width: 100%; max-height: calc(100% - 2.2em); margin: 0 auto; object-fit: contain;
                      border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); cursor: zoom-in; }
  #slide figcaption { margin-top: 10px; text-align: center; color: var(--muted); font-size: 14px; }
  #deck footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); background: #0e0e0e; }
  #dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; background: #444; }
  #dots button[aria-current="true"] { background: var(--accent); }
  #pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  #slide.enter { animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateX(var(--from, 16px)); } }

  /* Immagine a tutto schermo */
  #zoom { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
          padding: 24px; background: rgba(0, 0, 0, .88); cursor: zoom-out; }
  #zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  @media (max-width: 820px) {
    #slide.with-image { grid-template-columns: 1fr; align-items: start; }
    #slide figure { height: auto; }
    #slide figure img { max-height: none; }
    #dots { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #slide.enter { animation: none; } #guides a { transition: none; } }
</style>
</head>
<body>

<main id="menu" hidden>
  <div class="brand">
    <img src="../../assets/logo.png" alt="">
    <div>
      <h1>Overlay Browser</h1>
      <p>Guía de uso, paso a paso</p>
    </div>
  </div>
  <p class="legend">En las capturas de pantalla, los elementos citados en el texto están resaltados con un recuadro rojo <span class="box"></span>; los números como <span class="num">1</span> en el texto indican el elemento con el mismo número en la captura.</p>
  <ol id="guides"></ol>
</main>

<div id="deck" hidden>
  <header>
    <a class="btn" href="#" title="Volver a la lista de guías (Esc)">☰ Guías</a>
    <span class="title" id="guide-title"></span>
    <span id="pos"></span>
  </header>
  <section id="slide" aria-live="polite"></section>
  <footer>
    <button class="btn" id="prev" title="Diapositiva anterior (←)">← Atrás</button>
    <div id="dots" role="tablist"></div>
    <button class="btn primary" id="next" title="Diapositiva siguiente (→)">Siguiente →</button>
  </footer>
</div>

<div id="zoom" hidden><img alt=""></div>

<script>
const DATA = {"guides":[{"id":"getting-started","title":"Primeros pasos para tener a mano los sitios de tu juego","intro":"En esta guía abres Overlay Browser mientras juegas a \u003cstrong>Tiny Glade\u003c/strong>, añades un par de sitios útiles y aprendes a mostrarlos y ocultarlos sin salir del juego.","slides":[{"heading":null,"html":"\u003cp>En esta guía abres Overlay Browser mientras juegas a \u003cstrong>Tiny Glade\u003c/strong>, añades un par de sitios útiles y aprendes a mostrarlos y ocultarlos sin salir del juego.\u003c/p>","image":null,"intro":true},{"heading":"1. Inicia la aplicación","html":"\u003cp>Inicia Overlay Browser. La ventana \u003cstrong>permanece oculta\u003c/strong> y la aplicación queda en el área de notificación, junto al reloj. No aparece en la barra de tareas ni en Alt+Tab.\u003c/p>\u003cp>A continuación, inicia el juego en modo ventana o ventana sin bordes.\u003c/p>","image":null},{"heading":"2. Abre el overlay sobre el juego","html":"\u003cp>Mientras juegas, pulsa \u003cstrong>Win+F10\u003c/strong> (Super+F10 en Linux, Cmd+Mayús+Espacio en macOS). El overlay aparece sobre el juego y muestra \u003cstrong>Inicio\u003c/strong>.\u003c/p>\u003cp>El overlay ha reconocido el juego. Arriba está la lista \u003cstrong>Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, \u003cem>activa\u003c/em> y aún \u003cem>nueva\u003c/em>. Cada juego tiene su propia lista de sitios, que se crea al añadir el primero. En \u003cem>Otras listas\u003c/em> está \u003cstrong>General\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, la lista que se usa cuando no hay ningún juego abierto. Pulsa \u003cstrong>Usar\u003c/strong> para activarla manualmente.\u003c/p>","image":{"src":"img/getting-started/01-empty-home.png","alt":"Inicio abierto sobre Tiny Glade con la lista del juego todavía vacía"}},{"heading":"3. Añade un sitio","html":"\u003cp>Haz clic en \u003cstrong>+\u003c/strong> \u003cspan class=\"num\">1\u003c/span> en la barra superior, escribe la \u003cstrong>dirección\u003c/strong> del sitio \u003cspan class=\"num\">2\u003c/span> (basta con \u003ccode>tinyglade.com\u003c/code>) y pulsa \u003cstrong>Añadir\u003c/strong> \u003cspan class=\"num\">3\u003c/span>.\u003c/p>","image":{"src":"img/getting-started/02-add-site.png","alt":"Ventana para añadir un sitio con la dirección tinyglade.com"}},{"heading":"3. Añade un sitio","html":"\u003cp>El sitio se abre enseguida en su \u003cstrong>pestaña\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, que toma el título de la página. Ciérrala con \u003cstrong>×\u003c/strong>. Debajo está la barra de navegación, como en un navegador, con los botones \u003cstrong>Atrás\u003c/strong>, \u003cstrong>Adelante\u003c/strong> y \u003cstrong>Recargar\u003c/strong> \u003cspan class=\"num\">2\u003c/span>. En el campo de \u003cstrong>dirección\u003c/strong> \u003cspan class=\"num\">3\u003c/span> puedes escribir otra y pulsar Intro. \u003cstrong>Fijar\u003c/strong> \u003cspan class=\"num\">4\u003c/span> convierte la página a la que has llegado en una pestaña nueva.\u003c/p>","image":{"src":"img/getting-started/03-site-open.png","alt":"Sitio oficial de Tiny Glade abierto en su pestaña"}},{"heading":"4. Añade más sitios desde Inicio","html":"\u003cp>Vuelve a \u003cstrong>Inicio\u003c/strong> para ver los sitios de la lista. Haz clic en el \u003cstrong>nombre de un sitio\u003c/strong> \u003cspan class=\"num\">1\u003c/span> para abrirlo, en \u003cstrong>Editar\u003c/strong> \u003cspan class=\"num\">2\u003c/span> para cambiar la dirección (Intro guarda y Esc cancela) y en \u003cstrong>Eliminar\u003c/strong> \u003cspan class=\"num\">3\u003c/span> para quitarlo de la lista. Para añadir un sitio, escribe su dirección en el \u003cstrong>campo debajo de la lista\u003c/strong> \u003cspan class=\"num\">4\u003c/span> y pulsa \u003cem>Añadir\u003c/em>. Aquí hemos añadido la página del juego en Steam.\u003c/p>","image":{"src":"img/getting-started/04-home-with-sites.png","alt":"Inicio con los dos sitios de la lista de Tiny Glade"}},{"heading":"5. Cambia de sitio","html":"\u003cp>Cada sitio tiene su pestaña. Aquí están el \u003cstrong>sitio oficial\u003c/strong> \u003cspan class=\"num\">1\u003c/span> y la \u003cstrong>página de Steam\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, que es la que está abierta. Al volver a una pestaña encuentras la página donde la dejaste.\u003c/p>","image":{"src":"img/getting-started/05-two-tabs.png","alt":"Página de Tiny Glade en Steam abierta en la segunda pestaña"}},{"heading":"6. Vuelve al juego","html":"\u003cp>Pulsa de nuevo \u003cstrong>Win+F10\u003c/strong> para ocultar el overlay o haz clic en la ventana del juego. Por defecto, el overlay se oculta al perder el foco. Puedes desactivar esta opción en Ajustes.\u003c/p>\u003cp>La próxima vez que abras el overlay sobre Tiny Glade encontrarás su lista en la última pestaña que estabas usando. Si lo abres sobre otro juego, verás la lista de ese juego.\u003c/p>","image":null}]},{"id":"free-browsing","title":"Navegación libre para buscar, encontrar y fijar páginas","intro":"En la pestaña \u003cstrong>Navegar\u003c/strong> puedes buscar y abrir cualquier página sin añadirla a la lista. Si quieres conservarla, \u003cstrong>Fijar\u003c/strong> la convierte en una pestaña de la lista del juego.","slides":[{"heading":null,"html":"\u003cp>En la pestaña \u003cstrong>Navegar\u003c/strong> puedes buscar y abrir cualquier página sin añadirla a la lista. Si quieres conservarla, \u003cstrong>Fijar\u003c/strong> la convierte en una pestaña de la lista del juego.\u003c/p>\u003cp>Seguimos con el ejemplo de \u003ca href=\"#getting-started\">Primeros pasos\u003c/a>. El overlay está abierto sobre \u003cstrong>Tiny Glade\u003c/strong>, su lista ya contiene dos sitios y vamos a buscar una wiki del juego.\u003c/p>","image":null,"intro":true},{"heading":"1. Abre la pestaña Navegar","html":"\u003cp>Haz clic en \u003cstrong>Navegar\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, justo al lado de Inicio. Escribe en el \u003cstrong>campo de dirección\u003c/strong> \u003cspan class=\"num\">2\u003c/span> una dirección (basta con \u003ccode>example.com\u003c/code>) o el texto que quieras buscar. El overlay sugiere como ejemplo el \u003cstrong>nombre del juego\u003c/strong> \u003cspan class=\"num\">3\u003c/span>. Haz clic en él para buscarlo.\u003c/p>","image":{"src":"img/free-browsing/01-browse.png","alt":"Pestaña Navegar vacía con el campo de dirección y la búsqueda de ejemplo «Tiny Glade»"}},{"heading":"2. Busca","html":"\u003cp>Escribe \u003ccode>tiny glade wiki\u003c/code> y pulsa Intro. Los resultados se abren en la pestaña. El \u003cstrong>campo de dirección\u003c/strong> \u003cspan class=\"num\">1\u003c/span> muestra la dirección de la página de resultados.\u003c/p>\u003cp>Elige el motor de búsqueda en Ajustes, en \u003cem>Comportamiento\u003c/em>. Puedes usar Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage o una dirección personalizada. Aquí usamos DuckDuckGo.\u003c/p>\u003cp>Haz clic en el resultado que quieras, en este caso \u003cstrong>Tiny Glade Wiki\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/02-results.png","alt":"Resultados de «tiny glade wiki» con el enlace a Tiny Glade Wiki"}},{"heading":"3. Fija la página","html":"\u003cp>La página se abre en Navegar y puedes usarla como en un navegador. \u003cstrong>Atrás\u003c/strong> \u003cspan class=\"num\">1\u003c/span> vuelve a los resultados. Para conservar la página, pulsa \u003cstrong>Fijar\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/03-page-found.png","alt":"Tiny Glade Wiki abierta en la pestaña Navegar"}},{"heading":"3. Fija la página","html":"\u003cp>El overlay pide confirmación. Pulsa \u003cstrong>Fijar\u003c/strong>.\u003c/p>","image":{"src":"img/free-browsing/04-confirm.png","alt":"Confirmación para fijar Tiny Glade Wiki como pestaña nueva de la lista Tiny Glade"}},{"heading":"4. La página pasa a la lista","html":"\u003cp>La página y su historial pasan a una \u003cstrong>pestaña nueva\u003c/strong> \u003cspan class=\"num\">1\u003c/span> al final de la lista de Tiny Glade. La encontrarás ahí cada vez que abras el overlay sobre el juego. \u003cstrong>Fijar\u003c/strong> \u003cspan class=\"num\">2\u003c/span> queda desactivado porque la página ya está en la lista.\u003c/p>","image":{"src":"img/free-browsing/05-pinned.png","alt":"Tiny Glade Wiki en su nueva pestaña con Fijar desactivado"}},{"heading":"4. La página pasa a la lista","html":"\u003cp>También puedes fijar páginas desde las pestañas de sitios. La pestaña nueva queda justo después de la original. Si la página ya está en una pestaña de la lista, esa pestaña se resalta y Fijar queda desactivado.\u003c/p>","image":null},{"heading":"5. La pestaña Navegar queda libre","html":"\u003cp>Cuando vuelvas a \u003cstrong>Navegar\u003c/strong>, la encontrarás vacía, lista para otra búsqueda. La página fijada ya tiene su propia pestaña. Mientras navegas, \u003cstrong>Volver a la página inicial\u003c/strong> \u003cspan class=\"num\">1\u003c/span> cierra la página abierta y vuelve a mostrar la vista vacía.\u003c/p>","image":{"src":"img/free-browsing/06-browse-again.png","alt":"Pestaña Navegar de nuevo vacía"}},{"heading":"5. La pestaña Navegar queda libre","html":"\u003cp>En Ajustes, en \u003cem>Comportamiento\u003c/em>, puedes elegir una \u003cstrong>Página de inicio de la navegación libre\u003c/strong> para que se abra en lugar de la vista vacía.\u003c/p>","image":null},{"heading":"Abre otras direcciones desde las pestañas de sitios","html":"\u003cp>También puedes escribir en el campo de dirección de una pestaña de sitio. Una dirección del mismo sitio se abre en esa pestaña. Una dirección de otro sitio o una búsqueda se abre en Navegar tras una confirmación. La pestaña del sitio conserva su página.\u003c/p>","image":null}]},{"id":"lists-per-game","title":"Una lista por juego","intro":"Overlay Browser reconoce el juego sobre el que lo abres y muestra sus sitios. Cada juego tiene su propia \u003cstrong>lista\u003c/strong>. Tras Primeros pasos y Navegación libre, la lista de \u003cstrong>Tiny Glade\u003c/strong> ya tiene tres sitios. Ahora vamos a jugar a \u003cstrong>Brotato\u003c/strong>.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser reconoce el juego sobre el que lo abres y muestra sus sitios. Cada juego tiene su propia \u003cstrong>lista\u003c/strong>. Tras \u003ca href=\"#getting-started\">Primeros pasos\u003c/a> y \u003ca href=\"#free-browsing\">Navegación libre\u003c/a>, la lista de \u003cstrong>Tiny Glade\u003c/strong> ya tiene tres sitios. Ahora vamos a jugar a \u003cstrong>Brotato\u003c/strong>.\u003c/p>","image":null,"intro":true},{"heading":"1. Un juego nuevo, una lista nueva","html":"\u003cp>Abre el overlay mientras juegas a Brotato. Arriba en Inicio está la \u003cstrong>lista de Brotato\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, \u003cem>activa\u003c/em> y aún \u003cem>nueva\u003c/em>. Junto al nombre verás el programa reconocido y el número de sitios. Añade un sitio en el \u003cstrong>campo debajo de la lista\u003c/strong> \u003cspan class=\"num\">2\u003c/span> o desde \u003cstrong>+\u003c/strong> en la barra superior. La lista se crea al añadir el primer sitio. La \u003cstrong>lista de Tiny Glade\u003c/strong> \u003cspan class=\"num\">3\u003c/span> está plegada en \u003cem>Otras listas\u003c/em>. Haz clic en ella para ver sus sitios.\u003c/p>","image":{"src":"img/lists-per-game/01-brotato-new.png","alt":"Inicio abierto sobre Brotato con su lista nueva y la de Tiny Glade entre las otras listas"}},{"heading":"1. Un juego nuevo, una lista nueva","html":"\u003cp>Aquí añadimos la wiki de Brotato y su página de Steam. La barra muestra solo las pestañas de Brotato.\u003c/p>","image":{"src":"img/lists-per-game/02-brotato-wiki.png","alt":"Pestañas de la lista de Brotato"}},{"heading":"2. Cada juego recupera sus sitios","html":"\u003cp>Vuelve a Tiny Glade y abre el overlay. La barra muestra las \u003cstrong>pestañas de Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span> y la \u003cstrong>lista de Tiny Glade\u003c/strong> \u003cspan class=\"num\">2\u003c/span> es la activa. La \u003cstrong>lista de Brotato\u003c/strong> \u003cspan class=\"num\">3\u003c/span> ha pasado a \u003cem>Otras listas\u003c/em>. Con \u003cstrong>Usar\u003c/strong> \u003cspan class=\"num\">4\u003c/span> puedes activarla manualmente (véase el paso 4). Cada lista vuelve a abrirse en la última pestaña que estabas usando.\u003c/p>","image":{"src":"img/lists-per-game/03-tiny-glade.png","alt":"Inicio abierto sobre Tiny Glade con sus pestañas y la lista de Brotato entre las demás"}},{"heading":"3. La lista General","html":"\u003cp>El overlay ofrece una lista para cualquier programa sobre el que lo abras. Cuando no reconoce ninguna aplicación, la \u003cstrong>lista General\u003c/strong> queda activa. Sirve para sitios que no están ligados a un programa concreto. Funciona como las demás y no se puede eliminar.\u003c/p>","image":{"src":"img/lists-per-game/04-general.png","alt":"Lista General activa cuando no se reconoce ninguna aplicación"}},{"heading":"4. Elige una lista a mano","html":"\u003cp>Puede que quieras consultar los sitios de otro juego, por ejemplo la wiki de Brotato mientras tienes abierto Tiny Glade. Pulsa \u003cstrong>Usar\u003c/strong> junto a la lista que quieras (\u003cspan class=\"num\">4\u003c/span> en la captura del paso 2).\u003c/p>\u003cp>La lista queda activa como \u003cstrong>Lista elegida a mano\u003c/strong> \u003cspan class=\"num\">1\u003c/span> incluso si abres el overlay sobre otros juegos. Pulsa \u003cstrong>Volver a Tiny Glade\u003c/strong> para recuperar la lista del juego sobre el que está abierto en ese momento. La barra muestra las \u003cstrong>pestañas de la lista elegida\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/lists-per-game/05-chosen-by-hand.png","alt":"Lista de Brotato elegida a mano con el overlay abierto sobre Tiny Glade"}},{"heading":"5. Reordena pestañas y sitios","html":"\u003cp>Arrastra una pestaña en la barra para moverla. Aquí la pestaña de Tiny Glade Wiki pasa a la primera posición.\u003c/p>","image":{"src":"img/lists-per-game/06-drag.png","alt":"Pestaña de Tiny Glade Wiki arrastrada a la primera posición"}},{"heading":"5. Reordena pestañas y sitios","html":"\u003cp>También puedes arrastrar los sitios en Inicio. El orden es el mismo en ambos sitios.\u003c/p>","image":null},{"heading":"6. Elimina una lista","html":"\u003cp>\u003cstrong>Eliminar lista\u003c/strong>, junto a su nombre, borra la lista y todos sus sitios tras pedirte confirmación.\u003c/p>","image":{"src":"img/lists-per-game/07-remove-list.png","alt":"Confirmación para eliminar la lista Brotato y todos sus sitios"}},{"heading":"6. Elimina una lista","html":"\u003cp>Si vuelves a añadir un sitio mientras juegas a Brotato, su lista se crea de nuevo.\u003c/p>","image":null}]},{"id":"bookmarks","title":"Importar y exportar marcadores","intro":"Si ya guardas los sitios de tus juegos en el navegador, puedes importarlos a las listas de Overlay Browser sin volver a escribir las direcciones. También puedes exportar las listas a un archivo de marcadores que puedes importar en cualquier navegador.","slides":[{"heading":null,"html":"\u003cp>Si ya guardas los sitios de tus juegos en el navegador, puedes importarlos a las listas de Overlay Browser sin volver a escribir las direcciones. También puedes exportar las listas a un archivo de marcadores que puedes importar en cualquier navegador.\u003c/p>\u003cp>Aquí el overlay está abierto sobre \u003cstrong>Brotato\u003c/strong>, cuya lista sigue vacía. La de \u003cstrong>Tiny Glade\u003c/strong> ya tiene tres sitios. Consulta \u003ca href=\"#lists-per-game\">Una lista por juego\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Los marcadores en Inicio","html":"\u003cp>Al final de \u003cstrong>Inicio\u003c/strong> está la sección \u003cem>Marcadores\u003c/em>, con \u003cstrong>Importar marcadores…\u003c/strong> \u003cspan class=\"num\">1\u003c/span> y \u003cstrong>Exportar marcadores…\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/bookmarks/01-bookmarks-section.png","alt":"Sección Marcadores al final de Inicio"}},{"heading":"2. Elige qué marcadores importar","html":"\u003cp>Haz clic en \u003cstrong>Importar marcadores…\u003c/strong>. En la ventana aparecen estas opciones.\u003c/p>\u003cul>\u003cli>\u003cstrong>Desde\u003c/strong> \u003cspan class=\"num\">1\u003c/span> elige el perfil del navegador del que se leerán los marcadores. El overlay detecta Chrome, Edge, Brave, Opera, Vivaldi, Chromium, Firefox, LibreWolf y navegadores similares. Firefox puede seguir abierto. La próxima vez se propone el último perfil elegido.\u003c/li>\u003cli>\u003cstrong>Archivo…\u003c/strong> \u003cspan class=\"num\">2\u003c/span> permite importar un archivo HTML exportado desde el gestor de marcadores de cualquier navegador. En macOS es el único método, así que primero exporta los marcadores desde el navegador.\u003c/li>\u003cli>\u003cstrong>Buscar en los marcadores…\u003c/strong> \u003cspan class=\"num\">3\u003c/span> encuentra marcadores y carpetas por nombre o dirección.\u003c/li>\u003cli>Con las \u003cstrong>casillas\u003c/strong> \u003cspan class=\"num\">4\u003c/span> puedes seleccionar marcadores sueltos o carpetas completas. \u003cem>Todos los marcadores\u003c/em> los selecciona todos. Aquí marcamos la carpeta \u003cem>Brotato\u003c/em>.\u003c/li>\u003cli>\u003cstrong>En la lista\u003c/strong> \u003cspan class=\"num\">5\u003c/span> indica dónde se añadirán. Al principio está seleccionada la lista activa. Si todavía es \u003cem>nueva\u003c/em>, como la de Brotato, se crea al importar los sitios.\u003c/li>\u003cli>El botón \u003cstrong>Añadir 3 sitios\u003c/strong> \u003cspan class=\"num\">6\u003c/span> muestra cuántos sitios se añadirán.\u003c/li>\u003c/ul>","image":{"src":"img/bookmarks/02-import.png","alt":"Ventana de importación con la carpeta Brotato marcada"}},{"heading":"2. Elige qué marcadores importar","html":"\u003cp>Los marcadores se convierten en sitios de la lista y conservan sus nombres.\u003c/p>","image":{"src":"img/bookmarks/03-imported.png","alt":"Tres sitios importados en la lista de Brotato"}},{"heading":"3. Importa desde «+»","html":"\u003cp>También puedes importar desde \u003cstrong>+\u003c/strong> en la barra superior. Abre la pestaña \u003cstrong>Marcadores\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, al lado de \u003cem>Dirección\u003c/em>. Desde aquí los sitios se añaden a la lista activa. \u003cstrong>Buscar en los marcadores…\u003c/strong> \u003cspan class=\"num\">2\u003c/span> permite encontrar los que buscas. Los que \u003cstrong>ya están en la lista\u003c/strong> \u003cspan class=\"num\">3\u003c/span> aparecen atenuados y no se pueden seleccionar. Así evitas duplicados.\u003c/p>","image":{"src":"img/bookmarks/04-plus-bookmarks.png","alt":"Pestaña Marcadores del diálogo «+» con los marcadores ya presentes desactivados"}},{"heading":"4. Exporta las listas","html":"\u003cp>\u003cstrong>Exportar marcadores…\u003c/strong>, en la sección \u003cem>Marcadores\u003c/em> de Inicio, guarda los sitios en un archivo HTML que puedes importar en cualquier navegador. Cada lista se convierte en una carpeta. Al principio están seleccionados \u003cstrong>Todos los marcadores\u003c/strong> \u003cspan class=\"num\">1\u003c/span>. En la \u003cstrong>lista\u003c/strong> \u003cspan class=\"num\">2\u003c/span> puedes desmarcar listas o sitios. \u003cstrong>Exportar 6 sitios\u003c/strong> \u003cspan class=\"num\">3\u003c/span> te pregunta dónde guardar el archivo.\u003c/p>","image":{"src":"img/bookmarks/05-export.png","alt":"Ventana de exportación con las listas de Brotato y Tiny Glade"}}]},{"id":"customizing","title":"Personaliza el overlay","intro":"En \u003cstrong>Ajustes\u003c/strong> eliges la combinación de teclas, el comportamiento, la apariencia y el idioma. Cada cambio se aplica al instante y queda guardado.","slides":[{"heading":null,"html":"\u003cp>En \u003cstrong>Ajustes\u003c/strong> eliges la combinación de teclas, el comportamiento, la apariencia y el idioma. Cada cambio se aplica al instante y queda guardado.\u003c/p>","image":null,"intro":true},{"heading":"1. La combinación de teclas","html":"\u003cp>Abre \u003cstrong>Ajustes\u003c/strong> \u003cspan class=\"num\">1\u003c/span> arriba a la derecha o desde el menú del icono del área de notificación. En \u003cem>Teclado\u003c/em> verás la \u003cstrong>combinación actual\u003c/strong> \u003cspan class=\"num\">2\u003c/span> para mostrar y ocultar el overlay. \u003cstrong>Cambiar\u003c/strong> \u003cspan class=\"num\">3\u003c/span> registra otra. \u003cstrong>Restablecer\u003c/strong> \u003cspan class=\"num\">4\u003c/span> recupera la predeterminada (Win+F10, Super+F10 en Linux, Cmd+Mayús+Espacio en macOS).\u003c/p>","image":{"src":"img/customizing/01-shortcut.png","alt":"Sección Teclado de Ajustes"}},{"heading":"1. La combinación de teclas","html":"\u003cp>Después de pulsar \u003cstrong>Cambiar\u003c/strong>, pulsa la combinación que prefieras, por ejemplo \u003ccode>Ctrl+Shift+O\u003c/code>. Con Esc cancelas el cambio.\u003c/p>","image":{"src":"img/customizing/02-new-combination.png","alt":"Overlay a la espera de la nueva combinación"}},{"heading":"1. La combinación de teclas","html":"\u003cp>Puedes usar F1 a F24 solas o combinar una tecla con Ctrl, Alt, Mayús o Win (Super en Linux, Cmd en macOS). Si la combinación ya la usa otro programa, aparece un aviso y se mantiene la anterior.\u003c/p>\u003cblockquote>\u003cstrong>Durante el juego.\u003c/strong> El juego también recibe la combinación. Elige una que no esté asignada a ningún comando del juego para evitar activarlo cuando abras el overlay.\u003c/blockquote>","image":null},{"heading":"2. Comportamiento","html":"\u003cp>En \u003cem>Comportamiento\u003c/em> tienes estas opciones.\u003c/p>\u003cul>\u003cli>\u003cstrong>Ocultar el overlay cuando pierde el foco\u003c/strong> \u003cspan class=\"num\">1\u003c/span> viene activada. El overlay se oculta al hacer clic en el juego o en otra ventana. Desactívala si quieres que siga visible mientras juegas. Puedes seguir ocultándolo con la combinación. La opción también está en el menú del icono del área de notificación.\u003c/li>\u003cli>\u003cstrong>Página de inicio de la navegación libre\u003c/strong> \u003cspan class=\"num\">2\u003c/span> es la página que se abre al entrar en Navegar. Si dejas el campo vacío, no se abre ninguna página. Consulta \u003ca href=\"#free-browsing\">Navegación libre\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Motor de búsqueda\u003c/strong> \u003cspan class=\"num\">3\u003c/span> elige dónde buscar el texto introducido en Navegar. Puedes elegir Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage o \u003cem>Personalizado\u003c/em>. En una dirección personalizada, \u003ccode>%s\u003c/code> se sustituye por el texto de la búsqueda.\u003c/li>\u003c/ul>\u003cp>\u003cem>Buscar nuevas versiones\u003c/em> te avisa en Inicio cuando sale una versión nueva. La edición de Microsoft Store se actualiza desde la tienda.\u003c/p>","image":{"src":"img/customizing/03-behavior.png","alt":"Sección Comportamiento de Ajustes"}},{"heading":"3. Apariencia e idioma","html":"\u003cp>En \u003cem>Apariencia\u003c/em> tienes estas opciones.\u003c/p>\u003cul>\u003cli>\u003cstrong>Color de acento\u003c/strong> \u003cspan class=\"num\">1\u003c/span> cambia el color de las pestañas fijas, los botones principales y otros detalles.\u003c/li>\u003cli>\u003cstrong>Pestañas fijas\u003c/strong> \u003cspan class=\"num\">2\u003c/span> muestra Inicio, Navegar y Ajustes con icono y nombre. \u003cem>Solo icono\u003c/em> deja más espacio a las pestañas de los sitios.\u003c/li>\u003cli>\u003cstrong>Opacidad de la ventana\u003c/strong> \u003cspan class=\"num\">3\u003c/span> va del 30 % al 100 %. Con valores más bajos, la ventana deja ver el juego detrás.\u003c/li>\u003c/ul>\u003cp>En \u003cem>Idioma\u003c/em>, \u003cstrong>Idioma de la interfaz\u003c/strong> \u003cspan class=\"num\">4\u003c/span> es por defecto el \u003cem>Idioma del sistema\u003c/em> si está disponible (italiano, inglés, francés, portugués, ruso, español y alemán). En los demás casos se usa el inglés.\u003c/p>","image":{"src":"img/customizing/04-appearance.png","alt":"Secciones Apariencia e Idioma de Ajustes"}},{"heading":"3. Apariencia e idioma","html":"\u003cp>Aquí se ve el overlay con el color de acento azul y las \u003cstrong>pestañas fijas con solo el icono\u003c/strong> \u003cspan class=\"num\">1\u003c/span> \u003cspan class=\"num\">2\u003c/span>. La captura solo muestra la ventana, de modo que no se ve el juego detrás ni se aprecia la opacidad.\u003c/p>","image":{"src":"img/customizing/05-customized.png","alt":"Overlay con acento azul y pestañas fijas que solo muestran el icono"}},{"heading":"Las demás secciones","html":"\u003cp>Más abajo, \u003cem>Memoria\u003c/em> muestra cuánta memoria usa la aplicación y cuándo se cierran las páginas que no estás usando. \u003cem>Diagnóstico\u003c/em> ayuda a recopilar información para comunicar un problema.\u003c/p>","image":null}]},{"id":"memory","title":"Memoria y páginas cerradas","intro":"Cada página abierta en Overlay Browser usa memoria, como en un navegador, aunque no la estés viendo. Las páginas de otras listas también siguen abiertas. Para dejar memoria al juego, el overlay \u003cstrong>cierra automáticamente las páginas que llevas un rato sin usar\u003c/strong>. En Ajustes puedes consultar cuánta memoria usa y cerrar páginas a mano.","slides":[{"heading":null,"html":"\u003cp>Cada página abierta en Overlay Browser usa memoria, como en un navegador, aunque no la estés viendo. Las páginas de otras listas también siguen abiertas. Para dejar memoria al juego, el overlay \u003cstrong>cierra automáticamente las páginas que llevas un rato sin usar\u003c/strong>. En Ajustes puedes consultar cuánta memoria usa y cerrar páginas a mano.\u003c/p>\u003cp>Aquí hay varias páginas abiertas en las listas de \u003cstrong>Tiny Glade\u003c/strong> y \u003cstrong>Brotato\u003c/strong>. Consulta \u003ca href=\"#lists-per-game\">Una lista por juego\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Por qué se vuelve a cargar una página","html":"\u003cp>Las páginas que no estás viendo quedan abiertas un rato y después se cierran. Esto incluye las demás pestañas, las páginas de otras listas y todas las páginas cuando el overlay está oculto. Al volver a abrir la pestaña, la página \u003cstrong>se recarga desde la última dirección visitada\u003c/strong>. Recuperas la página, aunque puedes perder la posición de desplazamiento o un formulario a medio rellenar.\u003c/p>\u003cp>La página que estás viendo sigue abierta.\u003c/p>","image":null},{"heading":"2. La sección Memoria","html":"\u003cp>Abre \u003cstrong>Ajustes\u003c/strong> y baja hasta \u003cem>Memoria\u003c/em>.\u003c/p>\u003cul>\u003cli>\u003cstrong>Cerrar las páginas no usadas después de\u003c/strong> \u003cspan class=\"num\">1\u003c/span> fija el tiempo de espera entre 5 y 60 minutos. El valor inicial es 30 minutos. Si tienes poca memoria libre o el juego usa mucha, conviene reducirlo.\u003c/li>\u003cli>\u003cstrong>Memoria usada\u003c/strong> \u003cspan class=\"num\">2\u003c/span> muestra la memoria de toda la aplicación.\u003c/li>\u003cli>\u003cstrong>Cerrar todas las páginas\u003c/strong> \u003cspan class=\"num\">3\u003c/span> cierra de inmediato las páginas abiertas de todas las listas.\u003c/li>\u003cli>\u003cstrong>Procesos de la aplicación\u003c/strong> \u003cspan class=\"num\">4\u003c/span> incluye la interfaz, el proceso principal, los gráficos (GPU) y otros procesos. Estos usan memoria siempre.\u003c/li>\u003cli>\u003cstrong>Páginas agrupadas por lista\u003c/strong> \u003cspan class=\"num\">5\u003c/span> muestra la memoria de las páginas abiertas de cada lista. \u003cstrong>Cerrar\u003c/strong> cierra todas las páginas de esa lista.\u003c/li>\u003c/ul>","image":{"src":"img/memory/01-memory.png","alt":"Sección Memoria de Ajustes con las listas de Tiny Glade y Brotato"}},{"heading":"3. Las páginas de una lista","html":"\u003cp>Haz clic en el nombre de una lista para ver sus páginas abiertas, la memoria que usa cada una y el tiempo que le queda. \u003cstrong>Cerrar\u003c/strong> junto a la lista \u003cspan class=\"num\">1\u003c/span> cierra todas sus páginas. \u003cstrong>Cerrar\u003c/strong> junto a una página \u003cspan class=\"num\">2\u003c/span> cierra solo esa.\u003c/p>","image":{"src":"img/memory/02-pages.png","alt":"Páginas abiertas de Tiny Glade con sus botones Cerrar"}},{"heading":"3. Las páginas de una lista","html":"\u003cp>Algunas páginas comparten proceso, por ejemplo las del mismo sitio en listas distintas. Aparecen en una sola fila, fuera de los grupos. Se cierran juntas porque la memoria solo se libera cuando todas se cierran.\u003c/p>","image":null},{"heading":"4. Después del cierre","html":"\u003cp>Aquí cerramos las páginas de Brotato. Su grupo desaparece y baja la memoria usada. Las pestañas siguen en la lista y las páginas se recargan la próxima vez que las abras.\u003c/p>","image":{"src":"img/memory/03-closed.png","alt":"Sección Memoria tras cerrar las páginas de Brotato"}}]},{"id":"new-versions","title":"Nuevas versiones","intro":"Overlay Browser comprueba si hay una versión nueva y te avisa. Tú eliges cuándo descargarla e instalarla.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser comprueba si hay una versión nueva y te avisa. Tú eliges cuándo descargarla e instalarla.\u003c/p>","image":null,"intro":true},{"heading":"1. Aviso de una nueva versión","html":"\u003cp>Cuando sale una versión nueva, aparece una \u003cstrong>franja\u003c/strong> \u003cspan class=\"num\">1\u003c/span> bajo la barra superior con su número. \u003cstrong>Descargar\u003c/strong> \u003cspan class=\"num\">2\u003c/span> abre en el navegador del sistema la página donde puedes descargar el archivo para tu sistema. Consulta la instalación en el \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a>. Pulsa \u003cstrong>×\u003c/strong> \u003cspan class=\"num\">3\u003c/span> para cerrar la franja de esa versión de forma permanente.\u003c/p>\u003cp>La nueva versión también aparece arriba en \u003cstrong>Inicio\u003c/strong> \u003cspan class=\"num\">4\u003c/span>, junto a la que usas. Haz clic en ella para abrir la misma página.\u003c/p>","image":{"src":"img/new-versions/01-new-version.png","alt":"Franja bajo la barra y nueva versión en Inicio"}},{"heading":"1. Aviso de una nueva versión","html":"\u003cp>Al cerrar la franja, la versión nueva sigue apareciendo en Inicio hasta que instales la actualización.\u003c/p>","image":{"src":"img/new-versions/02-strip-closed.png","alt":"Inicio con la nueva versión junto a la que está en uso"}},{"heading":"2. Cuándo se comprueba","html":"\u003cp>La aplicación consulta las publicaciones del proyecto en GitHub poco después de arrancar y luego cada seis horas. Si usas una beta, también te avisa de las betas posteriores. En los demás casos solo te avisa de versiones finales.\u003c/p>\u003cp>Para dejar de recibir avisos, desactiva \u003cstrong>Buscar nuevas versiones\u003c/strong> en \u003cstrong>Ajustes\u003c/strong>, en \u003cem>Comportamiento\u003c/em>. La edición de Microsoft Store recibe las actualizaciones desde la tienda y carece de esta opción.\u003c/p>","image":{"src":"img/new-versions/03-option.png","alt":"Opción Buscar nuevas versiones en Ajustes"}}]},{"id":"signing-in","title":"Iniciar sesión en un sitio y eliminar sus cookies","intro":"Muchos sitios de juegos, como foros, wikis o herramientas para planificar configuraciones, funcionan mejor con una cuenta o exigen iniciar sesión. En el overlay inicias sesión como en un navegador y la sesión queda guardada. Si el sitio deja de funcionar bien o quieres cerrar la sesión, puedes eliminar sus cookies.","slides":[{"heading":null,"html":"\u003cp>Muchos sitios de juegos, como foros, wikis o herramientas para planificar configuraciones, funcionan mejor con una cuenta o exigen iniciar sesión. En el overlay inicias sesión como en un navegador y la sesión queda guardada. Si el sitio deja de funcionar bien o quieres cerrar la sesión, puedes eliminar sus cookies.\u003c/p>\u003cp>La lista de \u003cstrong>Tiny Glade\u003c/strong> incluye un foro. Es un \u003cstrong>sitio de ejemplo\u003c/strong> creado para esta guía. El inicio de sesión funciona como en un sitio real, por ejemplo con \u003cem>Continuar con Google\u003c/em>.\u003c/p>","image":null,"intro":true},{"heading":"1. Inicia sesión con tu cuenta","html":"\u003cp>Abre la pestaña del sitio y pulsa el botón de acceso. Aquí es \u003cstrong>Continuar con una cuenta\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/01-forum.png","alt":"Foro de ejemplo abierto en su pestaña con el botón de acceso"}},{"heading":"1. Inicia sesión con tu cuenta","html":"\u003cp>El sitio abre una \u003cstrong>ventana de inicio de sesión\u003c/strong> sobre el overlay. Introduce tus datos y confirma.\u003c/p>","image":{"src":"img/signing-in/02-sign-in-window.png","alt":"Ventana de inicio de sesión abierta sobre el overlay"}},{"heading":"1. Inicia sesión con tu cuenta","html":"\u003cp>La ventana de inicio de sesión forma parte del overlay. Se mantiene encima y se oculta y vuelve a aparecer junto con él. Puedes pasar de una ventana a otra sin que se oculten. Al cerrar la ventana de inicio de sesión, el overlay vuelve a estar activo.\u003c/p>","image":null},{"heading":"2. La sesión queda guardada","html":"\u003cp>Una vez iniciada la sesión, la ventana se cierra y el sitio muestra tu \u003cstrong>cuenta\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/03-signed-in.png","alt":"Foro con la sesión iniciada y el nombre de usuario arriba"}},{"heading":"2. La sesión queda guardada","html":"\u003cp>La sesión se mantiene aunque cierres el overlay o reinicies la aplicación. Se comparte entre todas las listas que contengan el mismo sitio.\u003c/p>","image":null},{"heading":"3. Elimina las cookies de un sitio","html":"\u003cp>Las cookies son datos que el sitio guarda para recordarte, incluida la sesión. Puedes eliminarlas para \u003cstrong>cerrar sesión\u003c/strong>, por ejemplo si quieres usar otra cuenta, o cuando \u003cstrong>un sitio deja de funcionar bien\u003c/strong>.\u003c/p>\u003cp>En la pestaña del sitio, pulsa \u003cstrong>…\u003c/strong> (\u003cem>Más acciones\u003c/em>) a la derecha de la dirección y elige \u003cstrong>Eliminar las cookies de forum.example\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/04-menu.png","alt":"Menú Más acciones con la opción Eliminar las cookies de forum.example"}},{"heading":"3. Elimina las cookies de un sitio","html":"\u003cp>Cuando el overlay pida confirmación, pulsa \u003cstrong>Eliminar\u003c/strong>. Se eliminan las cookies del sitio y sus subdominios. Los demás sitios conservan las suyas.\u003c/p>","image":{"src":"img/signing-in/05-confirm.png","alt":"Confirmación para eliminar las cookies de forum.example y de sus subdominios"}},{"heading":"4. La página se vuelve a cargar","html":"\u003cp>Al eliminar las cookies, la página se recarga. La sesión se ha cerrado y el sitio vuelve a ofrecerte \u003cstrong>iniciar sesión\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/06-signed-out.png","alt":"Foro recargado tras eliminar las cookies, con la sesión cerrada"}}]},{"id":"links-and-menu","title":"Enlaces, pestañas nuevas y menú contextual","intro":"En un navegador muchos enlaces se abren en una pestaña nueva. En el overlay, las pestañas corresponden a los sitios de la lista. Estos enlaces se abren en la pestaña del sitio de origen o, tras una confirmación, en una nueva. Con el botón derecho puedes abrir un enlace en otra pestaña o copiar enlaces, imágenes y texto.","slides":[{"heading":null,"html":"\u003cp>En un navegador muchos enlaces se abren en una pestaña nueva. En el overlay, las pestañas corresponden a los sitios de la lista. Estos enlaces se abren en la pestaña del sitio de origen o, tras una confirmación, en una nueva. Con el botón derecho puedes abrir un enlace en otra pestaña o copiar enlaces, imágenes y texto.\u003c/p>\u003cp>La lista de \u003cstrong>Tiny Glade\u003c/strong> incluye un foro, un \u003cstrong>sitio de ejemplo\u003c/strong> creado para esta guía. Consulta \u003ca href=\"#signing-in\">Iniciar sesión en un sitio y eliminar sus cookies\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Un enlace que el sitio abre en otra pestaña","html":"\u003cp>Algunos enlaces se crean para abrirse en una pestaña nueva, como el de este debate. Lo mismo ocurre al pulsar un enlace con Ctrl o con el botón central del ratón.\u003c/p>","image":{"src":"img/links-and-menu/01-link.png","alt":"Foro de ejemplo con el enlace a un debate"}},{"heading":"2. El mismo sitio se abre en su pestaña","html":"\u003cp>Si el enlace lleva al mismo sitio, se abre en la \u003cstrong>pestaña del sitio\u003c/strong> \u003cspan class=\"num\">1\u003c/span> en lugar de la página anterior. Ahora la \u003cstrong>dirección\u003c/strong> \u003cspan class=\"num\">2\u003c/span> es la del debate. \u003cstrong>Atrás\u003c/strong> recupera la página anterior.\u003c/p>","image":{"src":"img/links-and-menu/02-same-tab.png","alt":"Debate abierto en la pestaña del foro"}},{"heading":"2. El mismo sitio se abre en su pestaña","html":"\u003cp>Si hay varias pestañas del mismo sitio en la lista, el enlace se abre en la pestaña de origen.\u003c/p>","image":null},{"heading":"3. Otro sitio requiere confirmación","html":"\u003cp>Si el enlace lleva a un sitio que no tiene pestaña, como las guías de la comunidad en Steam, el overlay pregunta si quieres añadirlo a la lista. \u003cstrong>Añadir\u003c/strong> agrega el sitio y lo abre. \u003cstrong>Cancelar\u003c/strong> te deja en la página actual.\u003c/p>","image":{"src":"img/links-and-menu/03-other-site.png","alt":"Pregunta para añadir a la lista el sitio que la página quiere abrir en otra pestaña"}},{"heading":"3. Otro sitio requiere confirmación","html":"\u003cp>Los enlaces abiertos desde \u003cstrong>Navegar\u003c/strong> se quedan en esa pestaña. Consulta \u003ca href=\"#free-browsing\">Navegación libre\u003c/a>.\u003c/p>","image":null},{"heading":"4. Botón derecho sobre un enlace","html":"\u003cp>Al hacer clic con el botón derecho en un enlace, el menú muestra \u003cstrong>Abrir enlace en una pestaña nueva\u003c/strong> \u003cspan class=\"num\">1\u003c/span> y \u003cstrong>Copiar enlace\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, que copia su dirección.\u003c/p>","image":{"src":"img/links-and-menu/04-link-menu.png","alt":"Menú contextual de un enlace con las opciones para abrirlo y copiarlo"}},{"heading":"4. Botón derecho sobre un enlace","html":"\u003cp>\u003cstrong>Abrir enlace en una pestaña nueva\u003c/strong> pide confirmación antes de añadirlo a la lista. Pulsa \u003cstrong>Añadir\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/05-confirm-tab.png","alt":"Confirmación para añadir el enlace como pestaña nueva de la lista de Tiny Glade"}},{"heading":"4. Botón derecho sobre un enlace","html":"\u003cp>El enlace se abre en una \u003cstrong>pestaña nueva\u003c/strong>, justo después de la pestaña de origen. Si ya hay una pestaña con esa dirección en la lista, el overlay la muestra.\u003c/p>","image":{"src":"img/links-and-menu/06-new-tab.png","alt":"Debate abierto en la pestaña nueva, justo después de la del foro"}},{"heading":"5. Botón derecho sobre imágenes y texto","html":"\u003cp>Sobre una imagen aparece \u003cstrong>Copiar imagen\u003c/strong> para pegarla, por ejemplo, en un chat. Sobre el texto de una página aparecen \u003cstrong>Copiar\u003c/strong>, para el texto seleccionado, y \u003cstrong>Seleccionar todo\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/07-image-menu.png","alt":"Menú contextual de una imagen con la opción Copiar imagen"}},{"heading":"5. Botón derecho sobre imágenes y texto","html":"\u003cp>En campos de texto, como el de respuesta del foro o el de dirección, aparecen \u003cstrong>Deshacer\u003c/strong>, \u003cstrong>Rehacer\u003c/strong>, \u003cstrong>Cortar\u003c/strong>, \u003cstrong>Copiar\u003c/strong>, \u003cstrong>Pegar\u003c/strong> y \u003cstrong>Seleccionar todo\u003c/strong>. Las opciones que no se pueden usar en ese momento aparecen atenuadas, como \u003cem>Copiar\u003c/em> si no hay texto seleccionado.\u003c/p>","image":{"src":"img/links-and-menu/08-field-menu.png","alt":"Menú contextual en un campo de texto"}}]},{"id":"troubleshooting","title":"Solución de problemas","intro":"Aquí verás cómo resolver problemas habituales y recopilar información para comunicarlos. Consulta el README para los detalles de Windows, Linux y macOS.","slides":[{"heading":null,"html":"\u003cp>Aquí verás cómo resolver problemas habituales y recopilar información para comunicarlos. Consulta el \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a> para los detalles de Windows, Linux y macOS.\u003c/p>","image":null,"intro":true},{"heading":"1. La combinación de teclas no funciona","html":"\u003cul>\u003cli>\u003cstrong>Ya la usa otro programa.\u003c/strong> Si la eliges en Ajustes, el overlay indica «combinación no válida o ya en uso» y conserva la anterior. Elige otra. Consulta \u003ca href=\"#customizing\">Personaliza el overlay\u003c/a>.\u003c/li>\u003cli>\u003cstrong>El juego la usa para un comando.\u003c/strong> La combinación también llega al juego. Elige una que no ejecute nada en él.\u003c/li>\u003cli>\u003cstrong>Linux con Wayland.\u003c/strong> La combinación no se detecta si hay una ventana nativa de Wayland activa. Usa una sesión X11. Consulta \u003cem>Linux\u003c/em> en el \u003ca href=\"../../README.md#linux\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Teclas de función en macOS.\u003c/strong> Por defecto, F1 a F12 controlan el brillo, el volumen y otros ajustes. Púlsalas junto con \u003cstrong>fn\u003c/strong> o cambia los ajustes del teclado. Consulta \u003cem>macOS\u003c/em> en el \u003ca href=\"../../README.md#macos\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003c/ul>\u003cp>También puedes mostrar el overlay desde el icono del área de notificación.\u003c/p>","image":null},{"heading":"2. No encuentro el icono","html":"\u003cp>La aplicación está en el área de notificación, cerca del reloj. No aparece en la barra de tareas ni en Alt+Tab.\u003c/p>\u003cul>\u003cli>\u003cstrong>Windows\u003c/strong>. Si no ves el icono, pulsa \u003cstrong>^\u003c/strong> y arrástralo a la barra de tareas para que quede visible.\u003c/li>\u003cli>\u003cstrong>Linux con GNOME\u003c/strong>. Necesitas la extensión \u003cem>AppIndicator and KStatusNotifierItem Support\u003c/em>. Si al hacer clic en el icono se abre el menú, elige \u003cem>Mostrar\u003c/em>.\u003c/li>\u003cli>\u003cstrong>macOS\u003c/strong>. El icono está arriba a la derecha, en la barra de menús.\u003c/li>\u003c/ul>","image":null},{"heading":"3. El overlay no aparece sobre el juego o es opaco","html":"\u003cul>\u003cli>\u003cstrong>El juego tapa el overlay.\u003c/strong> Algunos juegos a pantalla completa exclusiva cubren todas las ventanas. Cambia a modo \u003cem>ventana sin bordes\u003c/em>.\u003c/li>\u003cli>\u003cstrong>La ventana es opaca en Linux.\u003c/strong> La transparencia requiere un gestor de ventanas con composición activa, como Cinnamon, KDE, GNOME o Xfce con composición activada.\u003c/li>\u003c/ul>","image":null},{"heading":"4. Un sitio falla o una página se vuelve a cargar","html":"\u003cul>\u003cli>\u003cstrong>Un sitio deja de funcionar bien o quieres cerrar sesión.\u003c/strong> Borra sus cookies desde el menú \u003cstrong>…\u003c/strong>. Consulta \u003ca href=\"#signing-in\">Iniciar sesión en un sitio y eliminar sus cookies\u003c/a>.\u003c/li>\u003cli>\u003cstrong>La página se recarga al volver a su pestaña.\u003c/strong> Las páginas que no usas se cierran al cabo de un tiempo para liberar memoria. Consulta \u003ca href=\"#memory\">Memoria y páginas cerradas\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Quieres empezar de cero.\u003c/strong> Sal de la aplicación y borra el archivo de preferencias. Consulta \u003cem>Preferences and uninstalling\u003c/em> en el \u003ca href=\"../../README.md#preferences-and-uninstalling\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003c/ul>","image":null},{"heading":"5. Recopila información para informar de un problema","html":"\u003cp>Si el problema persiste, puedes comunicarlo en la \u003ca href=\"https://github.com/siculo/overlay-browser/issues\" target=\"_blank\" rel=\"noopener\">página de incidencias del proyecto\u003c/a>. El archivo de registro ayuda a entender qué ocurrió.\u003c/p>\u003cp>Abre \u003cem>Diagnóstico\u003c/em> en \u003cstrong>Ajustes\u003c/strong>.\u003c/p>\u003cul>\u003cli>\u003cstrong>Registro detallado\u003c/strong> \u003cspan class=\"num\">1\u003c/span> guarda habitualmente los errores y cierres inesperados con los ajustes actuales. Al activarlo, también registra las acciones en la aplicación (pestañas, sitios, listas y ajustes) y lo que le ocurre al overlay (visibilidad, foco, combinación de teclas y aplicación en primer plano). Actívalo y repite lo que provoca el problema.\u003c/li>\u003cli>\u003cstrong>Mostrar el archivo de registro\u003c/strong> \u003cspan class=\"num\">2\u003c/span> abre la carpeta que contiene \u003ccode>overlay.log\u003c/code> para que puedas adjuntarlo al informe.\u003c/li>\u003cli>\u003cstrong>Vaciar el registro\u003c/strong> \u003cspan class=\"num\">3\u003c/span> borra su contenido, por ejemplo para registrar únicamente el problema que quieres comunicar.\u003c/li>\u003c/ul>","image":{"src":"img/troubleshooting/01-diagnostics.png","alt":"Sección Diagnóstico de Ajustes"}},{"heading":"5. Recopila información para informar de un problema","html":"\u003cp>El registro no guarda las teclas que pulsas ni tu navegación, incluidas direcciones y títulos de páginas. Solo identifica los sitios por su posición en la lista.\u003c/p>\u003cp>\u003cstrong>Vaciar el registro\u003c/strong> te pide confirmación antes de borrar el contenido.\u003c/p>","image":{"src":"img/troubleshooting/02-empty-log.png","alt":"Confirmación para vaciar el archivo de registro"}}]}],"strings":{"docTitle":"Overlay Browser · Guía","subtitle":"Guía de uso, paso a paso","legend":"En las capturas de pantalla, los elementos citados en el texto están resaltados con un recuadro rojo \u003cspan class=\"box\">\u003c/span>; los números como \u003cspan class=\"num\">1\u003c/span> en el texto indican el elemento con el mismo número en la captura.","menu":"Guías","menuTitle":"Volver a la lista de guías (Esc)","prev":"Atrás","prevTitle":"Diapositiva anterior (←)","next":"Siguiente","nextTitle":"Diapositiva siguiente (→)","prevGuide":"Guía anterior","nextGuide":"Siguiente guía: {title}","backToGuides":"Volver a las guías","guideOf":"Guía {n} de {total}","step":"Paso {n}","slideOne":"1 diapositiva","slideOther":"{count} diapositivas"}};
const S = DATA.strings;   // testi della pagina nella lingua delle guide
const $ = (id) => document.getElementById(id);
const guides = DATA.guides;
const plural = (n) => (n === 1 ? S.slideOne : S.slideOther.replace('{count}', n));

// ---------- menu ----------
$('guides').replaceChildren(...guides.map((g, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${g.id}"><span class="n">${i + 1}</span><h2></h2><p>${g.intro}</p><span class="count">${plural(g.slides.length)}</span></a>`;
  li.querySelector('h2').textContent = g.title;
  return li;
}));

// ---------- slide ----------
// Indirizzo: #<guida>/<numero> (da 1); #<guida> = prima slide; vuoto = menu.
let current = null, index = 0;

function route() {
  const [id, n] = decodeURIComponent(location.hash.slice(1)).split('/');
  const g = guides.find((x) => x.id === id);
  closeZoom();
  if (!g) { showMenu(); return; }
  const i = Math.min(Math.max((Number(n) || 1) - 1, 0), g.slides.length - 1);
  const dir = g === current ? Math.sign(i - index) : 0;
  current = g;
  index = i;
  renderSlide(dir);
}

function showMenu() {
  current = null;
  $('deck').hidden = true;
  $('menu').hidden = false;
  document.title = S.docTitle;
}

const go = (i) => { location.hash = `${current.id}/${i + 1}`; };

function renderSlide(dir) {
  const g = current, s = g.slides[index];
  const gi = guides.indexOf(g), nextGuide = guides[gi + 1];
  $('menu').hidden = true;
  $('deck').hidden = false;
  document.title = `${g.title} · Overlay Browser`;
  $('guide-title').textContent = g.title;
  $('pos').textContent = `${index + 1} / ${g.slides.length}`;

  const el = $('slide');
  el.className = s.image ? 'with-image' : 'text-only';
  if (s.intro) el.classList.add('intro');
  const text = document.createElement('div');
  text.className = 'text';
  if (s.intro) {
    text.innerHTML = `<p class="section">${S.guideOf.replace('{n}', gi + 1).replace('{total}', guides.length)}</p><h2></h2>${s.html}`;
    text.querySelector('h2').textContent = g.title;
  } else {
    text.innerHTML = `<p class="section"></p><h2></h2>${s.html}`;
    const m = s.heading.match(/^(\d+)\.\s+(.*)$/);
    text.querySelector('.section').textContent = m ? S.step.replace('{n}', m[1]) : '';
    text.querySelector('h2').textContent = m ? m[2] : s.heading;
  }
  const parts = [text];
  if (s.image) {
    const fig = document.createElement('figure');
    fig.innerHTML = '<img><figcaption></figcaption>';
    fig.querySelector('img').src = s.image.src;
    fig.querySelector('img').alt = s.image.alt;
    fig.querySelector('figcaption').textContent = s.image.alt;
    fig.querySelector('img').onclick = () => openZoom(s.image);
    parts.push(fig);
  }
  el.replaceChildren(...parts);
  el.scrollTop = 0;
  el.classList.remove('enter');
  el.style.setProperty('--from', `${dir * 16}px`);
  if (dir) { void el.offsetWidth; el.classList.add('enter'); }

  $('dots').replaceChildren(...g.slides.map((x, i) => {
    const b = document.createElement('button');
    b.title = x.intro ? g.title : x.heading;
    b.setAttribute('aria-current', String(i === index));
    b.onclick = () => go(i);
    return b;
  }));
  $('prev').disabled = index === 0 && gi === 0;
  $('prev').textContent = index === 0 && gi > 0 ? `← ${S.prevGuide}` : `← ${S.prev}`;
  const last = index === g.slides.length - 1;
  $('next').textContent = !last ? `${S.next} →` : nextGuide ? `${S.nextGuide.replace('{title}', nextGuide.title)} →` : S.backToGuides;
}

function next() {
  if (index < current.slides.length - 1) return go(index + 1);
  const g = guides[guides.indexOf(current) + 1];
  location.hash = g ? g.id : '';
}
function prev() {
  if (index > 0) return go(index - 1);
  const g = guides[guides.indexOf(current) - 1];
  if (g) location.hash = `${g.id}/${g.slides.length}`;
}
$('next').onclick = next;
$('prev').onclick = prev;

// ---------- immagine a tutto schermo ----------
function openZoom(image) {
  $('zoom').querySelector('img').src = image.src;
  $('zoom').querySelector('img').alt = image.alt;
  $('zoom').hidden = false;
}
function closeZoom() { $('zoom').hidden = true; }
$('zoom').onclick = closeZoom;

// ---------- tastiera ----------
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!$('zoom').hidden) { if (e.key === 'Escape') closeZoom(); return; }
  if (!current) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) next();
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) prev();
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(current.slides.length - 1);
  else if (e.key === 'Escape') location.hash = '';
  else return;
  e.preventDefault();
});

window.addEventListener('hashchange', route);
route();
</script>
</body>
