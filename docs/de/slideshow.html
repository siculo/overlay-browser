<!doctype html>
<!-- Modello della presentazione: build.js sostituisce i testi (segnaposti tra doppie graffe, da
     STRINGS in build.js) e i dati e scrive docs/<lingua>/<file>.html. Non
     modificare la pagina generata. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Browser · Anleitung</title>
<link rel="icon" href="../../assets/icon.png">
<style>
  :root {
    --bg: #141414; --sheet: #1b1b1b; --line: #2c2c2c; --text: #e8e8e8; --muted: #9a9a9a;
    --accent: #f0a030; --accent-text: #f5b750; --on-accent: #111; --mark: #e5262b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, sans-serif; }
  a { color: var(--accent-text); }
  code { font-family: ui-monospace, monospace; font-size: .9em; padding: 1px 5px; border-radius: 4px; background: #262626; }
  strong { color: #fff; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Numeri come nelle schermate: bianco su cerchio rosso. */
  .num { display: inline-flex; align-items: center; justify-content: center; width: 1.45em; height: 1.45em;
         margin: 0 .1em; border-radius: 50%; background: var(--mark); color: #fff; border: 2px solid #fff;
         font-size: .72em; font-weight: 700; line-height: 1; vertical-align: .12em; }

  /* ---------- menu ---------- */
  #menu { max-width: 1100px; margin: 0 auto; padding: 48px 32px 64px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { height: 56px; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; color: var(--muted); }
  .legend { margin: 28px 0 32px; padding: 12px 16px; border-left: 3px solid var(--mark); background: var(--sheet);
            color: #cfcfcf; border-radius: 0 6px 6px 0; }
  .legend .box { display: inline-block; width: 1.3em; height: .9em; border: 2px solid var(--mark); border-radius: 4px; vertical-align: -.05em; }
  #guides { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
            list-style: none; margin: 0; padding: 0; counter-reset: guide; }
  #guides a { display: flex; flex-direction: column; height: 100%; padding: 18px 20px; border: 1px solid var(--line);
              border-radius: 10px; background: var(--sheet); color: inherit; text-decoration: none;
              transition: border-color .15s, transform .15s; }
  #guides a:hover, #guides a:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  #guides .n { color: var(--accent-text); font-weight: 700; font-size: 14px; }
  #guides h2 { margin: 4px 0 8px; font-size: 19px; font-weight: 600; line-height: 1.3; }
  #guides p { margin: 0 0 14px; color: #bdbdbd; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #guides .count { margin-top: auto; }
  #guides .count { color: var(--muted); font-size: 13px; }

  /* ---------- slide ---------- */
  #deck { display: flex; flex-direction: column; height: 100%; }
  #deck header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: #0e0e0e; }
  #deck header .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid #3a3a3a;
         border-radius: 6px; background: #232323; text-decoration: none; color: var(--text); white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  #slide { flex: 1; min-height: 0; padding: 28px 36px; overflow: auto; }
  #slide.with-image { display: grid; grid-template-columns: minmax(300px, 36%) 1fr; gap: 36px; align-items: center; }
  #slide.text-only { display: flex; align-items: center; justify-content: center; }
  #slide .text { max-height: 100%; overflow: auto; }
  #slide.text-only .text { max-width: 760px; font-size: 19px; }
  #slide .section { margin: 0 0 4px; color: var(--accent-text); font-size: 14px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  #slide h2 { margin: 0 0 14px; font-size: 26px; font-weight: 600; line-height: 1.25; }
  #slide.intro h2 { font-size: 34px; }
  #slide p { margin: 0 0 12px; }
  #slide ul { margin: 0 0 12px; padding-left: 1.2em; }
  #slide li { margin-bottom: 8px; }
  #slide blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--sheet); border-radius: 0 6px 6px 0; color: #d4d4d4; }
  #slide figure { margin: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  #slide figure img { display: block; max-width: 100%; max-height: calc(100% - 2.2em); margin: 0 auto; object-fit: contain;
                      border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); cursor: zoom-in; }
  #slide figcaption { margin-top: 10px; text-align: center; color: var(--muted); font-size: 14px; }
  #deck footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); background: #0e0e0e; }
  #dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; background: #444; }
  #dots button[aria-current="true"] { background: var(--accent); }
  #pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  #slide.enter { animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateX(var(--from, 16px)); } }

  /* Immagine a tutto schermo */
  #zoom { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
          padding: 24px; background: rgba(0, 0, 0, .88); cursor: zoom-out; }
  #zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  @media (max-width: 820px) {
    #slide.with-image { grid-template-columns: 1fr; align-items: start; }
    #slide figure { height: auto; }
    #slide figure img { max-height: none; }
    #dots { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #slide.enter { animation: none; } #guides a { transition: none; } }
</style>
</head>

    </div>
  </div>
  <p class="legend">In den Screenshots sind die im Text genannten Elemente rot umrahmt <span class="box"></span>; Nummern wie <span class="num">1</span> im Text verweisen auf das Element mit derselben Nummer im Screenshot.</p>
  <ol id="guides"></ol>
</main>

    <a class="btn" href="#" title="Zurück zur Liste der Anleitungen (Esc)">☰ Anleitungen</a>

<script>
const DATA = {"guides":[{"id":"getting-started","title":"Erste Schritte – die Websites zu deinem Spiel griffbereit","intro":"In dieser Anleitung öffnest du Overlay Browser beim Spielen von \u003cstrong>Tiny Glade\u003c/strong>, fügst zwei nützliche Websites hinzu und lernst, sie einzublenden und auszublenden, ohne das Spiel zu verlassen.","slides":[{"heading":null,"html":"\u003cp>In dieser Anleitung öffnest du Overlay Browser beim Spielen von \u003cstrong>Tiny Glade\u003c/strong>, fügst zwei nützliche Websites hinzu und lernst, sie einzublenden und auszublenden, ohne das Spiel zu verlassen.\u003c/p>","image":null,"intro":true},{"heading":"1. App starten","html":"\u003cp>Starte Overlay Browser. Das Fenster \u003cstrong>bleibt ausgeblendet\u003c/strong>. Die App wartet im Infobereich neben der Uhr. In der Taskleiste und unter Alt+Tab erscheint sie nicht.\u003c/p>\u003cp>Starte dann das Spiel im Fenster oder im randlosen Fenstermodus.\u003c/p>","image":null},{"heading":"2. Overlay über dem Spiel öffnen","html":"\u003cp>Drücke im Spiel \u003cstrong>Win+F10\u003c/strong> (Super+F10 unter Linux, Cmd+Shift+Leertaste unter macOS). Das Overlay erscheint über dem Spiel und öffnet die \u003cstrong>Startseite\u003c/strong>.\u003c/p>\u003cp>Das Overlay hat das Spiel erkannt. Oben steht die Liste \u003cstrong>Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span>. Sie ist \u003cem>aktiv\u003c/em> und noch \u003cem>neu\u003c/em>. Jedes Spiel hat eine eigene Liste, die beim Hinzufügen der ersten Website angelegt wird. Unter \u003cem>Andere Listen\u003c/em> findest du \u003cstrong>Allgemein\u003c/strong> \u003cspan class=\"num\">2\u003c/span>. Diese Liste ist aktiv, wenn kein Spiel geöffnet ist. Mit \u003cstrong>Verwenden\u003c/strong> wählst du sie manuell aus.\u003c/p>","image":{"src":"img/getting-started/01-empty-home.png","alt":"Die Startseite über Tiny Glade mit der noch leeren Liste des Spiels"}},{"heading":"3. Website hinzufügen","html":"\u003cp>Klicke oben auf \u003cstrong>+\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, gib die \u003cstrong>Adresse\u003c/strong> \u003cspan class=\"num\">2\u003c/span> ein (es genügt \u003ccode>tinyglade.com\u003c/code>) und klicke auf \u003cstrong>Hinzufügen\u003c/strong> \u003cspan class=\"num\">3\u003c/span>.\u003c/p>","image":{"src":"img/getting-started/02-add-site.png","alt":"Das Fenster zum Hinzufügen einer Website mit der Adresse tinyglade.com"}},{"heading":"3. Website hinzufügen","html":"\u003cp>Die Website öffnet sich sofort in ihrem \u003cstrong>Tab\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, der den Seitentitel übernimmt. Das \u003cstrong>×\u003c/strong> schließt ihn. Darunter findest du die Navigationsleiste wie in einem Browser. Mit \u003cstrong>Zurück\u003c/strong>, \u003cstrong>Vorwärts\u003c/strong> und \u003cstrong>Neu laden\u003c/strong> \u003cspan class=\"num\">2\u003c/span> steuerst du die Seite. In das \u003cstrong>Adressfeld\u003c/strong> \u003cspan class=\"num\">3\u003c/span> kannst du eine andere Adresse eingeben und Enter drücken. Mit \u003cstrong>Anheften\u003c/strong> \u003cspan class=\"num\">4\u003c/span> machst du aus der gerade besuchten Seite einen neuen Tab.\u003c/p>","image":{"src":"img/getting-started/03-site-open.png","alt":"Die offizielle Website von Tiny Glade in ihrem Tab"}},{"heading":"4. Weitere Websites auf der Startseite hinzufügen","html":"\u003cp>Auf der \u003cstrong>Startseite\u003c/strong> siehst du die Websites der Liste. Klicke auf einen \u003cstrong>Namen\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, um die Website zu öffnen. \u003cstrong>Bearbeiten\u003c/strong> \u003cspan class=\"num\">2\u003c/span> ändert die Adresse (Enter speichert, Esc bricht ab). \u003cstrong>Entfernen\u003c/strong> \u003cspan class=\"num\">3\u003c/span> nimmt die Website aus der Liste. Gib eine weitere Adresse in das \u003cstrong>Feld unter der Liste\u003c/strong> \u003cspan class=\"num\">4\u003c/span> ein und klicke auf \u003cem>Hinzufügen\u003c/em>. Hier haben wir die Steam-Seite des Spiels hinzugefügt.\u003c/p>","image":{"src":"img/getting-started/04-home-with-sites.png","alt":"Die Startseite mit zwei Websites in der Liste für Tiny Glade"}},{"heading":"5. Zwischen Websites wechseln","html":"\u003cp>Jede Website hat einen eigenen Tab. Hier siehst du die \u003cstrong>offizielle Website\u003c/strong> \u003cspan class=\"num\">1\u003c/span> und die gerade geöffnete \u003cstrong>Steam-Seite\u003c/strong> \u003cspan class=\"num\">2\u003c/span>. Wenn du zu einem Tab zurückkehrst, findest du die Seite dort wieder, wo du sie verlassen hast.\u003c/p>","image":{"src":"img/getting-started/05-two-tabs.png","alt":"Die Steam-Seite von Tiny Glade im zweiten Tab"}},{"heading":"6. Zurück zum Spiel","html":"\u003cp>Drücke erneut \u003cstrong>Win+F10\u003c/strong>, um das Overlay auszublenden, oder klicke auf das Spielfenster. Standardmäßig blendet sich das Overlay aus, wenn es den Fokus verliert. Das kannst du in den Einstellungen abschalten.\u003c/p>\u003cp>Beim nächsten Öffnen über Tiny Glade erscheint dessen Liste mit dem zuletzt verwendeten Tab. Über einem anderen Spiel siehst du dessen Liste.\u003c/p>","image":null}]},{"id":"free-browsing","title":"Freies Surfen – suchen, finden, anheften","intro":"Im Tab \u003cstrong>Surfen\u003c/strong> kannst du beliebige Seiten suchen und öffnen. Möchtest du eine Seite behalten, macht \u003cstrong>Anheften\u003c/strong> daraus einen Tab in der Liste des Spiels.","slides":[{"heading":null,"html":"\u003cp>Im Tab \u003cstrong>Surfen\u003c/strong> kannst du beliebige Seiten suchen und öffnen. Möchtest du eine Seite behalten, macht \u003cstrong>Anheften\u003c/strong> daraus einen Tab in der Liste des Spiels.\u003c/p>\u003cp>Hier geht das Beispiel aus \u003ca href=\"#getting-started\">Erste Schritte\u003c/a> weiter. Das Overlay ist über \u003cstrong>Tiny Glade\u003c/strong> geöffnet. Die Liste enthält bereits zwei Websites. Jetzt suchen wir ein Wiki zum Spiel.\u003c/p>","image":null,"intro":true},{"heading":"1. Tab Surfen öffnen","html":"\u003cp>Klicke gleich neben der Startseite auf \u003cstrong>Surfen\u003c/strong> \u003cspan class=\"num\">1\u003c/span>. Gib im \u003cstrong>Adressfeld\u003c/strong> \u003cspan class=\"num\">2\u003c/span> eine Adresse (etwa \u003ccode>example.com\u003c/code>) oder einen Suchbegriff ein. Als Beispiel schlägt das Overlay den \u003cstrong>Namen des Spiels\u003c/strong> \u003cspan class=\"num\">3\u003c/span> vor. Klicke darauf, um danach zu suchen.\u003c/p>","image":{"src":"img/free-browsing/01-browse.png","alt":"Der leere Tab Surfen mit Adressfeld und der Beispielsuche „Tiny Glade“"}},{"heading":"2. Suchen","html":"\u003cp>Gib \u003ccode>tiny glade wiki\u003c/code> ein und drücke Enter. Die Ergebnisse öffnen sich im Tab. Das \u003cstrong>Adressfeld\u003c/strong> \u003cspan class=\"num\">1\u003c/span> zeigt die Adresse der Ergebnisseite.\u003c/p>\u003cp>Die Suchmaschine wählst du in den Einstellungen unter \u003cem>Verhalten\u003c/em>. Zur Auswahl stehen Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage und eine benutzerdefinierte Adresse. Hier verwenden wir DuckDuckGo.\u003c/p>\u003cp>Klicke auf das gewünschte Ergebnis, hier \u003cstrong>Tiny Glade Wiki\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/02-results.png","alt":"Die Suchergebnisse für „tiny glade wiki“ mit dem Link zum Wiki"}},{"heading":"3. Seite anheften","html":"\u003cp>Die Seite öffnet sich im Tab Surfen und funktioniert wie im Browser. Mit \u003cstrong>Zurück\u003c/strong> \u003cspan class=\"num\">1\u003c/span> gelangst du zu den Suchergebnissen. Klicke auf \u003cstrong>Anheften\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, um die Seite zu behalten.\u003c/p>","image":{"src":"img/free-browsing/03-page-found.png","alt":"Das Tiny Glade Wiki im Tab Surfen"}},{"heading":"3. Seite anheften","html":"\u003cp>Bestätige mit \u003cstrong>Anheften\u003c/strong>.\u003c/p>","image":{"src":"img/free-browsing/04-confirm.png","alt":"Die Bestätigung zum Anheften des Tiny Glade Wiki als neuer Tab der Liste Tiny Glade"}},{"heading":"4. Die Seite wird zum Tab der Liste","html":"\u003cp>Die Seite wird mit ihrem Verlauf zum \u003cstrong>neuen Tab\u003c/strong> \u003cspan class=\"num\">1\u003c/span> am Ende der Liste von Tiny Glade. Wenn du das Overlay über dem Spiel öffnest, findest du sie dort. \u003cstrong>Anheften\u003c/strong> \u003cspan class=\"num\">2\u003c/span> ist jetzt deaktiviert, da die Seite bereits in der Liste steht.\u003c/p>","image":{"src":"img/free-browsing/05-pinned.png","alt":"Das Tiny Glade Wiki im neuen Tab mit deaktivierter Schaltfläche Anheften"}},{"heading":"4. Die Seite wird zum Tab der Liste","html":"\u003cp>Du kannst auch in einem Website-Tab eine Seite anheften. Der neue Tab erscheint direkt hinter dem ursprünglichen Tab. Ist die Seite bereits als Tab vorhanden, wird dieser hervorgehoben und Anheften ist deaktiviert.\u003c/p>","image":null},{"heading":"5. Der Tab Surfen ist wieder frei","html":"\u003cp>Wenn du zu \u003cstrong>Surfen\u003c/strong> zurückkehrst, ist der Tab bereit für eine neue Suche. Die angeheftete Seite hat jetzt einen eigenen Tab. Beim Surfen schließt \u003cstrong>Zurück zur Startseite\u003c/strong> \u003cspan class=\"num\">1\u003c/span> die offene Seite und zeigt wieder die leere Ansicht.\u003c/p>","image":{"src":"img/free-browsing/06-browse-again.png","alt":"Der Tab Surfen ist wieder leer"}},{"heading":"5. Der Tab Surfen ist wieder frei","html":"\u003cp>In den Einstellungen unter \u003cem>Verhalten\u003c/em> kannst du eine \u003cstrong>Startseite für freies Surfen\u003c/strong> festlegen, die anstelle der leeren Ansicht erscheint.\u003c/p>","image":null},{"heading":"Adressen anderer Websites in Website-Tabs eingeben","html":"\u003cp>Auch in Website-Tabs kannst du das Adressfeld bearbeiten. Adressen derselben Website öffnen sich im aktuellen Tab. Eine andere Website oder eine Suche öffnet sich nach Bestätigung im Tab Surfen. Der ursprüngliche Tab behält seine Seite.\u003c/p>","image":null}]},{"id":"lists-per-game","title":"Eine Liste pro Spiel","intro":"Overlay Browser erkennt, über welchem Spiel du es öffnest, und zeigt die zugehörigen Websites. Jedes Spiel hat seine eigene \u003cstrong>Liste\u003c/strong>. Nach Erste Schritte und Freies Surfen hat die Liste für \u003cstrong>Tiny Glade\u003c/strong> bereits drei Websites. Jetzt spielen wir \u003cstrong>Brotato\u003c/strong>.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser erkennt, über welchem Spiel du es öffnest, und zeigt die zugehörigen Websites. Jedes Spiel hat seine eigene \u003cstrong>Liste\u003c/strong>. Nach \u003ca href=\"#getting-started\">Erste Schritte\u003c/a> und \u003ca href=\"#free-browsing\">Freies Surfen\u003c/a> hat die Liste für \u003cstrong>Tiny Glade\u003c/strong> bereits drei Websites. Jetzt spielen wir \u003cstrong>Brotato\u003c/strong>.\u003c/p>","image":null,"intro":true},{"heading":"1. Ein neues Spiel, eine neue Liste","html":"\u003cp>Öffne das Overlay beim Spielen von Brotato. Oben auf der Startseite steht die \u003cstrong>Liste für Brotato\u003c/strong> \u003cspan class=\"num\">1\u003c/span>. Sie ist \u003cem>aktiv\u003c/em> und noch \u003cem>neu\u003c/em>. Neben dem Namen siehst du das erkannte Programm und die Zahl der Websites. Füge im \u003cstrong>Feld unter der Liste\u003c/strong> \u003cspan class=\"num\">2\u003c/span> oder über \u003cstrong>+\u003c/strong> eine Website hinzu. Dabei wird die Liste angelegt. Die \u003cstrong>Liste für Tiny Glade\u003c/strong> \u003cspan class=\"num\">3\u003c/span> ist unter \u003cem>Andere Listen\u003c/em> eingeklappt. Klicke darauf, um ihre Websites zu sehen.\u003c/p>","image":{"src":"img/lists-per-game/01-brotato-new.png","alt":"Die Startseite über Brotato mit seiner neuen Liste und Tiny Glade unter den anderen Listen"}},{"heading":"1. Ein neues Spiel, eine neue Liste","html":"\u003cp>Hier fügen wir das Wiki und die Steam-Seite von Brotato hinzu. In der Leiste erscheinen jetzt die beiden Tabs für Brotato.\u003c/p>","image":{"src":"img/lists-per-game/02-brotato-wiki.png","alt":"Die Tabs der Liste für Brotato"}},{"heading":"2. Jedes Spiel findet seine eigenen Websites","html":"\u003cp>Wechsle zu Tiny Glade zurück und öffne das Overlay. In der Leiste stehen die \u003cstrong>Tabs für Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span> und die \u003cstrong>Liste für Tiny Glade\u003c/strong> \u003cspan class=\"num\">2\u003c/span> ist aktiv. Die \u003cstrong>Liste für Brotato\u003c/strong> \u003cspan class=\"num\">3\u003c/span> steht jetzt unter \u003cem>Andere Listen\u003c/em>. Mit \u003cstrong>Verwenden\u003c/strong> \u003cspan class=\"num\">4\u003c/span> kannst du sie manuell aktivieren (siehe Schritt 4). Jede Liste öffnet sich wieder auf dem zuletzt verwendeten Tab.\u003c/p>","image":{"src":"img/lists-per-game/03-tiny-glade.png","alt":"Die Startseite über Tiny Glade mit seinen Tabs und Brotato unter den anderen Listen"}},{"heading":"3. Die Liste Allgemein","html":"\u003cp>Das Overlay bietet für jedes Programm eine Liste an. Erkennt es keine Anwendung, ist die \u003cstrong>Liste Allgemein\u003c/strong> aktiv. Hier passen Websites hinein, die zu keinem bestimmten Programm gehören. Die Liste funktioniert wie die anderen und lässt sich nicht entfernen.\u003c/p>","image":{"src":"img/lists-per-game/04-general.png","alt":"Die aktive Liste Allgemein bei nicht erkannter Anwendung"}},{"heading":"4. Liste manuell auswählen","html":"\u003cp>Du möchtest zum Beispiel das Wiki von Brotato lesen, während Tiny Glade geöffnet ist. Klicke neben der gewünschten Liste auf \u003cstrong>Verwenden\u003c/strong> (\u003cspan class=\"num\">4\u003c/span> im Screenshot von Schritt 2).\u003c/p>\u003cp>Die Liste wird aktiv und bleibt \u003cstrong>manuell gewählt\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, auch wenn du das Overlay über anderen Spielen öffnest. Mit \u003cstrong>Zurück zu Tiny Glade\u003c/strong> wechselst du zur Liste des gerade erkannten Spiels zurück. In der Leiste stehen die \u003cstrong>Tabs der gewählten Liste\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/lists-per-game/05-chosen-by-hand.png","alt":"Die manuell gewählte Liste für Brotato im Overlay über Tiny Glade"}},{"heading":"5. Tabs und Websites umsortieren","html":"\u003cp>Ziehe einen Tab an die gewünschte Stelle. Hier rückt das Tiny Glade Wiki an die erste Position.\u003c/p>","image":{"src":"img/lists-per-game/06-drag.png","alt":"Der Tab des Tiny Glade Wiki wird an die erste Position gezogen"}},{"heading":"5. Tabs und Websites umsortieren","html":"\u003cp>Die Websites auf der Startseite kannst du genauso verschieben. Beide Ansichten verwenden dieselbe Reihenfolge.\u003c/p>","image":null},{"heading":"6. Liste entfernen","html":"\u003cp>Mit \u003cstrong>Liste entfernen\u003c/strong> neben dem Listennamen löschst du die Liste samt Websites nach einer Bestätigung.\u003c/p>","image":{"src":"img/lists-per-game/07-remove-list.png","alt":"Die Bestätigung zum Entfernen der Liste Brotato und aller ihrer Websites"}},{"heading":"6. Liste entfernen","html":"\u003cp>Wenn du später beim Spielen von Brotato eine Website hinzufügst, wird die Liste neu angelegt.\u003c/p>","image":null}]},{"id":"bookmarks","title":"Lesezeichen importieren und exportieren","intro":"Sind die Websites zu deinen Spielen schon in deinem Browser gespeichert? Du kannst die Lesezeichen direkt in die Listen von Overlay Browser übernehmen und die Listen als Lesezeichendatei für andere Browser exportieren.","slides":[{"heading":null,"html":"\u003cp>Sind die Websites zu deinen Spielen schon in deinem Browser gespeichert? Du kannst die Lesezeichen direkt in die Listen von Overlay Browser übernehmen und die Listen als Lesezeichendatei für andere Browser exportieren.\u003c/p>\u003cp>Hier ist das Overlay über \u003cstrong>Brotato\u003c/strong> geöffnet. Diese Liste ist noch leer. Die Liste für \u003cstrong>Tiny Glade\u003c/strong> enthält bereits drei Websites. Siehe \u003ca href=\"#lists-per-game\">Eine Liste pro Spiel\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Lesezeichen auf der Startseite","html":"\u003cp>Unten auf der \u003cstrong>Startseite\u003c/strong> findest du den Abschnitt \u003cem>Lesezeichen\u003c/em> mit \u003cstrong>Lesezeichen importieren…\u003c/strong> \u003cspan class=\"num\">1\u003c/span> und \u003cstrong>Lesezeichen exportieren…\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/bookmarks/01-bookmarks-section.png","alt":"Der Abschnitt Lesezeichen am Ende der Startseite"}},{"heading":"2. Lesezeichen für den Import auswählen","html":"\u003cp>Klicke auf \u003cstrong>Lesezeichen importieren…\u003c/strong>. Im Fenster findest du diese Optionen.\u003c/p>\u003cul>\u003cli>\u003cstrong>Aus\u003c/strong> \u003cspan class=\"num\">1\u003c/span> wählt ein Browserprofil. Das Overlay erkennt Chrome, Edge, Brave, Opera, Vivaldi, Chromium, Firefox, LibreWolf und ähnliche Browser automatisch. Firefox kann geöffnet bleiben. Beim nächsten Import wird das zuletzt gewählte Profil angeboten.\u003c/li>\u003cli>\u003cstrong>Datei…\u003c/strong> \u003cspan class=\"num\">2\u003c/span> liest eine HTML-Datei, die du in der Lesezeichenverwaltung eines Browsers exportiert hast. Unter macOS erfolgt der Import über diesen Weg.\u003c/li>\u003cli>\u003cstrong>Lesezeichen durchsuchen…\u003c/strong> \u003cspan class=\"num\">3\u003c/span> findet Lesezeichen und Ordner nach Namen oder Adresse.\u003c/li>\u003cli>Mit den \u003cstrong>Kontrollkästchen\u003c/strong> \u003cspan class=\"num\">4\u003c/span> wählst du einzelne Lesezeichen oder ganze Ordner aus. \u003cem>Alle Lesezeichen\u003c/em> wählt alles aus. Hier markieren wir den Ordner \u003cem>Brotato\u003c/em>.\u003c/li>\u003cli>\u003cstrong>In die Liste\u003c/strong> \u003cspan class=\"num\">5\u003c/span> bestimmt die Zielliste. Anfangs ist die aktive Liste ausgewählt. Ist sie wie hier bei Brotato noch \u003cem>neu\u003c/em>, wird sie mit den importierten Websites angelegt.\u003c/li>\u003cli>Die Schaltfläche \u003cstrong>3 Websites hinzufügen\u003c/strong> \u003cspan class=\"num\">6\u003c/span> zeigt die Anzahl der Websites.\u003c/li>\u003c/ul>","image":{"src":"img/bookmarks/02-import.png","alt":"Das Importfenster mit dem ausgewählten Ordner Brotato"}},{"heading":"2. Lesezeichen für den Import auswählen","html":"\u003cp>Die Lesezeichen erscheinen mit ihren Namen als Websites in der Liste.\u003c/p>","image":{"src":"img/bookmarks/03-imported.png","alt":"Drei importierte Websites in der Liste für Brotato"}},{"heading":"3. Über „+“ importieren","html":"\u003cp>Öffne \u003cstrong>+\u003c/strong> in der Leiste und wähle \u003cstrong>Lesezeichen\u003c/strong> \u003cspan class=\"num\">1\u003c/span> neben \u003cem>Adresse\u003c/em>. Die Websites werden in die aktive Liste übernommen. Mit \u003cstrong>Lesezeichen durchsuchen…\u003c/strong> \u003cspan class=\"num\">2\u003c/span> findest du die gewünschten Einträge. Adressen, die \u003cstrong>bereits in der Liste\u003c/strong> \u003cspan class=\"num\">3\u003c/span> sind, sind ausgegraut und lassen sich nicht erneut auswählen. So entstehen keine Duplikate.\u003c/p>","image":{"src":"img/bookmarks/04-plus-bookmarks.png","alt":"Der Tab Lesezeichen im Dialog „+“ mit bereits vorhandenen, ausgegrauten Einträgen"}},{"heading":"4. Listen exportieren","html":"\u003cp>\u003cstrong>Lesezeichen exportieren…\u003c/strong> im Abschnitt \u003cem>Lesezeichen\u003c/em> der Startseite speichert die Websites in einer HTML-Datei, die Browser importieren können. Jede Liste wird zu einem Ordner. Anfangs sind \u003cstrong>Alle Lesezeichen\u003c/strong> \u003cspan class=\"num\">1\u003c/span> ausgewählt. In der \u003cstrong>Liste\u003c/strong> \u003cspan class=\"num\">2\u003c/span> kannst du Ordner oder Websites abwählen. Die Schaltfläche \u003cstrong>6 Websites exportieren\u003c/strong> \u003cspan class=\"num\">3\u003c/span> öffnet den Speicherdialog.\u003c/p>","image":{"src":"img/bookmarks/05-export.png","alt":"Das Exportfenster mit den Listen für Brotato und Tiny Glade"}}]},{"id":"customizing","title":"Overlay anpassen","intro":"In den \u003cstrong>Einstellungen\u003c/strong> legst du Tastenkombination, Verhalten, Darstellung und Sprache fest. Änderungen gelten sofort und werden gespeichert.","slides":[{"heading":null,"html":"\u003cp>In den \u003cstrong>Einstellungen\u003c/strong> legst du Tastenkombination, Verhalten, Darstellung und Sprache fest. Änderungen gelten sofort und werden gespeichert.\u003c/p>","image":null,"intro":true},{"heading":"1. Tastenkombination","html":"\u003cp>Öffne oben rechts \u003cstrong>Einstellungen\u003c/strong> \u003cspan class=\"num\">1\u003c/span> oder wähle \u003cem>Einstellungen\u003c/em> im Menü des Symbols im Infobereich. Im Abschnitt \u003cem>Tastatur\u003c/em> steht die \u003cstrong>aktuelle Tastenkombination\u003c/strong> \u003cspan class=\"num\">2\u003c/span> zum Ein- und Ausblenden. Mit \u003cstrong>Ändern\u003c/strong> \u003cspan class=\"num\">3\u003c/span> erfasst du eine neue Kombination. \u003cstrong>Zurücksetzen\u003c/strong> \u003cspan class=\"num\">4\u003c/span> stellt die Standardkombination wieder her (Win+F10, Super+F10 unter Linux, Cmd+Shift+Leertaste unter macOS).\u003c/p>","image":{"src":"img/customizing/01-shortcut.png","alt":"Die Einstellungen mit dem Abschnitt Tastatur"}},{"heading":"1. Tastenkombination","html":"\u003cp>Drücke nach \u003cstrong>Ändern\u003c/strong> deine gewünschte Kombination, etwa \u003ccode>Ctrl+Shift+O\u003c/code>. Mit Esc brichst du ab.\u003c/p>","image":{"src":"img/customizing/02-new-combination.png","alt":"Das Overlay wartet auf die neue Tastenkombination"}},{"heading":"1. Tastenkombination","html":"\u003cp>F1 bis F24 kannst du einzeln verwenden. Andere Tasten kombinierst du mit Strg, Alt, Umschalt oder Win (Super unter Linux, Cmd unter macOS). Ist die Kombination bereits belegt, erscheint eine Meldung und die bisherige Kombination bleibt aktiv.\u003c/p>\u003cblockquote>\u003cstrong>Beim Spielen:\u003c/strong> Auch das Spiel empfängt die Tastenkombination. Wähle eine, der im Spiel kein Befehl zugeordnet ist. Sonst löst du beim Öffnen des Overlays zugleich diesen Befehl aus.\u003c/blockquote>","image":null},{"heading":"2. Verhalten","html":"\u003cp>Im Abschnitt \u003cem>Verhalten\u003c/em> findest du diese Optionen.\u003c/p>\u003cul>\u003cli>\u003cstrong>Overlay ausblenden, wenn es den Fokus verliert\u003c/strong> \u003cspan class=\"num\">1\u003c/span> ist standardmäßig aktiv. Beim Klick auf das Spiel oder ein anderes Fenster blendet sich das Overlay aus. Deaktiviere die Option, wenn das Overlay beim Spielen sichtbar bleiben soll. Mit der Tastenkombination kannst du es weiterhin ausblenden. Die Option steht auch im Menü des Symbols im Infobereich.\u003c/li>\u003cli>\u003cstrong>Startseite für freies Surfen\u003c/strong> \u003cspan class=\"num\">2\u003c/span> legt fest, welche Seite der Tab Surfen zuerst öffnet. Lässt du das Feld leer, öffnet sich der Tab ohne Seite. Siehe \u003ca href=\"#free-browsing\">Freies Surfen\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Suchmaschine\u003c/strong> \u003cspan class=\"num\">3\u003c/span> bestimmt, wie der Tab Surfen nach Text sucht. Du kannst Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage oder \u003cem>Benutzerdefiniert\u003c/em> wählen. In einer eigenen Suchadresse steht \u003ccode>%s\u003c/code> für den Suchbegriff.\u003c/li>\u003c/ul>\u003cp>Mit \u003cem>Nach neuen Versionen suchen\u003c/em> erhältst du auf der Startseite einen Hinweis auf neue Versionen. Bei der Microsoft-Store-Version laufen Updates über den Store.\u003c/p>","image":{"src":"img/customizing/03-behavior.png","alt":"Der Abschnitt Verhalten in den Einstellungen"}},{"heading":"3. Darstellung und Sprache","html":"\u003cp>Im Abschnitt \u003cem>Darstellung\u003c/em> findest du diese Optionen.\u003c/p>\u003cul>\u003cli>\u003cstrong>Akzentfarbe\u003c/strong> \u003cspan class=\"num\">1\u003c/span> bestimmt die Farbe der festen Tabs, der wichtigsten Schaltflächen und weiterer Elemente.\u003c/li>\u003cli>\u003cstrong>Feste Tabs\u003c/strong> \u003cspan class=\"num\">2\u003c/span> zeigt Startseite, Surfen und Einstellungen mit Symbol und Name an. \u003cem>Nur Symbol\u003c/em> lässt mehr Platz für Website-Tabs.\u003c/li>\u003cli>\u003cstrong>Deckkraft des Fensters\u003c/strong> \u003cspan class=\"num\">3\u003c/span> reicht von 30 % bis 100 %. Bei niedrigeren Werten scheint das Spiel hinter dem Fenster durch.\u003c/li>\u003c/ul>\u003cp>Im Abschnitt \u003cem>Sprache\u003c/em> stellst du die \u003cstrong>Sprache der Oberfläche\u003c/strong> \u003cspan class=\"num\">4\u003c/span> ein. Standardmäßig gilt die \u003cem>Systemsprache\u003c/em>, sofern sie unterstützt wird (Italienisch, Englisch, Französisch, Portugiesisch, Russisch, Spanisch und Deutsch). Andernfalls erscheint die App auf Englisch.\u003c/p>","image":{"src":"img/customizing/04-appearance.png","alt":"Die Abschnitte Darstellung und Sprache in den Einstellungen"}},{"heading":"3. Darstellung und Sprache","html":"\u003cp>Hier siehst du das Overlay mit blauer Akzentfarbe und \u003cstrong>festen Tabs mit Symbolen\u003c/strong> \u003cspan class=\"num\">1\u003c/span> \u003cspan class=\"num\">2\u003c/span>. Der Screenshot erfasst nur das Fenster, daher siehst du das Spiel hinter dem Fenster und die Transparenz hier nicht.\u003c/p>","image":{"src":"img/customizing/05-customized.png","alt":"Das Overlay mit blauem Akzent und festen Tabs ohne Namen"}},{"heading":"Weitere Abschnitte","html":"\u003cp>Unter \u003cem>Speicher\u003c/em> siehst du den Speicherverbrauch und kannst einstellen, wann ungenutzte Seiten geschlossen werden. Unter \u003cem>Diagnose\u003c/em> sammelst du Informationen für eine Fehlermeldung.\u003c/p>","image":null}]},{"id":"memory","title":"Speicher und geschlossene Seiten","intro":"Jede geöffnete Seite beansprucht wie im Browser Speicher, auch wenn du sie gerade nicht siehst. Das gilt ebenso für Seiten anderer Listen. Damit dem Spiel Speicher bleibt, \u003cstrong>schließt das Overlay länger ungenutzte Seiten automatisch\u003c/strong>. In den Einstellungen siehst du den Verbrauch und kannst Seiten manuell schließen.","slides":[{"heading":null,"html":"\u003cp>Jede geöffnete Seite beansprucht wie im Browser Speicher, auch wenn du sie gerade nicht siehst. Das gilt ebenso für Seiten anderer Listen. Damit dem Spiel Speicher bleibt, \u003cstrong>schließt das Overlay länger ungenutzte Seiten automatisch\u003c/strong>. In den Einstellungen siehst du den Verbrauch und kannst Seiten manuell schließen.\u003c/p>\u003cp>Hier sind mehrere Seiten in den Listen für \u003cstrong>Tiny Glade\u003c/strong> und \u003cstrong>Brotato\u003c/strong> geöffnet. Siehe \u003ca href=\"#lists-per-game\">Eine Liste pro Spiel\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Warum eine Seite neu lädt","html":"\u003cp>Seiten, die du gerade nicht betrachtest, bleiben eine Weile offen und werden dann geschlossen. Das betrifft andere Tabs, andere Listen und bei ausgeblendetem Overlay alle Seiten. Beim erneuten Öffnen des Tabs \u003cstrong>lädt die zuletzt besuchte Adresse neu\u003c/strong>. Die Seite ist wieder da. Scrollposition oder teilweise ausgefüllte Formulare können verloren gehen.\u003c/p>\u003cp>Die gerade angezeigte Seite bleibt geöffnet.\u003c/p>","image":null},{"heading":"2. Der Abschnitt Speicher","html":"\u003cp>Öffne die \u003cstrong>Einstellungen\u003c/strong> und scrolle zum Abschnitt \u003cem>Speicher\u003c/em>.\u003c/p>\u003cul>\u003cli>\u003cstrong>Nicht verwendete Seiten schließen nach\u003c/strong> \u003cspan class=\"num\">1\u003c/span> legt fest, wann ungenutzte Seiten geschlossen werden. Wähle 5 bis 60 Minuten. Der Standardwert ist 30 Minuten. Bei wenig freiem Speicher oder anspruchsvollen Spielen ist eine kürzere Dauer sinnvoll.\u003c/li>\u003cli>\u003cstrong>Belegter Speicher\u003c/strong> \u003cspan class=\"num\">2\u003c/span> zeigt den Speicherverbrauch der gesamten App.\u003c/li>\u003cli>\u003cstrong>Alle Seiten schließen\u003c/strong> \u003cspan class=\"num\">3\u003c/span> schließt sofort alle geöffneten Seiten aller Listen.\u003c/li>\u003cli>\u003cstrong>Prozesse der App\u003c/strong> \u003cspan class=\"num\">4\u003c/span> umfasst Overlay-Oberfläche, Hauptprozess, Grafik (GPU) und andere Prozesse. Dieser Speicherbedarf besteht immer.\u003c/li>\u003cli>\u003cstrong>Seiten nach Liste\u003c/strong> \u003cspan class=\"num\">5\u003c/span> zeigt den Speicher der geöffneten Seiten je Liste. Mit \u003cstrong>Schließen\u003c/strong> schließt du alle Seiten dieser Liste.\u003c/li>\u003c/ul>","image":{"src":"img/memory/01-memory.png","alt":"Der Abschnitt Speicher mit den Listen für Tiny Glade und Brotato"}},{"heading":"3. Die Seiten einer Liste","html":"\u003cp>Klicke auf den Namen einer Liste, um ihre offenen Seiten samt Speicherverbrauch und verbleibender Zeit zu sehen. \u003cstrong>Schließen\u003c/strong> neben der Liste \u003cspan class=\"num\">1\u003c/span> schließt alle ihre Seiten. \u003cstrong>Schließen\u003c/strong> neben einer Seite \u003cspan class=\"num\">2\u003c/span> schließt nur diese.\u003c/p>","image":{"src":"img/memory/02-pages.png","alt":"Die geöffneten Seiten für Tiny Glade mit ihren Schaltflächen Schließen"}},{"heading":"3. Die Seiten einer Liste","html":"\u003cp>Einige Seiten teilen sich einen Prozess, etwa wenn dieselbe Website in verschiedenen Listen geöffnet ist. Sie stehen in einer gemeinsamen Zeile außerhalb der Gruppen. Sie werden zusammen geschlossen, da ihr Speicher erst frei wird, wenn sie alle geschlossen sind.\u003c/p>","image":null},{"heading":"4. Nach dem Schließen","html":"\u003cp>Hier wurden die Seiten für Brotato geschlossen. Die Gruppe ist verschwunden und der Speicherverbrauch ist gesunken. Die Tabs bleiben in der Liste und laden ihre Seiten beim nächsten Öffnen neu.\u003c/p>","image":{"src":"img/memory/03-closed.png","alt":"Der Abschnitt Speicher nach dem Schließen der Seiten für Brotato"}}]},{"id":"new-versions","title":"Neue Versionen","intro":"Overlay Browser prüft automatisch, ob eine neue Version verfügbar ist, und zeigt einen Hinweis an. Du entscheidest, wann du die neue Version herunterlädst und installierst.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser prüft automatisch, ob eine neue Version verfügbar ist, und zeigt einen Hinweis an. Du entscheidest, wann du die neue Version herunterlädst und installierst.\u003c/p>","image":null,"intro":true},{"heading":"1. Hinweis auf eine neue Version","html":"\u003cp>Sobald eine neue Version verfügbar ist, erscheint unter der Leiste ein \u003cstrong>Hinweisstreifen\u003c/strong> \u003cspan class=\"num\">1\u003c/span> mit ihrer Nummer. \u003cstrong>Herunterladen\u003c/strong> \u003cspan class=\"num\">2\u003c/span> öffnet die Seite der neuen Version im Systembrowser. Dort lädst du die Datei für dein Betriebssystem herunter. Siehe Installation in der \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a>. Das \u003cstrong>×\u003c/strong> \u003cspan class=\"num\">3\u003c/span> schließt den Streifen für diese Version dauerhaft.\u003c/p>\u003cp>Die neue Version steht auch oben auf der \u003cstrong>Startseite\u003c/strong> \u003cspan class=\"num\">4\u003c/span> neben der installierten Version. Ein Klick darauf öffnet dieselbe Seite.\u003c/p>","image":{"src":"img/new-versions/01-new-version.png","alt":"Der Hinweisstreifen und die neue Version auf der Startseite"}},{"heading":"1. Hinweis auf eine neue Version","html":"\u003cp>Nach dem Schließen des Streifens bleibt die neue Version bis zur Installation auf der Startseite sichtbar.\u003c/p>","image":{"src":"img/new-versions/02-strip-closed.png","alt":"Die Startseite mit der neuen und der installierten Version"}},{"heading":"2. Wann die App prüft","html":"\u003cp>Die App prüft kurz nach dem Start und danach alle sechs Stunden die GitHub-Veröffentlichungen des Projekts. Mit einer Beta erhältst du auch Hinweise auf neuere Betas. Andernfalls meldet die App nur stabile Versionen.\u003c/p>\u003cp>Wenn du keine Hinweise möchtest, deaktiviere \u003cstrong>Nach neuen Versionen suchen\u003c/strong> in den \u003cstrong>Einstellungen\u003c/strong> unter \u003cem>Verhalten\u003c/em>. Bei der Microsoft-Store-Version kommen die Updates aus dem Store, deshalb fehlt dort diese Option.\u003c/p>","image":{"src":"img/new-versions/03-option.png","alt":"Die Option Nach neuen Versionen suchen in den Einstellungen"}}]},{"id":"signing-in","title":"Bei einer Website anmelden und Cookies löschen","intro":"Viele Websites zu Spielen, etwa Foren, Wikis oder Build-Planer, bieten mit einem Konto mehr Funktionen oder setzen eine Anmeldung voraus. Im Overlay meldest du dich wie im Browser an. Die Anmeldung bleibt gespeichert. Funktioniert eine Website nicht mehr richtig oder möchtest du dich abmelden, kannst du ihre Cookies löschen.","slides":[{"heading":null,"html":"\u003cp>Viele Websites zu Spielen, etwa Foren, Wikis oder Build-Planer, bieten mit einem Konto mehr Funktionen oder setzen eine Anmeldung voraus. Im Overlay meldest du dich wie im Browser an. Die Anmeldung bleibt gespeichert. Funktioniert eine Website nicht mehr richtig oder möchtest du dich abmelden, kannst du ihre Cookies löschen.\u003c/p>\u003cp>In der Liste für \u003cstrong>Tiny Glade\u003c/strong> gibt es auch ein Forum. Die \u003cstrong>Beispielseite\u003c/strong> wurde für diese Anleitung erstellt. Die Anmeldung funktioniert wie auf echten Websites, etwa mit \u003cem>Mit Google fortfahren\u003c/em>.\u003c/p>","image":null,"intro":true},{"heading":"1. Mit deinem Konto anmelden","html":"\u003cp>Öffne den Tab der Website und klicke auf die Schaltfläche zur Anmeldung, hier \u003cstrong>Mit einem Konto fortfahren\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/01-forum.png","alt":"Das Beispielforum mit der Schaltfläche zur Anmeldung"}},{"heading":"1. Mit deinem Konto anmelden","html":"\u003cp>Die Website öffnet ihr \u003cstrong>Anmeldefenster\u003c/strong> über dem Overlay. Gib deine Daten ein und bestätige.\u003c/p>","image":{"src":"img/signing-in/02-sign-in-window.png","alt":"Das Anmeldefenster der Website über dem Overlay"}},{"heading":"1. Mit deinem Konto anmelden","html":"\u003cp>Das Anmeldefenster gehört zum Overlay. Es bleibt darüber und wird zusammen mit ihm ein- und ausgeblendet. Du kannst zwischen den Fenstern wechseln, ohne dass sie ausgeblendet werden. Wenn das Anmeldefenster schließt, ist das Overlay wieder aktiv.\u003c/p>","image":null},{"heading":"2. Die Anmeldung bleibt gespeichert","html":"\u003cp>Nach der Anmeldung schließt sich das Fenster. Die Website zeigt dein \u003cstrong>Konto\u003c/strong> an.\u003c/p>","image":{"src":"img/signing-in/03-signed-in.png","alt":"Das Forum nach der Anmeldung mit dem Benutzernamen oben"}},{"heading":"2. Die Anmeldung bleibt gespeichert","html":"\u003cp>Du bleibst auch angemeldet, wenn du das Overlay schließt oder die App neu startest. Die Anmeldung gilt für dieselbe Website in allen Listen.\u003c/p>","image":null},{"heading":"3. Cookies einer Website löschen","html":"\u003cp>Cookies speichern Daten, mit denen eine Website dich wiedererkennt, etwa deine Anmeldung. Lösche sie, um dich \u003cstrong>abzumelden\u003c/strong>, etwa für einen Kontowechsel, oder wenn die Website \u003cstrong>nicht mehr richtig funktioniert\u003c/strong>.\u003c/p>\u003cp>Klicke im Tab rechts neben der Adresse auf \u003cstrong>…\u003c/strong> (\u003cem>Weitere Aktionen\u003c/em>) und wähle \u003cstrong>Cookies von forum.example löschen\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/04-menu.png","alt":"Das Menü Weitere Aktionen mit dem Eintrag Cookies von forum.example löschen"}},{"heading":"3. Cookies einer Website löschen","html":"\u003cp>Bestätige mit \u003cstrong>Löschen\u003c/strong>. Die Cookies der Website und ihrer Subdomains werden gelöscht. Andere Websites bleiben angemeldet.\u003c/p>","image":{"src":"img/signing-in/05-confirm.png","alt":"Die Bestätigung zum Löschen der Cookies von forum.example und seinen Subdomains"}},{"heading":"4. Die Seite lädt neu","html":"\u003cp>Nach dem Löschen lädt die Seite neu. Du bist abgemeldet und kannst dich auf der Website erneut \u003cstrong>anmelden\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/06-signed-out.png","alt":"Das neu geladene Forum nach dem Löschen der Cookies"}}]},{"id":"links-and-menu","title":"Links, neue Tabs und das Kontextmenü","intro":"Viele Links öffnen sich im Browser in einem neuen Tab. Im Overlay entsprechen die Tabs den Websites der Liste. Solche Links öffnen sich im Tab der ursprünglichen Website oder nach einer Rückfrage in einem neuen Tab. Mit einem Rechtsklick kannst du Links gezielt in neuen Tabs öffnen und Links, Bilder oder Text kopieren.","slides":[{"heading":null,"html":"\u003cp>Viele Links öffnen sich im Browser in einem neuen Tab. Im Overlay entsprechen die Tabs den Websites der Liste. Solche Links öffnen sich im Tab der ursprünglichen Website oder nach einer Rückfrage in einem neuen Tab. Mit einem Rechtsklick kannst du Links gezielt in neuen Tabs öffnen und Links, Bilder oder Text kopieren.\u003c/p>\u003cp>Die Liste für \u003cstrong>Tiny Glade\u003c/strong> enthält ein Forum als \u003cstrong>Beispielseite\u003c/strong> für diese Anleitung. Siehe \u003ca href=\"#signing-in\">Bei einer Website anmelden und Cookies löschen\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Ein Link, den die Website in einem neuen Tab öffnet","html":"\u003cp>Einige Links sind für neue Tabs vorgesehen, etwa dieser Link zu einem Forenthema. Dasselbe gilt für Klicks mit gedrückter Strg-Taste oder mit der mittleren Maustaste.\u003c/p>","image":{"src":"img/links-and-menu/01-link.png","alt":"Das Beispielforum mit einem Link zu einem Thema"}},{"heading":"2. Dieselbe Website öffnet sich in ihrem Tab","html":"\u003cp>Führt der Link zur selben Website, ersetzt die Zielseite die bisherige Seite im \u003cstrong>Tab der Website\u003c/strong> \u003cspan class=\"num\">1\u003c/span>. Im \u003cstrong>Adressfeld\u003c/strong> \u003cspan class=\"num\">2\u003c/span> steht jetzt die Adresse des Themas. Mit \u003cstrong>Zurück\u003c/strong> kommst du zur vorherigen Seite.\u003c/p>","image":{"src":"img/links-and-menu/02-same-tab.png","alt":"Das Thema im Tab des Forums"}},{"heading":"2. Dieselbe Website öffnet sich in ihrem Tab","html":"\u003cp>Gibt es mehrere Tabs derselben Website, öffnet sich der Link in dem Tab, in dem du ihn angeklickt hast.\u003c/p>","image":null},{"heading":"3. Rückfrage bei einer anderen Website","html":"\u003cp>Führt der Link zu einer Website ohne eigenen Tab in der Liste, hier zu den Community-Guides auf Steam, fragt das Overlay nach. \u003cstrong>Hinzufügen\u003c/strong> nimmt die Website in die Liste auf und öffnet sie. \u003cstrong>Abbrechen\u003c/strong> belässt dich auf der aktuellen Seite.\u003c/p>","image":{"src":"img/links-and-menu/03-other-site.png","alt":"Die Rückfrage, ob die verlinkte Website zur Liste hinzugefügt werden soll"}},{"heading":"3. Rückfrage bei einer anderen Website","html":"\u003cp>Links aus dem Tab \u003cstrong>Surfen\u003c/strong> bleiben im Tab Surfen. Siehe \u003ca href=\"#free-browsing\">Freies Surfen\u003c/a>.\u003c/p>","image":null},{"heading":"4. Rechtsklick auf einen Link","html":"\u003cp>Mit einem Rechtsklick öffnest du das Menü mit \u003cstrong>Link in neuem Tab öffnen\u003c/strong> \u003cspan class=\"num\">1\u003c/span> und \u003cstrong>Link kopieren\u003c/strong> \u003cspan class=\"num\">2\u003c/span>. Letzteres kopiert die Adresse des Links.\u003c/p>","image":{"src":"img/links-and-menu/04-link-menu.png","alt":"Das Kontextmenü des Links mit den Einträgen zum Öffnen und Kopieren"}},{"heading":"4. Rechtsklick auf einen Link","html":"\u003cp>\u003cstrong>Link in neuem Tab öffnen\u003c/strong> fragt nach, bevor der Link in die Liste aufgenommen wird. Klicke auf \u003cstrong>Hinzufügen\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/05-confirm-tab.png","alt":"Die Bestätigung zum Hinzufügen des Links als neuer Tab der Liste Tiny Glade"}},{"heading":"4. Rechtsklick auf einen Link","html":"\u003cp>Der Link öffnet sich in einem \u003cstrong>neuen Tab\u003c/strong> direkt hinter dem ursprünglichen Tab. Gibt es bereits einen Tab mit dieser Adresse, wechselt das Overlay dorthin.\u003c/p>","image":{"src":"img/links-and-menu/06-new-tab.png","alt":"Das Thema im neuen Tab direkt hinter dem Tab des Forums"}},{"heading":"5. Rechtsklick auf Bilder und Text","html":"\u003cp>Mit \u003cstrong>Bild kopieren\u003c/strong> kannst du ein Bild etwa in einem Chat einfügen. Auf Seitentext findest du \u003cstrong>Kopieren\u003c/strong> für den markierten Text und \u003cstrong>Alles auswählen\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/07-image-menu.png","alt":"Das Kontextmenü eines Bildes mit dem Eintrag Bild kopieren"}},{"heading":"5. Rechtsklick auf Bilder und Text","html":"\u003cp>In Textfeldern wie dem Antwortfeld des Forums oder dem Adressfeld stehen \u003cstrong>Rückgängig\u003c/strong>, \u003cstrong>Wiederholen\u003c/strong>, \u003cstrong>Ausschneiden\u003c/strong>, \u003cstrong>Kopieren\u003c/strong>, \u003cstrong>Einfügen\u003c/strong> und \u003cstrong>Alles auswählen\u003c/strong> zur Verfügung. Gerade nicht verfügbare Befehle sind ausgegraut, zum Beispiel \u003cem>Kopieren\u003c/em> ohne Textauswahl.\u003c/p>","image":{"src":"img/links-and-menu/08-field-menu.png","alt":"Das Kontextmenü in einem Textfeld"}}]},{"id":"troubleshooting","title":"Probleme beheben","intro":"Hier findest du Lösungen für häufige Probleme und erfährst, wie du Informationen für eine Fehlermeldung sammelst. Einzelheiten zu Windows, Linux und macOS stehen in der README.","slides":[{"heading":null,"html":"\u003cp>Hier findest du Lösungen für häufige Probleme und erfährst, wie du Informationen für eine Fehlermeldung sammelst. Einzelheiten zu Windows, Linux und macOS stehen in der \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Die Tastenkombination funktioniert nicht","html":"\u003cul>\u003cli>\u003cstrong>Ein anderes Programm verwendet sie bereits.\u003c/strong> Wenn du sie in den Einstellungen auswählst, meldet das Overlay „ungültige Kombination oder bereits belegt“. Die bisherige Kombination bleibt aktiv. Wähle eine andere. Siehe \u003ca href=\"#customizing\">Overlay anpassen\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Das Spiel verwendet sie für einen Befehl.\u003c/strong> Auch das Spiel empfängt die Tastenkombination. Wähle eine, die im Spiel nichts auslöst.\u003c/li>\u003cli>\u003cstrong>Linux mit Wayland.\u003c/strong> Bei aktivem nativem Wayland-Fenster wird die Kombination nicht erkannt. Verwende eine X11-Sitzung. Siehe \u003cem>Linux\u003c/em> in der \u003ca href=\"../../README.md#linux\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Funktionstasten unter macOS.\u003c/strong> Standardmäßig steuern F1 bis F12 etwa Helligkeit und Lautstärke. Drücke dazu \u003cstrong>fn\u003c/strong>, um sie als Funktionstasten zu verwenden, oder ändere die Tastatureinstellung. Siehe \u003cem>macOS\u003c/em> in der \u003ca href=\"../../README.md#macos\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003c/ul>\u003cp>Du kannst das Overlay jederzeit über das Symbol im Infobereich öffnen.\u003c/p>","image":null},{"heading":"2. Ich finde das App-Symbol nicht","html":"\u003cp>Die App steht im Infobereich neben der Uhr. Sie erscheint weder in der Taskleiste noch unter Alt+Tab.\u003c/p>\u003cul>\u003cli>\u003cstrong>Windows\u003c/strong> – Klicke auf \u003cstrong>^\u003c/strong>, wenn das Symbol verborgen ist. Ziehe es auf die Taskleiste, damit es sichtbar bleibt.\u003c/li>\u003cli>\u003cstrong>Linux mit GNOME\u003c/strong> – Du brauchst die Erweiterung \u003cem>AppIndicator and KStatusNotifierItem Support\u003c/em>. Öffnet ein Klick auf das Symbol ein Menü, wähle darin \u003cem>Anzeigen\u003c/em>.\u003c/li>\u003cli>\u003cstrong>macOS\u003c/strong> – Das Symbol steht oben rechts in der Menüleiste.\u003c/li>\u003c/ul>","image":null},{"heading":"3. Das Overlay erscheint nicht über dem Spiel oder ist undurchsichtig","html":"\u003cul>\u003cli>\u003cstrong>Das Spiel verdeckt das Overlay.\u003c/strong> Manche Spiele im exklusiven Vollbildmodus verdecken alle Fenster. Stelle das Spiel auf \u003cem>randloses Fenster\u003c/em> um.\u003c/li>\u003cli>\u003cstrong>Das Fenster ist unter Linux undurchsichtig.\u003c/strong> Transparenz braucht einen Fenstermanager mit aktivem Compositing, etwa Cinnamon, KDE, GNOME oder Xfce mit aktiviertem Compositing.\u003c/li>\u003c/ul>","image":null},{"heading":"4. Eine Website funktioniert nicht richtig oder lädt neu","html":"\u003cul>\u003cli>\u003cstrong>Eine Website funktioniert nicht mehr richtig oder du möchtest dich abmelden.\u003c/strong> Lösche ihre Cookies über das Menü \u003cstrong>…\u003c/strong>. Siehe \u003ca href=\"#signing-in\">Bei einer Website anmelden und Cookies löschen\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Die Seite lädt beim Zurückwechseln zum Tab neu.\u003c/strong> Ungenutzte Seiten werden nach einer Weile geschlossen, um Speicher freizugeben. Siehe \u003ca href=\"#memory\">Speicher und geschlossene Seiten\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Du möchtest neu anfangen.\u003c/strong> Beende die App und lösche die Einstellungsdatei. Siehe \u003cem>Preferences and uninstalling\u003c/em> in der \u003ca href=\"../../README.md#preferences-and-uninstalling\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003c/ul>","image":null},{"heading":"5. Informationen für eine Fehlermeldung sammeln","html":"\u003cp>Melde ein anhaltendes Problem auf der \u003ca href=\"https://github.com/siculo/overlay-browser/issues\" target=\"_blank\" rel=\"noopener\">Issues-Seite des Projekts\u003c/a>. Die Protokolldatei hilft bei der Fehlersuche.\u003c/p>\u003cp>Öffne in den \u003cstrong>Einstellungen\u003c/strong> den Abschnitt \u003cem>Diagnose\u003c/em>.\u003c/p>\u003cul>\u003cli>\u003cstrong>Ausführliches Protokoll\u003c/strong> \u003cspan class=\"num\">1\u003c/span> – Standardmäßig zeichnet das Protokoll Fehler und Abstürze mit den aktuellen Einstellungen auf. Aktiviert erfasst es auch deine Aktionen in der App (Tabs, Websites, Listen und Einstellungen) und Ereignisse des Overlays (Ein- und Ausblenden, Fokus, Tastenkombination und Vordergrundanwendung). Schalte es ein und wiederhole die Schritte, die das Problem auslösen.\u003c/li>\u003cli>\u003cstrong>Protokolldatei anzeigen\u003c/strong> \u003cspan class=\"num\">2\u003c/span> öffnet den Ordner mit \u003ccode>overlay.log\u003c/code>. Hänge die Datei an die Fehlermeldung an.\u003c/li>\u003cli>\u003cstrong>Protokoll leeren\u003c/strong> \u003cspan class=\"num\">3\u003c/span> löscht den Inhalt, etwa um nur das zu meldende Problem aufzuzeichnen.\u003c/li>\u003c/ul>","image":{"src":"img/troubleshooting/01-diagnostics.png","alt":"Der Abschnitt Diagnose in den Einstellungen"}},{"heading":"5. Informationen für eine Fehlermeldung sammeln","html":"\u003cp>Das Protokoll speichert weder Tastendrücke noch deinen Browserverlauf, Seitenadressen oder Seitentitel. Es erfasst Websites nur anhand ihrer Position in der Liste.\u003c/p>\u003cp>\u003cstrong>Protokoll leeren\u003c/strong> fragt vor dem Löschen nach.\u003c/p>","image":{"src":"img/troubleshooting/02-empty-log.png","alt":"Die Bestätigung zum Leeren der Protokolldatei"}}]}],"strings":{"docTitle":"Overlay Browser · Anleitung","subtitle":"Anleitung, Schritt für Schritt","legend":"In den Screenshots sind die im Text genannten Elemente rot umrahmt \u003cspan class=\"box\">\u003c/span>; Nummern wie \u003cspan class=\"num\">1\u003c/span> im Text verweisen auf das Element mit derselben Nummer im Screenshot.","menu":"Anleitungen","menuTitle":"Zurück zur Liste der Anleitungen (Esc)","prev":"Zurück","prevTitle":"Vorherige Folie (←)","next":"Weiter","nextTitle":"Nächste Folie (→)","prevGuide":"Vorherige Anleitung","nextGuide":"Nächste Anleitung: {title}","backToGuides":"Zurück zu den Anleitungen","guideOf":"Anleitung {n} von {total}","step":"Schritt {n}","slideOne":"1 Folie","slideOther":"{count} Folien"}};
const S = DATA.strings;   // testi della pagina nella lingua delle guide
const $ = (id) => document.getElementById(id);
const guides = DATA.guides;
const plural = (n) => (n === 1 ? S.slideOne : S.slideOther.replace('{count}', n));

// ---------- menu ----------
$('guides').replaceChildren(...guides.map((g, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${g.id}"><span class="n">${i + 1}</span><h2></h2><p>${g.intro}</p><span class="count">${plural(g.slides.length)}</span></a>`;
  li.querySelector('h2').textContent = g.title;
  return li;
}));

// ---------- slide ----------
// Indirizzo: #<guida>/<numero> (da 1); #<guida> = prima slide; vuoto = menu.
let current = null, index = 0;

function route() {
  const [id, n] = decodeURIComponent(location.hash.slice(1)).split('/');
  const g = guides.find((x) => x.id === id);
  closeZoom();
  if (!g) { showMenu(); return; }
  const i = Math.min(Math.max((Number(n) || 1) - 1, 0), g.slides.length - 1);
  const dir = g === current ? Math.sign(i - index) : 0;
  current = g;
  index = i;
  renderSlide(dir);
}

function showMenu() {
  current = null;
  $('deck').hidden = true;
  $('menu').hidden = false;
  document.title = S.docTitle;
}

const go = (i) => { location.hash = `${current.id}/${i + 1}`; };

function renderSlide(dir) {
  const g = current, s = g.slides[index];
  const gi = guides.indexOf(g), nextGuide = guides[gi + 1];
  $('menu').hidden = true;
  $('deck').hidden = false;
  document.title = `${g.title} · Overlay Browser`;
  $('guide-title').textContent = g.title;
  $('pos').textContent = `${index + 1} / ${g.slides.length}`;

  const el = $('slide');
  el.className = s.image ? 'with-image' : 'text-only';
  if (s.intro) el.classList.add('intro');
  const text = document.createElement('div');
  text.className = 'text';
  if (s.intro) {
    text.innerHTML = `<p class="section">${S.guideOf.replace('{n}', gi + 1).replace('{total}', guides.length)}</p><h2></h2>${s.html}`;
    text.querySelector('h2').textContent = g.title;
  } else {
    text.innerHTML = `<p class="section"></p><h2></h2>${s.html}`;
    const m = s.heading.match(/^(\d+)\.\s+(.*)$/);
    text.querySelector('.section').textContent = m ? S.step.replace('{n}', m[1]) : '';
    text.querySelector('h2').textContent = m ? m[2] : s.heading;
  }
  const parts = [text];
  if (s.image) {
    const fig = document.createElement('figure');
    fig.innerHTML = '<img><figcaption></figcaption>';
    fig.querySelector('img').src = s.image.src;
    fig.querySelector('img').alt = s.image.alt;
    fig.querySelector('figcaption').textContent = s.image.alt;
    fig.querySelector('img').onclick = () => openZoom(s.image);
    parts.push(fig);
  }
  el.replaceChildren(...parts);
  el.scrollTop = 0;
  el.classList.remove('enter');
  el.style.setProperty('--from', `${dir * 16}px`);
  if (dir) { void el.offsetWidth; el.classList.add('enter'); }

  $('dots').replaceChildren(...g.slides.map((x, i) => {
    const b = document.createElement('button');
    b.title = x.intro ? g.title : x.heading;
    b.setAttribute('aria-current', String(i === index));
    b.onclick = () => go(i);
    return b;
  }));
  $('prev').disabled = index === 0 && gi === 0;
  $('prev').textContent = index === 0 && gi > 0 ? `← ${S.prevGuide}` : `← ${S.prev}`;
  const last = index === g.slides.length - 1;
  $('next').textContent = !last ? `${S.next} →` : nextGuide ? `${S.nextGuide.replace('{title}', nextGuide.title)} →` : S.backToGuides;
}

function next() {
  if (index < current.slides.length - 1) return go(index + 1);
  const g = guides[guides.indexOf(current) + 1];
  location.hash = g ? g.id : '';
}
function prev() {
  if (index > 0) return go(index - 1);
  const g = guides[guides.indexOf(current) - 1];
  if (g) location.hash = `${g.id}/${g.slides.length}`;
}
$('next').onclick = next;
$('prev').onclick = prev;

// ---------- immagine a tutto schermo ----------
function openZoom(image) {
  $('zoom').querySelector('img').src = image.src;
  $('zoom').querySelector('img').alt = image.alt;
  $('zoom').hidden = false;
}
function closeZoom() { $('zoom').hidden = true; }
$('zoom').onclick = closeZoom;

// ---------- tastiera ----------
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!$('zoom').hidden) { if (e.key === 'Escape') closeZoom(); return; }
  if (!current) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) next();
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) prev();
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(current.slides.length - 1);
  else if (e.key === 'Escape') location.hash = '';
  else return;
  e.preventDefault();
});

window.addEventListener('hashchange', route);
route();
</script>
</body>
