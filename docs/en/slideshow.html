<!doctype html>
<!-- Modello della presentazione: build.js sostituisce i testi (segnaposti tra doppie graffe, da
     STRINGS in build.js) e i dati e scrive docs/<lingua>/<file>.html. Non
     modificare la pagina generata. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Browser · Guide</title>
<link rel="icon" href="../../assets/icon.png">
<style>
  :root {
    --bg: #141414; --sheet: #1b1b1b; --line: #2c2c2c; --text: #e8e8e8; --muted: #9a9a9a;
    --accent: #f0a030; --accent-text: #f5b750; --on-accent: #111; --mark: #e5262b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, sans-serif; }
  a { color: var(--accent-text); }
  code { font-family: ui-monospace, monospace; font-size: .9em; padding: 1px 5px; border-radius: 4px; background: #262626; }
  strong { color: #fff; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Numeri come nelle schermate: bianco su cerchio rosso. */
  .num { display: inline-flex; align-items: center; justify-content: center; width: 1.45em; height: 1.45em;
         margin: 0 .1em; border-radius: 50%; background: var(--mark); color: #fff; border: 2px solid #fff;
         font-size: .72em; font-weight: 700; line-height: 1; vertical-align: .12em; }

  /* ---------- menu ---------- */
  #menu { max-width: 1100px; margin: 0 auto; padding: 48px 32px 64px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { height: 56px; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; color: var(--muted); }
  .legend { margin: 28px 0 32px; padding: 12px 16px; border-left: 3px solid var(--mark); background: var(--sheet);
            color: #cfcfcf; border-radius: 0 6px 6px 0; }
  .legend .box { display: inline-block; width: 1.3em; height: .9em; border: 2px solid var(--mark); border-radius: 4px; vertical-align: -.05em; }
  #guides { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
            list-style: none; margin: 0; padding: 0; counter-reset: guide; }
  #guides a { display: flex; flex-direction: column; height: 100%; padding: 18px 20px; border: 1px solid var(--line);
              border-radius: 10px; background: var(--sheet); color: inherit; text-decoration: none;
              transition: border-color .15s, transform .15s; }
  #guides a:hover, #guides a:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  #guides .n { color: var(--accent-text); font-weight: 700; font-size: 14px; }
  #guides h2 { margin: 4px 0 8px; font-size: 19px; font-weight: 600; line-height: 1.3; }
  #guides p { margin: 0 0 14px; color: #bdbdbd; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #guides .count { margin-top: auto; }
  #guides .count { color: var(--muted); font-size: 13px; }

  /* ---------- slide ---------- */
  #deck { display: flex; flex-direction: column; height: 100%; }
  #deck header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: #0e0e0e; }
  #deck header .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid #3a3a3a;
         border-radius: 6px; background: #232323; text-decoration: none; color: var(--text); white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  #slide { flex: 1; min-height: 0; padding: 28px 36px; overflow: auto; }
  #slide.with-image { display: grid; grid-template-columns: minmax(300px, 36%) 1fr; gap: 36px; align-items: center; }
  #slide.text-only { display: flex; align-items: center; justify-content: center; }
  #slide .text { max-height: 100%; overflow: auto; }
  #slide.text-only .text { max-width: 760px; font-size: 19px; }
  #slide .section { margin: 0 0 4px; color: var(--accent-text); font-size: 14px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  #slide h2 { margin: 0 0 14px; font-size: 26px; font-weight: 600; line-height: 1.25; }
  #slide.intro h2 { font-size: 34px; }
  #slide p { margin: 0 0 12px; }
  #slide ul { margin: 0 0 12px; padding-left: 1.2em; }
  #slide li { margin-bottom: 8px; }
  #slide blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--sheet); border-radius: 0 6px 6px 0; color: #d4d4d4; }
  #slide figure { margin: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  #slide figure img { display: block; max-width: 100%; max-height: calc(100% - 2.2em); margin: 0 auto; object-fit: contain;
                      border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); cursor: zoom-in; }
  #slide figcaption { margin-top: 10px; text-align: center; color: var(--muted); font-size: 14px; }
  #deck footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); background: #0e0e0e; }
  #dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; background: #444; }
  #dots button[aria-current="true"] { background: var(--accent); }
  #pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  #slide.enter { animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateX(var(--from, 16px)); } }

  /* Immagine a tutto schermo */
  #zoom { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
          padding: 24px; background: rgba(0, 0, 0, .88); cursor: zoom-out; }
  #zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  @media (max-width: 820px) {
    #slide.with-image { grid-template-columns: 1fr; align-items: start; }
    #slide figure { height: auto; }
    #slide figure img { max-height: none; }
    #dots { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #slide.enter { animation: none; } #guides a { transition: none; } }
</style>
</head>
<body>

<main id="menu" hidden>
  <div class="brand">
    <img src="../../assets/logo.png" alt="">
    <div>
      <h1>Overlay Browser</h1>
      <p>User guide, step by step</p>
    </div>
  </div>
  <p class="legend">In the screenshots the elements mentioned in the text are highlighted by a red frame <span class="box"></span>; numbers like <span class="num">1</span> in the text point to the element with the same number in the screenshot.</p>
  <ol id="guides"></ol>
</main>

<div id="deck" hidden>
  <header>
    <a class="btn" href="#" title="Back to the list of guides (Esc)">☰ Guides</a>
    <span class="title" id="guide-title"></span>
    <span id="pos"></span>
  </header>
  <section id="slide" aria-live="polite"></section>
  <footer>
    <button class="btn" id="prev" title="Previous slide (←)">← Back</button>
    <div id="dots" role="tablist"></div>
    <button class="btn primary" id="next" title="Next slide (→)">Next →</button>
  </footer>
</div>

<div id="zoom" hidden><img alt=""></div>

<script>
const DATA = {"guides":[{"id":"getting-started","title":"Getting started: your game's sites at hand","intro":"In this guide you open Overlay Browser while playing (here \u003cstrong>Tiny Glade\u003c/strong>), add a couple of useful sites and learn to show and hide them without leaving the game.","slides":[{"heading":null,"html":"\u003cp>In this guide you open Overlay Browser while playing (here \u003cstrong>Tiny Glade\u003c/strong>), add a couple of useful sites and learn to show and hide them without leaving the game.\u003c/p>","image":null,"intro":true},{"heading":"1. Start the app","html":"\u003cp>Start Overlay Browser: the window \u003cstrong>stays hidden\u003c/strong> and the app waits in the notification area, near the clock. It does not appear in the taskbar or in Alt+Tab.\u003c/p>\u003cp>Then start the game, in windowed or borderless window mode.\u003c/p>","image":null},{"heading":"2. Open the overlay over the game","html":"\u003cp>While playing, press \u003cstrong>Win+F10\u003c/strong> (Super+F10 on Linux, Cmd+Shift+Space on macOS). The overlay appears over the game and opens on the \u003cstrong>Home\u003c/strong>.\u003c/p>\u003cp>The overlay has recognized the game: at the top there is the \u003cstrong>Tiny Glade\u003c/strong> list \u003cspan class=\"num\">1\u003c/span>, \u003cem>active\u003c/em> and still \u003cem>new\u003c/em>. Each game has its own list of sites, created when you add its first site. Among the \u003cem>Other lists\u003c/em> there is the \u003cstrong>General\u003c/strong> list \u003cspan class=\"num\">2\u003c/span>, used when no game is open; \u003cstrong>Use\u003c/strong> makes it active by hand.\u003c/p>","image":{"src":"img/getting-started/01-empty-home.png","alt":"The Home opened over Tiny Glade, with the game's list still empty"}},{"heading":"3. Add a site","html":"\u003cp>Click \u003cstrong>+\u003c/strong> \u003cspan class=\"num\">1\u003c/span> in the top bar, type the site's address \u003cspan class=\"num\">2\u003c/span> (\u003ccode>tinyglade.com\u003c/code> is enough) and press \u003cstrong>Add\u003c/strong> \u003cspan class=\"num\">3\u003c/span>.\u003c/p>","image":{"src":"img/getting-started/02-add-site.png","alt":"The window to add a site, with the address tinyglade.com"}},{"heading":"3. Add a site","html":"\u003cp>The site opens right away in its \u003cstrong>tab\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, named after the page's title; the \u003cstrong>×\u003c/strong> closes it. Below is the navigation bar, as in a browser: \u003cstrong>back, forward and reload\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, the page's \u003cstrong>address\u003c/strong> \u003cspan class=\"num\">3\u003c/span> (you can type another one and press Enter) and \u003cstrong>Pin\u003c/strong> \u003cspan class=\"num\">4\u003c/span>, which turns a page you reached while browsing into a new tab.\u003c/p>","image":{"src":"img/getting-started/03-site-open.png","alt":"Tiny Glade's official site open in its tab"}},{"heading":"4. Add more from the Home","html":"\u003cp>Go back to the \u003cstrong>Home\u003c/strong>: here you see the list's sites. Click a \u003cstrong>site's name\u003c/strong> \u003cspan class=\"num\">1\u003c/span> to open it, \u003cstrong>Edit\u003c/strong> \u003cspan class=\"num\">2\u003c/span> to change its address (Enter to save, Esc to cancel) or \u003cstrong>Remove\u003c/strong> \u003cspan class=\"num\">3\u003c/span> to take it off the list. To add a site, type its address in the \u003cstrong>field below the list\u003c/strong> \u003cspan class=\"num\">4\u003c/span> and press \u003cem>Add\u003c/em>: here we added the game's Steam page.\u003c/p>","image":{"src":"img/getting-started/04-home-with-sites.png","alt":"The Home with the two sites of Tiny Glade's list"}},{"heading":"5. Switch between sites","html":"\u003cp>Each site has its own tab in the bar: here the \u003cstrong>official site\u003c/strong> \u003cspan class=\"num\">1\u003c/span> and the \u003cstrong>Steam page\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, the one open now. When you switch tabs and come back, you find the page exactly where you left it.\u003c/p>","image":{"src":"img/getting-started/05-two-tabs.png","alt":"Tiny Glade's Steam page in the second tab"}},{"heading":"6. Back to the game","html":"\u003cp>Press \u003cstrong>Win+F10\u003c/strong> again to hide the overlay, or click the game's window: by default the overlay hides by itself when it loses focus (you can turn this off in the Settings).\u003c/p>\u003cp>Next time you open the overlay over Tiny Glade you find its list, open on the last tab you were looking at. Over another game you will see that game's list instead.\u003c/p>","image":null}]},{"id":"free-browsing","title":"Free browsing: search, find, pin","intro":"The \u003cstrong>Browse\u003c/strong> tab is for searching and opening any page without adding it to the list. When you find a page you want to keep, \u003cstrong>Pin\u003c/strong> turns it into a tab of the game's list.","slides":[{"heading":null,"html":"\u003cp>The \u003cstrong>Browse\u003c/strong> tab is for searching and opening any page without adding it to the list. When you find a page you want to keep, \u003cstrong>Pin\u003c/strong> turns it into a tab of the game's list.\u003c/p>\u003cp>Here we continue the example of \u003ca href=\"#getting-started\">Getting started\u003c/a>: the overlay is open over \u003cstrong>Tiny Glade\u003c/strong>, whose list already has two sites, and we look for a wiki of the game.\u003c/p>","image":null,"intro":true},{"heading":"1. Open the Browse tab","html":"\u003cp>Click \u003cstrong>Browse\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, right after Home. In the \u003cstrong>address field\u003c/strong> \u003cspan class=\"num\">2\u003c/span> you can type an address (\u003ccode>example.com\u003c/code> is enough) or any text to search for. As an example the overlay suggests the \u003cstrong>game's name\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: click it to search for it.\u003c/p>","image":{"src":"img/free-browsing/01-browse.png","alt":"The empty Browse tab, with the address field and the example search \"Tiny Glade\""}},{"heading":"2. Search","html":"\u003cp>Type \u003ccode>tiny glade wiki\u003c/code> and press Enter. The search opens in the tab, and the \u003cstrong>address field\u003c/strong> \u003cspan class=\"num\">1\u003c/span> shows the address of the results page.\u003c/p>\u003cp>You choose the search engine in the Settings (\u003cem>Behavior\u003c/em> section): Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage or a custom address. Here we use DuckDuckGo.\u003c/p>\u003cp>Click the result you want, here \u003cstrong>Tiny Glade Wiki\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/02-results.png","alt":"The results of the search \"tiny glade wiki\", with the link to the Tiny Glade Wiki"}},{"heading":"3. Pin the page","html":"\u003cp>The page opens in the Browse tab and you can use it as in a browser: \u003cstrong>Back\u003c/strong> \u003cspan class=\"num\">1\u003c/span> takes you back to the search results. To keep it, click \u003cstrong>Pin\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/03-page-found.png","alt":"The Tiny Glade Wiki open in the Browse tab"}},{"heading":"3. Pin the page","html":"\u003cp>The overlay asks for confirmation: click \u003cstrong>Pin\u003c/strong>.\u003c/p>","image":{"src":"img/free-browsing/04-confirm.png","alt":"The confirmation: pin \"Tiny Glade Wiki\" as a new tab of the list \"Tiny Glade\"?"}},{"heading":"4. The page is a tab of the list","html":"\u003cp>The page, with its history, becomes a \u003cstrong>new tab\u003c/strong> \u003cspan class=\"num\">1\u003c/span> at the end of Tiny Glade's list, and from now on you find it whenever you open the overlay over the game. \u003cstrong>Pin\u003c/strong> \u003cspan class=\"num\">2\u003c/span> is now disabled: the page is already in the list.\u003c/p>","image":{"src":"img/free-browsing/05-pinned.png","alt":"The Tiny Glade Wiki in its new tab, with Pin disabled"}},{"heading":"4. The page is a tab of the list","html":"\u003cp>Pin also works in the sites' tabs: if from a site you reach a page you want to keep separately, Pin adds it as a new tab right after the site's tab. When a page is already one of the list's tabs, that tab is highlighted and Pin is disabled.\u003c/p>","image":null},{"heading":"5. The Browse tab is free again","html":"\u003cp>When you go back to \u003cstrong>Browse\u003c/strong> you find it empty, ready for a new search: the pinned page has moved to its own tab. While browsing, the \u003cstrong>Back to the start page\u003c/strong> button \u003cspan class=\"num\">1\u003c/span> closes the open page and goes back to the empty page.\u003c/p>","image":{"src":"img/free-browsing/06-browse-again.png","alt":"The Browse tab empty again"}},{"heading":"5. The Browse tab is free again","html":"\u003cp>In the Settings (\u003cem>Behavior\u003c/em> section) you can also choose a \u003cstrong>start page\u003c/strong> for the Browse tab, opened instead of the empty page.\u003c/p>","image":null},{"heading":"Addresses of other sites from the sites' tabs","html":"\u003cp>You can type in the address field of the sites' tabs too. An address on the same site opens in the tab; an address on another site, or a search, opens instead in the Browse tab, after a confirmation, so the site's tab keeps its page.\u003c/p>","image":null}]},{"id":"lists-per-game","title":"One list per game","intro":"Overlay Browser recognizes the game you open it over and shows that game's sites: each game has its own \u003cstrong>list\u003c/strong>. In this guide, after Getting started and Free browsing, \u003cstrong>Tiny Glade\u003c/strong>'s list already has three sites; now we play \u003cstrong>Brotato\u003c/strong>.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser recognizes the game you open it over and shows that game's sites: each game has its own \u003cstrong>list\u003c/strong>. In this guide, after \u003ca href=\"#getting-started\">Getting started\u003c/a> and \u003ca href=\"#free-browsing\">Free browsing\u003c/a>, \u003cstrong>Tiny Glade\u003c/strong>'s list already has three sites; now we play \u003cstrong>Brotato\u003c/strong>.\u003c/p>","image":null,"intro":true},{"heading":"1. A new game, a new list","html":"\u003cp>Open the overlay while playing Brotato. At the top of the Home there is \u003cstrong>Brotato's list\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, \u003cem>active\u003c/em> and still \u003cem>new\u003c/em>: next to its name you see the program recognized and the number of sites. Add a site in the \u003cstrong>field below the list\u003c/strong> \u003cspan class=\"num\">2\u003c/span> (or with the \u003cstrong>+\u003c/strong> in the top bar): the list is created with its first site. \u003cstrong>Tiny Glade's list\u003c/strong> \u003cspan class=\"num\">3\u003c/span> is among the \u003cem>Other lists\u003c/em>, collapsed: click it to see its sites.\u003c/p>","image":{"src":"img/lists-per-game/01-brotato-new.png","alt":"The Home opened over Brotato: its new list and, among the other lists, Tiny Glade's"}},{"heading":"1. A new game, a new list","html":"\u003cp>Here we add Brotato's wiki and its Steam page. The bar now has their tabs, and only those: Tiny Glade's sites do not appear.\u003c/p>","image":{"src":"img/lists-per-game/02-brotato-wiki.png","alt":"The tabs of Brotato's list"}},{"heading":"2. Each game finds its own sites","html":"\u003cp>Go back to Tiny Glade and open the overlay: the bar has \u003cstrong>Tiny Glade's tabs\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, and \u003cstrong>Tiny Glade's list\u003c/strong> \u003cspan class=\"num\">2\u003c/span> is the active one. \u003cstrong>Brotato's list\u003c/strong> \u003cspan class=\"num\">3\u003c/span> has moved among the \u003cem>Other lists\u003c/em>; \u003cstrong>Use\u003c/strong> \u003cspan class=\"num\">4\u003c/span> would make it active by hand (see step 4). Each list opens again on the last tab you were looking at.\u003c/p>","image":{"src":"img/lists-per-game/03-tiny-glade.png","alt":"The Home opened over Tiny Glade, with its tabs and Brotato's list among the others"}},{"heading":"3. The General list","html":"\u003cp>Lists are not only for games: the overlay offers a list for any program you open it over. When it recognizes no application, the \u003cstrong>General list\u003c/strong> is active, a place for sites not tied to a specific program. It works like the others, but cannot be removed.\u003c/p>","image":{"src":"img/lists-per-game/04-general.png","alt":"The General list, active when no application is recognized"}},{"heading":"4. Choose a list by hand","html":"\u003cp>Sometimes you want another game's sites: for example you are reading Brotato's wiki while Tiny Glade is open. Click \u003cstrong>Use\u003c/strong> next to the list you want (\u003cspan class=\"num\">4\u003c/span> in the screenshot of step 2).\u003c/p>\u003cp>The list becomes active and stays the one \u003cstrong>chosen by hand\u003c/strong> \u003cspan class=\"num\">1\u003c/span> even when you open the overlay over other games, until you click \u003cstrong>Back to Tiny Glade\u003c/strong>, where Tiny Glade is the game the overlay is open over at that moment. The bar has the \u003cstrong>tabs of the chosen list\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/lists-per-game/05-chosen-by-hand.png","alt":"Brotato's list chosen by hand while the overlay is open over Tiny Glade"}},{"heading":"5. Reorder tabs and sites","html":"\u003cp>Drag a tab in the bar to move it: here the Tiny Glade Wiki is moved to the first place.\u003c/p>","image":{"src":"img/lists-per-game/06-drag.png","alt":"The Tiny Glade Wiki tab dragged to the first place"}},{"heading":"5. Reorder tabs and sites","html":"\u003cp>In the same way you can drag the sites in the Home: the order of the Home and of the tabs is the same.\u003c/p>","image":null},{"heading":"6. Remove a list","html":"\u003cp>\u003cstrong>Remove list\u003c/strong>, next to a list's name, deletes it with all its sites, after a confirmation:\u003c/p>","image":{"src":"img/lists-per-game/07-remove-list.png","alt":"The confirmation: remove the list \"Brotato\" and all its sites?"}},{"heading":"6. Remove a list","html":"\u003cp>If you then add a site while playing Brotato again, its list is created from scratch.\u003c/p>","image":null}]},{"id":"bookmarks","title":"Importing and exporting bookmarks","intro":"Do you already have your games' sites among your browser's bookmarks? You can import them into Overlay Browser's lists without typing them again, and export the lists to a bookmark file to open in any browser.","slides":[{"heading":null,"html":"\u003cp>Do you already have your games' sites among your browser's bookmarks? You can import them into Overlay Browser's lists without typing them again, and export the lists to a bookmark file to open in any browser.\u003c/p>\u003cp>Here the overlay is open over \u003cstrong>Brotato\u003c/strong>, whose list is still empty, and \u003cstrong>Tiny Glade\u003c/strong>'s list already has three sites (see \u003ca href=\"#lists-per-game\">One list per game\u003c/a>).\u003c/p>","image":null,"intro":true},{"heading":"1. The Bookmarks section of the Home","html":"\u003cp>At the bottom of the \u003cstrong>Home\u003c/strong> there is the \u003cem>Bookmarks\u003c/em> section, with \u003cstrong>Import bookmarks…\u003c/strong> \u003cspan class=\"num\">1\u003c/span> and \u003cstrong>Export bookmarks…\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/bookmarks/01-bookmarks-section.png","alt":"The Bookmarks section at the bottom of the Home"}},{"heading":"2. Choose the bookmarks to import","html":"\u003cp>Click \u003cstrong>Import bookmarks…\u003c/strong>. In the window:\u003c/p>\u003cul>\u003cli>\u003cstrong>From\u003c/strong> \u003cspan class=\"num\">1\u003c/span>: the browser to read the bookmarks from, one per profile. The overlay finds them by itself: Chrome, Edge, Brave, Opera, Vivaldi, Chromium, Firefox, LibreWolf and other similar browsers; Firefox can stay open. Next time it offers again the browser chosen last.\u003c/li>\u003cli>\u003cstrong>File…\u003c/strong> \u003cspan class=\"num\">2\u003c/span>: imports instead an HTML bookmark file, exported from any browser's bookmark manager. On macOS it is the only way: export the bookmarks from the browser first.\u003c/li>\u003cli>\u003cstrong>Search\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: finds bookmarks and folders by name or address.\u003c/li>\u003cli>\u003cstrong>The checkboxes\u003c/strong> \u003cspan class=\"num\">4\u003c/span>: tick single bookmarks or whole folders; \u003cem>All bookmarks\u003c/em> selects them all. Here we tick the \u003cem>Brotato\u003c/em> folder.\u003c/li>\u003cli>\u003cstrong>To the list\u003c/strong> \u003cspan class=\"num\">5\u003c/span>: the list to add them to, at first the active one. If it is still \u003cem>new\u003c/em>, like Brotato's here, it is created with the imported sites.\u003c/li>\u003cli>\u003cstrong>Add\u003c/strong> \u003cspan class=\"num\">6\u003c/span>: the button says how many sites you will add.\u003c/li>\u003c/ul>","image":{"src":"img/bookmarks/02-import.png","alt":"The import window with the Brotato folder ticked"}},{"heading":"2. Choose the bookmarks to import","html":"\u003cp>The bookmarks become sites of the list, with their names:\u003c/p>","image":{"src":"img/bookmarks/03-imported.png","alt":"The three sites imported into Brotato's list"}},{"heading":"3. Import from the \"+\"","html":"\u003cp>You can also import from the \u003cstrong>+\u003c/strong> in the top bar, in the \u003cstrong>Bookmarks\u003c/strong> tab \u003cspan class=\"num\">1\u003c/span>, next to \u003cem>Address\u003c/em>: here the sites always go to the active list. \u003cstrong>Search\u003c/strong> \u003cspan class=\"num\">2\u003c/span> finds the bookmarks; those whose address is \u003cstrong>already in the list\u003c/strong> \u003cspan class=\"num\">3\u003c/span> are grayed out and cannot be chosen, so importing twice creates no duplicates.\u003c/p>","image":{"src":"img/bookmarks/04-plus-bookmarks.png","alt":"The Bookmarks tab of the \"+\", with the bookmarks already in the list not selectable"}},{"heading":"4. Export the lists","html":"\u003cp>\u003cstrong>Export bookmarks…\u003c/strong>, in the \u003cem>Bookmarks\u003c/em> section of the Home, saves the lists' sites to an HTML bookmark file that any browser can import. Each list becomes a folder. At first \u003cstrong>all bookmarks\u003c/strong> \u003cspan class=\"num\">1\u003c/span> are chosen; in the \u003cstrong>list\u003c/strong> \u003cspan class=\"num\">2\u003c/span> you can leave out lists or sites. \u003cstrong>Export\u003c/strong> \u003cspan class=\"num\">3\u003c/span> asks where to save the file.\u003c/p>","image":{"src":"img/bookmarks/05-export.png","alt":"The export window with Brotato's and Tiny Glade's lists"}}]},{"id":"customizing","title":"Customizing the overlay","intro":"From the \u003cstrong>Settings\u003c/strong> page you choose the key combination, how the overlay behaves, its appearance and its language. Every change applies right away and is remembered.","slides":[{"heading":null,"html":"\u003cp>From the \u003cstrong>Settings\u003c/strong> page you choose the key combination, how the overlay behaves, its appearance and its language. Every change applies right away and is remembered.\u003c/p>","image":null,"intro":true},{"heading":"1. The key combination","html":"\u003cp>Open the \u003cstrong>Settings\u003c/strong> tab \u003cspan class=\"num\">1\u003c/span>, top right (or \u003cem>Settings\u003c/em> from the menu of the notification area icon). In the \u003cem>Keyboard\u003c/em> section you see the \u003cstrong>current combination\u003c/strong> \u003cspan class=\"num\">2\u003c/span> that shows and hides the overlay. \u003cstrong>Change\u003c/strong> \u003cspan class=\"num\">3\u003c/span> records a new one; \u003cstrong>Reset to default\u003c/strong> \u003cspan class=\"num\">4\u003c/span> goes back to the default one (Win+F10, Super+F10 on Linux, Cmd+Shift+Space on macOS).\u003c/p>","image":{"src":"img/customizing/01-shortcut.png","alt":"The Settings page, Keyboard section"}},{"heading":"1. The key combination","html":"\u003cp>After \u003cstrong>Change\u003c/strong>, press the combination you prefer, for example \u003ccode>Ctrl+Shift+O\u003c/code>; Esc cancels.\u003c/p>","image":{"src":"img/customizing/02-new-combination.png","alt":"The overlay waiting for the new combination"}},{"heading":"1. The key combination","html":"\u003cp>F1–F24 are allowed alone, otherwise any key together with Ctrl, Alt, Shift or Win (Super on Linux, Cmd on macOS). If the combination is already used by another program a message appears and the previous one stays.\u003c/p>\u003cblockquote>\u003cstrong>Careful in game:\u003c/strong> the combination also reaches the game, not only the overlay. Choose one that the game does not assign to any command, otherwise opening the overlay will trigger that command too.\u003c/blockquote>","image":null},{"heading":"2. Behavior","html":"\u003cp>In the \u003cem>Behavior\u003c/em> section:\u003c/p>\u003cul>\u003cli>\u003cstrong>Hide the overlay when it loses focus\u003c/strong> \u003cspan class=\"num\">1\u003c/span>: on by default, the overlay hides by itself when you click the game or another window. Turn it off if you want to keep it visible while playing; it then hides only with the key combination. The same option is also in the menu of the notification area icon.\u003c/li>\u003cli>\u003cstrong>Free browsing start page\u003c/strong> \u003cspan class=\"num\">2\u003c/span>: the page the Browse tab opens at first. Empty: no page (see \u003ca href=\"#free-browsing\">Free browsing\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Search engine\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: the one the Browse tab uses for texts that are not addresses: Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage, or \u003cem>Custom\u003c/em>, a search address with \u003ccode>%s\u003c/code> in place of the searched text.\u003c/li>\u003c/ul>\u003cp>Here there is also \u003cem>Check for new versions\u003c/em>, which tells you on the Home when a new version comes out (not in the Microsoft Store version, which updates by itself).\u003c/p>","image":{"src":"img/customizing/03-behavior.png","alt":"The Behavior section of the Settings"}},{"heading":"3. Appearance and language","html":"\u003cp>In the \u003cem>Appearance\u003c/em> section:\u003c/p>\u003cul>\u003cli>\u003cstrong>Accent color\u003c/strong> \u003cspan class=\"num\">1\u003c/span>: the color of the fixed tabs, of the main buttons and of the interface's details.\u003c/li>\u003cli>\u003cstrong>Fixed tabs\u003c/strong> \u003cspan class=\"num\">2\u003c/span>: Home, Browse and Settings with icon and name, or \u003cem>Icon only\u003c/em> to leave more room for the sites' tabs.\u003c/li>\u003cli>\u003cstrong>Window opacity\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: with lower values the window becomes transparent and you can see the game behind it (from 30% to 100%, that is opaque).\u003c/li>\u003c/ul>\u003cp>In the \u003cem>Language\u003c/em> section, \u003cstrong>Interface language\u003c/strong> \u003cspan class=\"num\">4\u003c/span>: by default \u003cem>System language\u003c/em>, that is the system's language if the app has it (Italian, English, French, Portuguese, Russian, Spanish and German), otherwise English.\u003c/p>","image":{"src":"img/customizing/04-appearance.png","alt":"The Appearance and Language sections of the Settings"}},{"heading":"3. Appearance and language","html":"\u003cp>Here is the overlay with the blue accent color and the \u003cstrong>fixed tabs with the icon only\u003c/strong> \u003cspan class=\"num\">1\u003c/span> \u003cspan class=\"num\">2\u003c/span>. The opacity does not show in the screenshot, which captures only the window and not the game behind it.\u003c/p>","image":{"src":"img/customizing/05-customized.png","alt":"The overlay with blue accent and icon-only fixed tabs"}},{"heading":"The other sections","html":"\u003cp>Further down, the \u003cem>Memory\u003c/em> section tells how much memory the app uses and after how long to close the pages you are not looking at; the \u003cem>Diagnostics\u003c/em> section helps collect information to attach to a problem report.\u003c/p>","image":null}]},{"id":"memory","title":"Memory and closed pages","intro":"Every page open in Overlay Browser uses memory, as in a browser, even when you are not looking at it: the pages of the other lists stay open until they are closed. Not to take memory away from the game, the overlay \u003cstrong>closes by itself the pages you have not used for a while\u003c/strong>, and in the Settings you can see how much memory it uses and close them by hand.","slides":[{"heading":null,"html":"\u003cp>Every page open in Overlay Browser uses memory, as in a browser, even when you are not looking at it: the pages of the other lists stay open until they are closed. Not to take memory away from the game, the overlay \u003cstrong>closes by itself the pages you have not used for a while\u003c/strong>, and in the Settings you can see how much memory it uses and close them by hand.\u003c/p>\u003cp>Here the lists of \u003cstrong>Tiny Glade\u003c/strong> and \u003cstrong>Brotato\u003c/strong> have several open pages (see \u003ca href=\"#lists-per-game\">One list per game\u003c/a>).\u003c/p>","image":null,"intro":true},{"heading":"1. Why a page reloads","html":"\u003cp>The pages you are not looking at (the other tabs, the pages of the other lists, and all of them while the overlay is hidden) stay open for a while, then they are closed. When you open the tab again, the page \u003cstrong>reloads from the last address visited\u003c/strong>: you find the page again, but not, for example, the point you had scrolled to or a half-filled form.\u003c/p>\u003cp>The page you are looking at is never closed.\u003c/p>","image":null},{"heading":"2. The Memory section","html":"\u003cp>Open the \u003cstrong>Settings\u003c/strong> and scroll down to the \u003cem>Memory\u003c/em> section:\u003c/p>\u003cul>\u003cli>\u003cstrong>Close unused pages after\u003c/strong> \u003cspan class=\"num\">1\u003c/span>: the time after which an unused page is closed, from 5 to 60 minutes (30 by default). With less free memory, or with heavy games, a shorter time is better.\u003c/li>\u003cli>\u003cstrong>Memory used\u003c/strong> \u003cspan class=\"num\">2\u003c/span>: the memory of the whole app.\u003c/li>\u003cli>\u003cstrong>Close all pages\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: closes right away all the open pages, of all the lists.\u003c/li>\u003cli>\u003cstrong>The app's processes\u003c/strong> \u003cspan class=\"num\">4\u003c/span>: the overlay interface, the main process, the graphics (GPU) and the other processes. This memory is always there.\u003c/li>\u003cli>\u003cstrong>The pages, grouped by list\u003c/strong> \u003cspan class=\"num\">5\u003c/span>: for each list, the memory of its open pages. \u003cstrong>Close\u003c/strong> closes all the pages of that list.\u003c/li>\u003c/ul>","image":{"src":"img/memory/01-memory.png","alt":"The Memory section of the Settings, with the lists of Tiny Glade and Brotato"}},{"heading":"3. The pages of a list","html":"\u003cp>Click a list's name to see its open pages, each with the memory it uses and the time left before it closes. \u003cstrong>Close\u003c/strong> next to the list \u003cspan class=\"num\">1\u003c/span> closes all its pages; \u003cstrong>Close\u003c/strong> next to a page \u003cspan class=\"num\">2\u003c/span> closes only that one.\u003c/p>","image":{"src":"img/memory/02-pages.png","alt":"The open pages of Tiny Glade's list, each with its Close button"}},{"heading":"3. The pages of a list","html":"\u003cp>Some pages share the same process, for example pages of the same site in different lists: they appear in a single row, outside the groups, and are closed together, because the memory is freed only when all of them are closed.\u003c/p>","image":null},{"heading":"4. After closing","html":"\u003cp>Here we closed Brotato's pages: its group is gone and the memory used went down. Brotato's tabs stay in its list: next time you open them, the pages reload.\u003c/p>","image":{"src":"img/memory/03-closed.png","alt":"The Memory section after closing Brotato's pages"}}]},{"id":"new-versions","title":"New versions","intro":"Overlay Browser checks by itself whether a new version is out and tells you; it does not update by itself: you download the new version when you want.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser checks by itself whether a new version is out and tells you; it does not update by itself: you download the new version when you want.\u003c/p>","image":null,"intro":true},{"heading":"1. The notice of a new version","html":"\u003cp>When a new version is out, a \u003cstrong>strip\u003c/strong> \u003cspan class=\"num\">1\u003c/span> with its number appears below the top bar. \u003cstrong>Download\u003c/strong> \u003cspan class=\"num\">2\u003c/span> opens in the system browser the new version's page, where you download the file for your system (see the installation in the \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a>). The \u003cstrong>×\u003c/strong> \u003cspan class=\"num\">3\u003c/span> closes the strip: for that version it does not come back.\u003c/p>\u003cp>The new version is also shown at the top of the \u003cstrong>Home\u003c/strong> \u003cspan class=\"num\">4\u003c/span>, next to the version you are using: click it to open the same page.\u003c/p>","image":{"src":"img/new-versions/01-new-version.png","alt":"The new version's strip below the bar and the version shown on the Home"}},{"heading":"1. The notice of a new version","html":"\u003cp>After you close the strip, the new version stays on the Home until you install the update:\u003c/p>","image":{"src":"img/new-versions/02-strip-closed.png","alt":"The Home with the new version shown next to the one in use"}},{"heading":"2. When it checks","html":"\u003cp>The app checks shortly after starting and then every 6 hours, on the project's releases on GitHub. If you use a beta version, it also tells you about newer betas; otherwise only about final versions.\u003c/p>\u003cp>Not to receive the notices, turn off \u003cstrong>Check for new versions\u003c/strong> in the \u003cstrong>Settings\u003c/strong>, \u003cem>Behavior\u003c/em> section. The Microsoft Store version does not have the option: its updates come from the Store.\u003c/p>","image":{"src":"img/new-versions/03-option.png","alt":"The Check for new versions option in the Settings"}}]},{"id":"signing-in","title":"Signing in to a site and cookies","intro":"Many game sites (forums, wikis, build tools) work better, or only, if you sign in with your account. In the overlay you sign in as in a browser, and the sign-in is remembered. If a site no longer works well, or you want to sign out of the account, you can delete its cookies.","slides":[{"heading":null,"html":"\u003cp>Many game sites (forums, wikis, build tools) work better, or only, if you sign in with your account. In the overlay you sign in as in a browser, and the sign-in is remembered. If a site no longer works well, or you want to sign out of the account, you can delete its cookies.\u003c/p>\u003cp>Here \u003cstrong>Tiny Glade\u003c/strong>'s list also has a forum. The forum is an \u003cstrong>example site\u003c/strong>, made for this guide: its sign-in works like the one of real sites, for example \u003cem>Continue with Google\u003c/em>.\u003c/p>","image":null,"intro":true},{"heading":"1. Sign in with your account","html":"\u003cp>Open the site's tab and click the button to sign in, here \u003cstrong>Continue with an account\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/01-forum.png","alt":"The example forum open in its tab, with the button to sign in"}},{"heading":"1. Sign in with your account","html":"\u003cp>The site opens its \u003cstrong>sign-in window\u003c/strong> over the overlay, as in a browser. Enter your details and confirm.\u003c/p>","image":{"src":"img/signing-in/02-sign-in-window.png","alt":"The sign-in window opened by the site over the overlay"}},{"heading":"1. Sign in with your account","html":"\u003cp>The sign-in window is part of the overlay: it stays over it, hides and shows again together with the overlay, and moving from one to the other does not hide it. When it closes, at the end of the sign-in, the overlay is active again.\u003c/p>","image":null},{"heading":"2. The sign-in is remembered","html":"\u003cp>Once signed in, the window closes and the site shows your \u003cstrong>account\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/03-signed-in.png","alt":"The forum signed in: the user's name at the top"}},{"heading":"2. The sign-in is remembered","html":"\u003cp>The sign-in stays even when you close the overlay or restart the app, as in a browser. The sites are the same for all the lists: if you sign in to a site in a game's list, you are already signed in in the other lists that have that site too.\u003c/p>","image":null},{"heading":"3. Delete a site's cookies","html":"\u003cp>Cookies are the data a site saves to remember you, including the sign-in. Deleting them is useful to \u003cstrong>sign out of an account\u003c/strong> (for example to sign in with another one) or when a site \u003cstrong>no longer works well\u003c/strong>.\u003c/p>\u003cp>In the site's tab click \u003cstrong>…\u003c/strong> (\u003cem>More actions\u003c/em>), right of the address, and choose \u003cstrong>Delete cookies for forum.example\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/04-menu.png","alt":"The More actions menu with the item Delete cookies for forum.example"}},{"heading":"3. Delete a site's cookies","html":"\u003cp>The overlay asks for confirmation: click \u003cstrong>Delete\u003c/strong>. The cookies of the site and of its subdomains are deleted, not those of other sites.\u003c/p>","image":{"src":"img/signing-in/05-confirm.png","alt":"The confirmation: delete the cookies of forum.example and its subdomains?"}},{"heading":"4. The page reloads","html":"\u003cp>After the deletion the page reloads: you are no longer signed in and the site offers to \u003cstrong>sign in\u003c/strong> again.\u003c/p>","image":{"src":"img/signing-in/06-signed-out.png","alt":"The forum reloaded after deleting the cookies, signed out again"}}]},{"id":"links-and-menu","title":"Links, new tabs and the context menu","intro":"In a browser many links open in a new tab. In the overlay the tabs are the list's sites, so these links go where they are useful: into the tab of the site they come from, or, after a question, into a new tab. The right click opens the menu to open a link in a new tab and to copy links, images and text.","slides":[{"heading":null,"html":"\u003cp>In a browser many links open in a new tab. In the overlay the tabs are the list's sites, so these links go where they are useful: into the tab of the site they come from, or, after a question, into a new tab. The right click opens the menu to open a link in a new tab and to copy links, images and text.\u003c/p>\u003cp>Here \u003cstrong>Tiny Glade\u003c/strong>'s list also has a forum, an \u003cstrong>example site\u003c/strong> made for this guide (see \u003ca href=\"#signing-in\">Signing in to a site and cookies\u003c/a>).\u003c/p>","image":null,"intro":true},{"heading":"1. A link the site opens in a new tab","html":"\u003cp>Some links are made to open in a new tab, like this forum thread. The same goes for links clicked with Ctrl or with the middle mouse button.\u003c/p>","image":{"src":"img/links-and-menu/01-link.png","alt":"The example forum, with the link to a thread"}},{"heading":"2. The same site: in its tab","html":"\u003cp>If the link leads to the same site, it opens in the \u003cstrong>site's tab\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, in place of the previous page: the \u003cstrong>address\u003c/strong> \u003cspan class=\"num\">2\u003c/span> now is the thread's. With \u003cstrong>Back\u003c/strong> you go back to the previous page.\u003c/p>","image":{"src":"img/links-and-menu/02-same-tab.png","alt":"The thread open in the forum's tab"}},{"heading":"2. The same site: in its tab","html":"\u003cp>If the list has several tabs of the same site, the link opens in the one it comes from.\u003c/p>","image":null},{"heading":"3. Another site: the question","html":"\u003cp>If the link leads to a site that has no tab in the list, here the community guides on Steam, the overlay asks whether to add it to the list: \u003cstrong>Add\u003c/strong> adds it as a new site and opens it; \u003cstrong>Cancel\u003c/strong> leaves everything as it is.\u003c/p>","image":{"src":"img/links-and-menu/03-other-site.png","alt":"The question: add to the list the site the page wants to open in a new tab?"}},{"heading":"3. Another site: the question","html":"\u003cp>Links opened from the \u003cstrong>Browse\u003c/strong> tab stay instead in the Browse tab (see \u003ca href=\"#free-browsing\">Free browsing\u003c/a>).\u003c/p>","image":null},{"heading":"4. Right click on a link","html":"\u003cp>A right click on a link opens the menu with \u003cstrong>Open link in new tab\u003c/strong> \u003cspan class=\"num\">1\u003c/span> and \u003cstrong>Copy link\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, which copies the link's address.\u003c/p>","image":{"src":"img/links-and-menu/04-link-menu.png","alt":"The right-click menu on a link: Open link in new tab, Copy link"}},{"heading":"4. Right click on a link","html":"\u003cp>\u003cstrong>Open link in new tab\u003c/strong> asks for confirmation before adding the link to the list: click \u003cstrong>Add\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/05-confirm-tab.png","alt":"The confirmation: add the link as a new tab of the Tiny Glade list?"}},{"heading":"4. Right click on a link","html":"\u003cp>The link becomes a \u003cstrong>new tab\u003c/strong>, right after the one it comes from, and opens. If a tab of the list is already on that address, the overlay shows that tab instead of adding another one.\u003c/p>","image":{"src":"img/links-and-menu/06-new-tab.png","alt":"The thread open in the new tab, right after the forum's"}},{"heading":"5. Right click on images and text","html":"\u003cp>On an image the menu has \u003cstrong>Copy image\u003c/strong>, to paste it elsewhere, for example in a chat. On a page's text there are \u003cstrong>Copy\u003c/strong>, for the selected text, and \u003cstrong>Select All\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/07-image-menu.png","alt":"The right-click menu on an image, with Copy image"}},{"heading":"5. Right click on images and text","html":"\u003cp>In text fields, like the forum's reply field or the tabs' address, the menu has \u003cstrong>Undo\u003c/strong>, \u003cstrong>Redo\u003c/strong>, \u003cstrong>Cut\u003c/strong>, \u003cstrong>Copy\u003c/strong>, \u003cstrong>Paste\u003c/strong> and \u003cstrong>Select All\u003c/strong>. The items not useful at that moment, for example \u003cem>Copy\u003c/em> with no text selected, are grayed out.\u003c/p>","image":{"src":"img/links-and-menu/08-field-menu.png","alt":"The right-click menu in a text field"}}]},{"id":"troubleshooting","title":"Troubleshooting","intro":"Here you find the solutions to the most common problems and how to collect the information useful to report one. For each system's details (Windows, Linux, macOS) the guide refers to the README.","slides":[{"heading":null,"html":"\u003cp>Here you find the solutions to the most common problems and how to collect the information useful to report one. For each system's details (Windows, Linux, macOS) the guide refers to the \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. The key combination does not work","html":"\u003cul>\u003cli>\u003cstrong>It is already used by another program.\u003c/strong> If you choose it in the Settings, the overlay tells you («invalid combination or already in use») and the previous one stays: choose another one (see \u003ca href=\"#customizing\">Customizing the overlay\u003c/a>).\u003c/li>\u003cli>\u003cstrong>The game uses it for one of its commands.\u003c/strong> The combination also reaches the game: choose one that does nothing in the game.\u003c/li>\u003cli>\u003cstrong>Linux with Wayland.\u003c/strong> The combination is not seen while a native Wayland window is active: an X11 session is needed (see \u003cem>Linux\u003c/em> in the \u003ca href=\"../../README.md#linux\" target=\"_blank\" rel=\"noopener\">README\u003c/a>).\u003c/li>\u003cli>\u003cstrong>macOS and function keys.\u003c/strong> By default F1–F12 control brightness, volume and so on: press them together with \u003cstrong>fn\u003c/strong>, or change the keyboard setting (see \u003cem>macOS\u003c/em> in the \u003ca href=\"../../README.md#macos\" target=\"_blank\" rel=\"noopener\">README\u003c/a>).\u003c/li>\u003c/ul>\u003cp>You can always show the overlay from the notification area icon as well.\u003c/p>","image":null},{"heading":"2. I cannot find the app's icon","html":"\u003cp>The app does not appear in the taskbar or in Alt+Tab: it is in the notification area, near the clock.\u003c/p>\u003cul>\u003cli>\u003cstrong>Windows:\u003c/strong> if you do not see it, click the \u003cstrong>^\u003c/strong> arrow and drag the icon onto the taskbar to keep it always visible.\u003c/li>\u003cli>\u003cstrong>Linux with GNOME:\u003c/strong> the \u003cem>AppIndicator and KStatusNotifierItem Support\u003c/em> extension is needed. In some environments clicking the icon opens the menu instead of showing the window: use the \u003cem>Show\u003c/em> item.\u003c/li>\u003cli>\u003cstrong>macOS:\u003c/strong> the icon is in the menu bar, top right.\u003c/li>\u003c/ul>","image":null},{"heading":"3. The overlay does not appear over the game, or is not transparent","html":"\u003cul>\u003cli>\u003cstrong>The game covers the overlay.\u003c/strong> Some games in &quot;exclusive&quot; fullscreen cover any window: set the game to \u003cem>borderless window\u003c/em> mode.\u003c/li>\u003cli>\u003cstrong>The window is not transparent (Linux).\u003c/strong> Transparency needs a window manager with compositing on (Cinnamon, KDE, GNOME, Xfce with compositing): without it, the window stays opaque.\u003c/li>\u003c/ul>","image":null},{"heading":"4. A site does not work well or a page reloads","html":"\u003cul>\u003cli>\u003cstrong>A site no longer works well, or you want to sign out of an account:\u003c/strong> delete the site's cookies from the \u003cstrong>…\u003c/strong> menu (see \u003ca href=\"#signing-in\">Signing in to a site and cookies\u003c/a>).\u003c/li>\u003cli>\u003cstrong>A page reloads when you go back to its tab:\u003c/strong> unused pages are closed after a while to free memory (see \u003ca href=\"#memory\">Memory and closed pages\u003c/a>).\u003c/li>\u003cli>\u003cstrong>You want to start over:\u003c/strong> quit the app and delete the preferences file (see \u003cem>Preferences and uninstalling\u003c/em> in the \u003ca href=\"../../README.md#preferences-and-uninstalling\" target=\"_blank\" rel=\"noopener\">README\u003c/a>).\u003c/li>\u003c/ul>","image":null},{"heading":"5. Collect the information for a report","html":"\u003cp>If a problem persists, you can report it on the \u003ca href=\"https://github.com/siculo/overlay-browser/issues\" target=\"_blank\" rel=\"noopener\">project's issues page\u003c/a>. The app's log file helps understand what happened.\u003c/p>\u003cp>In the \u003cstrong>Settings\u003c/strong>, \u003cem>Diagnostics\u003c/em> section:\u003c/p>\u003cul>\u003cli>\u003cstrong>Detailed log\u003c/strong> \u003cspan class=\"num\">1\u003c/span>: normally the log records only errors and crashes, with the current settings. When on, it also records what you do in the app (tabs, sites, lists, settings) and what happens to the overlay (shown and hidden, focus, key combination, foreground app). Turn it on, then repeat what causes the problem.\u003c/li>\u003cli>\u003cstrong>Show the log file\u003c/strong> \u003cspan class=\"num\">2\u003c/span>: opens the folder with the \u003ccode>overlay.log\u003c/code> file, to attach to the report.\u003c/li>\u003cli>\u003cstrong>Empty the log\u003c/strong> \u003cspan class=\"num\">3\u003c/span>: deletes the log's content, for example to record only the problem to report.\u003c/li>\u003c/ul>","image":{"src":"img/troubleshooting/01-diagnostics.png","alt":"The Diagnostics section of the Settings"}},{"heading":"5. Collect the information for a report","html":"\u003cp>The log never contains the keys you press or your browsing: no addresses or page titles. Sites are identified only by their position in the list.\u003c/p>\u003cp>\u003cstrong>Empty the log\u003c/strong> asks for confirmation before deleting it:\u003c/p>","image":{"src":"img/troubleshooting/02-empty-log.png","alt":"The confirmation: empty the log file?"}}]}],"strings":{"docTitle":"Overlay Browser · Guide","subtitle":"User guide, step by step","legend":"In the screenshots the elements mentioned in the text are highlighted by a red frame \u003cspan class=\"box\">\u003c/span>; numbers like \u003cspan class=\"num\">1\u003c/span> in the text point to the element with the same number in the screenshot.","menu":"Guides","menuTitle":"Back to the list of guides (Esc)","prev":"Back","prevTitle":"Previous slide (←)","next":"Next","nextTitle":"Next slide (→)","prevGuide":"Previous guide","nextGuide":"Next guide: {title}","backToGuides":"Back to the guides","guideOf":"Guide {n} of {total}","step":"Step {n}","slideOne":"1 slide","slideOther":"{count} slides"}};
const S = DATA.strings;   // testi della pagina nella lingua delle guide
const $ = (id) => document.getElementById(id);
const guides = DATA.guides;
const plural = (n) => (n === 1 ? S.slideOne : S.slideOther.replace('{count}', n));

// ---------- menu ----------
$('guides').replaceChildren(...guides.map((g, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${g.id}"><span class="n">${i + 1}</span><h2></h2><p>${g.intro}</p><span class="count">${plural(g.slides.length)}</span></a>`;
  li.querySelector('h2').textContent = g.title;
  return li;
}));

// ---------- slide ----------
// Indirizzo: #<guida>/<numero> (da 1); #<guida> = prima slide; vuoto = menu.
let current = null, index = 0;

function route() {
  const [id, n] = decodeURIComponent(location.hash.slice(1)).split('/');
  const g = guides.find((x) => x.id === id);
  closeZoom();
  if (!g) { showMenu(); return; }
  const i = Math.min(Math.max((Number(n) || 1) - 1, 0), g.slides.length - 1);
  const dir = g === current ? Math.sign(i - index) : 0;
  current = g;
  index = i;
  renderSlide(dir);
}

function showMenu() {
  current = null;
  $('deck').hidden = true;
  $('menu').hidden = false;
  document.title = S.docTitle;
}

const go = (i) => { location.hash = `${current.id}/${i + 1}`; };

function renderSlide(dir) {
  const g = current, s = g.slides[index];
  const gi = guides.indexOf(g), nextGuide = guides[gi + 1];
  $('menu').hidden = true;
  $('deck').hidden = false;
  document.title = `${g.title} · Overlay Browser`;
  $('guide-title').textContent = g.title;
  $('pos').textContent = `${index + 1} / ${g.slides.length}`;

  const el = $('slide');
  el.className = s.image ? 'with-image' : 'text-only';
  if (s.intro) el.classList.add('intro');
  const text = document.createElement('div');
  text.className = 'text';
  if (s.intro) {
    text.innerHTML = `<p class="section">${S.guideOf.replace('{n}', gi + 1).replace('{total}', guides.length)}</p><h2></h2>${s.html}`;
    text.querySelector('h2').textContent = g.title;
  } else {
    text.innerHTML = `<p class="section"></p><h2></h2>${s.html}`;
    const m = s.heading.match(/^(\d+)\.\s+(.*)$/);
    text.querySelector('.section').textContent = m ? S.step.replace('{n}', m[1]) : '';
    text.querySelector('h2').textContent = m ? m[2] : s.heading;
  }
  const parts = [text];
  if (s.image) {
    const fig = document.createElement('figure');
    fig.innerHTML = '<img><figcaption></figcaption>';
    fig.querySelector('img').src = s.image.src;
    fig.querySelector('img').alt = s.image.alt;
    fig.querySelector('figcaption').textContent = s.image.alt;
    fig.querySelector('img').onclick = () => openZoom(s.image);
    parts.push(fig);
  }
  el.replaceChildren(...parts);
  el.scrollTop = 0;
  el.classList.remove('enter');
  el.style.setProperty('--from', `${dir * 16}px`);
  if (dir) { void el.offsetWidth; el.classList.add('enter'); }

  $('dots').replaceChildren(...g.slides.map((x, i) => {
    const b = document.createElement('button');
    b.title = x.intro ? g.title : x.heading;
    b.setAttribute('aria-current', String(i === index));
    b.onclick = () => go(i);
    return b;
  }));
  $('prev').disabled = index === 0 && gi === 0;
  $('prev').textContent = index === 0 && gi > 0 ? `← ${S.prevGuide}` : `← ${S.prev}`;
  const last = index === g.slides.length - 1;
  $('next').textContent = !last ? `${S.next} →` : nextGuide ? `${S.nextGuide.replace('{title}', nextGuide.title)} →` : S.backToGuides;
}

function next() {
  if (index < current.slides.length - 1) return go(index + 1);
  const g = guides[guides.indexOf(current) + 1];
  location.hash = g ? g.id : '';
}
function prev() {
  if (index > 0) return go(index - 1);
  const g = guides[guides.indexOf(current) - 1];
  if (g) location.hash = `${g.id}/${g.slides.length}`;
}
$('next').onclick = next;
$('prev').onclick = prev;

// ---------- immagine a tutto schermo ----------
function openZoom(image) {
  $('zoom').querySelector('img').src = image.src;
  $('zoom').querySelector('img').alt = image.alt;
  $('zoom').hidden = false;
}
function closeZoom() { $('zoom').hidden = true; }
$('zoom').onclick = closeZoom;

// ---------- tastiera ----------
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!$('zoom').hidden) { if (e.key === 'Escape') closeZoom(); return; }
  if (!current) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) next();
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) prev();
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(current.slides.length - 1);
  else if (e.key === 'Escape') location.hash = '';
  else return;
  e.preventDefault();
});

window.addEventListener('hashchange', route);
route();
</script>
</body>
