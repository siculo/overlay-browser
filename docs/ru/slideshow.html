<!doctype html>
<!-- Modello della presentazione: build.js sostituisce i testi (segnaposti tra doppie graffe, da

<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay Browser · Руководство</title>
<link rel="icon" href="../../assets/icon.png">
<style>
  :root {
    --bg: #141414; --sheet: #1b1b1b; --line: #2c2c2c; --text: #e8e8e8; --muted: #9a9a9a;
    --accent: #f0a030; --accent-text: #f5b750; --on-accent: #111; --mark: #e5262b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 system-ui, sans-serif; }
  a { color: var(--accent-text); }
  code { font-family: ui-monospace, monospace; font-size: .9em; padding: 1px 5px; border-radius: 4px; background: #262626; }
  strong { color: #fff; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* Numeri come nelle schermate: bianco su cerchio rosso. */
  .num { display: inline-flex; align-items: center; justify-content: center; width: 1.45em; height: 1.45em;
         margin: 0 .1em; border-radius: 50%; background: var(--mark); color: #fff; border: 2px solid #fff;
         font-size: .72em; font-weight: 700; line-height: 1; vertical-align: .12em; }

  /* ---------- menu ---------- */
  #menu { max-width: 1100px; margin: 0 auto; padding: 48px 32px 64px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { height: 56px; }
  .brand h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; color: var(--muted); }
  .legend { margin: 28px 0 32px; padding: 12px 16px; border-left: 3px solid var(--mark); background: var(--sheet);
            color: #cfcfcf; border-radius: 0 6px 6px 0; }
  .legend .box { display: inline-block; width: 1.3em; height: .9em; border: 2px solid var(--mark); border-radius: 4px; vertical-align: -.05em; }
  #guides { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
            list-style: none; margin: 0; padding: 0; counter-reset: guide; }
  #guides a { display: flex; flex-direction: column; height: 100%; padding: 18px 20px; border: 1px solid var(--line);
              border-radius: 10px; background: var(--sheet); color: inherit; text-decoration: none;
              transition: border-color .15s, transform .15s; }
  #guides a:hover, #guides a:focus-visible { border-color: var(--accent); transform: translateY(-2px); outline: none; }
  #guides .n { color: var(--accent-text); font-weight: 700; font-size: 14px; }
  #guides h2 { margin: 4px 0 8px; font-size: 19px; font-weight: 600; line-height: 1.3; }
  #guides p { margin: 0 0 14px; color: #bdbdbd; font-size: 15px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #guides .count { margin-top: auto; }
  #guides .count { color: var(--muted); font-size: 13px; }

  /* ---------- slide ---------- */
  #deck { display: flex; flex-direction: column; height: 100%; }
  #deck header { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: #0e0e0e; }
  #deck header .title { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px solid #3a3a3a;
         border-radius: 6px; background: #232323; text-decoration: none; color: var(--text); white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  #slide { flex: 1; min-height: 0; padding: 28px 36px; overflow: auto; }
  #slide.with-image { display: grid; grid-template-columns: minmax(300px, 36%) 1fr; gap: 36px; align-items: center; }
  #slide.text-only { display: flex; align-items: center; justify-content: center; }
  #slide .text { max-height: 100%; overflow: auto; }
  #slide.text-only .text { max-width: 760px; font-size: 19px; }
  #slide .section { margin: 0 0 4px; color: var(--accent-text); font-size: 14px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  #slide h2 { margin: 0 0 14px; font-size: 26px; font-weight: 600; line-height: 1.25; }
  #slide.intro h2 { font-size: 34px; }
  #slide p { margin: 0 0 12px; }
  #slide ul { margin: 0 0 12px; padding-left: 1.2em; }
  #slide li { margin-bottom: 8px; }
  #slide blockquote { margin: 0 0 12px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--sheet); border-radius: 0 6px 6px 0; color: #d4d4d4; }
  #slide figure { margin: 0; min-height: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  #slide figure img { display: block; max-width: 100%; max-height: calc(100% - 2.2em); margin: 0 auto; object-fit: contain;
                      border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .5); cursor: zoom-in; }
  #slide figcaption { margin-top: 10px; text-align: center; color: var(--muted); font-size: 14px; }
  #deck footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); background: #0e0e0e; }
  #dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; background: #444; }
  #dots button[aria-current="true"] { background: var(--accent); }
  #pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  #slide.enter { animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateX(var(--from, 16px)); } }

  /* Immagine a tutto schermo */
  #zoom { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
          padding: 24px; background: rgba(0, 0, 0, .88); cursor: zoom-out; }
  #zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  @media (max-width: 820px) {
    #slide.with-image { grid-template-columns: 1fr; align-items: start; }
    #slide figure { height: auto; }
    #slide figure img { max-height: none; }
    #dots { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { #slide.enter { animation: none; } #guides a { transition: none; } }
</style>
</head>
<body>

<main id="menu" hidden>
  <div class="brand">
    <img src="../../assets/logo.png" alt="">
    <div>
      <h1>Overlay Browser</h1>
      <p>Руководство пользователя, шаг за шагом</p>
    </div>
  </div>
  <p class="legend">На снимках экрана элементы, упомянутые в тексте, выделены красной рамкой <span class="box"></span>; номера вроде <span class="num">1</span> в тексте указывают на элемент с тем же номером на снимке.</p>
  <ol id="guides"></ol>
</main>

<div id="deck" hidden>
  <header>
    <a class="btn" href="#" title="К списку руководств (Esc)">☰ Руководства</a>
    <span class="title" id="guide-title"></span>
    <span id="pos"></span>
  </header>
  <section id="slide" aria-live="polite"></section>
  <footer>
    <button class="btn" id="prev" title="Предыдущий слайд (←)">← Назад</button>
    <div id="dots" role="tablist"></div>
    <button class="btn primary" id="next" title="Следующий слайд (→)">Далее →</button>
  </footer>
</div>

<div id="zoom" hidden><img alt=""></div>

<script>
const DATA = {"guides":[{"id":"getting-started","title":"Первые шаги: сайты вашей игры под рукой","intro":"В этом руководстве вы откроете Overlay Browser во время игры в \u003cstrong>Tiny Glade\u003c/strong>, добавите пару полезных сайтов и научитесь показывать и скрывать их, не выходя из игры.","slides":[{"heading":null,"html":"\u003cp>В этом руководстве вы откроете Overlay Browser во время игры в \u003cstrong>Tiny Glade\u003c/strong>, добавите пару полезных сайтов и научитесь показывать и скрывать их, не выходя из игры.\u003c/p>","image":null,"intro":true},{"heading":"1. Запустите приложение","html":"\u003cp>Запустите Overlay Browser. Окно \u003cstrong>останется скрытым\u003c/strong>, а значок приложения появится в области уведомлений рядом с часами. На панели задач и в списке Alt+Tab приложения нет.\u003c/p>\u003cp>Затем запустите игру в оконном режиме или в режиме окна без рамки.\u003c/p>","image":null},{"heading":"2. Откройте оверлей поверх игры","html":"\u003cp>Во время игры нажмите \u003cstrong>Win+F10\u003c/strong> (Super+F10 в Linux, Cmd+Shift+Пробел в macOS). Оверлей откроется поверх игры на вкладке \u003cstrong>Главная\u003c/strong>.\u003c/p>\u003cp>Оверлей распознал игру. Вверху показан список \u003cstrong>Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span>. Он \u003cem>активный\u003c/em> и пока \u003cem>новый\u003c/em>. У каждой игры свой список сайтов. Он создаётся, когда вы добавляете первый сайт. В разделе \u003cem>Другие списки\u003c/em> есть список \u003cstrong>Общий\u003c/strong> \u003cspan class=\"num\">2\u003c/span>. Он активен, когда игра не открыта. Чтобы выбрать его вручную, нажмите \u003cstrong>Использовать\u003c/strong>.\u003c/p>","image":{"src":"img/getting-started/01-empty-home.png","alt":"Главная поверх Tiny Glade с пока пустым списком игры"}},{"heading":"3. Добавьте сайт","html":"\u003cp>Нажмите \u003cstrong>+\u003c/strong> \u003cspan class=\"num\">1\u003c/span> на верхней панели, введите \u003cstrong>адрес\u003c/strong> сайта \u003cspan class=\"num\">2\u003c/span> (достаточно \u003ccode>tinyglade.com\u003c/code>) и нажмите \u003cstrong>Добавить\u003c/strong> \u003cspan class=\"num\">3\u003c/span>.\u003c/p>","image":{"src":"img/getting-started/02-add-site.png","alt":"Окно добавления сайта с адресом tinyglade.com"}},{"heading":"3. Добавьте сайт","html":"\u003cp>Сайт сразу откроется в своей \u003cstrong>вкладке\u003c/strong> \u003cspan class=\"num\">1\u003c/span> с заголовком страницы. Нажмите \u003cstrong>×\u003c/strong>, чтобы закрыть вкладку. Ниже расположена панель навигации, как в браузере. Кнопки \u003cstrong>Назад\u003c/strong>, \u003cstrong>Вперёд\u003c/strong> и \u003cstrong>Обновить\u003c/strong> \u003cspan class=\"num\">2\u003c/span> управляют страницей. В поле \u003cstrong>адреса\u003c/strong> \u003cspan class=\"num\">3\u003c/span> можно ввести другой адрес и нажать Enter. Кнопка \u003cstrong>Закрепить\u003c/strong> \u003cspan class=\"num\">4\u003c/span> превращает найденную страницу в новую вкладку.\u003c/p>","image":{"src":"img/getting-started/03-site-open.png","alt":"Официальный сайт Tiny Glade в своей вкладке"}},{"heading":"4. Добавьте ещё сайты с главной страницы","html":"\u003cp>Откройте вкладку \u003cstrong>Главная\u003c/strong>, чтобы увидеть сайты списка. Нажмите \u003cstrong>название сайта\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, чтобы открыть его, \u003cstrong>Изменить\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, чтобы поменять адрес (Enter сохраняет, Esc отменяет), или \u003cstrong>Удалить\u003c/strong> \u003cspan class=\"num\">3\u003c/span>, чтобы убрать сайт из списка. Для добавления введите адрес в \u003cstrong>поле под списком\u003c/strong> \u003cspan class=\"num\">4\u003c/span> и нажмите \u003cem>Добавить\u003c/em>. В примере мы добавили страницу игры в Steam.\u003c/p>","image":{"src":"img/getting-started/04-home-with-sites.png","alt":"Главная с двумя сайтами в списке Tiny Glade"}},{"heading":"5. Переключайтесь между сайтами","html":"\u003cp>У каждого сайта своя вкладка. Здесь видны \u003cstrong>официальный сайт\u003c/strong> \u003cspan class=\"num\">1\u003c/span> и \u003cstrong>страница Steam\u003c/strong> \u003cspan class=\"num\">2\u003c/span>, которая сейчас открыта. Вернувшись к вкладке, вы найдёте страницу там, где её оставили.\u003c/p>","image":{"src":"img/getting-started/05-two-tabs.png","alt":"Страница Tiny Glade в Steam открыта во второй вкладке"}},{"heading":"6. Вернитесь к игре","html":"\u003cp>Снова нажмите \u003cstrong>Win+F10\u003c/strong>, чтобы скрыть оверлей, или щёлкните по окну игры. По умолчанию оверлей скрывается при потере фокуса. Это можно отключить в настройках.\u003c/p>\u003cp>Когда вы снова откроете оверлей поверх Tiny Glade, его список откроется на последней использованной вкладке. Поверх другой игры появится список этой игры.\u003c/p>","image":null}]},{"id":"free-browsing","title":"Свободный просмотр: поиск и закрепление страниц","intro":"Во вкладке \u003cstrong>Обзор\u003c/strong> можно искать и открывать любые страницы без добавления в список. Если хотите сохранить страницу, кнопка \u003cstrong>Закрепить\u003c/strong> сделает её вкладкой в списке игры.","slides":[{"heading":null,"html":"\u003cp>Во вкладке \u003cstrong>Обзор\u003c/strong> можно искать и открывать любые страницы без добавления в список. Если хотите сохранить страницу, кнопка \u003cstrong>Закрепить\u003c/strong> сделает её вкладкой в списке игры.\u003c/p>\u003cp>Продолжим пример из руководства \u003ca href=\"#getting-started\">Первые шаги\u003c/a>. Оверлей открыт поверх \u003cstrong>Tiny Glade\u003c/strong>, в списке уже есть два сайта, и теперь мы ищем вики игры.\u003c/p>","image":null,"intro":true},{"heading":"1. Откройте вкладку «Обзор»","html":"\u003cp>Нажмите \u003cstrong>Обзор\u003c/strong> \u003cspan class=\"num\">1\u003c/span> рядом с главной страницей. В \u003cstrong>поле адреса\u003c/strong> \u003cspan class=\"num\">2\u003c/span> введите адрес (достаточно \u003ccode>example.com\u003c/code>) или поисковый запрос. Оверлей предлагает в качестве примера \u003cstrong>название игры\u003c/strong> \u003cspan class=\"num\">3\u003c/span>. Нажмите на него, чтобы запустить поиск.\u003c/p>","image":{"src":"img/free-browsing/01-browse.png","alt":"Пустая вкладка «Обзор» с полем адреса и примером запроса Tiny Glade"}},{"heading":"2. Найдите страницу","html":"\u003cp>Введите \u003ccode>tiny glade wiki\u003c/code> и нажмите Enter. Результаты откроются во вкладке, а \u003cstrong>поле адреса\u003c/strong> \u003cspan class=\"num\">1\u003c/span> покажет адрес страницы результатов.\u003c/p>\u003cp>Поисковую систему можно выбрать в настройках, в разделе \u003cem>Поведение\u003c/em>. Доступны Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage и собственный адрес. Здесь мы используем DuckDuckGo.\u003c/p>\u003cp>Нажмите на нужный результат, в нашем примере \u003cstrong>Tiny Glade Wiki\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/02-results.png","alt":"Результаты поиска tiny glade wiki со ссылкой на Tiny Glade Wiki"}},{"heading":"3. Закрепите страницу","html":"\u003cp>Страница откроется во вкладке «Обзор» и будет работать как в браузере. Кнопка \u003cstrong>Назад\u003c/strong> \u003cspan class=\"num\">1\u003c/span> вернёт вас к результатам поиска. Чтобы сохранить страницу, нажмите \u003cstrong>Закрепить\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/free-browsing/03-page-found.png","alt":"Tiny Glade Wiki открыта во вкладке «Обзор»"}},{"heading":"3. Закрепите страницу","html":"\u003cp>Оверлей попросит подтверждение. Нажмите \u003cstrong>Закрепить\u003c/strong>.\u003c/p>","image":{"src":"img/free-browsing/04-confirm.png","alt":"Подтверждение закрепления Tiny Glade Wiki в новой вкладке списка Tiny Glade"}},{"heading":"4. Страница стала вкладкой списка","html":"\u003cp>Страница вместе с историей станет \u003cstrong>новой вкладкой\u003c/strong> \u003cspan class=\"num\">1\u003c/span> в конце списка Tiny Glade. Вы найдёте её там при каждом открытии оверлея поверх игры. Кнопка \u003cstrong>Закрепить\u003c/strong> \u003cspan class=\"num\">2\u003c/span> недоступна, потому что страница уже в списке.\u003c/p>","image":{"src":"img/free-browsing/05-pinned.png","alt":"Tiny Glade Wiki в новой вкладке с недоступной кнопкой «Закрепить»"}},{"heading":"4. Страница стала вкладкой списка","html":"\u003cp>Закреплять страницы можно и во вкладках сайтов. Новая вкладка появится сразу после исходной. Если страница уже есть в списке, её вкладка подсвечивается, а кнопка «Закрепить» недоступна.\u003c/p>","image":null},{"heading":"5. Вкладка «Обзор» снова свободна","html":"\u003cp>Вернувшись в \u003cstrong>Обзор\u003c/strong>, вы увидите пустую вкладку, готовую к новому поиску. Закреплённая страница переместилась в свою вкладку. Во время просмотра кнопка \u003cstrong>Вернуться на начальную страницу\u003c/strong> \u003cspan class=\"num\">1\u003c/span> закрывает открытую страницу и возвращает пустой экран.\u003c/p>","image":{"src":"img/free-browsing/06-browse-again.png","alt":"Вкладка «Обзор» снова пуста"}},{"heading":"5. Вкладка «Обзор» снова свободна","html":"\u003cp>В настройках, в разделе \u003cem>Поведение\u003c/em>, можно задать параметр \u003cstrong>Начальная страница свободного просмотра\u003c/strong>. Она будет открываться вместо пустого экрана.\u003c/p>","image":null},{"heading":"Адреса других сайтов во вкладках сайтов","html":"\u003cp>Во вкладках сайтов тоже можно вводить адреса. Страница того же сайта откроется в текущей вкладке. Адрес другого сайта или поисковый запрос откроется во вкладке «Обзор» после подтверждения. Исходная вкладка сохранит свою страницу.\u003c/p>","image":null}]},{"id":"lists-per-game","title":"У каждой игры свой список","intro":"Overlay Browser распознаёт игру, поверх которой вы его открыли, и показывает её сайты. У каждой игры свой \u003cstrong>список\u003c/strong>. После первых шагов и свободного просмотра в списке \u003cstrong>Tiny Glade\u003c/strong> уже три сайта. Теперь запустим \u003cstrong>Brotato\u003c/strong>.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser распознаёт игру, поверх которой вы его открыли, и показывает её сайты. У каждой игры свой \u003cstrong>список\u003c/strong>. После \u003ca href=\"#getting-started\">первых шагов\u003c/a> и \u003ca href=\"#free-browsing\">свободного просмотра\u003c/a> в списке \u003cstrong>Tiny Glade\u003c/strong> уже три сайта. Теперь запустим \u003cstrong>Brotato\u003c/strong>.\u003c/p>","image":null,"intro":true},{"heading":"1. Новая игра, новый список","html":"\u003cp>Откройте оверлей во время игры в Brotato. Вверху главной страницы находится \u003cstrong>список Brotato\u003c/strong> \u003cspan class=\"num\">1\u003c/span>. Он \u003cem>активный\u003c/em> и пока \u003cem>новый\u003c/em>. Рядом с названием указаны распознанная программа и число сайтов. Добавьте сайт через \u003cstrong>поле под списком\u003c/strong> \u003cspan class=\"num\">2\u003c/span> или через \u003cstrong>+\u003c/strong> на верхней панели. Список создастся вместе с первым сайтом. \u003cstrong>Список Tiny Glade\u003c/strong> \u003cspan class=\"num\">3\u003c/span> свёрнут в разделе \u003cem>Другие списки\u003c/em>. Нажмите на него, чтобы увидеть сайты.\u003c/p>","image":{"src":"img/lists-per-game/01-brotato-new.png","alt":"Главная поверх Brotato с новым списком игры и списком Tiny Glade среди остальных"}},{"heading":"1. Новая игра, новый список","html":"\u003cp>Добавим вики Brotato и страницу игры в Steam. Теперь на панели видны только вкладки Brotato.\u003c/p>","image":{"src":"img/lists-per-game/02-brotato-wiki.png","alt":"Вкладки списка Brotato"}},{"heading":"2. У каждой игры свои сайты","html":"\u003cp>Вернитесь в Tiny Glade и откройте оверлей. На панели видны \u003cstrong>вкладки Tiny Glade\u003c/strong> \u003cspan class=\"num\">1\u003c/span>, а \u003cstrong>список Tiny Glade\u003c/strong> \u003cspan class=\"num\">2\u003c/span> активен. \u003cstrong>Список Brotato\u003c/strong> \u003cspan class=\"num\">3\u003c/span> переместился в раздел \u003cem>Другие списки\u003c/em>. Кнопка \u003cstrong>Использовать\u003c/strong> \u003cspan class=\"num\">4\u003c/span> позволяет выбрать его вручную (см. шаг 4). Каждый список открывается на той вкладке, которой вы пользовались в последний раз.\u003c/p>","image":{"src":"img/lists-per-game/03-tiny-glade.png","alt":"Главная поверх Tiny Glade с её вкладками и списком Brotato среди остальных"}},{"heading":"3. Общий список","html":"\u003cp>Оверлей предлагает список для любой программы, поверх которой вы его открываете. Если программа не распознана, активен \u003cstrong>список Общий\u003c/strong>. В нём удобно держать сайты, которые не относятся к конкретной программе. Он работает так же, как другие списки, и его нельзя удалить.\u003c/p>","image":{"src":"img/lists-per-game/04-general.png","alt":"Список «Общий» активен, когда приложение не распознано"}},{"heading":"4. Выберите список вручную","html":"\u003cp>Иногда нужны сайты другой игры, например вики Brotato, пока открыта Tiny Glade. Нажмите \u003cstrong>Использовать\u003c/strong> рядом с нужным списком (\u003cspan class=\"num\">4\u003c/span> на снимке к шагу 2).\u003c/p>\u003cp>Появится надпись \u003cstrong>Список выбран вручную\u003c/strong> \u003cspan class=\"num\">1\u003c/span>. Выбранный список остаётся активным, даже если вы откроете оверлей поверх другой игры. Нажмите \u003cstrong>Вернуться к Tiny Glade\u003c/strong>, чтобы вернуться к списку игры, поверх которой сейчас открыт оверлей. На панели видны \u003cstrong>вкладки выбранного списка\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/lists-per-game/05-chosen-by-hand.png","alt":"Список Brotato выбран вручную, пока оверлей открыт поверх Tiny Glade"}},{"heading":"5. Измените порядок вкладок и сайтов","html":"\u003cp>Перетащите вкладку в нужное место на панели. В примере Tiny Glade Wiki перемещается на первое место.\u003c/p>","image":{"src":"img/lists-per-game/06-drag.png","alt":"Вкладку Tiny Glade Wiki перетаскивают на первое место"}},{"heading":"5. Измените порядок вкладок и сайтов","html":"\u003cp>Так же можно перетаскивать сайты на главной странице. Порядок сайтов и вкладок совпадает.\u003c/p>","image":null},{"heading":"6. Удалите список","html":"\u003cp>Кнопка \u003cstrong>Удалить список\u003c/strong> рядом с названием удаляет список со всеми сайтами после подтверждения.\u003c/p>","image":{"src":"img/lists-per-game/07-remove-list.png","alt":"Подтверждение удаления списка Brotato и всех его сайтов"}},{"heading":"6. Удалите список","html":"\u003cp>Если вы снова добавите сайт во время игры в Brotato, список будет создан заново.\u003c/p>","image":null}]},{"id":"bookmarks","title":"Импорт и экспорт закладок","intro":"Сайты ваших игр уже есть в закладках браузера? Их можно импортировать в списки Overlay Browser без повторного ввода адресов. Списки можно экспортировать в файл закладок для любого браузера.","slides":[{"heading":null,"html":"\u003cp>Сайты ваших игр уже есть в закладках браузера? Их можно импортировать в списки Overlay Browser без повторного ввода адресов. Списки можно экспортировать в файл закладок для любого браузера.\u003c/p>\u003cp>Оверлей открыт поверх \u003cstrong>Brotato\u003c/strong>, список которого пока пуст. В списке \u003cstrong>Tiny Glade\u003c/strong> уже три сайта. См. \u003ca href=\"#lists-per-game\">У каждой игры свой список\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Раздел «Закладки» на главной","html":"\u003cp>Внизу вкладки \u003cstrong>Главная\u003c/strong> находится раздел \u003cem>Закладки\u003c/em> с кнопками \u003cstrong>Импорт закладок…\u003c/strong> \u003cspan class=\"num\">1\u003c/span> и \u003cstrong>Экспорт закладок…\u003c/strong> \u003cspan class=\"num\">2\u003c/span>.\u003c/p>","image":{"src":"img/bookmarks/01-bookmarks-section.png","alt":"Раздел «Закладки» внизу главной страницы"}},{"heading":"2. Выберите закладки для импорта","html":"\u003cp>Нажмите \u003cstrong>Импорт закладок…\u003c/strong>. В окне есть несколько элементов.\u003c/p>\u003cul>\u003cli>\u003cstrong>Откуда\u003c/strong> \u003cspan class=\"num\">1\u003c/span> выбирает профиль браузера. Оверлей автоматически находит Chrome, Edge, Brave, Opera, Vivaldi, Chromium, Firefox, LibreWolf и похожие браузеры. Firefox можно оставить открытым. При следующем импорте будет предложен последний выбранный профиль.\u003c/li>\u003cli>\u003cstrong>Файл…\u003c/strong> \u003cspan class=\"num\">2\u003c/span> импортирует HTML-файл, экспортированный из менеджера закладок любого браузера. В macOS доступен только этот способ. Сначала экспортируйте закладки из браузера.\u003c/li>\u003cli>\u003cstrong>Поиск по закладкам…\u003c/strong> \u003cspan class=\"num\">3\u003c/span> находит закладки и папки по названию или адресу.\u003c/li>\u003cli>\u003cstrong>Флажки\u003c/strong> \u003cspan class=\"num\">4\u003c/span> позволяют выбирать отдельные закладки и целые папки. \u003cem>Все закладки\u003c/em> выбирает их все. В примере отмечаем папку \u003cem>Brotato\u003c/em>.\u003c/li>\u003cli>\u003cstrong>В список\u003c/strong> \u003cspan class=\"num\">5\u003c/span> задаёт, куда добавлять сайты. Изначально выбран активный список. Если он ещё \u003cem>новый\u003c/em>, как у Brotato, он будет создан вместе с импортированными сайтами.\u003c/li>\u003cli>Кнопка \u003cstrong>Добавить сайты: 3\u003c/strong> \u003cspan class=\"num\">6\u003c/span> показывает, сколько сайтов будет добавлено.\u003c/li>\u003c/ul>","image":{"src":"img/bookmarks/02-import.png","alt":"Окно импорта с выбранной папкой Brotato"}},{"heading":"2. Выберите закладки для импорта","html":"\u003cp>Закладки появятся в списке как сайты под своими названиями.\u003c/p>","image":{"src":"img/bookmarks/03-imported.png","alt":"Три сайта импортированы в список Brotato"}},{"heading":"3. Импортируйте через «+»","html":"\u003cp>Импорт доступен и через \u003cstrong>+\u003c/strong> на верхней панели. Откройте вкладку \u003cstrong>Закладки\u003c/strong> \u003cspan class=\"num\">1\u003c/span> рядом с вкладкой \u003cem>Адрес\u003c/em>. Здесь сайты добавляются в активный список. \u003cstrong>Поиск по закладкам…\u003c/strong> \u003cspan class=\"num\">2\u003c/span> помогает найти нужные записи. Закладки с адресом, который \u003cstrong>уже в списке\u003c/strong> \u003cspan class=\"num\">3\u003c/span>, отображаются серым и недоступны для выбора. Так повторный импорт не создаёт дубликатов.\u003c/p>","image":{"src":"img/bookmarks/04-plus-bookmarks.png","alt":"Вкладка «Закладки» в окне «+» с недоступными для выбора закладками, которые уже в списке"}},{"heading":"4. Экспортируйте списки","html":"\u003cp>Кнопка \u003cstrong>Экспорт закладок…\u003c/strong> в разделе \u003cem>Закладки\u003c/em> на главной сохраняет сайты в HTML-файл, который можно импортировать в любой браузер. Каждый список станет папкой. Изначально выбраны \u003cstrong>Все закладки\u003c/strong> \u003cspan class=\"num\">1\u003c/span>. В \u003cstrong>списке\u003c/strong> \u003cspan class=\"num\">2\u003c/span> можно снять отметку с отдельных сайтов или списков. Кнопка \u003cstrong>Экспортировать сайты: 6\u003c/strong> \u003cspan class=\"num\">3\u003c/span> открывает выбор места для сохранения файла.\u003c/p>","image":{"src":"img/bookmarks/05-export.png","alt":"Окно экспорта со списками Brotato и Tiny Glade"}}]},{"id":"customizing","title":"Настройка оверлея","intro":"В разделе \u003cstrong>Настройки\u003c/strong> вы можете выбрать сочетание клавиш, изменить поведение, внешний вид и язык оверлея. Изменения применяются сразу и сохраняются.","slides":[{"heading":null,"html":"\u003cp>В разделе \u003cstrong>Настройки\u003c/strong> вы можете выбрать сочетание клавиш, изменить поведение, внешний вид и язык оверлея. Изменения применяются сразу и сохраняются.\u003c/p>","image":null,"intro":true},{"heading":"1. Сочетание клавиш","html":"\u003cp>Откройте \u003cstrong>Настройки\u003c/strong> \u003cspan class=\"num\">1\u003c/span> вверху справа или через меню значка в области уведомлений. В разделе \u003cem>Клавиатура\u003c/em> указано \u003cstrong>текущее сочетание\u003c/strong> \u003cspan class=\"num\">2\u003c/span> для показа и скрытия оверлея. \u003cstrong>Изменить\u003c/strong> \u003cspan class=\"num\">3\u003c/span> записывает новое сочетание. \u003cstrong>По умолчанию\u003c/strong> \u003cspan class=\"num\">4\u003c/span> возвращает исходное (Win+F10, Super+F10 в Linux, Cmd+Shift+Пробел в macOS).\u003c/p>","image":{"src":"img/customizing/01-shortcut.png","alt":"Раздел «Клавиатура» в настройках"}},{"heading":"1. Сочетание клавиш","html":"\u003cp>Нажмите \u003cstrong>Изменить\u003c/strong>, затем нужное сочетание, например \u003ccode>Ctrl+Shift+O\u003c/code>. Для отмены нажмите Esc.\u003c/p>","image":{"src":"img/customizing/02-new-combination.png","alt":"Оверлей ждёт ввода нового сочетания"}},{"heading":"1. Сочетание клавиш","html":"\u003cp>Клавиши F1–F24 можно использовать отдельно. Другие клавиши сочетайте с Ctrl, Alt, Shift или Win (Super в Linux, Cmd в macOS). Если сочетание занято другой программой, появится сообщение, а прежнее сочетание сохранится.\u003c/p>\u003cblockquote>\u003cstrong>Во время игры.\u003c/strong> Сочетание получает и сама игра. Выберите сочетание, которому в игре не назначена команда, чтобы при открытии оверлея случайно её не выполнить.\u003c/blockquote>","image":null},{"heading":"2. Поведение","html":"\u003cp>В разделе \u003cem>Поведение\u003c/em> доступны следующие параметры.\u003c/p>\u003cul>\u003cli>\u003cstrong>Скрывать оверлей при потере фокуса\u003c/strong> \u003cspan class=\"num\">1\u003c/span> включено по умолчанию. Оверлей скрывается, когда вы нажимаете на игру или другое окно. Отключите этот параметр, если хотите оставить оверлей видимым во время игры. Сочетание клавиш по-прежнему позволяет скрыть оверлей. Этот параметр есть и в меню значка в области уведомлений.\u003c/li>\u003cli>\u003cstrong>Начальная страница свободного просмотра\u003c/strong> \u003cspan class=\"num\">2\u003c/span> определяет, какую страницу вкладка «Обзор» открывает первой. Если оставить поле пустым, страница не откроется. См. \u003ca href=\"#free-browsing\">Свободный просмотр\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Поисковая система\u003c/strong> \u003cspan class=\"num\">3\u003c/span> определяет, где искать текст, введённый во вкладке «Обзор». Доступны Google, Bing, DuckDuckGo, Brave Search, Ecosia, Startpage и вариант \u003cem>Другая\u003c/em>. В собственном адресе поиска укажите \u003ccode>%s\u003c/code> вместо текста запроса.\u003c/li>\u003c/ul>\u003cp>Параметр \u003cem>Проверять новые версии\u003c/em> выводит уведомление на главной, когда выходит новая версия. Версия из Microsoft Store обновляется через магазин.\u003c/p>","image":{"src":"img/customizing/03-behavior.png","alt":"Раздел «Поведение» в настройках"}},{"heading":"3. Внешний вид и язык","html":"\u003cp>В разделе \u003cem>Внешний вид\u003c/em> доступны следующие параметры.\u003c/p>\u003cul>\u003cli>\u003cstrong>Акцентный цвет\u003c/strong> \u003cspan class=\"num\">1\u003c/span> меняет цвет постоянных вкладок, основных кнопок и других элементов.\u003c/li>\u003cli>\u003cstrong>Постоянные вкладки\u003c/strong> \u003cspan class=\"num\">2\u003c/span> показывает значок и название вкладок «Главная», «Обзор» и «Настройки». Вариант \u003cem>Только значок\u003c/em> оставляет больше места вкладкам сайтов.\u003c/li>\u003cli>\u003cstrong>Непрозрачность окна\u003c/strong> \u003cspan class=\"num\">3\u003c/span> можно менять от 30% до 100%. При меньшем значении через окно видно игру.\u003c/li>\u003c/ul>\u003cp>В разделе \u003cem>Язык\u003c/em> параметр \u003cstrong>Язык интерфейса\u003c/strong> \u003cspan class=\"num\">4\u003c/span> по умолчанию использует \u003cem>Язык системы\u003c/em>, если приложение его поддерживает (итальянский, английский, французский, португальский, русский, испанский и немецкий). В остальных случаях используется английский.\u003c/p>","image":{"src":"img/customizing/04-appearance.png","alt":"Разделы «Внешний вид» и «Язык» в настройках"}},{"heading":"3. Внешний вид и язык","html":"\u003cp>Здесь у оверлея синий акцентный цвет, а у \u003cstrong>постоянных вкладок только значки\u003c/strong> \u003cspan class=\"num\">1\u003c/span> \u003cspan class=\"num\">2\u003c/span>. Снимок показывает само окно, поэтому игру за ним и эффект прозрачности здесь не видно.\u003c/p>","image":{"src":"img/customizing/05-customized.png","alt":"Оверлей с синим акцентным цветом и постоянными вкладками в виде значков"}},{"heading":"Другие разделы","html":"\u003cp>Ниже раздел \u003cem>Память\u003c/em> показывает, сколько памяти использует приложение и когда закрываются неиспользуемые страницы. Раздел \u003cem>Диагностика\u003c/em> помогает собрать сведения для сообщения о проблеме.\u003c/p>","image":null}]},{"id":"memory","title":"Память и закрытие страниц","intro":"Как и в браузере, каждая открытая страница Overlay Browser использует память, даже если вы на неё не смотрите. Это касается и открытых страниц из других списков. Чтобы освободить память для игры, оверлей \u003cstrong>сам закрывает страницы, которыми вы давно не пользовались\u003c/strong>. В настройках можно посмотреть расход памяти и закрыть страницы вручную.","slides":[{"heading":null,"html":"\u003cp>Как и в браузере, каждая открытая страница Overlay Browser использует память, даже если вы на неё не смотрите. Это касается и открытых страниц из других списков. Чтобы освободить память для игры, оверлей \u003cstrong>сам закрывает страницы, которыми вы давно не пользовались\u003c/strong>. В настройках можно посмотреть расход памяти и закрыть страницы вручную.\u003c/p>\u003cp>В примере в списках \u003cstrong>Tiny Glade\u003c/strong> и \u003cstrong>Brotato\u003c/strong> открыто несколько страниц. См. \u003ca href=\"#lists-per-game\">У каждой игры свой список\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Почему страница загружается заново","html":"\u003cp>Страницы, которые вы не просматриваете, остаются открытыми некоторое время, а затем закрываются. Это относится к другим вкладкам, страницам из других списков и ко всем страницам, пока оверлей скрыт. Когда вы снова откроете вкладку, страница \u003cstrong>загрузится по последнему посещённому адресу\u003c/strong>. Вы вернётесь на страницу, но положение прокрутки или частично заполненная форма могут потеряться.\u003c/p>\u003cp>Страница, которую вы просматриваете, остаётся открытой.\u003c/p>","image":null},{"heading":"2. Раздел «Память»","html":"\u003cp>Откройте \u003cstrong>Настройки\u003c/strong> и прокрутите до раздела \u003cem>Память\u003c/em>.\u003c/p>\u003cul>\u003cli>\u003cstrong>Закрывать неиспользуемые страницы через\u003c/strong> \u003cspan class=\"num\">1\u003c/span> задаёт время ожидания от 5 до 60 минут. По умолчанию это 30 минут. Если свободной памяти мало или игра требовательная, выберите меньшее время.\u003c/li>\u003cli>\u003cstrong>Используемая память\u003c/strong> \u003cspan class=\"num\">2\u003c/span> показывает расход памяти всего приложения.\u003c/li>\u003cli>\u003cstrong>Закрыть все страницы\u003c/strong> \u003cspan class=\"num\">3\u003c/span> сразу закрывает открытые страницы во всех списках.\u003c/li>\u003cli>\u003cstrong>Процессы приложения\u003c/strong> \u003cspan class=\"num\">4\u003c/span> включают интерфейс оверлея, основной процесс, графику (GPU) и другие процессы. Они всегда занимают память.\u003c/li>\u003cli>\u003cstrong>Страницы по спискам\u003c/strong> \u003cspan class=\"num\">5\u003c/span> показывает память открытых страниц каждого списка. Кнопка \u003cstrong>Закрыть\u003c/strong> закрывает все страницы этого списка.\u003c/li>\u003c/ul>","image":{"src":"img/memory/01-memory.png","alt":"Раздел «Память» со списками Tiny Glade и Brotato"}},{"heading":"3. Страницы одного списка","html":"\u003cp>Нажмите название списка, чтобы увидеть открытые страницы, расход памяти каждой из них и время до закрытия. Кнопка \u003cstrong>Закрыть\u003c/strong> рядом со списком \u003cspan class=\"num\">1\u003c/span> закрывает все его страницы. Кнопка \u003cstrong>Закрыть\u003c/strong> рядом со страницей \u003cspan class=\"num\">2\u003c/span> закрывает только её.\u003c/p>","image":{"src":"img/memory/02-pages.png","alt":"Открытые страницы списка Tiny Glade с кнопками «Закрыть»"}},{"heading":"3. Страницы одного списка","html":"\u003cp>Некоторые страницы используют один процесс, например страницы одного сайта из разных списков. Они отображаются одной строкой вне групп и закрываются вместе. Только тогда освобождается их память.\u003c/p>","image":null},{"heading":"4. После закрытия","html":"\u003cp>В примере мы закрыли страницы Brotato. Группа исчезла, а расход памяти уменьшился. Вкладки остались в списке. При следующем открытии страницы загрузятся заново.\u003c/p>","image":{"src":"img/memory/03-closed.png","alt":"Раздел «Память» после закрытия страниц Brotato"}}]},{"id":"new-versions","title":"Новые версии","intro":"Overlay Browser проверяет, вышла ли новая версия, и сообщает об этом. Когда скачать и установить её, решаете вы.","slides":[{"heading":null,"html":"\u003cp>Overlay Browser проверяет, вышла ли новая версия, и сообщает об этом. Когда скачать и установить её, решаете вы.\u003c/p>","image":null,"intro":true},{"heading":"1. Уведомление о новой версии","html":"\u003cp>Когда выходит новая версия, под верхней панелью появляется \u003cstrong>полоса уведомления\u003c/strong> \u003cspan class=\"num\">1\u003c/span> с её номером. Кнопка \u003cstrong>Скачать\u003c/strong> \u003cspan class=\"num\">2\u003c/span> открывает в системном браузере страницу новой версии. С неё можно скачать файл для своей системы. См. раздел об установке в \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a>. Кнопка \u003cstrong>×\u003c/strong> \u003cspan class=\"num\">3\u003c/span> закрывает полосу для этой версии.\u003c/p>\u003cp>Ссылка на новую версию также появляется вверху вкладки \u003cstrong>Главная\u003c/strong> \u003cspan class=\"num\">4\u003c/span>, рядом с номером текущей версии. Нажмите её, чтобы открыть ту же страницу.\u003c/p>","image":{"src":"img/new-versions/01-new-version.png","alt":"Полоса уведомления под панелью и новая версия на главной странице"}},{"heading":"1. Уведомление о новой версии","html":"\u003cp>После закрытия полосы ссылка на новую версию остаётся на главной до установки обновления.\u003c/p>","image":{"src":"img/new-versions/02-strip-closed.png","alt":"Главная с номером новой версии рядом с текущей"}},{"heading":"2. Когда приложение проверяет обновления","html":"\u003cp>Приложение проверяет выпуски проекта на GitHub вскоре после запуска, а затем каждые шесть часов. Если у вас бета-версия, оно сообщает и о новых бета-версиях. В остальных случаях уведомления приходят только о стабильных версиях.\u003c/p>\u003cp>Чтобы отключить уведомления, снимите флажок \u003cstrong>Проверять новые версии\u003c/strong> в разделе \u003cem>Поведение\u003c/em> на вкладке \u003cstrong>Настройки\u003c/strong>. Версия из Microsoft Store получает обновления из магазина, поэтому этого параметра в ней нет.\u003c/p>","image":{"src":"img/new-versions/03-option.png","alt":"Параметр «Проверять новые версии» в настройках"}}]},{"id":"signing-in","title":"Вход на сайт и удаление cookie","intro":"Многие игровые сайты, например форумы, вики и инструменты для создания билдов, предоставляют больше возможностей после входа или требуют учётную запись. В оверлее вы входите как в обычном браузере, и вход сохраняется. Если сайт перестал нормально работать или вы хотите выйти из учётной записи, можно удалить его cookie.","slides":[{"heading":null,"html":"\u003cp>Многие игровые сайты, например форумы, вики и инструменты для создания билдов, предоставляют больше возможностей после входа или требуют учётную запись. В оверлее вы входите как в обычном браузере, и вход сохраняется. Если сайт перестал нормально работать или вы хотите выйти из учётной записи, можно удалить его cookie.\u003c/p>\u003cp>В списке \u003cstrong>Tiny Glade\u003c/strong> есть форум. Этот \u003cstrong>пример сайта\u003c/strong> создан для руководства. Вход работает так же, как на реальных сайтах, например через \u003cem>Войти через Google\u003c/em>.\u003c/p>","image":null,"intro":true},{"heading":"1. Войдите в учётную запись","html":"\u003cp>Откройте вкладку сайта и нажмите кнопку входа. В примере это \u003cstrong>Продолжить с учётной записью\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/01-forum.png","alt":"Форум из примера открыт в своей вкладке, видна кнопка входа"}},{"heading":"1. Войдите в учётную запись","html":"\u003cp>Сайт откроет \u003cstrong>окно входа\u003c/strong> поверх оверлея. Введите данные и подтвердите вход.\u003c/p>","image":{"src":"img/signing-in/02-sign-in-window.png","alt":"Окно входа, открытое сайтом поверх оверлея"}},{"heading":"1. Войдите в учётную запись","html":"\u003cp>Окно входа является частью оверлея. Оно остаётся поверх него, скрывается и появляется вместе с ним. Можно переходить между окнами, и они останутся видимыми. Когда окно входа закроется, фокус вернётся оверлею.\u003c/p>","image":null},{"heading":"2. Вход сохраняется","html":"\u003cp>После входа окно закрывается, и сайт показывает вашу \u003cstrong>учётную запись\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/03-signed-in.png","alt":"Форум после входа с именем пользователя вверху"}},{"heading":"2. Вход сохраняется","html":"\u003cp>Вход сохраняется при закрытии оверлея и перезапуске приложения. Если один и тот же сайт есть в нескольких списках, вход действует во всех этих списках.\u003c/p>","image":null},{"heading":"3. Удалите cookie сайта","html":"\u003cp>Cookie — это данные, которые сайт хранит, чтобы узнавать вас и запоминать вход. Их можно удалить, чтобы \u003cstrong>выйти из учётной записи\u003c/strong>, например перед входом в другую, или если \u003cstrong>сайт перестал нормально работать\u003c/strong>.\u003c/p>\u003cp>Во вкладке сайта нажмите \u003cstrong>…\u003c/strong> (\u003cem>Другие действия\u003c/em>) справа от адреса и выберите \u003cstrong>Удалить cookie сайта forum.example\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/04-menu.png","alt":"Меню «Другие действия» с пунктом «Удалить cookie сайта forum.example»"}},{"heading":"3. Удалите cookie сайта","html":"\u003cp>Когда оверлей попросит подтверждение, нажмите \u003cstrong>Удалить\u003c/strong>. Cookie сайта и его поддоменов будут удалены. Cookie других сайтов сохранятся.\u003c/p>","image":{"src":"img/signing-in/05-confirm.png","alt":"Подтверждение удаления cookie сайта forum.example и его поддоменов"}},{"heading":"4. Страница загружается заново","html":"\u003cp>После удаления cookie страница перезагрузится. Вы вышли из учётной записи, и сайт снова предложит \u003cstrong>войти\u003c/strong>.\u003c/p>","image":{"src":"img/signing-in/06-signed-out.png","alt":"Форум после удаления cookie и выхода из учётной записи"}}]},{"id":"links-and-menu","title":"Ссылки, новые вкладки и контекстное меню","intro":"В браузере многие ссылки открываются в новых вкладках. В оверлее вкладки соответствуют сайтам из списка. Такие ссылки открываются во вкладке исходного сайта или после подтверждения в новой. Щелчок правой кнопкой мыши открывает меню, через которое можно открыть ссылку в новой вкладке и скопировать ссылку, изображение или текст.","slides":[{"heading":null,"html":"\u003cp>В браузере многие ссылки открываются в новых вкладках. В оверлее вкладки соответствуют сайтам из списка. Такие ссылки открываются во вкладке исходного сайта или после подтверждения в новой. Щелчок правой кнопкой мыши открывает меню, через которое можно открыть ссылку в новой вкладке и скопировать ссылку, изображение или текст.\u003c/p>\u003cp>В списке \u003cstrong>Tiny Glade\u003c/strong> есть форум, \u003cstrong>пример сайта\u003c/strong> для этого руководства. См. \u003ca href=\"#signing-in\">Вход на сайт и удаление cookie\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Ссылка, которая открывается в новой вкладке","html":"\u003cp>Некоторые ссылки предназначены для открытия в новой вкладке, например ссылка на эту тему форума. То же происходит при щелчке с Ctrl или средней кнопкой мыши.\u003c/p>","image":{"src":"img/links-and-menu/01-link.png","alt":"Форум из примера со ссылкой на тему"}},{"heading":"2. Тот же сайт открывается в своей вкладке","html":"\u003cp>Если ссылка ведёт на тот же сайт, новая страница открывается во \u003cstrong>вкладке сайта\u003c/strong> \u003cspan class=\"num\">1\u003c/span> и заменяет предыдущую. В поле \u003cstrong>адреса\u003c/strong> \u003cspan class=\"num\">2\u003c/span> теперь указан адрес темы. Кнопка \u003cstrong>Назад\u003c/strong> вернёт прежнюю страницу.\u003c/p>","image":{"src":"img/links-and-menu/02-same-tab.png","alt":"Тема открыта во вкладке форума"}},{"heading":"2. Тот же сайт открывается в своей вкладке","html":"\u003cp>Если в списке несколько вкладок одного сайта, ссылка открывается в той, где вы на неё нажали.\u003c/p>","image":null},{"heading":"3. Для другого сайта требуется подтверждение","html":"\u003cp>Если ссылка ведёт на сайт, у которого нет вкладки в списке, как в примере с руководствами сообщества Steam, оверлей предложит добавить сайт. Кнопка \u003cstrong>Добавить\u003c/strong> добавит его в список и откроет. Кнопка \u003cstrong>Отмена\u003c/strong> оставит текущую страницу открытой.\u003c/p>","image":{"src":"img/links-and-menu/03-other-site.png","alt":"Запрос на добавление сайта, который страница хочет открыть в новой вкладке"}},{"heading":"3. Для другого сайта требуется подтверждение","html":"\u003cp>Ссылки из вкладки \u003cstrong>Обзор\u003c/strong> открываются в этой же вкладке. См. \u003ca href=\"#free-browsing\">Свободный просмотр\u003c/a>.\u003c/p>","image":null},{"heading":"4. Щёлкните правой кнопкой по ссылке","html":"\u003cp>При таком щелчке в меню появляются \u003cstrong>Открыть ссылку в новой вкладке\u003c/strong> \u003cspan class=\"num\">1\u003c/span> и \u003cstrong>Копировать ссылку\u003c/strong> \u003cspan class=\"num\">2\u003c/span>. Второй пункт копирует адрес ссылки.\u003c/p>","image":{"src":"img/links-and-menu/04-link-menu.png","alt":"Контекстное меню ссылки с пунктами открытия и копирования"}},{"heading":"4. Щёлкните правой кнопкой по ссылке","html":"\u003cp>Пункт \u003cstrong>Открыть ссылку в новой вкладке\u003c/strong> запрашивает подтверждение перед добавлением ссылки в список. Нажмите \u003cstrong>Добавить\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/05-confirm-tab.png","alt":"Подтверждение добавления ссылки в новую вкладку списка Tiny Glade"}},{"heading":"4. Щёлкните правой кнопкой по ссылке","html":"\u003cp>Ссылка открывается в \u003cstrong>новой вкладке\u003c/strong> сразу после исходной. Если в списке уже есть вкладка с этим адресом, оверлей переключится на неё.\u003c/p>","image":{"src":"img/links-and-menu/06-new-tab.png","alt":"Тема открыта в новой вкладке сразу после вкладки форума"}},{"heading":"5. Щёлкните правой кнопкой по изображению или тексту","html":"\u003cp>Для изображения есть пункт \u003cstrong>Копировать изображение\u003c/strong>, чтобы затем вставить его, например, в чат. Для текста страницы доступны \u003cstrong>Копировать\u003c/strong> (если текст выделен) и \u003cstrong>Выделить всё\u003c/strong>.\u003c/p>","image":{"src":"img/links-and-menu/07-image-menu.png","alt":"Контекстное меню изображения с пунктом «Копировать изображение»"}},{"heading":"5. Щёлкните правой кнопкой по изображению или тексту","html":"\u003cp>В текстовых полях, например в поле ответа на форуме или в адресной строке, есть \u003cstrong>Отменить\u003c/strong>, \u003cstrong>Повторить\u003c/strong>, \u003cstrong>Вырезать\u003c/strong>, \u003cstrong>Копировать\u003c/strong>, \u003cstrong>Вставить\u003c/strong> и \u003cstrong>Выделить всё\u003c/strong>. Недоступные действия отображаются серым, например \u003cem>Копировать\u003c/em>, если текст не выделен.\u003c/p>","image":{"src":"img/links-and-menu/08-field-menu.png","alt":"Контекстное меню в текстовом поле"}}]},{"id":"troubleshooting","title":"Устранение неполадок","intro":"Здесь описано, как решать частые проблемы и собирать сведения для сообщения об ошибке. Подробности для Windows, Linux и macOS приведены в README.","slides":[{"heading":null,"html":"\u003cp>Здесь описано, как решать частые проблемы и собирать сведения для сообщения об ошибке. Подробности для Windows, Linux и macOS приведены в \u003ca href=\"../../README.md\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/p>","image":null,"intro":true},{"heading":"1. Сочетание клавиш не работает","html":"\u003cul>\u003cli>\u003cstrong>Его уже использует другая программа.\u003c/strong> Если выбрать его в настройках, оверлей сообщит, что сочетание «недопустимое или оно уже занято», и сохранит предыдущее. Выберите другое. См. \u003ca href=\"#customizing\">Настройка оверлея\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Игра использует его для своей команды.\u003c/strong> Сочетание клавиш получает и игра. Выберите сочетание, которое ничего в ней не запускает.\u003c/li>\u003cli>\u003cstrong>Linux с Wayland.\u003c/strong> Сочетание не распознаётся, пока активно нативное окно Wayland. Используйте сеанс X11. См. раздел \u003cem>Linux\u003c/em> в \u003ca href=\"../../README.md#linux\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Функциональные клавиши в macOS.\u003c/strong> По умолчанию F1–F12 управляют яркостью, громкостью и другими параметрами. Нажимайте их вместе с \u003cstrong>fn\u003c/strong> или измените настройки клавиатуры. См. раздел \u003cem>macOS\u003c/em> в \u003ca href=\"../../README.md#macos\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003c/ul>\u003cp>Оверлей можно открыть и через значок в области уведомлений.\u003c/p>","image":null},{"heading":"2. Не видно значка приложения","html":"\u003cp>Приложение находится в области уведомлений рядом с часами. Оно не появляется на панели задач или в списке Alt+Tab.\u003c/p>\u003cul>\u003cli>\u003cstrong>Windows.\u003c/strong> Если значок скрыт, нажмите стрелку \u003cstrong>^\u003c/strong> и перетащите значок на панель задач, чтобы он всегда был виден.\u003c/li>\u003cli>\u003cstrong>Linux с GNOME.\u003c/strong> Установите расширение \u003cem>AppIndicator and KStatusNotifierItem Support\u003c/em>. Если щелчок по значку открывает меню, выберите \u003cem>Показать\u003c/em>.\u003c/li>\u003cli>\u003cstrong>macOS.\u003c/strong> Значок находится справа вверху в строке меню.\u003c/li>\u003c/ul>","image":null},{"heading":"3. Оверлей не появляется поверх игры или остаётся непрозрачным","html":"\u003cul>\u003cli>\u003cstrong>Игра перекрывает оверлей.\u003c/strong> Некоторые игры в эксклюзивном полноэкранном режиме перекрывают все окна. Переключите игру в режим \u003cem>окна без рамки\u003c/em>.\u003c/li>\u003cli>\u003cstrong>Окно непрозрачное в Linux.\u003c/strong> Для прозрачности требуется оконный менеджер с включённым композитингом, например Cinnamon, KDE, GNOME или Xfce с включённым композитингом.\u003c/li>\u003c/ul>","image":null},{"heading":"4. Сайт работает плохо или страница загружается заново","html":"\u003cul>\u003cli>\u003cstrong>Сайт работает плохо или вы хотите выйти из учётной записи.\u003c/strong> Удалите cookie сайта через меню \u003cstrong>…\u003c/strong>. См. \u003ca href=\"#signing-in\">Вход на сайт и удаление cookie\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Страница загружается заново при возврате к вкладке.\u003c/strong> Неиспользуемые страницы через некоторое время закрываются для освобождения памяти. См. \u003ca href=\"#memory\">Память и закрытие страниц\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Вы хотите начать заново.\u003c/strong> Закройте приложение и удалите файл настроек. См. раздел \u003cem>Preferences and uninstalling\u003c/em> в \u003ca href=\"../../README.md#preferences-and-uninstalling\" target=\"_blank\" rel=\"noopener\">README\u003c/a>.\u003c/li>\u003c/ul>","image":null},{"heading":"5. Соберите сведения для сообщения о проблеме","html":"\u003cp>Если проблема сохраняется, сообщите о ней на \u003ca href=\"https://github.com/siculo/overlay-browser/issues\" target=\"_blank\" rel=\"noopener\">странице обсуждения ошибок проекта\u003c/a>. Файл журнала поможет понять, что произошло.\u003c/p>\u003cp>Откройте раздел \u003cem>Диагностика\u003c/em> на вкладке \u003cstrong>Настройки\u003c/strong>.\u003c/p>\u003cul>\u003cli>\u003cstrong>Подробный журнал\u003c/strong> \u003cspan class=\"num\">1\u003c/span>. Обычно в журнал попадают только ошибки и сбои вместе с текущими настройками. Если включить этот параметр, журнал также запишет действия в приложении (вкладки, сайты, списки, настройки) и события оверлея (показ и скрытие, фокус, сочетание клавиш, активное приложение). Включите его и повторите действия, вызывающие проблему.\u003c/li>\u003cli>\u003cstrong>Показать файл журнала\u003c/strong> \u003cspan class=\"num\">2\u003c/span> открывает папку с файлом \u003ccode>overlay.log\u003c/code>. Приложите файл к сообщению.\u003c/li>\u003cli>\u003cstrong>Очистить журнал\u003c/strong> \u003cspan class=\"num\">3\u003c/span> удаляет содержимое журнала, например перед повторением ошибки.\u003c/li>\u003c/ul>","image":{"src":"img/troubleshooting/01-diagnostics.png","alt":"Раздел «Диагностика» в настройках"}},{"heading":"5. Соберите сведения для сообщения о проблеме","html":"\u003cp>В журнал не попадают нажатия клавиш и данные о просмотре, включая адреса и заголовки страниц. Сайты обозначаются только по их положению в списке.\u003c/p>\u003cp>Кнопка \u003cstrong>Очистить журнал\u003c/strong> запрашивает подтверждение перед удалением содержимого.\u003c/p>","image":{"src":"img/troubleshooting/02-empty-log.png","alt":"Подтверждение очистки файла журнала"}}]}],"strings":{"docTitle":"Overlay Browser · Руководство","subtitle":"Руководство пользователя, шаг за шагом","legend":"На снимках экрана элементы, упомянутые в тексте, выделены красной рамкой \u003cspan class=\"box\">\u003c/span>; номера вроде \u003cspan class=\"num\">1\u003c/span> в тексте указывают на элемент с тем же номером на снимке.","menu":"Руководства","menuTitle":"К списку руководств (Esc)","prev":"Назад","prevTitle":"Предыдущий слайд (←)","next":"Далее","nextTitle":"Следующий слайд (→)","prevGuide":"Предыдущее руководство","nextGuide":"Следующее руководство: {title}","backToGuides":"К руководствам","guideOf":"Руководство {n} из {total}","step":"Шаг {n}","slideOne":"1 слайд","slideOther":"Слайдов: {count}"}};
const S = DATA.strings;   // testi della pagina nella lingua delle guide
const $ = (id) => document.getElementById(id);
const guides = DATA.guides;
const plural = (n) => (n === 1 ? S.slideOne : S.slideOther.replace('{count}', n));

// ---------- menu ----------
$('guides').replaceChildren(...guides.map((g, i) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="#${g.id}"><span class="n">${i + 1}</span><h2></h2><p>${g.intro}</p><span class="count">${plural(g.slides.length)}</span></a>`;
  li.querySelector('h2').textContent = g.title;
  return li;
}));

// ---------- slide ----------
// Indirizzo: #<guida>/<numero> (da 1); #<guida> = prima slide; vuoto = menu.
let current = null, index = 0;

function route() {
  const [id, n] = decodeURIComponent(location.hash.slice(1)).split('/');
  const g = guides.find((x) => x.id === id);
  closeZoom();
  if (!g) { showMenu(); return; }
  const i = Math.min(Math.max((Number(n) || 1) - 1, 0), g.slides.length - 1);
  const dir = g === current ? Math.sign(i - index) : 0;
  current = g;
  index = i;
  renderSlide(dir);
}

function showMenu() {
  current = null;
  $('deck').hidden = true;
  $('menu').hidden = false;
  document.title = S.docTitle;
}

const go = (i) => { location.hash = `${current.id}/${i + 1}`; };

function renderSlide(dir) {
  const g = current, s = g.slides[index];
  const gi = guides.indexOf(g), nextGuide = guides[gi + 1];
  $('menu').hidden = true;
  $('deck').hidden = false;
  document.title = `${g.title} · Overlay Browser`;
  $('guide-title').textContent = g.title;
  $('pos').textContent = `${index + 1} / ${g.slides.length}`;

  const el = $('slide');
  el.className = s.image ? 'with-image' : 'text-only';
  if (s.intro) el.classList.add('intro');
  const text = document.createElement('div');
  text.className = 'text';
  if (s.intro) {
    text.innerHTML = `<p class="section">${S.guideOf.replace('{n}', gi + 1).replace('{total}', guides.length)}</p><h2></h2>${s.html}`;
    text.querySelector('h2').textContent = g.title;
  } else {
    text.innerHTML = `<p class="section"></p><h2></h2>${s.html}`;
    const m = s.heading.match(/^(\d+)\.\s+(.*)$/);
    text.querySelector('.section').textContent = m ? S.step.replace('{n}', m[1]) : '';
    text.querySelector('h2').textContent = m ? m[2] : s.heading;
  }
  const parts = [text];
  if (s.image) {
    const fig = document.createElement('figure');
    fig.innerHTML = '<img><figcaption></figcaption>';
    fig.querySelector('img').src = s.image.src;
    fig.querySelector('img').alt = s.image.alt;
    fig.querySelector('figcaption').textContent = s.image.alt;
    fig.querySelector('img').onclick = () => openZoom(s.image);
    parts.push(fig);
  }
  el.replaceChildren(...parts);
  el.scrollTop = 0;
  el.classList.remove('enter');
  el.style.setProperty('--from', `${dir * 16}px`);
  if (dir) { void el.offsetWidth; el.classList.add('enter'); }

  $('dots').replaceChildren(...g.slides.map((x, i) => {
    const b = document.createElement('button');
    b.title = x.intro ? g.title : x.heading;
    b.setAttribute('aria-current', String(i === index));
    b.onclick = () => go(i);
    return b;
  }));
  $('prev').disabled = index === 0 && gi === 0;
  $('prev').textContent = index === 0 && gi > 0 ? `← ${S.prevGuide}` : `← ${S.prev}`;
  const last = index === g.slides.length - 1;
  $('next').textContent = !last ? `${S.next} →` : nextGuide ? `${S.nextGuide.replace('{title}', nextGuide.title)} →` : S.backToGuides;
}

function next() {
  if (index < current.slides.length - 1) return go(index + 1);
  const g = guides[guides.indexOf(current) + 1];
  location.hash = g ? g.id : '';
}
function prev() {
  if (index > 0) return go(index - 1);
  const g = guides[guides.indexOf(current) - 1];
  if (g) location.hash = `${g.id}/${g.slides.length}`;
}
$('next').onclick = next;
$('prev').onclick = prev;

// ---------- immagine a tutto schermo ----------
function openZoom(image) {
  $('zoom').querySelector('img').src = image.src;
  $('zoom').querySelector('img').alt = image.alt;
  $('zoom').hidden = false;
}
function closeZoom() { $('zoom').hidden = true; }
$('zoom').onclick = closeZoom;

// ---------- tastiera ----------
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!$('zoom').hidden) { if (e.key === 'Escape') closeZoom(); return; }
  if (!current) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) next();
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) prev();
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(current.slides.length - 1);
  else if (e.key === 'Escape') location.hash = '';
  else return;
  e.preventDefault();
});

window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
