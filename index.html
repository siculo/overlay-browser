<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  /* Translucency applied by the page (platforms whose window cannot be
     translucent by itself, see 'state:load'). The opacity goes on body: the
     body background would otherwise be painted on the page canvas, which
     opacity does not affect. A background of its own on html (transparent,
     but not "none") keeps the body background on body. */
  html.css-opacity { background-image: linear-gradient(transparent, transparent); }
  html.css-opacity body { opacity: var(--window-opacity); }
  button { font: inherit; color: #eee; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 4px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #363636; }
  button.active { background: #4a4a4a; font-weight: bold; }
  input, select { font: inherit; color: #eee; background: #1c1c1c; border: 1px solid #3a3a3a; border-radius: 4px; padding: 5px 8px; }

  /* Top bar: fixed Home, then the tabs, scrollable with the arrows */
  #bar { display: flex; align-items: center; gap: 4px; padding: 6px; -webkit-app-region: drag; }
  #bar button { -webkit-app-region: no-drag; }
  /* #tabs does not grow beyond its content, so the "+" sits right after the last tab */
  #tabs { flex: 0 1 auto; min-width: 0; display: flex; gap: 4px; overflow-x: hidden; scroll-behavior: smooth; }
  #tabs-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; }
  .arrow { padding: 3px 8px; }
  #add-tab { padding: 3px 9px; font-weight: bold; }

  /* Tab: label with ellipsis + close button */
  .tab { flex: none; display: flex; align-items: center; gap: 4px; max-width: 200px; padding: 3px 4px 3px 10px; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 4px; cursor: pointer; -webkit-app-region: no-drag; user-select: none; }
  .tab:hover { background: #363636; }
  .tab.active { background: #4a4a4a; font-weight: bold; }
  .tab .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab .close { flex: none; width: 18px; height: 18px; line-height: 16px; text-align: center; border-radius: 3px; color: #aaa; font-weight: normal; }
  .tab .close:hover { background: #5a5a5a; color: #fff; }

  /* Dialog (confirmations and address input) */
  #dialog { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); -webkit-app-region: no-drag; }
  #dialog .box { width: min(440px, calc(100vw - 32px)); padding: 18px; background: #1c1c1c; border: 1px solid #444; border-radius: 8px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); }
  #dialog-msg { margin-bottom: 12px; line-height: 1.4; overflow-wrap: anywhere; }
  #dialog-input { width: 100%; }
  #dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  #dialog-ok.danger { background: #7a2a2a; border-color: #944; }
  #dialog-ok.danger:hover { background: #8e3333; }

  /* Navigation bar of the active site, below the tabs */
  #nav { display: flex; align-items: center; gap: 4px; padding: 0 6px 6px; -webkit-app-region: drag; }
  #nav button { -webkit-app-region: no-drag; min-width: 32px; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: #2a2a2a; }

  /* Home */
  #home, .page { flex: 1; overflow-y: auto; padding: 24px; }
  #home h1, .page h1 { margin: 0 0 16px; font-weight: 500; font-size: 22px; }
  .page h2 { margin: 24px 0 12px; font-weight: 500; font-size: 16px; color: #bbb; text-transform: uppercase; letter-spacing: 0.04em; }
  .page h1 + h2 { margin-top: 8px; }
  .setting.check { align-items: flex-start; cursor: pointer; max-width: 720px; }
  .setting.check input { margin: 3px 0 0; width: 16px; height: 16px; cursor: pointer; }
  .setting .desc { display: block; font-size: 13px; color: #999; margin-top: 2px; }
  #settings-btn { padding: 3px 8px; }
  #list { display: flex; flex-direction: column; gap: 8px; max-width: 720px; }
  .site { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #1c1c1c; border: 1px solid #333; border-radius: 6px; }
  .site .info { flex: 1; min-width: 0; cursor: pointer; }
  .site .info:hover .title { text-decoration: underline; }
  .site .title { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site .url { font-size: 12px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site input { flex: 1; min-width: 0; }
  #add { display: flex; gap: 8px; max-width: 720px; margin-top: 16px; }
  #add input { flex: 1; }
  .error { color: #f77; font-size: 13px; margin-top: 6px; min-height: 1em; }
  #home h2 { margin: 28px 0 12px; font-weight: 500; font-size: 18px; }
  /* Application the overlay was opened over (e.g. the game) */
  #fg-app { display: flex; align-items: baseline; gap: 8px; max-width: 720px; margin: -6px 0 16px; padding: 6px 10px; font-size: 13px; color: #bbb; background: #1c1c1c; border: 1px solid #333; border-left: 3px solid #6af; border-radius: 4px; }
  #fg-app .name { color: #eee; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #fg-app .detail { color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .setting { display: flex; align-items: center; gap: 8px; }
  kbd { font: inherit; font-family: ui-monospace, monospace; padding: 3px 8px; border: 1px solid #555; border-radius: 4px; background: #1c1c1c; min-width: 3em; text-align: center; }
  kbd.capturing { border-color: #6af; color: #6af; }
  .hint { font-size: 13px; color: #999; margin-top: 6px; min-height: 1em; }
  .hint.err { color: #f77; }
  input[type=range] { width: 220px; padding: 0; border: none; background: none; accent-color: #6af; }
  #opt-opacity-value { min-width: 3em; font-variant-numeric: tabular-nums; }

  #views { flex: 1; display: flex; }
  #views webview { flex: 1; }
</style>
</head>
<body>
  <div id="bar">
    <button id="home-btn" data-i18n="bar.home"></button>
    <div id="tabs-wrap">
      <button class="arrow" id="left" hidden>&#9664;</button>
      <div id="tabs"></div>
      <button class="arrow" id="right" hidden>&#9654;</button>
      <button id="add-tab" data-i18n-title="bar.addSite">+</button>
    </div>
    <button id="settings-btn" data-i18n-title="bar.settings">&#9881;</button>
  </div>

  <div id="nav" hidden>
    <button id="nav-site" data-i18n-title="nav.siteHome">&#8962;</button>
    <button id="nav-back" data-i18n-title="nav.back">&#8592;</button>
    <button id="nav-forward" data-i18n-title="nav.forward">&#8594;</button>
    <button id="nav-reload" data-i18n-title="nav.reload">&#8635;</button>
  </div>

  <div id="home">
    <h1 data-i18n="home.title"></h1>
    <div id="fg-app" hidden>
      <span id="fg-app-label"></span>
      <span class="name" id="fg-app-name"></span>
      <span class="detail" id="fg-app-detail"></span>
    </div>
    <div id="list"></div>
    <form id="add">
      <input id="add-url" data-i18n-placeholder="home.addPlaceholder">
      <button type="submit" data-i18n="home.add"></button>
    </form>
    <div class="error" id="error"></div>
  </div>

  <div id="settings" class="page" hidden>
    <h1 data-i18n="settings.title"></h1>

    <h2 data-i18n="settings.keyboard"></h2>
    <div class="setting">
      <span data-i18n="settings.toggle"></span>
      <kbd id="shortcut"></kbd>
      <button id="shortcut-change" data-i18n="settings.change"></button>
      <button id="shortcut-reset" data-i18n="settings.reset"></button>
    </div>
    <div class="hint" id="shortcut-hint"></div>

    <h2 data-i18n="settings.behavior"></h2>
    <label class="setting check">
      <input type="checkbox" id="opt-hide-on-blur">
      <span><span data-i18n="settings.hideOnBlur"></span>
        <span class="desc" data-i18n="settings.hideOnBlurDesc"></span></span>
    </label>

    <div id="appearance" hidden>
      <h2 data-i18n="settings.appearance"></h2>
      <div class="setting">
        <label for="opt-opacity" data-i18n="settings.opacity"></label>
        <input type="range" id="opt-opacity" step="5">
        <output id="opt-opacity-value" for="opt-opacity"></output>
      </div>
      <div class="hint" data-i18n="settings.opacityDesc"></div>
    </div>

    <h2 data-i18n="settings.language"></h2>
    <div class="setting">
      <label for="opt-language" data-i18n="settings.languageLabel"></label>
      <select id="opt-language"></select>
    </div>
  </div>

  <div id="views" hidden></div>

  <div id="dialog" hidden>
    <form class="box" id="dialog-form">
      <div id="dialog-msg"></div>
      <input id="dialog-input" hidden>
      <div class="error" id="dialog-error"></div>
      <div class="buttons">
        <button type="button" id="dialog-cancel" data-i18n="dialog.cancel"></button>
        <button type="submit" id="dialog-ok"></button>
      </div>
    </form>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const homeBtn = $('home-btn'), tabsEl = $('tabs'), leftBtn = $('left'), rightBtn = $('right');
  const home = $('home'), list = $('list'), views = $('views'), errorEl = $('error');
  const settingsBtn = $('settings-btn'), settingsPage = $('settings');

  let prefs = { sites: [] };
  const webviews = new Map();   // id -> webview (one "tab" per site, created on first access)
  const SETTINGS = ':settings'; // value of `active` for the Settings page
  let active = null;            // id of the active site, null = Home, SETTINGS = Settings
  const isSite = (id) => id !== null && id !== SETTINGS;
  let editing = null;           // id of the site being edited on the Home page

  // ---------- utilities ----------

  function normalizeUrl(raw) {
    let s = raw.trim();
    if (!s) return null;
    if (!/^[a-z][a-z\d+.-]*:\/\//i.test(s)) s = 'https://' + s;
    try {
      const u = new URL(s);
      return /^https?:$/.test(u.protocol) ? u.href : null;
    } catch {
      return null;
    }
  }

  const siteName = (site) => site.title || new URL(site.url).hostname;
  const findSite = (id) => prefs.sites.find((s) => s.id === id);
  const save = () => window.overlay.saveSites(prefs.sites);

  function showError(msg) { errorEl.textContent = msg || ''; }

  // Fetches the title from the page; if that fails the host name is kept.
  async function resolveTitle(site) {
    const url = site.url;
    const title = await window.overlay.fetchTitle(url);
    if (title && site.url === url && findSite(site.id)) {
      site.title = title;
      save();
      render();
    }
  }

  // ---------- tab / webview ----------

  function getWebview(site) {
    let wv = webviews.get(site.id);
    if (!wv) {
      wv = document.createElement('webview');
      wv.src = site.url;
      wv.style.display = 'none';
      // Fallback for sites that set the title via JavaScript: use the first
      // title the page reports, if we don't have one already.
      wv.addEventListener('page-title-updated', (e) => {
        const s = findSite(site.id);
        if (s && !s.title && e.title) { s.title = e.title; save(); render(); }
      });
      // History changes on every navigation: update Back/Forward.
      for (const ev of ['dom-ready', 'did-navigate', 'did-navigate-in-page', 'did-stop-loading']) {
        wv.addEventListener(ev, () => { if (active === site.id) updateNav(); });
      }
      views.append(wv);
      webviews.set(site.id, wv);
    }
    return wv;
  }

  function closeWebview(id) {
    webviews.get(id)?.remove();
    webviews.delete(id);
  }

  function activate(id) {
    // The Settings page is not remembered as the "last tab".
    if (id !== active && id !== SETTINGS) window.overlay.setActiveTab(id);
    if (id !== SETTINGS) cancelCapture();
    active = id;
    if (isSite(id)) getWebview(findSite(id));
    home.hidden = id !== null;
    settingsPage.hidden = id !== SETTINGS;
    views.hidden = !isSite(id);
    for (const [wid, wv] of webviews) wv.style.display = wid === id ? 'flex' : 'none';
    renderTabs();
    updateNav();
  }

  // ---------- navigation ----------

  const navEl = $('nav'), navBack = $('nav-back'), navForward = $('nav-forward');

  function updateNav() {
    navEl.hidden = !isSite(active);
    const wv = isSite(active) ? webviews.get(active) : null;
    // canGoBack/canGoForward throw until the webview is ready.
    let back = false, forward = false;
    try { back = wv.canGoBack(); forward = wv.canGoForward(); } catch { /* not ready yet */ }
    navBack.disabled = !back;
    navForward.disabled = !forward;
  }

  navBack.onclick = () => webviews.get(active)?.goBack();
  navForward.onclick = () => webviews.get(active)?.goForward();
  $('nav-reload').onclick = () => webviews.get(active)?.reload();
  $('nav-site').onclick = () => {
    const site = findSite(active);
    if (site) webviews.get(active)?.loadURL(site.url);
  };

  // ---------- render ----------

  function renderTabs() {
    homeBtn.classList.toggle('active', active === null);
    settingsBtn.classList.toggle('active', active === SETTINGS);
    tabsEl.replaceChildren(...prefs.sites.map((site) => {
      const tab = document.createElement('div');
      tab.className = 'tab';
      tab.classList.toggle('active', site.id === active);
      tab.title = siteName(site);
      tab.onclick = () => activate(site.id);
      // Middle click on the tab: close it, as in browsers.
      tab.onauxclick = (e) => { if (e.button === 1) confirmRemove(site.id); };

      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = siteName(site);

      const close = document.createElement('span');
      close.className = 'close';
      close.textContent = '×';
      close.title = t('site.remove');
      close.onclick = (e) => { e.stopPropagation(); confirmRemove(site.id); };

      tab.append(label, close);
      return tab;
    }));
    tabsEl.querySelector('.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    updateArrows();
  }

  function renderList() {
    list.replaceChildren(...prefs.sites.map((site) => {
      const row = document.createElement('div');
      row.className = 'site';

      if (editing === site.id) {
        const input = document.createElement('input');
        input.value = site.url;
        const ok = document.createElement('button');
        ok.textContent = t('site.save');
        const cancel = document.createElement('button');
        cancel.textContent = t('site.cancel');
        ok.onclick = () => updateSite(site.id, input.value);
        cancel.onclick = () => { editing = null; showError(); renderList(); };
        input.onkeydown = (e) => {
          if (e.key === 'Enter') ok.click();
          if (e.key === 'Escape') cancel.click();
        };
        row.append(input, ok, cancel);
        setTimeout(() => input.focus());
      } else {
        const info = document.createElement('div');
        info.className = 'info';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = siteName(site);
        const url = document.createElement('div');
        url.className = 'url';
        url.textContent = site.url;
        info.append(title, url);
        info.onclick = () => activate(site.id);

        const edit = document.createElement('button');
        edit.textContent = t('site.edit');
        edit.onclick = () => { editing = site.id; showError(); renderList(); };
        const del = document.createElement('button');
        del.textContent = t('site.remove');
        del.onclick = () => confirmRemove(site.id);
        row.append(info, edit, del);
      }
      return row;
    }));
    if (!prefs.sites.length) {
      const empty = document.createElement('div');
      empty.style.color = '#999';
      empty.textContent = t('home.empty');
      list.append(empty);
    }
  }

  // ---------- application the overlay was opened over ----------

  let fgApp = null;   // { exe, path, title, steamAppId } or null, from the main process

  function renderForegroundApp() {
    const box = $('fg-app');
    box.hidden = !fgApp || !(fgApp.title || fgApp.exe);
    if (box.hidden) return;
    $('fg-app-label').textContent = t('home.foregroundApp');
    // The window title is usually the game's name; otherwise the executable.
    $('fg-app-name').textContent = fgApp.title || fgApp.exe;
    const details = [];
    if (fgApp.title && fgApp.exe) details.push(fgApp.exe);
    if (fgApp.steamAppId) details.push(t('home.steamAppId', { id: fgApp.steamAppId }));
    $('fg-app-detail').textContent = details.join(' · ');
    box.title = [fgApp.title, fgApp.path].filter(Boolean).join('\n');
  }

  window.overlay.onForegroundApp((app) => {
    fgApp = app;
    renderForegroundApp();
  });

  function render() { renderTabs(); renderList(); renderForegroundApp(); }

  // ---------- scroll arrows ----------

  function updateArrows() {
    const overflow = tabsEl.scrollWidth > tabsEl.clientWidth + 1;
    leftBtn.hidden = rightBtn.hidden = !overflow;
    leftBtn.disabled = tabsEl.scrollLeft <= 0;
    rightBtn.disabled = tabsEl.scrollLeft + tabsEl.clientWidth >= tabsEl.scrollWidth - 1;
  }
  leftBtn.onclick = () => tabsEl.scrollBy({ left: -tabsEl.clientWidth * 0.8 });
  rightBtn.onclick = () => tabsEl.scrollBy({ left: tabsEl.clientWidth * 0.8 });
  tabsEl.addEventListener('scroll', updateArrows);
  tabsEl.addEventListener('wheel', (e) => { tabsEl.scrollLeft += e.deltaY || e.deltaX; e.preventDefault(); }, { passive: false });
  new ResizeObserver(updateArrows).observe(tabsEl);

  // ---------- list changes ----------

  // Returns the added site, or null if the address is invalid.
  function addSite(raw) {
    const url = normalizeUrl(raw);
    if (!url) return null;
    const site = { id: crypto.randomUUID(), url, title: null };
    prefs.sites.push(site);
    save();
    render();
    resolveTitle(site);
    return site;
  }

  function updateSite(id, raw) {
    const site = findSite(id);
    const url = normalizeUrl(raw);
    if (!url) return showError(t('site.invalidUrl'));
    editing = null;
    showError();
    if (url !== site.url) {
      site.url = url;
      site.title = null;
      const wv = webviews.get(id);
      if (wv) wv.src = url;
      save();
      resolveTitle(site);
    }
    render();
  }

  function removeSite(id) {
    prefs.sites = prefs.sites.filter((s) => s.id !== id);
    closeWebview(id);
    if (editing === id) editing = null;
    save();
    if (active === id) activate(null); else render();
  }

  async function confirmRemove(id) {
    const site = findSite(id);
    if (!site) return;
    const ok = await openDialog({
      message: t('site.confirmRemove', { name: siteName(site) }),
      okLabel: t('site.remove'),
      danger: true,
    });
    if (ok) removeSite(id);
  }

  // Adding from the "+" in the bar: asks for the address and opens the new tab right away.
  async function promptAddTab() {
    const url = await openDialog({
      message: t('addDialog.message'),
      input: '',
      placeholder: t('addDialog.placeholder'),
      okLabel: t('addDialog.ok'),
      validate: (v) => (normalizeUrl(v) ? null : t('site.invalidUrl')),
    });
    if (url === null) return;
    const site = addSite(url);
    if (site) activate(site.id);
  }

  // ---------- dialog ----------
  //
  // openDialog({ message, input?, placeholder?, okLabel?, danger?, validate? })
  // Without `input` it is a confirmation and returns true/false; with `input`
  // (initial value) it returns the entered text, or null if cancelled.

  const dialog = $('dialog'), dialogForm = $('dialog-form'), dialogInput = $('dialog-input');
  const dialogOk = $('dialog-ok'), dialogError = $('dialog-error');
  let closeDialog = null;

  function openDialog({ message, input, placeholder = '', okLabel = t('dialog.ok'), danger = false, validate }) {
    closeDialog?.(null);   // one dialog at a time
    const withInput = input !== undefined;
    $('dialog-msg').textContent = message;
    dialogInput.hidden = !withInput;
    dialogInput.value = withInput ? input : '';
    dialogInput.placeholder = placeholder;
    dialogError.textContent = '';
    dialogOk.textContent = okLabel;
    dialogOk.classList.toggle('danger', danger);
    dialog.hidden = false;
    setTimeout(() => (withInput ? dialogInput : dialogOk).focus());

    return new Promise((resolve) => {
      closeDialog = (confirmed) => {
        closeDialog = null;
        dialog.hidden = true;
        dialogForm.onsubmit = null;
        resolve(withInput ? (confirmed ? dialogInput.value : null) : !!confirmed);
      };
      dialogForm.onsubmit = (e) => {
        e.preventDefault();
        const err = withInput && validate ? validate(dialogInput.value) : null;
        if (err) { dialogError.textContent = err; dialogInput.focus(); return; }
        closeDialog(true);
      };
    });
  }
  $('dialog-cancel').onclick = () => closeDialog?.(false);
  // Click on the dark backdrop or Esc: cancel.
  dialog.addEventListener('mousedown', (e) => { if (e.target === dialog) closeDialog?.(false); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && closeDialog) { e.preventDefault(); closeDialog(false); }
  });

  // When the window gets focus, the keyboard goes to the open site
  // (otherwise it would stay on the page holding the tabs), unless
  // a dialog is open.
  window.addEventListener('focus', () => {
    if (isSite(active) && !closeDialog) webviews.get(active)?.focus();
  });

  homeBtn.onclick = () => activate(null);
  settingsBtn.onclick = () => activate(SETTINGS);
  window.overlay.onSettings(() => activate(SETTINGS));
  $('add-tab').onclick = promptAddTab;
  window.overlay.onHome(() => activate(null));
  $('add').onsubmit = (e) => {
    e.preventDefault();
    if (addSite($('add-url').value)) {
      $('add-url').value = '';
      showError();
    } else {
      showError(t('site.invalidUrl'));
    }
  };

  // ---------- shortcut ----------

  const shortcutEl = $('shortcut'), shortcutHint = $('shortcut-hint');
  const changeBtn = $('shortcut-change');
  let capturing = false;
  let currentShortcut = null;

  function showShortcut(acc, msg, isError) {
    shortcutEl.textContent = acc || t('shortcut.none');
    shortcutHint.textContent = msg || '';
    shortcutHint.classList.toggle('err', !!isError);
  }

  // Converts a KeyboardEvent into the key of an Electron accelerator.
  // e.code (physical key) is used so the result does not depend on the layout.
  const CODE_KEYS = {
    Space: 'Space', Tab: 'Tab', Enter: 'Enter', Backspace: 'Backspace',
    Insert: 'Insert', Delete: 'Delete', Home: 'Home', End: 'End',
    PageUp: 'PageUp', PageDown: 'PageDown',
    ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right',
    Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backslash: '\\',
    Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', Backquote: '`',
    NumpadAdd: 'numadd', NumpadSubtract: 'numsub', NumpadMultiply: 'nummult',
    NumpadDivide: 'numdiv', NumpadDecimal: 'numdec',
  };
  function keyFromCode(code) {
    let m;
    if ((m = code.match(/^Key([A-Z])$/))) return m[1];
    if ((m = code.match(/^Digit(\d)$/))) return m[1];
    if ((m = code.match(/^Numpad(\d)$/))) return 'num' + m[1];
    if (/^F([1-9]|1\d|2[0-4])$/.test(code)) return code;
    return CODE_KEYS[code] ?? null;
  }

  function startCapture() {
    capturing = true;
    window.overlay.suspendShortcut(true);
    shortcutEl.classList.add('capturing');
    showShortcut('…', t('shortcut.press'));
    changeBtn.disabled = true;
  }
  function endCapture() {
    capturing = false;
    shortcutEl.classList.remove('capturing');
    changeBtn.disabled = false;
  }
  // Cancels the capture and re-enables the current shortcut.
  function cancelCapture() {
    if (!capturing) return;
    endCapture();
    window.overlay.suspendShortcut(false);
    showShortcut(currentShortcut);
  }
  async function applyShortcut(acc) {
    const res = await window.overlay.setShortcut(acc);
    currentShortcut = res.shortcut;
    if (res.ok) showShortcut(res.shortcut, t('shortcut.updated'));
    else showShortcut(res.shortcut, res.error, true);
  }
  window.addEventListener('blur', cancelCapture);

  document.addEventListener('keydown', async (e) => {
    if (!capturing) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.code === 'Escape' && !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey) {
      cancelCapture();
      return;
    }
    const key = keyFromCode(e.code);
    if (!key) return;   // modifier alone or unsupported key: wait for the next one
    const mods = [];
    if (e.ctrlKey) mods.push('Ctrl');
    if (e.altKey) mods.push('Alt');
    if (e.shiftKey) mods.push('Shift');
    if (e.metaKey) mods.push('Super');
    // Without modifiers only function keys are allowed, so as not to
    // "steal" from the whole system a key normally used for typing.
    if (!mods.length && !/^F\d+$/.test(key)) {
      showShortcut('…', t('shortcut.needModifier'), true);
      return;
    }
    endCapture();
    await applyShortcut([...mods, key].join('+'));
  }, true);

  changeBtn.onclick = startCapture;
  $('shortcut-reset').onclick = () => { cancelCapture(); applyShortcut('F10'); };

  // ---------- options ----------
  //
  // Each checkbox is bound to a `settings` key in prefs.json and is applied
  // immediately. To add an option: an entry in OPTIONS and its default in
  // main.js (DEFAULT_SETTINGS).

  const OPTIONS = { hideOnBlur: $('opt-hide-on-blur') };

  function initOptions(settings) {
    for (const [key, input] of Object.entries(OPTIONS)) {
      input.checked = !!settings[key];
      input.onchange = () => window.overlay.setSetting(key, input.checked);
    }
  }

  // ---------- opacity ----------
  //
  // The slider works in percent; the setting is a fraction (0.3–1). It is
  // applied while dragging: by the main process where the window is
  // translucent by itself, here via CSS where the platform requires it
  // (state.platform.opacity === 'css'). Hidden where neither is possible.

  const opacityGroup = $('appearance');
  const opacityInput = $('opt-opacity'), opacityValue = $('opt-opacity-value');
  let opacityMode = 'none';

  function showOpacity(value) {
    opacityValue.textContent = `${Math.round(value * 100)}%`;
    if (opacityMode === 'css') document.documentElement.style.setProperty('--window-opacity', value);
  }

  function initOpacity(platform, value) {
    opacityMode = platform.opacity;
    opacityGroup.hidden = opacityMode === 'none';
    if (opacityMode === 'none') return;
    if (opacityMode === 'css') document.documentElement.classList.add('css-opacity');
    opacityInput.min = Math.round(platform.opacityRange.min * 100);
    opacityInput.max = Math.round(platform.opacityRange.max * 100);
    opacityInput.value = Math.round(value * 100);
    showOpacity(value);
    opacityInput.oninput = () => {
      const v = Number(opacityInput.value) / 100;
      showOpacity(v);
      window.overlay.setSetting('opacity', v);
    };
  }

  // ---------- language ----------
  //
  // Texts come from locales/*.json through the main process. Fixed texts are
  // marked in the HTML (data-i18n for the content, data-i18n-title and
  // data-i18n-placeholder for those attributes); the others use t() while
  // rendering. Changing language re-applies everything without reloading the
  // page, so the open tabs are kept.

  const languageSelect = $('opt-language');
  let i18n = { messages: {}, languages: [] };
  let languageSetting = 'system';

  function t(key, params = {}) {
    const text = i18n.messages[key] ?? key;
    return text.replace(/\{(\w+)\}/g, (m, name) => params[name] ?? m);
  }

  function renderLanguageSelect() {
    const nameOf = (code) => i18n.languages.find((l) => l.code === code)?.name ?? code;
    const choices = [
      { value: 'system', label: t('settings.languageSystem', { name: nameOf(i18n.system) }) },
      ...i18n.languages.map((l) => ({ value: l.code, label: l.name })),
    ];
    languageSelect.replaceChildren(...choices.map(({ value, label }) => new Option(label, value)));
    // A saved language no longer available counts as the system one.
    languageSelect.value = choices.some((c) => c.value === languageSetting) ? languageSetting : 'system';
  }

  function applyI18n(state) {
    i18n = state;
    document.documentElement.lang = i18n.language;
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll('[data-i18n-title]')) el.title = t(el.dataset.i18nTitle);
    for (const el of document.querySelectorAll('[data-i18n-placeholder]')) el.placeholder = t(el.dataset.i18nPlaceholder);
    renderLanguageSelect();
  }

  languageSelect.onchange = async () => {
    languageSetting = languageSelect.value;
    applyI18n(await window.overlay.setLanguage(languageSetting));
    // Texts built while rendering, and messages still in the old language.
    render();
    showError();
    if (!capturing) showShortcut(currentShortcut);
  };

  // ---------- startup ----------

  (async () => {
    const state = await window.overlay.loadState();
    initOpacity(state.platform, state.settings.opacity);
    languageSetting = state.settings.language;
    applyI18n(state.i18n);
    prefs = { sites: state.sites };
    fgApp = state.foregroundApp;
    renderForegroundApp();
    currentShortcut = state.shortcut;
    showShortcut(currentShortcut);
    initOptions(state.settings);
    // Reopens the last chosen tab, if the site still exists.
    activate(findSite(state.activeTab) ? state.activeTab : null);
    renderList();
    for (const site of prefs.sites) if (!site.title) resolveTitle(site);
  })();
</script>
</body>
</html>
