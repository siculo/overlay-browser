<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: #111; color: #eee; font-family: system-ui, sans-serif; }
  button { font: inherit; color: #eee; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 4px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #363636; }
  button.active { background: #4a4a4a; font-weight: bold; }
  input { font: inherit; color: #eee; background: #1c1c1c; border: 1px solid #3a3a3a; border-radius: 4px; padding: 5px 8px; }

  /* Barra superiore: Home fisso, poi le tab scorrevoli con le frecce */
  #bar { display: flex; align-items: center; gap: 4px; padding: 6px; -webkit-app-region: drag; }
  #bar button { -webkit-app-region: no-drag; }
  #tabs { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: hidden; scroll-behavior: smooth; }
  #tabs button { flex: none; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
  #tabs-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; }
  .arrow { padding: 3px 8px; }

  /* Home */
  #home { flex: 1; overflow-y: auto; padding: 24px; }
  #home h1 { margin: 0 0 16px; font-weight: 500; font-size: 22px; }
  #list { display: flex; flex-direction: column; gap: 8px; max-width: 720px; }
  .site { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #1c1c1c; border: 1px solid #333; border-radius: 6px; }
  .site .info { flex: 1; min-width: 0; cursor: pointer; }
  .site .info:hover .title { text-decoration: underline; }
  .site .title { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site .url { font-size: 12px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site input { flex: 1; min-width: 0; }
  #add { display: flex; gap: 8px; max-width: 720px; margin-top: 16px; }
  #add input { flex: 1; }
  .error { color: #f77; font-size: 13px; margin-top: 6px; min-height: 1em; }
  #home h2 { margin: 28px 0 12px; font-weight: 500; font-size: 18px; }
  .setting { display: flex; align-items: center; gap: 8px; }
  kbd { font: inherit; font-family: ui-monospace, monospace; padding: 3px 8px; border: 1px solid #555; border-radius: 4px; background: #1c1c1c; min-width: 3em; text-align: center; }
  kbd.capturing { border-color: #6af; color: #6af; }
  .hint { font-size: 13px; color: #999; margin-top: 6px; min-height: 1em; }
  .hint.err { color: #f77; }

  #views { flex: 1; display: flex; }
  #views webview { flex: 1; }
</style>
</head>
<body>
  <div id="bar">
    <button id="home-btn">Home</button>
    <div id="tabs-wrap">
      <button class="arrow" id="left" hidden>&#9664;</button>
      <div id="tabs"></div>
      <button class="arrow" id="right" hidden>&#9654;</button>
    </div>
  </div>

  <div id="home">
    <h1>Siti</h1>
    <div id="list"></div>
    <form id="add">
      <input id="add-url" placeholder="Indirizzo del sito da aggiungere (es. https://example.com)">
      <button type="submit">Aggiungi</button>
    </form>
    <div class="error" id="error"></div>

    <h2>Impostazioni</h2>
    <div class="setting">
      <span>Mostra/nascondi overlay:</span>
      <kbd id="shortcut"></kbd>
      <button id="shortcut-change">Cambia</button>
      <button id="shortcut-reset">Ripristina F10</button>
    </div>
    <div class="hint" id="shortcut-hint"></div>
  </div>

  <div id="views" hidden></div>

<script>
  const $ = (id) => document.getElementById(id);
  const homeBtn = $('home-btn'), tabsEl = $('tabs'), leftBtn = $('left'), rightBtn = $('right');
  const home = $('home'), list = $('list'), views = $('views'), errorEl = $('error');

  let prefs = { sites: [] };
  const webviews = new Map();   // id -> webview (una "tab" per sito, creata al primo accesso)
  let active = null;            // id del sito attivo, null = Home
  let editing = null;           // id del sito in modifica nella Home

  // ---------- utilità ----------

  function normalizeUrl(raw) {
    let s = raw.trim();
    if (!s) return null;
    if (!/^[a-z][a-z\d+.-]*:\/\//i.test(s)) s = 'https://' + s;
    try {
      const u = new URL(s);
      return /^https?:$/.test(u.protocol) ? u.href : null;
    } catch {
      return null;
    }
  }

  const siteName = (site) => site.title || new URL(site.url).hostname;
  const findSite = (id) => prefs.sites.find((s) => s.id === id);
  const save = () => window.overlay.saveSites(prefs.sites);

  function showError(msg) { errorEl.textContent = msg || ''; }

  // Recupera il titolo dalla pagina; se non ci riesce resta il nome host.
  async function resolveTitle(site) {
    const url = site.url;
    const title = await window.overlay.fetchTitle(url);
    if (title && site.url === url && findSite(site.id)) {
      site.title = title;
      save();
      render();
    }
  }

  // ---------- tab / webview ----------

  function getWebview(site) {
    let wv = webviews.get(site.id);
    if (!wv) {
      wv = document.createElement('webview');
      wv.src = site.url;
      wv.style.display = 'none';
      // Fallback per i siti che impostano il titolo via JavaScript: usa il primo
      // titolo che la pagina comunica, se non ne abbiamo già uno.
      wv.addEventListener('page-title-updated', (e) => {
        const s = findSite(site.id);
        if (s && !s.title && e.title) { s.title = e.title; save(); render(); }
      });
      views.append(wv);
      webviews.set(site.id, wv);
    }
    return wv;
  }

  function closeWebview(id) {
    webviews.get(id)?.remove();
    webviews.delete(id);
  }

  function activate(id) {
    if (id !== active) window.overlay.setActiveTab(id);
    if (id !== null) cancelCapture();
    active = id;
    if (id !== null) getWebview(findSite(id));
    home.hidden = id !== null;
    views.hidden = id === null;
    for (const [wid, wv] of webviews) wv.style.display = wid === id ? 'flex' : 'none';
    renderTabs();
  }

  // ---------- render ----------

  function renderTabs() {
    homeBtn.classList.toggle('active', active === null);
    tabsEl.replaceChildren(...prefs.sites.map((site) => {
      const b = document.createElement('button');
      b.textContent = siteName(site);
      b.title = siteName(site);
      b.classList.toggle('active', site.id === active);
      b.onclick = () => activate(site.id);
      return b;
    }));
    tabsEl.querySelector('.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    updateArrows();
  }

  function renderList() {
    list.replaceChildren(...prefs.sites.map((site) => {
      const row = document.createElement('div');
      row.className = 'site';

      if (editing === site.id) {
        const input = document.createElement('input');
        input.value = site.url;
        const ok = document.createElement('button');
        ok.textContent = 'Salva';
        const cancel = document.createElement('button');
        cancel.textContent = 'Annulla';
        ok.onclick = () => updateSite(site.id, input.value);
        cancel.onclick = () => { editing = null; showError(); renderList(); };
        input.onkeydown = (e) => {
          if (e.key === 'Enter') ok.click();
          if (e.key === 'Escape') cancel.click();
        };
        row.append(input, ok, cancel);
        setTimeout(() => input.focus());
      } else {
        const info = document.createElement('div');
        info.className = 'info';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = siteName(site);
        const url = document.createElement('div');
        url.className = 'url';
        url.textContent = site.url;
        info.append(title, url);
        info.onclick = () => activate(site.id);

        const edit = document.createElement('button');
        edit.textContent = 'Modifica';
        edit.onclick = () => { editing = site.id; showError(); renderList(); };
        const del = document.createElement('button');
        del.textContent = 'Rimuovi';
        del.onclick = () => removeSite(site.id);
        row.append(info, edit, del);
      }
      return row;
    }));
    if (!prefs.sites.length) {
      const empty = document.createElement('div');
      empty.style.color = '#999';
      empty.textContent = 'Nessun sito. Aggiungine uno qui sotto.';
      list.append(empty);
    }
  }

  function render() { renderTabs(); renderList(); }

  // ---------- frecce di scorrimento ----------

  function updateArrows() {
    const overflow = tabsEl.scrollWidth > tabsEl.clientWidth + 1;
    leftBtn.hidden = rightBtn.hidden = !overflow;
    leftBtn.disabled = tabsEl.scrollLeft <= 0;
    rightBtn.disabled = tabsEl.scrollLeft + tabsEl.clientWidth >= tabsEl.scrollWidth - 1;
  }
  leftBtn.onclick = () => tabsEl.scrollBy({ left: -tabsEl.clientWidth * 0.8 });
  rightBtn.onclick = () => tabsEl.scrollBy({ left: tabsEl.clientWidth * 0.8 });
  tabsEl.addEventListener('scroll', updateArrows);
  tabsEl.addEventListener('wheel', (e) => { tabsEl.scrollLeft += e.deltaY || e.deltaX; e.preventDefault(); }, { passive: false });
  new ResizeObserver(updateArrows).observe(tabsEl);

  // ---------- modifiche all'elenco ----------

  function addSite(raw) {
    const url = normalizeUrl(raw);
    if (!url) return showError('Indirizzo non valido.');
    const site = { id: crypto.randomUUID(), url, title: null };
    prefs.sites.push(site);
    save();
    showError();
    render();
    resolveTitle(site);
    return true;
  }

  function updateSite(id, raw) {
    const site = findSite(id);
    const url = normalizeUrl(raw);
    if (!url) return showError('Indirizzo non valido.');
    editing = null;
    showError();
    if (url !== site.url) {
      site.url = url;
      site.title = null;
      const wv = webviews.get(id);
      if (wv) wv.src = url;
      save();
      resolveTitle(site);
    }
    render();
  }

  function removeSite(id) {
    prefs.sites = prefs.sites.filter((s) => s.id !== id);
    closeWebview(id);
    if (editing === id) editing = null;
    save();
    if (active === id) activate(null); else render();
  }

  homeBtn.onclick = () => activate(null);
  window.overlay.onHome(() => activate(null));
  $('add').onsubmit = (e) => {
    e.preventDefault();
    if (addSite($('add-url').value)) $('add-url').value = '';
  };

  // ---------- scorciatoia ----------

  const shortcutEl = $('shortcut'), shortcutHint = $('shortcut-hint');
  const changeBtn = $('shortcut-change');
  let capturing = false;
  let currentShortcut = null;

  function showShortcut(acc, msg, isError) {
    shortcutEl.textContent = acc || 'nessuna';
    shortcutHint.textContent = msg || '';
    shortcutHint.classList.toggle('err', !!isError);
  }

  // Converte un KeyboardEvent nel tasto di un accelerator di Electron.
  // Si usa e.code (tasto fisico) così il risultato non dipende dal layout.
  const CODE_KEYS = {
    Space: 'Space', Tab: 'Tab', Enter: 'Enter', Backspace: 'Backspace',
    Insert: 'Insert', Delete: 'Delete', Home: 'Home', End: 'End',
    PageUp: 'PageUp', PageDown: 'PageDown',
    ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right',
    Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backslash: '\\',
    Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', Backquote: '`',
    NumpadAdd: 'numadd', NumpadSubtract: 'numsub', NumpadMultiply: 'nummult',
    NumpadDivide: 'numdiv', NumpadDecimal: 'numdec',
  };
  function keyFromCode(code) {
    let m;
    if ((m = code.match(/^Key([A-Z])$/))) return m[1];
    if ((m = code.match(/^Digit(\d)$/))) return m[1];
    if ((m = code.match(/^Numpad(\d)$/))) return 'num' + m[1];
    if (/^F([1-9]|1\d|2[0-4])$/.test(code)) return code;
    return CODE_KEYS[code] ?? null;
  }

  function startCapture() {
    capturing = true;
    window.overlay.suspendShortcut(true);
    shortcutEl.classList.add('capturing');
    showShortcut('…', 'Premi la nuova combinazione (Esc per annullare).');
    changeBtn.disabled = true;
  }
  function endCapture() {
    capturing = false;
    shortcutEl.classList.remove('capturing');
    changeBtn.disabled = false;
  }
  // Annulla la cattura e riattiva la scorciatoia attuale.
  function cancelCapture() {
    if (!capturing) return;
    endCapture();
    window.overlay.suspendShortcut(false);
    showShortcut(currentShortcut);
  }
  async function applyShortcut(acc) {
    const res = await window.overlay.setShortcut(acc);
    currentShortcut = res.shortcut;
    if (res.ok) showShortcut(res.shortcut, 'Scorciatoia aggiornata.');
    else showShortcut(res.shortcut, res.error, true);
  }
  window.addEventListener('blur', cancelCapture);

  document.addEventListener('keydown', async (e) => {
    if (!capturing) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.code === 'Escape' && !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey) {
      cancelCapture();
      return;
    }
    const key = keyFromCode(e.code);
    if (!key) return;   // tasto modificatore da solo o non supportato: si aspetta il prossimo
    const mods = [];
    if (e.ctrlKey) mods.push('Ctrl');
    if (e.altKey) mods.push('Alt');
    if (e.shiftKey) mods.push('Shift');
    if (e.metaKey) mods.push('Super');
    // Senza modificatori sono ammessi solo i tasti funzione, per non
    // "rubare" a tutto il sistema un tasto usato normalmente per scrivere.
    if (!mods.length && !/^F\d+$/.test(key)) {
      showShortcut('…', 'Usa un tasto funzione (F1–F24) o una combinazione con Ctrl, Alt, Shift o Win.', true);
      return;
    }
    endCapture();
    await applyShortcut([...mods, key].join('+'));
  }, true);

  changeBtn.onclick = startCapture;
  $('shortcut-reset').onclick = () => { cancelCapture(); applyShortcut('F10'); };

  // ---------- avvio ----------

  (async () => {
    const state = await window.overlay.loadState();
    prefs = { sites: state.sites };
    currentShortcut = state.shortcut;
    showShortcut(currentShortcut);
    // Riapre l'ultima tab scelta, se il sito esiste ancora.
    activate(findSite(state.activeTab) ? state.activeTab : null);
    renderList();
    for (const site of prefs.sites) if (!site.title) resolveTitle(site);
  })();
</script>
</body>
</html>
