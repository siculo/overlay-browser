<body style="margin:0;display:flex;flex-direction:column;height:100vh;background:#111;font-family:system-ui,sans-serif;color:#eee">
  <div id="bar" style="padding:6px;-webkit-app-region:drag"></div>
  <div id="home" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px">
    <h1 style="margin:0;font-weight:500">Scegli un sito</h1>
    <div id="tiles" style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:600px"></div>
  </div>
  <div id="views" style="flex:1;display:none"></div>
  <script>
    const SITES = {
      'SCMDB': 'https://scmdb.net/',
      '#DPSCalculator': 'https://erkul.games/calculator',
      'Star Citizen Tools': 'https://starcitizen.tools',
    };
    const bar = document.getElementById('bar');
    const home = document.getElementById('home');
    const tiles = document.getElementById('tiles');
    const views = document.getElementById('views');

    // Un webview per sito, creato al primo accesso e poi solo nascosto/mostrato:
    // così ogni "tab" conserva pagina, scroll, form e cronologia.
    const tabs = {};          // name -> webview
    const barButtons = {};    // name -> pulsante nella barra
    let active = null;        // nome del tab attivo, null = Home

    function setActive(name) {
      active = name;
      home.style.display = name === null ? 'flex' : 'none';
      views.style.display = name === null ? 'none' : 'flex';
      for (const [n, wv] of Object.entries(tabs)) {
        wv.style.display = n === name ? 'flex' : 'none';
      }
      for (const [n, b] of Object.entries(barButtons)) {
        b.style.fontWeight = n === name ? 'bold' : 'normal';
      }
      barButtons.Home.style.fontWeight = name === null ? 'bold' : 'normal';
    }

    function openSite(name) {
      if (!tabs[name]) {
        const wv = document.createElement('webview');
        wv.style.cssText = 'flex:1;display:none';
        wv.src = SITES[name];
        views.append(wv);
        tabs[name] = wv;
      }
      setActive(name);
    }

    function addBarButton(label, onclick) {
      const b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = '-webkit-app-region:no-drag;margin-right:4px';
      b.onclick = onclick;
      bar.append(b);
      return b;
    }

    barButtons.Home = addBarButton('Home', () => setActive(null));
    for (const [name, url] of Object.entries(SITES)) {
      barButtons[name] = addBarButton(name, () => openSite(name));

      const t = document.createElement('button');
      t.textContent = name;
      t.title = url;
      t.style.cssText = 'width:160px;height:100px;font-size:18px;border:1px solid #333;border-radius:8px;background:#1c1c1c;color:#eee;cursor:pointer';
      t.onmouseenter = () => (t.style.background = '#2a2a2a');
      t.onmouseleave = () => (t.style.background = '#1c1c1c');
      t.onclick = () => openSite(name);
      tiles.append(t);
    }
    setActive(null);
  </script>
</body>
