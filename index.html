<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* --strip: top bar behind the tabs; --sheet: everything below it (navigation
     bar and page), same color as the active tab, which looks attached to it.
     --accent: accent color chosen in the settings (set by the script, see
     ACCENT_COLORS; amber until then); --accent-text: lighter, for text on the
     dark background; --on-accent: text on an accent background. */
  :root { --strip: #0b0b0b; --sheet: #181818; --accent: #f0a030; --accent-text: #f5b750; --on-accent: #111;
          --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
          --accent-soft-hover: color-mix(in srgb, var(--accent) 25%, transparent); }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh; background: var(--sheet); color: #eee; font-family: system-ui, sans-serif; }
  /* Translucency applied by the page (platforms whose window cannot be
     translucent by itself, see 'state:load'). The opacity goes on body: the
     body background would otherwise be painted on the page canvas, which
     opacity does not affect. A background of its own on html (transparent,
     but not "none") keeps the body background on body. */
  html.css-opacity { background-image: linear-gradient(transparent, transparent); }
  html.css-opacity body { opacity: var(--window-opacity); }
  button { font: inherit; color: #eee; background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 4px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #363636; }
  button.active { background: #4a4a4a; font-weight: bold; }
  input, select { font: inherit; color: #eee; background: #1c1c1c; border: 1px solid #3a3a3a; border-radius: 4px; padding: 5px 8px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input[type=checkbox], input[type=range] { accent-color: var(--accent); }
  /* Confirmation buttons (OK of the dialogs, add, save) */
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
  button.primary:hover { background: var(--accent-text); border-color: var(--accent-text); }

  /* Top bar: fixed Home, then the tabs, scrollable with the arrows */
  /* The tabs (and the active Home/Settings) touch the bottom edge of the bar,
     the other buttons are centered on the tabs' height. */
  #bar { display: flex; align-items: flex-end; gap: 4px; padding: 6px 6px 0; background: var(--strip); -webkit-app-region: drag; }
  #bar button { -webkit-app-region: no-drag; }
  /* Flat buttons in the bar: background only on hover */
  #bar > button, #tabs-wrap > button { height: 26px; margin-bottom: 3px; background: none; border: none; color: #bbb; }
  #bar > button:hover:not(:disabled), #tabs-wrap > button:hover:not(:disabled) { background: #222; color: #fff; }
  #bar > button:disabled:hover, #tabs-wrap > button:disabled:hover { background: none; }
  /* #tabs does not grow beyond its content, so the "+" sits right after the last tab */
  #tabs { flex: 0 1 auto; min-width: 0; display: flex; align-items: flex-end; overflow-x: hidden; scroll-behavior: smooth; }
  #tabs-wrap { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 4px; }
  /* Scroll arrows and "+": Material Icons "chevron_left", "chevron_right"
     and "add" (Apache 2.0) */
  #tabs-wrap > button { display: flex; align-items: center; justify-content: center; }
  #tabs-wrap > button .icon { flex: none; width: 18px; height: 18px; fill: currentColor; }
  .arrow { padding: 3px 4px; }
  #add-tab { padding: 3px 6px; }

  /* Tab: label with ellipsis + close button, shaped like a tab whose active
     one is attached to the sheet below. Thin separators between inactive
     tabs, hidden next to the active and the hovered one. */
  .tab { position: relative; flex: none; display: flex; align-items: center; gap: 6px; height: 32px; max-width: 200px; padding: 0 6px 0 12px; color: #999; border-radius: 8px 8px 0 0; cursor: pointer; -webkit-app-region: no-drag; user-select: none; }
  .tab:not(:first-child)::before { content: ''; position: absolute; left: 0; top: 9px; bottom: 9px; width: 1px; background: #333; }
  .tab.active::before, .tab:hover::before, .tab.active + .tab::before, .tab:hover + .tab::before { display: none; }
  .tab:hover { background: #161616; color: #ddd; }
  .tab.active { background: var(--sheet); color: #fff; box-shadow: inset 0 2px 0 var(--accent); }
  /* The tab whose address is the page shown in another tab (see pageMatch) */
  .tab.match, .tab.match:hover { background: var(--accent-soft); color: var(--accent-text); }
  .tab.match::before, .tab.match + .tab::before { display: none; }
  .tab .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* The ×: always on the active tab, on the others only on hover
     (Material Icons "close", Apache 2.0) */
  .tab .close { flex: none; display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 4px; color: #aaa; visibility: hidden; }
  .tab .close .icon { width: 14px; height: 14px; fill: currentColor; }
  .tab.active .close, .tab:hover .close { visibility: visible; }
  .tab .close:hover { background: #3a3a3a; color: #fff; }

  /* Drag to reorder (tabs and site rows, see makeSortable) */
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }
  body.dragging webview { pointer-events: none; }
  .tab.dragging { z-index: 1; }
  .tab.dragging:not(.active) { background: #222; color: #ddd; }
  .tab.dragging::before, .tab.dragging + .tab::before { display: none; }

  /* Fixed tabs (Home, Browse, Settings): text in the accent color, to tell
     them from the sites' tabs; when active, attached to the sheet like a
     tab. Icon and name, or the icon only (settings.fixedTabs = 'icons',
     class on body; the name is then in the tooltip). */
  #bar > .fixed { display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 6px; color: var(--accent-text); font-weight: 500; }
  #bar > .fixed:hover { background: #222; color: var(--accent-text); }
  #bar > .fixed.active { height: 32px; margin-bottom: 0; border-radius: 8px 8px 0 0; background: var(--sheet); box-shadow: inset 0 2px 0 var(--accent); }
  #bar > #browse-btn { margin-right: 6px; }
  /* Icons: Material Icons "home", "language" and "settings" (Apache 2.0) */
  .fixed .icon { flex: none; width: 16px; height: 16px; fill: currentColor; }
  body.fixed-icons #bar > .fixed { padding: 0 9px; }
  body.fixed-icons .fixed .label { display: none; }

  /* Dialogs: confirmations and address input (#dialog), adding sites from
     an address or from bookmarks (#add-dialog) */
  .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.55); -webkit-app-region: no-drag; }
  .modal .box { width: min(440px, calc(100vw - 32px)); padding: 18px; background: #1c1c1c; border: 1px solid #444; border-radius: 8px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); }
  #dialog-msg, .dialog-msg { display: block; margin-bottom: 12px; line-height: 1.4; overflow-wrap: anywhere; }
  #dialog-input { width: 100%; }
  .modal .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  #dialog-ok.danger { background: #7a2a2a; border-color: #944; color: #eee; }
  #dialog-ok.danger:hover { background: #8e3333; border-color: #944; }
  /* Adding sites: tabs Address / Bookmarks; the Bookmarks one is wider */
  #add-dialog.wide .box, #export-dialog .box { width: min(640px, calc(100vw - 32px)); }
  .dialog-tabs { display: flex; gap: 4px; margin: -6px 0 14px; border-bottom: 1px solid #333; }
  .dialog-tabs button { background: none; border: none; border-radius: 4px 4px 0 0; padding: 5px 12px; color: #999; }
  .dialog-tabs button:hover { background: #262626; color: #ddd; }
  .dialog-tabs button[aria-selected=true] { color: #fff; box-shadow: inset 0 -2px 0 var(--accent); }
  #add-input, #bm-search { width: 100%; }
  .bm-source { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  #bm-source { flex: 1; min-width: 0; }
  /* Instead of the select where there are no browsers to choose (macOS) */
  #bm-file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bm-file-name.none { color: #888; }
  /* Browsers whose data the system does not let the app read */
  .bm-denied { margin-bottom: 8px; padding: 6px 9px; font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; color: #db8; background: #2a2416; border: 1px solid #4a3f22; border-radius: 4px; }
  /* Bookmark tree: one row per folder or bookmark, indented by depth */
  .bm-tree { margin-top: 8px; height: min(360px, calc(100vh - 300px)); min-height: 90px; overflow-y: auto; padding: 4px 0; background: #161616; border: 1px solid #333; border-radius: 4px; }
  .bm-row { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px calc(8px + var(--depth) * 18px); cursor: pointer; user-select: none; }
  .bm-row:hover { background: #222; }
  .bm-row .twisty { flex: none; width: 1em; color: #888; text-align: center; }
  .bm-row input { flex: none; margin: 0; cursor: inherit; }
  .bm-row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .bm-row.folder .title { font-weight: 500; }
  .bm-row .url, .bm-row .count { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #888; }
  .bm-row .count { color: #777; }
  .bm-row.disabled { cursor: default; color: #777; }
  .bm-row.disabled:hover { background: none; }
  .bm-row .tag { flex: none; font-size: 11px; color: #999; }
  .bm-status { padding: 12px; color: #999; }
  /* List the bookmarks are added to, left of the buttons */
  #add-target { flex: 1; min-width: 0; align-self: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; color: #999; }
  .bm-status.err { color: #f77; }
  /* Import from the Home: list the bookmarks are added to, left of the buttons */
  #add-list-pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #999; }
  #add-list { flex: 0 1 auto; min-width: 0; font-size: 13px; padding: 3px 6px; }
  /* "All bookmarks" checkbox above the tree (import and export) */
  .bm-all { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding: 0 9px; cursor: pointer; user-select: none; }
  .bm-all input { margin: 0; cursor: inherit; }
  #ex-search { width: 100%; }

  /* Navigation bar of the active site, below the tabs */
  #nav { display: flex; align-items: center; gap: 4px; padding: 6px; -webkit-app-region: drag; }
  #nav button { -webkit-app-region: no-drag; min-width: 32px; }
  /* Icons of the navigation buttons: Material Icons "keyboard_tab"
     (mirrored), "arrow_back", "arrow_forward", "refresh", "push_pin" and
     "more_horiz" (Apache 2.0) */
  #nav button .icon { flex: none; width: 16px; height: 16px; fill: currentColor; }
  #nav-site, #nav-back, #nav-forward, #nav-reload, #nav-pin, #nav-more { display: flex; align-items: center; justify-content: center; align-self: stretch; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: #2a2a2a; }
  /* Address field of the free browsing tab */
  #nav-url { flex: 1; min-width: 0; -webkit-app-region: no-drag; }
  /* In the sites' tabs: the address only, selectable but not editable,
     without border and background */
  #nav-url[readonly], #nav-url[readonly]:focus { color: #aaa; background: transparent; border-color: transparent; }
  #nav-url.invalid, #opt-browse-start.invalid, #opt-search-custom.invalid { border-color: #c55; }
  #nav-pin { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 6px; }
  /* Menu of the "..." button, right of the address: further operations on the page */
  #nav { position: relative; }
  #nav-menu { position: absolute; top: calc(100% - 2px); right: 6px; z-index: 50; min-width: 200px; max-width: calc(100vw - 32px); padding: 4px; background: #1c1c1c; border: 1px solid #444; border-radius: 6px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); -webkit-app-region: no-drag; }
  #nav-menu button { display: block; width: 100%; text-align: left; background: none; border: none; padding: 6px 10px; overflow: hidden; text-overflow: ellipsis; }
  #nav-menu button:hover:not(:disabled) { background: #2a2a2a; }
  #nav-menu button:disabled:hover { background: none; }

  /* New version available: strip below the navigation bar (below the tabs
     where there is no navigation bar), on every tab until closed */
  #update { flex: none; display: flex; align-items: center; gap: 10px; padding: 5px 6px 5px 12px; font-size: 13px; color: #ddd; background: var(--accent-soft); border-top: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  #update .icon { flex: none; width: 16px; height: 16px; fill: var(--accent-text); }
  #update-msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #update button { font-size: 13px; padding: 2px 10px; }
  #update-close { display: flex; align-items: center; justify-content: center; padding: 2px 4px !important; background: none; border: none; color: #aaa; }
  #update-close:hover { background: #3a3a3a; color: #fff; }
  #update-close .icon { fill: currentColor; }

  /* Free browsing tab with no page open */
  #browse-empty { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; color: #888; text-align: center; }
  #opt-browse-start, #opt-search-custom { flex: 1; min-width: 0; max-width: 420px; }

  /* Home */
  #home, .page { flex: 1; overflow-y: auto; padding: 24px; }
  .page h1 { margin: 0 0 16px; font-weight: 500; font-size: 22px; }
  .page h2 { margin: 40px 0 14px; font-weight: 500; font-size: 16px; color: #bbb; text-transform: uppercase; letter-spacing: 0.04em; }
  .page h1 + h2, .page .page-title + h2 { margin-top: 8px; }
  /* Settings title, with the app version and the project link on its right */
  .page-title { display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px; }
  .page-title h1 { margin: 0; }
  #app-info { margin-left: auto; font-size: 13px; color: #999; }
  #app-version { font-variant-numeric: tabular-nums; user-select: text; }
  #app-repo, #app-update-link { color: var(--accent-text); text-decoration: none; }
  #app-repo:hover, #app-update-link:hover { text-decoration: underline; }
  #app-update-link { font-weight: 500; }
  .setting.check { align-items: flex-start; cursor: pointer; max-width: 720px; }
  .setting.check input { margin: 3px 0 0; width: 16px; height: 16px; cursor: pointer; }
  .setting .desc { display: block; font-size: 13px; color: #999; margin-top: 2px; }
  #show-log-setting { margin-top: 14px; }
  /* Content of the Home (notices and lists) and of the Settings, at most
     720px wide, centered in the page */
  #home > *, #settings > * { margin-inline: auto; }
  #settings > * { max-width: 720px; }
  /* Site lists: the current one first, then the others (collapsed) */
  #lists { display: flex; flex-direction: column; gap: 18px; max-width: 720px; margin-top: 8px; }
  /* More room between the boxes above the lists and the current list */
  #pinned:not([hidden]) ~ #lists, #preset:not([hidden]) ~ #lists { margin-top: 20px; }
  .list-head { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid #333; }
  .list-head.toggle { cursor: pointer; }
  .list-head.toggle:hover .name { text-decoration: underline; }
  .list-head .twisty { width: 1em; color: #888; }
  .list-head .name { font-size: 17px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .list:not(.current) .list-head .name { color: #ccc; }
  .list.current { margin-bottom: 22px; }
  #lists .lists-title { margin: 0 0 -8px; font-weight: 500; font-size: 14px; color: #999; text-transform: uppercase; letter-spacing: 0.04em; }
  .list-head .detail { flex: 1; font-size: 12px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .badge { flex: none; font-size: 11px; padding: 1px 7px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-text); }
  .badge.new { background: #2e2e2e; color: #aaa; }
  .list-body { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .list-body .empty { color: #999; }
  .site .info.static { cursor: default; }
  .site .info.static:hover .title { text-decoration: none; }
  .site { position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #1c1c1c; border: 1px solid #333; border-radius: 6px; }
  .site.dragging { z-index: 1; border-color: #555; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5); }
  .site .info { flex: 1; min-width: 0; cursor: pointer; }
  .site .info:hover .title { text-decoration: underline; }
  .site .title { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site .url { font-size: 12px; color: #999; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .site input { flex: 1; min-width: 0; }
  .add { display: flex; gap: 8px; margin-top: 4px; }
  .add input { flex: 1; }
  .error { color: #f77; font-size: 13px; min-height: 1em; }
  .error:empty { display: none; }
  #home h2 { margin: 28px 0 12px; font-weight: 500; font-size: 18px; }
  /* Home: bookmark import and export, after the lists */
  #home-bookmarks { max-width: 720px; margin-top: 36px; padding-top: 14px; border-top: 1px solid #333; }
  #home-bookmarks h2 { margin: 0 0 4px; font-size: 14px; color: #999; text-transform: uppercase; letter-spacing: 0.04em; }
  #home-bookmarks .desc { margin-bottom: 10px; font-size: 13px; color: #999; }
  #home-bookmarks .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  /* Boxes above the lists: list chosen by hand, predefined list offered */
  .notice { display: flex; align-items: center; gap: 8px; max-width: 720px; margin: 0 0 8px; padding: 6px 10px; font-size: 13px; color: #bbb; background: #1c1c1c; border: 1px solid #333; border-left: 3px solid var(--accent); border-radius: 4px; }
  .notice .name { color: #eee; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .notice .detail { color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .notice button { font-size: 13px; padding: 2px 8px; }
  .notice.offer { border-left-color: #6c6; }
  .notice.offer .detail { color: #ddd; white-space: normal; }
  .setting { display: flex; align-items: center; gap: 8px; }
  kbd { font: inherit; font-family: ui-monospace, monospace; padding: 3px 8px; border: 1px solid #555; border-radius: 4px; background: #1c1c1c; min-width: 3em; text-align: center; }
  kbd.capturing { border-color: var(--accent); color: var(--accent-text); }
  .hint { font-size: 13px; color: #999; margin-top: 6px; min-height: 1em; }
  .hint.err { color: #f77; }
  input[type=range] { width: 220px; padding: 0; border: none; background: none; }
  #opt-opacity-value { min-width: 3em; font-variant-numeric: tabular-nums; }
  #opacity-setting, #browse-start-setting, #search-setting, #fixed-tabs-setting, #check-updates-setting { margin-top: 14px; }
  /* Memory: total, then one row per process (pages, interface, GPU...) */
  #memory-head { margin-top: 18px; justify-content: space-between; }
  #memory-total { font-size: 16px; }
  #memory-close-all { font-size: 13px; padding: 2px 10px; }
  #opt-unload-value { min-width: 4em; font-variant-numeric: tabular-nums; }
  #memory-table { width: 100%; margin-top: 10px; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
  #memory-table td { padding: 5px 0; border-bottom: 1px solid #2a2a2a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #memory-table td.size { width: 7em; text-align: right; font-variant-numeric: tabular-nums; color: #bbb; }
  /* Close button of the pages' rows */
  #memory-table td.action { width: 6.5em; padding: 3px 0 3px 10px; text-align: right; }
  #memory-table td.action button { font-size: 12px; padding: 1px 8px; }
  /* Accent color: one round swatch per predefined color, the chosen one ringed */
  #accents { display: flex; flex-wrap: wrap; gap: 8px; }
  #accents button { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid transparent; background: var(--swatch); box-shadow: inset 0 0 0 2px var(--sheet); }
  #accents button:hover { background: var(--swatch); border-color: #666; }
  #accents button[aria-checked=true] { border-color: #eee; }

  #views { flex: 1; display: flex; }
  #views webview { flex: 1; }
</style>
</head>
<body>
  <div id="bar">
    <button id="home-btn" class="fixed" data-i18n-title="bar.home"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span class="label" data-i18n="bar.home"></span></button>

<script>
  const $ = (id) => document.getElementById(id);
  const homeBtn = $('home-btn'), tabsEl = $('tabs'), leftBtn = $('left'), rightBtn = $('right');
  const home = $('home'), listsEl = $('lists'), views = $('views');
  const settingsBtn = $('settings-btn'), settingsPage = $('settings'), browseBtn = $('browse-btn');

  // ---------- site lists ----------
  //
  // Each list is { id, name, match, sites, activeTab }. `match` tells which
  // application it belongs to: { exe } (executable, lowercase and without
  // ".exe"), { title } (window title, when the executable is not known) or
  // null (no application detected: the general list, which always exists
  // and cannot be removed). `name` is the application's name, or the window
  // title when the list was created (null for the general list). `activeTab`
  // is the tab the list was left on: a site's id, HOME, SETTINGS or BROWSE.
  //
  // The current list, whose sites are the tabs, is the one chosen by hand
  // (pinnedId) if any, otherwise the one of the application the overlay was
  // opened over. A list is created only when its first site is added: until
  // then the application's list is a "new" one (id null) with no sites.

  let lists = [];
  let pinnedId = null;                           // list chosen by hand, kept until restored
  let context = { match: null, name: null };     // application the overlay was opened over
  const webviews = new Map();   // site id -> webview (one "tab" per site, created on first access, kept across lists)
  const SETTINGS = ':settings'; // value of `active` for the Settings page
  const HOME = ':home';         // a list's `activeTab` when it was left on the Home (`active` null)
  const BROWSE = ':browse';     // value of `active` for the free browsing tab (one for all lists)
  let active = null;            // id of the active site, null = Home, SETTINGS = Settings, BROWSE = free browsing
  // Whether a tab shows a page (webview): the sites and the free browsing tab.
  const isSite = (id) => id !== null && id !== SETTINGS;
  let editing = null;           // id of the site being edited on the Home page
  const expanded = new Set();   // ids of the other lists opened on the Home page
  const collapsed = new Set();  // keys (listKey) of the lists closed on the Home page while current
  let listError = null;         // { key, msg }: error shown under a list (invalid address)
  const drafts = new Map();     // input key -> text being typed, kept when the Home is rendered again
  let focusKey = null;          // input to focus after the next render

  function contextOf(app) {
    const exe = app?.exe?.toLowerCase().replace(/\.exe$/, '');
    if (exe) return { match: { exe }, name: app.name || app.title || app.exe };
    if (app?.title) return { match: { title: app.title }, name: app.title };
    return { match: null, name: null };
  }
  const sameMatch = (a, b) => (a?.exe ?? null) === (b?.exe ?? null) && (a?.title ?? null) === (b?.title ?? null);

  const listKey = (l) => l.id ?? 'new';
  const listName = (l) => l.name || l.match?.exe || l.match?.title || t('lists.general');
  const contextList = () => lists.find((l) => sameMatch(l.match, context.match)) ??
    { id: null, name: context.name, match: context.match, sites: [], activeTab: null };
  const pinnedList = () => (pinnedId && lists.find((l) => l.id === pinnedId)) || null;
  const currentList = () => pinnedList() || contextList();
  const listOfSite = (id) => lists.find((l) => l.sites.some((s) => s.id === id));
  const findSite = (id) => listOfSite(id)?.sites.find((s) => s.id === id);

  // ---------- log of the user's actions ----------
  //
  // Written by main.js in overlay.log with the verbose log only. Nothing
  // about the browsing: never addresses or page titles; a list is named by
  // its application, a site by its position in its list.
  const logAction = (msg) => window.overlay.logAction(msg);
  // The same, followed by the memory used by the app after the event.
  const logMemory = (msg) => window.overlay.logMemory(msg);
  const listRef = (l) => (!l ? 'no list' : !l.match ? 'general list'
    : l.match.exe ? `list of ${l.match.exe}` : 'list of a window');
  function siteRef(id) {
    const l = listOfSite(id);
    if (!l) return 'site';
    return `site ${l.sites.findIndex((s) => s.id === id) + 1}/${l.sites.length} of ${listRef(l)}`;
  }
  const tabRef = (id) => (id === null ? 'Home' : id === SETTINGS ? 'Settings' : id === BROWSE ? 'Browse' : siteRef(id));
  const save = () => window.overlay.saveLists(lists);

  // Lists created before the application's name was detected are named
  // after the window title they were created from (e.g. IntelliJ's project):
  // they take the application's name, once known. The names of the
  // predefined lists are kept.
  function renameContextList(app) {
    const l = contextList();
    if (!l.id || !app?.name || l.name === app.name || presetsApplied.has(l.match?.exe)) return;
    l.name = app.name;
    save();
  }

  // Turns a new list into a real one (when its first site is added).
  function materialize(l) {
    if (!l.id) {
      l.id = crypto.randomUUID();
      lists.push(l);
    }
    return l;
  }

  function setPinned(id) {
    logAction(id ? `list chosen by hand: ${listRef(lists.find((l) => l.id === id))}` : 'list chosen by hand restored');
    pinnedId = id;
    window.overlay.pinList(id);
  }

  // ---------- utilities ----------

  function normalizeUrl(raw) {
    let s = raw.trim();
    if (!s) return null;
    if (!/^[a-z][a-z\d+.-]*:\/\//i.test(s)) s = 'https://' + s;
    try {
      const u = new URL(s);
      return /^https?:$/.test(u.protocol) ? u.href : null;
    } catch {
      return null;
    }
  }

  const siteName = (site) => site.title || new URL(site.url).hostname;

  function showError(msg, l) { listError = msg ? { key: listKey(l), msg } : null; }

  // Fetches the title from the page; if that fails the host name is kept.
  async function resolveTitle(site) {
    const url = site.url;
    const title = await window.overlay.fetchTitle(url);
    if (title && site.url === url && findSite(site.id)) {
      site.title = title;
      save();
      render();
    }
  }

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function button(text, onclick, type = 'button') {
    const b = el('button', null, text);
    b.type = type;
    if (onclick) b.onclick = (e) => { e.stopPropagation(); onclick(e); };
    return b;
  }

  // Input whose text survives the Home being rendered again (see renderHome).
  function draftInput(key, initial) {
    const input = el('input');
    input.dataset.key = key;
    input.value = drafts.has(key) ? drafts.get(key) : initial;
    input.oninput = () => drafts.set(key, input.value);
    return input;
  }

  // ---------- tab / webview ----------

  // `id`: a site's id or BROWSE. `url`: the page to load if the webview is
  // created (default: the last page visited if its page was closed for
  // being unused, see unloadPage, otherwise the site's address, or the start
  // page for the free browsing tab). Returns null if there is nothing to load
  // (free browsing tab without a start page).
  function getWebview(id, url = lastUrls.get(id) ?? (id === BROWSE ? browseStart : findSite(id)?.url)) {
    let wv = webviews.get(id);
    if (!wv) {
      if (!url) return null;
      lastUrls.delete(id);
      wv = document.createElement('webview');
      // Windows opened by the site (logins, target=_blank): see 'site popups' in main.js.
      wv.setAttribute('allowpopups', '');
      wv.src = url;
      wv.style.display = 'none';
      // Fallback for sites that set the title via JavaScript: use the first
      // title the page reports, if we don't have one already.
      // The id is looked up at every event: a page of the free browsing tab
      // or of a site becomes another site's when it is pinned (see pinPage).
      const idOf = () => { for (const [k, v] of webviews) if (v === wv) return k; return null; };
      // First load of the page: its process now exists and is counted.
      const createdAt = Date.now();
      wv.addEventListener('did-finish-load', () => {
        if (webviews.get(idOf()) === wv) logMemory(`page loaded in ${Date.now() - createdAt} ms: ${tabRef(idOf())}`);
      }, { once: true });
      wv.addEventListener('page-title-updated', (e) => {
        const s = findSite(idOf());
        if (s && !s.title && e.title) { s.title = e.title; save(); render(); }
      });
      // History changes on every navigation: update Back/Forward (and the address).
      for (const ev of ['dom-ready', 'did-navigate', 'did-navigate-in-page', 'did-stop-loading']) {
        wv.addEventListener(ev, () => { if (active === idOf()) updateNav(ev !== 'did-stop-loading'); });
      }
      views.append(wv);
      webviews.set(id, wv);
    }
    return wv;
  }

  function closeWebview(id) {
    webviews.get(id)?.remove();
    webviews.delete(id);
    idleSince.delete(id);
    lastUrls.delete(id);
  }

  function activate(id) {
    if (id !== SETTINGS) cancelCapture();
    if (id !== active) logAction(`tab ${tabRef(id)}`);
    closeNavMenu();
    // The list's last tab: a site, the Home or the Settings page.
    const cur = currentList();
    const tab = id ?? HOME;
    if (cur.id && cur.activeTab !== tab) { cur.activeTab = tab; save(); }
    active = id;
    watchMemory(id === SETTINGS);
    if (isSite(id)) getWebview(id);
    home.hidden = id !== null;
    settingsPage.hidden = id !== SETTINGS;
    views.hidden = !isSite(id);
    for (const [wid, wv] of webviews) wv.style.display = wid === id ? 'flex' : 'none';
    browseEmpty.hidden = !(id === BROWSE && !webviews.has(BROWSE));
    markIdle();
    renderTabs();
    updateNav(true);
    // A bar button clicked earlier (Home, Browse, Settings) would keep the
    // focus, and its focus ring would show on a tab no longer active when
    // the tab changes by itself (overlay shown over another application).
    if (document.activeElement?.closest('#bar')) document.activeElement.blur();
    // Free browsing tab with no page: the address is typed right away.
    if (id === BROWSE && !webviews.has(BROWSE)) navUrl.focus();
  }

  // At startup and after the current list has changed (another application,
  // a list chosen or restored): shows the current list on its last tab, the
  // Home, the Settings page or a site, whose page is opened again if it was
  // closed (see below). If the list has no last tab (or its site was
  // removed), on its first tab; the Home if the list has no sites.
  function showCurrentList() {
    const cur = currentList();
    const last = cur.activeTab;
    let id;
    if (last === HOME) id = null;
    else if (last === SETTINGS || last === BROWSE) id = last;
    else if (cur.sites.some((s) => s.id === last)) id = last;
    else id = cur.sites[0]?.id ?? null;
    logAction(`current list: ${listRef(cur)}${pinnedId ? ' (chosen by hand)' : ''}, ${cur.sites.length} sites`);
    activate(id);
    render();
    sweepPages();
  }

  // ---------- closing the pages not in use ----------
  //
  // A page (webview) is in use while it is the active tab of the visible
  // overlay. Each of the others (other tabs, pages of the other lists, all
  // of them while the overlay is hidden) is closed after some minutes
  // without use (`unloadAfter`, Settings), whatever its list. Going back to
  // it before then finds it as it was; after, its tab loads again the last
  // page visited (without the history).

  const idleSince = new Map();   // site id -> since when its page is not in use
  const lastUrls = new Map();    // site id -> last page visited, for the pages closed by unloadPage
  let unloadAfter = 30;          // minutes
  let overlayVisible = false;    // the window starts hidden (see main.js)

  const inUse = (id) => overlayVisible && id === active;
  const unloadDelay = () => unloadAfter * 60000;

  // Starts the time of the pages that have just stopped being in use, and
  // stops the one of the page in use.
  function markIdle() {
    const now = Date.now();
    for (const id of webviews.keys()) {
      if (inUse(id)) idleSince.delete(id);
      else if (!idleSince.has(id)) idleSince.set(id, now);
    }
  }

  // Closes the page of a site, remembering where it was. `byHand`: from the
  // Settings page (see closePages) instead of after the delay.
  function unloadPage(id, byHand = false) {
    let url = null;
    try { url = webviews.get(id)?.getURL(); } catch { /* not ready yet */ }
    logAction(byHand ? `page closed by hand: ${tabRef(id)}` : `page closed after ${unloadAfter} min without use: ${tabRef(id)}`);
    closeWebview(id);
    if (url && /^https?:/i.test(url)) lastUrls.set(id, url);
  }

  // Closes pages by hand (Settings page, memory section): like after the
  // delay, their tab loads again the last page visited. On the Settings
  // page no page is in use, so any of them can be closed.
  function closePages(ids) {
    ids = ids.filter((id) => webviews.has(id) && !inUse(id));
    if (!ids.length) return;
    for (const id of ids) unloadPage(id, true);
    renderMemory();
    setTimeout(() => logMemory(`${ids.length} pages closed by hand`), 2000);
    // The processes take a moment to end: measured again a little later.
    setTimeout(updateMemory, 800);
  }

  function sweepPages() {
    markIdle();
    const now = Date.now();
    let closed = 0;
    for (const [id, since] of [...idleSince]) {
      if (now - since >= unloadDelay()) { unloadPage(id); closed++; }
    }
    // Measured a little later: the pages' processes take a moment to end.
    if (closed) setTimeout(() => logMemory(`${closed} pages closed after ${unloadAfter} min without use`), 2000);
  }
  // The time also runs while the overlay is hidden (timers of a hidden
  // window may be slowed down to once a minute: the delay is approximate).
  setInterval(sweepPages, 30000);

  window.overlay.onVisible((visible) => {
    overlayVisible = visible;
    if (!visible) closeNavMenu();
    sweepPages();
    // The page of the active tab was closed while the overlay was hidden:
    // it is opened again.
    if (visible && isSite(active) && !webviews.has(active)) activate(active);
  });

  // Minutes left before the page of a site is closed, null if it is in use.
  function minutesToUnload(id) {
    const since = idleSince.get(id);
    if (since === undefined) return null;
    return Math.max(1, Math.ceil((since + unloadDelay() - Date.now()) / 60000));
  }

  // Settings: the delay's slider.
  const unloadInput = $('opt-unload'), unloadValue = $('opt-unload-value');

  function showUnloadAfter() {
    unloadValue.textContent = t('settings.minutes', { count: unloadAfter });
  }

  function initUnload(range, settings) {
    unloadAfter = settings.unloadAfter;
    unloadInput.min = range.min;
    unloadInput.max = range.max;
    unloadInput.value = unloadAfter;
    unloadInput.oninput = () => {
      unloadAfter = Number(unloadInput.value);
      showUnloadAfter();
      window.overlay.setSetting('unloadAfter', unloadAfter);
      renderMemory();
    };
    showUnloadAfter();
  }

  // ---------- navigation ----------

  const navEl = $('nav'), navBack = $('nav-back'), navForward = $('nav-forward');
  const navSite = $('nav-site'), navReload = $('nav-reload'), navUrl = $('nav-url'), navPin = $('nav-pin');
  const navMore = $('nav-more'), navMenu = $('nav-menu'), navCookies = $('nav-cookies');
  const browseEmpty = $('browse-empty');
  let browseStart = '';   // start page of the free browsing tab (settings.browseStart), '' = none

  // The address field shows the page's address in every tab with a page;
  // it can be edited only in the free browsing tab. `showUrl`: update it
  // even while it has the focus (otherwise left alone, so as not to replace
  // what the user is typing), after a navigation or a tab change.
  function updateNav(showUrl = false) {
    navEl.hidden = !isSite(active);
    const wv = isSite(active) ? webviews.get(active) : null;
    // canGoBack/canGoForward/getURL throw until the webview is ready.
    let back = false, forward = false, url = '';
    try { back = wv.canGoBack(); forward = wv.canGoForward(); } catch { /* not ready yet */ }
    try { url = wv.getURL(); } catch { url = wv?.src ?? ''; }
    navBack.disabled = !back;
    navForward.disabled = !forward;
    const browse = active === BROWSE;
    navUrl.hidden = !isSite(active);
    navUrl.readOnly = !browse;
    navUrl.placeholder = !browse ? '' : searchName() ? t('nav.addressWith', { engine: searchName() }) : t('nav.address');
    navPin.hidden = !isSite(active);
    navMore.hidden = !isSite(active);
    navCookies.disabled = !cookieDomain(url);
    navCookies.textContent = cookieDomain(url) ? t('nav.cookiesOf', { domain: cookieDomain(url) }) : t('nav.cookies');
    // In the free browsing tab, the "site home" button goes to the start
    // page, or without one back to the empty page (disabled while on it).
    navSite.disabled = browse && !browseStart && !wv;
    navReload.disabled = !wv;
    // A page that is already a tab of the list (the tab itself, on its
    // address, or another one) cannot be pinned: another tab is highlighted.
    // Also after the in-page navigations (history.pushState), with which
    // many sites change page without loading it.
    const match = isSite(active) ? pageMatch(url) : null;
    navPin.disabled = !/^https?:/i.test(url) || !!match;
    navPin.title = match ? t('nav.pinned', { name: siteName(match) }) : t('nav.pinTitle');
    markMatch(match && match.id !== active ? match.id : null);
    if (showUrl || document.activeElement !== navUrl || navUrl.readOnly) {
      navUrl.value = /^https?:/i.test(url) ? url : '';
      navUrl.classList.remove('invalid');
    }
  }

  // Search engines of the free browsing tab (settings.searchEngine: the
  // names are validated in main.js, SEARCH_ENGINES): `%s` is replaced by the
  // encoded text. 'custom' uses the address in settings.searchCustom; while
  // it has none, Google is used.
  const SEARCH_ENGINES = {
    google: { name: 'Google', url: 'https://www.google.com/search?q=%s' },
    bing: { name: 'Bing', url: 'https://www.bing.com/search?q=%s' },
    duckduckgo: { name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=%s' },
    brave: { name: 'Brave Search', url: 'https://search.brave.com/search?q=%s' },
    ecosia: { name: 'Ecosia', url: 'https://www.ecosia.org/search?q=%s' },
    startpage: { name: 'Startpage', url: 'https://www.startpage.com/do/search?q=%s' },
  };
  let searchEngine = 'google', searchCustom = '';

  const searchTemplate = () => searchEngine === 'custom'
    ? searchCustom || SEARCH_ENGINES.google.url
    : (SEARCH_ENGINES[searchEngine] ?? SEARCH_ENGINES.google).url;
  // Name shown in the field, null for a custom engine.
  const searchName = () => searchEngine === 'custom' ? (searchCustom ? null : SEARCH_ENGINES.google.name)
    : (SEARCH_ENGINES[searchEngine] ?? SEARCH_ENGINES.google).name;

  // What is typed in the field of the free browsing tab: an address (with a
  // scheme, or without spaces and with a host such as "example.com",
  // "localhost:8080" or an IP address), otherwise a search. Returns the page
  // to open, null if there is nothing to open (empty, or an invalid address
  // with a scheme).
  function addressOrSearch(raw) {
    const text = raw.trim();
    if (!text) return null;
    if (/^[a-z][a-z\d+.-]*:\/\//i.test(text)) return normalizeUrl(text);
    const host = /^([^\s/?#:]+|\[[\da-f:.]+\])(:\d+)?([/?#]\S*)?$/i.exec(text)?.[1];
    const isHost = host && (host === 'localhost' || host.startsWith('[') ||
      /^\d{1,3}(\.\d{1,3}){3}$/.test(host) ||
      /^([\p{L}\p{N}-]+\.)+\p{L}[\p{L}\p{N}-]*$/iu.test(host));
    if (isHost) { const url = normalizeUrl(text); if (url) return url; }
    return searchTemplate().replaceAll('%s', encodeURIComponent(text));
  }

  // The current list's site whose address is the page's (the active tab's
  // own site first), or null. Ignored: http/https, "www.", the final "/" of
  // the path and the fragment (#...).
  function pageMatch(url) {
    const key = (u) => {
      const n = normalizeUrl(u ?? '');
      if (!n) return null;
      const { host, pathname, search } = new URL(n);
      return host.replace(/^www\./, '') + pathname.replace(/\/+$/, '') + search;
    };
    const page = key(url);
    if (!page) return null;
    const own = findSite(active);
    if (own && key(own.url) === page) return own;
    return currentList().sites.find((s) => key(s.url) === page) || null;
  }

  // Highlights the tab of the site `id` (null: none), scrolling to it.
  let matchId = null;
  function markMatch(id) {
    if (id !== matchId) {
      matchId = id;
      if (id) tabsEl.querySelector(`.tab[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
    for (const tab of tabsEl.children) tab.classList.toggle('match', !!id && tab.dataset.id === id);
  }

  // Opens an address in the free browsing tab.
  function browseTo(url) {
    const wv = webviews.get(BROWSE);
    // loadURL throws until the page is ready (e.g. the start page still loading).
    if (wv) { try { wv.loadURL(url); } catch { wv.src = url; } } else getWebview(BROWSE, url);
    activate(BROWSE);
  }

  navBack.onclick = () => webviews.get(active)?.goBack();
  navForward.onclick = () => webviews.get(active)?.goForward();
  navReload.onclick = () => webviews.get(active)?.reload();
  navSite.onclick = () => {
    if (active === BROWSE) {
      if (browseStart) { browseTo(browseStart); return; }
      // No start page: the page is closed (with its history) and the empty
      // page shows again, with the address field ready.
      closeWebview(BROWSE);
      logAction('Browse: back to the empty page');
      activate(BROWSE);
      return;
    }
    const site = findSite(active);
    if (site) webviews.get(active)?.loadURL(site.url);
  };
  navUrl.onkeydown = (e) => {
    if (e.key === 'Escape') { updateNav(true); webviews.get(active)?.focus(); return; }
    if (e.key !== 'Enter' || navUrl.readOnly) return;
    const url = addressOrSearch(navUrl.value);
    if (!url) { navUrl.classList.add('invalid'); return; }
    browseTo(url);
    webviews.get(BROWSE)?.focus();
  };
  navUrl.oninput = () => navUrl.classList.remove('invalid');
  navUrl.onfocus = () => navUrl.select();
  navPin.onclick = pinPage;

  // "..." menu right of the address: further operations on the active page.
  // Closed by a second click, a click elsewhere (also in the page: the
  // window loses the focus to the webview), Esc, a tab change and when the
  // overlay hides.
  function closeNavMenu() {
    navMenu.hidden = true;
    navMore.setAttribute('aria-expanded', 'false');
  }
  navMore.onclick = () => {
    if (!navMenu.hidden) { closeNavMenu(); return; }
    updateNav();
    navMenu.hidden = false;
    navMore.setAttribute('aria-expanded', 'true');
  };
  document.addEventListener('mousedown', (e) => {
    if (!navMenu.hidden && !e.target.closest('#nav-menu, #nav-more')) closeNavMenu();
  });
  window.addEventListener('blur', closeNavMenu);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !navMenu.hidden) { e.preventDefault(); closeNavMenu(); navMore.focus(); }
  });

  // Domain whose cookies are removed for a page: its host without "www.";
  // main.js removes the cookies of that domain, of its subdomains and of the
  // parent domains (those the page receives), see cookies:clear.
  function cookieDomain(url) {
    try {
      const u = new URL(url);
      return /^https?:$/.test(u.protocol) ? u.hostname.replace(/^www\./, '') : '';
    } catch { return ''; }
  }
  navCookies.onclick = async () => {
    closeNavMenu();
    const id = active;
    let url = '';
    try { url = webviews.get(id)?.getURL() ?? ''; } catch { /* not ready yet */ }
    const domain = cookieDomain(url);
    if (!domain) return;
    const ok = await openDialog({
      message: t('nav.cookiesConfirm', { domain }),
      okLabel: t('nav.cookiesRemove'),
      danger: true,
    });
    if (!ok) { logAction(`cookie removal cancelled: ${tabRef(id)}`); return; }
    const count = await window.overlay.clearCookies(domain);
    logAction(`cookies removed: ${tabRef(id)}, ${count} cookies`);
    // The page reloads, so it no longer uses what it had from them (e.g. the login).
    webviews.get(id)?.reload();
  };

  // Pins the page of the active tab: it becomes a new tab (site) of the
  // current list, keeping its page and history. From the free browsing tab
  // the new tab goes at the end and the free browsing tab starts again from
  // its start page (or empty); from a site's tab it goes right after it, and
  // that tab starts again from its site's address when it is opened.
  // After a confirmation (the page may change meanwhile: it is read again).
  async function pinPage() {
    const from = active;
    const wv = webviews.get(from);
    const page = () => {
      try { return { url: normalizeUrl(wv.getURL()), title: wv.getTitle() || null }; } catch { return { url: null, title: null }; }
    };
    let { url, title } = page();
    if (!url || pageMatch(url)) return;
    const ok = await openDialog({
      message: t('nav.pinConfirm', { name: title || url, list: listName(currentList()) }),
      okLabel: t('nav.pin'),
    });
    if (!ok || active !== from || webviews.get(from) !== wv) return;
    ({ url, title } = page());
    if (!url || pageMatch(url)) return;
    const site = { id: crypto.randomUUID(), url, title };
    const l = materialize(currentList());
    const at = l.sites.findIndex((s) => s.id === from);
    if (at >= 0) l.sites.splice(at + 1, 0, site); else l.sites.push(site);
    webviews.delete(from);
    idleSince.delete(from);
    lastUrls.delete(from);
    webviews.set(site.id, wv);
    save();
    logAction(`page pinned as ${siteRef(site.id)} (from ${from === BROWSE ? 'Browse' : 'a site tab'})`);
    activate(site.id);
    render();
    if (!title) resolveTitle(site);
  }

  // ---------- drag to reorder ----------
  //
  // The tabs (horizontally) and the site rows of the Home (vertically) are
  // reordered by dragging them. The dragged element follows the pointer, the
  // others make room (animated) when it passes their middle; `scroller`
  // scrolls by itself when the pointer is near its edges. On release onDrop
  // gets the new order (data-id of the elements matching `selector`). A press
  // that moves less than a few pixels stays a click; after a drag the click
  // is swallowed. Renders wait for the end of the drag, which renders again:
  // they would replace the elements being dragged.

  let dragging = false;

  function makeSortable(item, selector, axis, scroller, onDrop) {
    const X = axis === 'x';
    const off = (e) => (X ? e.offsetLeft : e.offsetTop);     // layout position, without transforms
    const size = (e) => (X ? e.offsetWidth : e.offsetHeight);
    const coord = (e) => (X ? e.clientX : e.clientY);
    const scroll = () => (X ? scroller.scrollLeft : scroller.scrollTop);
    const shift = (d) => (d ? (X ? `translateX(${d}px)` : `translateY(${d}px)`) : '');

    item.addEventListener('pointerdown', (down) => {
      if (down.button !== 0 || dragging || down.target.closest('button, input, .close')) return;
      const container = item.parentElement;
      const items = () => [...container.children].filter((c) => c.matches(selector));
      const start = coord(down), startOff = off(item), startScroll = scroll();
      let pointer = start, started = false, frame = 0;

      // A sibling moved by the reordering slides from where it was.
      const slide = (sib, from) => {
        sib.style.transition = 'none';
        sib.style.transform = shift(from - off(sib));
        void sib.offsetWidth;
        sib.style.transition = 'transform 150ms ease';
        sib.style.transform = '';
      };

      const update = () => {
        // Scrolls when the pointer is near the edges.
        const r = scroller.getBoundingClientRect();
        const edge = 30, speed = 8;
        const dir = pointer < (X ? r.left : r.top) + edge ? -1 : pointer > (X ? r.right : r.bottom) - edge ? 1 : 0;
        if (dir) scroller.scrollBy({ [X ? 'left' : 'top']: dir * speed, behavior: 'instant' });
        // Where the element should be, kept between the first and the last one.
        let all = items();
        const min = Math.min(...all.map(off));
        const max = Math.max(...all.map((c) => off(c) + size(c))) - size(item);
        const pos = Math.max(min, Math.min(max, startOff + pointer - start + scroll() - startScroll));
        // The siblings are moved, not the element: taking it out of the page,
        // even for a moment, would end the pointer capture.
        for (;;) {
          const i = all.indexOf(item), prev = all[i - 1], next = all[i + 1];
          if (next && pos + size(item) > off(next) + size(next) / 2) {
            const from = off(next);
            item.before(next);
            slide(next, from);
          } else if (prev && pos < off(prev) + size(prev) / 2) {
            const from = off(prev);
            item.after(prev);
            slide(prev, from);
          } else break;
          all = items();
        }
        item.style.transform = shift(pos - off(item));
        frame = requestAnimationFrame(update);
      };

      const move = (e) => {
        pointer = coord(e);
        if (started || Math.abs(pointer - start) < 5) return;
        started = dragging = true;
        try { item.setPointerCapture(down.pointerId); } catch { /* pointer already released */ }
        getSelection().removeAllRanges();
        document.body.classList.add('dragging');
        item.classList.add('dragging');
        frame = requestAnimationFrame(update);
      };

      const end = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', end);
        window.removeEventListener('pointercancel', end);
        window.removeEventListener('blur', end);
        if (!started) return;
        cancelAnimationFrame(frame);
        dragging = false;
        document.body.classList.remove('dragging');
        item.classList.remove('dragging');
        item.style.transform = '';
        const swallow = (e) => { e.stopPropagation(); e.preventDefault(); };
        window.addEventListener('click', swallow, true);
        setTimeout(() => window.removeEventListener('click', swallow, true));
        onDrop(items().map((c) => c.dataset.id));
        render();
      };

      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', end);
      window.addEventListener('pointercancel', end);
      window.addEventListener('blur', end);
    });
  }

  // New order of a list's sites (their ids); saved if it changed.
  function reorderSites(l, ids) {
    const byId = new Map(l.sites.map((s) => [s.id, s]));
    const sorted = ids.map((id) => byId.get(id));
    // Sites added or removed meanwhile: the old order is kept.
    if (sorted.length !== l.sites.length || sorted.some((s) => !s)) return;
    if (sorted.every((s, i) => s === l.sites[i])) return;
    l.sites.splice(0, l.sites.length, ...sorted);
    logAction(`sites reordered in ${listRef(l)}`);
    save();
  }

  // ---------- render ----------

  const CLOSE_ICON = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>';

  function renderTabs() {
    if (dragging) return;   // done at the end of the drag (see makeSortable)
    homeBtn.classList.toggle('active', active === null);
    settingsBtn.classList.toggle('active', active === SETTINGS);
    browseBtn.classList.toggle('active', active === BROWSE);
    tabsEl.replaceChildren(...currentList().sites.map((site) => {
      const tab = el('div', 'tab');
      tab.dataset.id = site.id;
      tab.classList.toggle('active', site.id === active);
      makeSortable(tab, '.tab', 'x', tabsEl, (ids) => reorderSites(currentList(), ids));
      tab.title = siteName(site);
      tab.onclick = () => activate(site.id);
      // Middle click on the tab: close it, as in browsers.
      tab.onauxclick = (e) => { if (e.button === 1) confirmRemove(site.id); };
      const close = el('span', 'close');
      close.innerHTML = CLOSE_ICON;
      close.title = t('site.remove');
      close.onclick = (e) => { e.stopPropagation(); confirmRemove(site.id); };
      tab.append(el('span', 'label', siteName(site)), close);
      return tab;
    }));
    tabsEl.querySelector('.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    // The sites may have changed: the tab to highlight and the Pin button too.
    updateNav();
    updateArrows();
  }

  function siteRow(l, site, isCurrent) {
    const row = el('div', 'site');
    row.dataset.id = site.id;
    if (editing === site.id) {
      const key = 'edit:' + site.id;
      const input = draftInput(key, site.url);
      const ok = button(t('site.save'), () => updateSite(site.id, input.value));
      ok.classList.add('primary');
      const cancel = button(t('site.cancel'), () => { editing = null; drafts.delete(key); showError(); renderHome(); });
      input.onkeydown = (e) => {
        if (e.key === 'Enter') ok.click();
        if (e.key === 'Escape') cancel.click();
      };
      row.append(input, ok, cancel);
    } else {
      const info = el('div', 'info');
      info.append(el('div', 'title', siteName(site)), el('div', 'url', site.url));
      // Only the current list's sites are tabs that can be opened.
      if (isCurrent) info.onclick = () => activate(site.id);
      else info.classList.add('static');
      const edit = button(t('site.edit'), () => {
        editing = site.id;
        drafts.delete('edit:' + site.id);
        focusKey = 'edit:' + site.id;
        showError();
        renderHome();
      });
      row.append(info, edit, button(t('site.remove'), () => confirmRemove(site.id)));
      makeSortable(row, '.site', 'y', home, (ids) => reorderSites(l, ids));
    }
    return row;
  }

  // A list on the Home page: header, then (if open) its sites and the add form.
  // The current list starts open, the others closed; each one opens and
  // closes by clicking its header.
  function listSection(l, isCurrent) {
    const section = el('section', 'list');
    section.classList.toggle('current', isCurrent);
    const open = isCurrent ? !collapsed.has(listKey(l)) : expanded.has(l.id);

    const head = el('div', 'list-head toggle');
    head.append(el('span', 'twisty', open ? '▾' : '▸'));
    head.onclick = () => {
      if (isCurrent) { if (!collapsed.delete(listKey(l))) collapsed.add(listKey(l)); }
      else if (!expanded.delete(l.id)) expanded.add(l.id);
      renderHome();
    };
    head.append(el('span', 'name', listName(l)));
    if (isCurrent) head.append(el('span', 'badge', t('lists.current')));
    if (!l.id) head.append(el('span', 'badge new', t('lists.new')));
    const app = l.match ? (l.match.exe ?? `"${l.match.title}"`) : t('lists.noApp');
    const count = t(l.sites.length === 1 ? 'lists.sites.one' : 'lists.sites.other', { count: l.sites.length });
    head.append(el('span', 'detail', `${app} · ${count}`));
    if (l.id && !isCurrent) head.append(button(t('lists.use'), () => { setPinned(l.id); showCurrentList(); }));
    if (l.id && l.match) head.append(button(t('lists.remove'), () => confirmRemoveList(l)));
    section.append(head);
    if (!open) return section;

    const body = el('div', 'list-body');
    body.append(...l.sites.map((site) => siteRow(l, site, isCurrent)));
    if (!l.sites.length) body.append(el('div', 'empty', t(l.id ? 'home.empty' : 'lists.emptyNew')));

    const key = 'add:' + listKey(l);
    const form = el('form', 'add');
    const input = draftInput(key, '');
    input.placeholder = t('home.addPlaceholder');
    const add = button(t('home.add'), null, 'submit');
    add.classList.add('primary');
    form.append(input, add);
    form.onsubmit = (e) => {
      e.preventDefault();
      if (!normalizeUrl(input.value)) {
        showError(t('site.invalidUrl'), l);
        focusKey = key;
        return renderHome();
      }
      drafts.delete(key);
      showError();
      // A new list gets its id now, so the focus can stay on its add field.
      materialize(l);
      focusKey = 'add:' + l.id;
      addSite(l, input.value);
    };
    body.append(form, el('div', 'error', listError?.key === listKey(l) ? listError.msg : ''));
    section.append(body);
    return section;
  }

  // List chosen by hand: shown with the button to go back to the application's one.
  function renderPinned() {
    const pinned = pinnedList();
    $('pinned').hidden = !pinned;
    if (!pinned) return;
    $('pinned-label').textContent = t('lists.pinned');
    $('pinned-name').textContent = listName(pinned);
    $('pinned-restore').textContent = t('lists.restore', { name: listName(contextList()) });
  }

  function renderPreset() {
    const show = !!preset && !pinnedList() && !contextList().id && preset.exe === context.match?.exe;
    $('preset').hidden = !show;
    if (!show) return;
    const count = t(preset.sites.length === 1 ? 'lists.sites.one' : 'lists.sites.other', { count: preset.sites.length });
    $('preset-msg').textContent = t('preset.found', { name: preset.name || context.name, count });
    $('preset-use').textContent = t('preset.use');
    $('preset-dismiss').textContent = t('preset.dismiss');
  }

  // The Home page: current list first, then the others. Rendering replaces
  // the inputs: the text being typed (drafts) and the focus are restored.
  function renderHome() {
    if (dragging) return;   // done at the end of the drag (see makeSortable)
    const focused = document.activeElement?.dataset?.key;
    const selection = focused && [document.activeElement.selectionStart, document.activeElement.selectionEnd];
    renderPinned();
    renderPreset();
    $('export-btn').disabled = !hasSites();
    const cur = currentList();
    const others = lists.filter((l) => l !== cur);
    listsEl.replaceChildren(listSection(cur, true));
    if (others.length) listsEl.append(el('h2', 'lists-title', t('lists.others')), ...others.map((l) => listSection(l, false)));
    const key = focusKey ?? focused;
    const input = key && listsEl.querySelector(`input[data-key="${CSS.escape(key)}"]`);
    if (input) {
      input.focus();
      if (!focusKey && selection) input.setSelectionRange(...selection);
    }
    focusKey = null;
  }

  function render() { renderTabs(); renderHome(); }

  // ---------- scroll arrows ----------

  function updateArrows() {
    const overflow = tabsEl.scrollWidth > tabsEl.clientWidth + 1;
    leftBtn.hidden = rightBtn.hidden = !overflow;
    leftBtn.disabled = tabsEl.scrollLeft <= 0;
    rightBtn.disabled = tabsEl.scrollLeft + tabsEl.clientWidth >= tabsEl.scrollWidth - 1;
  }
  leftBtn.onclick = () => tabsEl.scrollBy({ left: -tabsEl.clientWidth * 0.8 });
  rightBtn.onclick = () => tabsEl.scrollBy({ left: tabsEl.clientWidth * 0.8 });
  tabsEl.addEventListener('scroll', updateArrows);
  tabsEl.addEventListener('wheel', (e) => { tabsEl.scrollLeft += e.deltaY || e.deltaX; e.preventDefault(); }, { passive: false });
  new ResizeObserver(updateArrows).observe(tabsEl);

  // ---------- list changes ----------

  // Returns the added site, or null if the address is invalid.
  function addSite(l, raw) {
    const url = normalizeUrl(raw);
    if (!url) return null;
    const site = { id: crypto.randomUUID(), url, title: null };
    materialize(l).sites.push(site);
    logAction(`site added: ${siteRef(site.id)}`);
    save();
    render();
    resolveTitle(site);
    return site;
  }

  // Adds several sites ({ url, title }) at the end of a list, skipping the
  // addresses it already has. Returns the added sites.
  function addSites(l, entries) {
    const have = new Set(l.sites.map((s) => s.url));
    const added = [];
    for (const e of entries) {
      const url = normalizeUrl(e.url);
      if (!url || have.has(url)) continue;
      have.add(url);
      added.push({ id: crypto.randomUUID(), url, title: e.title || null });
    }
    logAction(`sites added to ${listRef(l)}: ${added.length}` +
      `${entries.length > added.length ? ` (${entries.length - added.length} already there or invalid)` : ''}`);
    if (!added.length) return added;
    materialize(l).sites.push(...added);
    save();
    render();
    for (const site of added) if (!site.title) resolveTitle(site);
    return added;
  }

  function updateSite(id, raw) {
    const site = findSite(id);
    const url = normalizeUrl(raw);
    if (!url) {
      showError(t('site.invalidUrl'), listOfSite(id));
      focusKey = 'edit:' + id;
      return renderHome();
    }
    editing = null;
    drafts.delete('edit:' + id);
    showError();
    if (url !== site.url) {
      logAction(`site address changed: ${siteRef(id)}`);
      site.url = url;
      site.title = null;
      lastUrls.delete(id);
      const wv = webviews.get(id);
      if (wv) wv.src = url;
      save();
      resolveTitle(site);
    }
    render();
  }

  // If the tab removed was the active one, the next tab is opened, else the
  // previous one, else the free browsing tab.
  function removeSite(id) {
    const l = listOfSite(id);
    const at = l.sites.findIndex((s) => s.id === id);
    const neighbour = l.sites[at + 1] ?? l.sites[at - 1] ?? null;
    logAction(`site removed: ${siteRef(id)}`);
    l.sites = l.sites.filter((s) => s.id !== id);
    if (l.activeTab === id) l.activeTab = null;
    closeWebview(id);
    if (editing === id) editing = null;
    save();
    if (active === id) activate(neighbour?.id ?? BROWSE);
    render();
  }

  async function confirmRemove(id) {
    const site = findSite(id);
    if (!site) return;
    const ok = await openDialog({
      message: t('site.confirmRemove', { name: siteName(site) }),
      okLabel: t('site.remove'),
      danger: true,
    });
    if (ok) removeSite(id);
  }

  async function confirmRemoveList(l) {
    const ok = await openDialog({
      message: t('lists.confirmRemove', { name: listName(l) }),
      okLabel: t('lists.remove'),
      danger: true,
    });
    if (!ok || !lists.includes(l)) return;
    const wasCurrent = currentList() === l;
    logAction(`list removed: ${listRef(l)} (${l.sites.length} sites)`);
    lists = lists.filter((x) => x !== l);
    for (const site of l.sites) closeWebview(site.id);
    expanded.delete(l.id);
    if (editing && l.sites.some((s) => s.id === editing)) editing = null;
    if (pinnedId === l.id) setPinned(null);
    save();
    if (wasCurrent) showCurrentList(); else render();
    lookupPreset();
  }

  // Adding from the "+" in the bar: asks for an address or bookmarks (see
  // openAddDialog) and opens the (first) new tab right away.
  async function promptAddTab() {
    const res = await openAddDialog('url');
    if (!res) return;
    if (res.url) {
      const site = addSite(currentList(), res.url);
      if (site) activate(site.id);
    } else {
      const added = addSites(currentList(), res.bookmarks);
      if (added.length) activate(added[0].id);
    }
  }

  // "Import bookmarks..." on the Home: only the bookmarks, added to the list
  // chosen in the dialog (the current one at first); the Home stays open.
  async function importBookmarks() {
    const res = await openAddDialog('bm', { home: true });
    if (res?.bookmarks) addSites(res.list, res.bookmarks);
  }

  // A page asked to open an address in a new tab (see 'site popups' in
  // main.js). It opens in the tab of the same site (same host, "www."
  // ignored) of the current list: the tab of the page that asked, if it is
  // that site, otherwise the first one. If the list has no such tab, the
  // user is asked whether to add the address to the list as a new site.
  const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return null; } };

  async function openSiteUrl(url, contentsId) {
    const host = hostOf(url);
    if (!host) return;
    // Asked by the free browsing tab: it opens there.
    let fromBrowse = false;
    try { fromBrowse = webviews.get(BROWSE)?.getWebContentsId() === contentsId; } catch { /* not attached yet */ }
    if (fromBrowse) { browseTo(url); return; }
    const sites = currentList().sites.filter((s) => hostOf(s.url) === host);
    const opener = sites.find((s) => {
      try { return webviews.get(s.id)?.getWebContentsId() === contentsId; } catch { return false; }
    });
    const site = opener ?? sites[0];
    if (site) {
      const wv = webviews.get(site.id);
      if (wv) wv.src = url; else getWebview(site.id, url);
      activate(site.id);
      return;
    }
    const ok = await openDialog({ message: t('openDialog.message', { url }), okLabel: t('addDialog.ok') });
    if (!ok) return;
    const added = addSite(currentList(), url);
    if (added) activate(added.id);
  }
  window.overlay.onOpenSite(openSiteUrl);

  // ---------- application the overlay was opened over ----------
  //
  // At every show the main process sends the detected application: its list
  // becomes the current one (unless a list was chosen by hand).

  window.overlay.onForegroundApp((app) => {
    const before = currentList();
    context = contextOf(app);
    renameContextList(app);
    const after = currentList();
    if (before.id !== after.id || !sameMatch(before.match, after.match)) showCurrentList();
    else renderHome();
    lookupPreset();
  });

  $('pinned-restore').onclick = () => { setPinned(null); showCurrentList(); };

  // ---------- predefined lists ----------
  //
  // When the application has no list yet, a predefined one (lists/ in the
  // app, see main.js) is looked for by executable. The first time it is
  // loaded automatically; if that list is removed later, it is only
  // offered on the Home.

  let preset = null;                     // { exe, name, sites }: list offered for the current application
  const dismissedPresets = new Set();    // executables whose predefined list was declined (this session)
  let presetsApplied = new Set();        // executables whose predefined list was already loaded automatically
  let presetLookup = 0;                  // ignores answers to lookups that are no longer current

  async function lookupPreset() {
    const exe = context.match?.exe;
    const lookup = ++presetLookup;
    preset = null;
    renderPreset();
    if (!exe || contextList().id || dismissedPresets.has(exe)) return;
    const found = await window.overlay.findPreset(exe);
    if (lookup !== presetLookup || !found || contextList().id) return;
    if (!presetsApplied.has(exe)) { applyPreset({ exe, ...found }); return; }
    preset = { exe, ...found };
    renderPreset();
  }

  // Creates the current application's list from a predefined one.
  function applyPreset(p) {
    const l = materialize(contextList());
    if (p.name) l.name = p.name;
    for (const s of p.sites) {
      const url = normalizeUrl(s.url);
      if (url) l.sites.push({ id: crypto.randomUUID(), url, title: s.title });
    }
    presetsApplied.add(p.exe);
    window.overlay.presetApplied(p.exe);
    logAction(`predefined list applied: ${listRef(l)} (${l.sites.length} sites)`);
    preset = null;
    save();
    showCurrentList();
    for (const site of l.sites) if (!site.title) resolveTitle(site);
  }

  $('preset-use').onclick = () => { if (preset) applyPreset(preset); };
  $('preset-dismiss').onclick = () => {
    if (preset) { dismissedPresets.add(preset.exe); logAction(`predefined list dismissed: ${preset.exe}`); }
    preset = null;
    renderPreset();
  };

  // ---------- dialog ----------
  //
  // openDialog({ message, input?, placeholder?, okLabel?, danger?, validate? })
  // Without `input` it is a confirmation and returns true/false; with `input`
  // (initial value) it returns the entered text, or null if cancelled.

  const dialog = $('dialog'), dialogForm = $('dialog-form'), dialogInput = $('dialog-input');
  const dialogOk = $('dialog-ok'), dialogError = $('dialog-error');
  let closeDialog = null;

  function openDialog({ message, input, placeholder = '', okLabel = t('dialog.ok'), danger = false, validate }) {
    closeDialog?.(null);   // one dialog at a time
    const withInput = input !== undefined;
    $('dialog-msg').textContent = message;
    dialogInput.hidden = !withInput;
    dialogInput.value = withInput ? input : '';
    dialogInput.placeholder = placeholder;
    dialogError.textContent = '';
    dialogOk.textContent = okLabel;
    dialogOk.classList.toggle('danger', danger);
    dialog.hidden = false;
    setTimeout(() => (withInput ? dialogInput : dialogOk).focus());

    return new Promise((resolve) => {
      closeDialog = (confirmed) => {
        closeDialog = null;
        dialog.hidden = true;
        dialogForm.onsubmit = null;
        resolve(withInput ? (confirmed ? dialogInput.value : null) : !!confirmed);
      };
      dialogForm.onsubmit = (e) => {
        e.preventDefault();
        const err = withInput && validate ? validate(dialogInput.value) : null;
        if (err) { dialogError.textContent = err; dialogInput.focus(); return; }
        closeDialog(true);
      };
    });
  }
  $('dialog-cancel').onclick = () => closeDialog?.(false);
  // Click on the dark backdrop or Esc: cancel.
  dialog.addEventListener('mousedown', (e) => { if (e.target === dialog) closeDialog?.(false); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && closeDialog) { e.preventDefault(); closeDialog(false); }
  });

  // ---------- bookmark tree with checkboxes ----------
  //
  // Used by the import (bookmarks of a browser or of a file) and by the
  // export (the site lists). The tree is made of folders { title, children }
  // and bookmarks { title, url }. A bookmark is selected by its `idOf`
  // (the import selects by address, so the same address in several folders
  // counts once); `selectable` tells whether it can be chosen, `tagOf` a
  // note for its row. A folder's checkbox selects all the selectable
  // bookmarks it contains, the optional `allBox` all of them: those shown,
  // while searching. Folders open and close by clicking them; while
  // searching the folders with results are all open. `status` replaces the
  // tree with a message (loading, error...).

  const bookmarksIn = (n) => (n.children ? n.children.flatMap(bookmarksIn) : [n]);

  function treePicker({ container, search, allBox, idOf, selectable = () => true, tagOf = () => null, empty, onChange }) {
    const p = { tree: null, status: null, error: false, selected: new Set(), open: new Set() };
    const folderTitle = (n) => n.title || '…';
    const bookmarkTitle = (n) => n.title || hostOf(n.url) || n.url;
    const idsIn = (nodes) => [...new Set(nodes.flatMap(bookmarksIn).filter(selectable).map(idOf))];

    // Bookmarks whose title or address contains the text, folders with such
    // bookmarks (all of a folder's bookmarks if its name contains the text).
    function filter(nodes, q) {
      if (!q) return nodes;
      const out = [];
      for (const n of nodes) {
        if (n.children) {
          if (folderTitle(n).toLowerCase().includes(q)) out.push(n);
          else {
            const children = filter(n.children, q);
            if (children.length) out.push({ ...n, children });
          }
        } else if (n.title.toLowerCase().includes(q) || n.url.toLowerCase().includes(q)) out.push(n);
      }
      return out;
    }

    // Checkbox for a group of bookmarks: checked if all are selected,
    // indeterminate if some; clicking selects them all, or none if all were.
    function groupBox(box, ids) {
      const chosen = ids.filter((id) => p.selected.has(id)).length;
      box.disabled = !ids.length;
      box.checked = ids.length > 0 && chosen === ids.length;
      box.indeterminate = chosen > 0 && chosen < ids.length;
      box.onclick = (e) => {
        e.stopPropagation();
        const all = chosen === ids.length;
        for (const id of ids) { if (all) p.selected.delete(id); else p.selected.add(id); }
        render();
      };
    }

    function checkbox() {
      const box = el('input');
      box.type = 'checkbox';
      box.tabIndex = -1;
      return box;
    }

    function folderRow(n, depth, q) {
      const row = el('div', 'bm-row folder');
      row.style.setProperty('--depth', depth);
      const open = !!q || p.open.has(n.key);
      const box = checkbox();
      groupBox(box, idsIn([n]));
      row.append(el('span', 'twisty', open ? '▾' : '▸'), box, el('span', 'title', folderTitle(n)),
        el('span', 'count', String(bookmarksIn(n).length)));
      row.onclick = () => {
        if (q) return;
        if (!p.open.delete(n.key)) p.open.add(n.key);
        render();
      };
      return { row, open };
    }

    function bookmarkRow(n, depth) {
      const row = el('div', 'bm-row');
      row.style.setProperty('--depth', depth);
      const ok = selectable(n);
      const box = checkbox();
      box.disabled = !ok;
      box.checked = ok && p.selected.has(idOf(n));
      row.classList.toggle('disabled', !ok);
      row.title = n.url;
      row.append(el('span', 'twisty'), box, el('span', 'title', bookmarkTitle(n)), el('span', 'url', n.url));
      const tag = tagOf(n);
      if (tag) row.append(el('span', 'tag', tag));
      const toggle = (e) => {
        e.stopPropagation();
        if (!ok) return;
        if (!p.selected.delete(idOf(n))) p.selected.add(idOf(n));
        render();
      };
      row.onclick = toggle;
      box.onclick = toggle;
      return row;
    }

    function render() {
      const scroll = container.scrollTop;
      const message = (text, err) => container.replaceChildren(el('div', 'bm-status' + (err ? ' err' : ''), text));
      const q = search.value.trim().toLowerCase();
      const nodes = p.tree && !p.status ? filter(p.tree, q) : [];
      if (allBox) groupBox(allBox, idsIn(nodes));
      if (p.status !== null) message(p.status, p.error);
      else if (!p.tree) message('');
      else if (!p.tree.length) message(empty());
      else {
        const rows = [];
        const walk = (list, depth) => {
          for (const n of list) {
            if (!n.children) { rows.push(bookmarkRow(n, depth)); continue; }
            const { row, open } = folderRow(n, depth, q);
            rows.push(row);
            if (open) walk(n.children, depth + 1);
          }
        };
        walk(nodes, 0);
        if (rows.length) container.replaceChildren(...rows);
        else message(t('bookmarks.noMatch'));
      }
      container.scrollTop = scroll;
      onChange?.();
    }

    // A new tree: `open` 'top' (top folders open) or 'all'; `selectAll`
    // selects all its bookmarks.
    p.setTree = (tree, { open = 'top', selectAll = false } = {}) => {
      let next = 0;
      const walk = (nodes, depth) => {
        for (const n of nodes) {
          if (!n.children) continue;
          n.key = String(next++);
          if (open === 'all' || depth === 0) p.open.add(n.key);
          walk(n.children, depth + 1);
        }
      };
      p.open.clear();
      p.selected.clear();
      p.tree = tree;
      p.status = null;
      if (tree) {
        walk(tree, 0);
        if (selectAll) for (const id of idsIn(tree)) p.selected.add(id);
      }
      container.scrollTop = 0;
      render();
    };
    p.setStatus = (text, error = false) => {
      p.tree = null;
      p.selected.clear();
      p.status = text;
      p.error = error;
      render();
    };
    p.render = render;

    search.addEventListener('input', () => { container.scrollTop = 0; render(); });
    // Enter in the search field does not confirm the dialog.
    search.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.preventDefault(); });
    return p;
  }

  // ---------- adding sites: address or bookmarks ----------
  //
  // The "+" in the bar opens it with two tabs, Address and Bookmarks, adding
  // to the current list. "Import bookmarks..." on the Home (`home`) opens
  // only the bookmarks, with the choice of the list to add them to (the
  // current one at first). Bookmarks come from a browser found on the
  // system (one source per browser profile) or from an HTML file exported by
  // a browser; they are read by the main process (see bookmarks.js) and
  // chosen in a tree (treePicker), by address: those already in the target
  // list cannot be chosen. Returns { url } or { bookmarks: [{ url, title }],
  // list }, null if cancelled. One dialog at a time: it shares closeDialog
  // with openDialog.

  const addDialog = $('add-dialog'), addForm = $('add-form'), addInput = $('add-input');
  const addOk = $('add-ok'), addError = $('add-error');
  const bmSourceSelect = $('bm-source');
  const FILE_SOURCE = ':file';
  let addTab = 'url';
  let addHome = false;     // opened from the Home: bookmarks only, list chosen in the dialog
  let lastSource = null;   // id of the browser source used last (this session)
  let browserBookmarks = true;   // false: the platform cannot read the browsers (macOS), bookmarks come from a file only
  const bm = {
    sources: null,        // [{ id, browser, profile }], null until listed
    denied: [],           // browsers whose data the system does not let the app read
    file: null,           // { name, tree, error } of the HTML file chosen
    source: null,         // id of the source shown, or FILE_SOURCE
    loading: false,
    titles: new Map(),    // address -> title of its first bookmark
    target: null,         // list the bookmarks are added to
    targets: [],          // lists that can be chosen (from the Home)
    existing: new Set(),  // addresses already in the target list
    request: 0,           // ignores readings that are no longer current
  };

  const importPicker = treePicker({
    container: $('bm-tree'),
    search: $('bm-search'),
    allBox: $('bm-all'),
    idOf: (n) => n.norm,
    selectable: (n) => !!n.norm && !bm.existing.has(n.norm),
    tagOf: (n) => (n.norm && bm.existing.has(n.norm) ? t('bookmarks.inList') : null),
    empty: () => t('bookmarks.empty'),
    onChange: () => updateAddOk(),
  });

  // Names the browsers' own top folders and gives each bookmark its
  // normalized address, the one the lists keep.
  function prepareImport(tree) {
    bm.titles.clear();
    const walk = (nodes) => {
      for (const n of nodes) {
        if (n.root) n.title = t('bookmarks.root.' + n.root);
