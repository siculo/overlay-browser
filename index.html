        if (n.children) walk(n.children);
        else {
          n.norm = normalizeUrl(n.url);
          if (n.norm && !bm.titles.has(n.norm)) bm.titles.set(n.norm, n.title);
        }
      }
    };
    walk(tree);
    return tree;
  }

  // The target list: its addresses cannot be chosen any more (and are
  // dropped from the selection).
  function setTarget(l) {
    bm.target = l;
    bm.existing = new Set(l.sites.map((s) => s.url));
    for (const url of [...importPicker.selected]) if (bm.existing.has(url)) importPicker.selected.delete(url);
    importPicker.render();
  }

  // From the Home: all the lists, in the order of the Home; the current one
  // may still be a new one (created when its first site is added).
  function renderListSelect() {
    const cur = currentList();
    bm.targets = [cur, ...lists.filter((l) => l !== cur)];
    $('add-list').replaceChildren(...bm.targets.map((l, i) =>
      new Option(l.id ? listName(l) : `${listName(l)} (${t('lists.new')})`, String(i))));
    $('add-list').value = String(bm.targets.indexOf(bm.target));
  }
  $('add-list').onchange = () => setTarget(bm.targets[Number($('add-list').value)]);

  function updateAddOk() {
    const target = $('add-target');
    target.hidden = addTab === 'url' || addHome;
    $('add-list-pick').hidden = !addHome;
    if (addTab === 'url') {
      addOk.textContent = t('addDialog.ok');
      addOk.disabled = false;
      return;
    }
    const n = importPicker.selected.size;
    target.textContent = t('bookmarks.target', { list: listName(bm.target) });
    target.title = target.textContent;
    addOk.textContent = n === 0 ? t('bookmarks.addNone') : t(n === 1 ? 'bookmarks.add.one' : 'bookmarks.add.other', { count: n });
    addOk.disabled = n === 0;
  }

  function showImport(res) {
    if (res.error) importPicker.setStatus(t(res.denied ? 'bookmarks.deniedSource' : 'bookmarks.error'), true);
    else importPicker.setTree(prepareImport(res.tree));
  }

  // The browsers found but not readable: their bookmarks can still come
  // from an exported file.
  function renderDenied() {
    $('bm-denied').hidden = !bm.denied.length;
    $('bm-denied').textContent = bm.denied.length ? t('bookmarks.denied', { browsers: bm.denied.join(', ') }) : '';
  }

  // Where the browsers cannot be read (macOS) there is nothing to choose:
  // the select gives way to the name of the chosen file.
  function renderSourceSelect() {
    const fileName = $('bm-file-name');
    bmSourceSelect.hidden = !browserBookmarks;
    fileName.hidden = browserBookmarks;
    if (!browserBookmarks) {
      fileName.textContent = bm.file ? bm.file.name : t('bookmarks.noFile');
      fileName.title = bm.file ? bm.file.name : '';
      fileName.classList.toggle('none', !bm.file);
      return;
    }
    const options = (bm.sources ?? []).map((s) => new Option(s.profile ? `${s.browser} · ${s.profile}` : s.browser, s.id));
    if (bm.file) options.push(new Option(t('bookmarks.fileSource', { name: bm.file.name }), FILE_SOURCE));
    if (!options.length) {
      const none = new Option(bm.sources ? t('bookmarks.noSources') : t('bookmarks.loading'), '');
      none.disabled = true;
      options.push(none);
    }
    bmSourceSelect.replaceChildren(...options);
    bmSourceSelect.disabled = !bm.sources?.length && !bm.file;
    bmSourceSelect.value = bm.source ?? '';
  }

  async function showSource(id) {
    bm.source = id;
    renderSourceSelect();
    const request = ++bm.request;
    if (id === FILE_SOURCE) return showImport(bm.file);
    lastSource = id;
    importPicker.setStatus(t('bookmarks.loading'));
    const res = await window.overlay.readBookmarks(id);
    if (request === bm.request) showImport(res);
  }

  // The sources are listed again at every opening (browsers installed or
  // profiles added meanwhile); the one used last is shown first.
  async function loadSources() {
    const request = ++bm.request;
    bm.loading = true;
    importPicker.setStatus(t('bookmarks.loading'));
    const { sources, denied } = await window.overlay.bookmarkSources();
    if (request !== bm.request) return;
    bm.loading = false;
    bm.sources = sources;
    bm.denied = denied;
    renderDenied();
    const first = sources.find((s) => s.id === lastSource) ?? sources[0];
    if (first) return showSource(first.id);
    renderSourceSelect();
    importPicker.setStatus(t(browserBookmarks ? 'bookmarks.noSources' : 'bookmarks.fileOnly'));
  }

  bmSourceSelect.onchange = () => showSource(bmSourceSelect.value);
  $('bm-file').onclick = async () => {
    const res = await window.overlay.openBookmarkFile();
    if (!res || addDialog.hidden) return;
    bm.file = res;
    showSource(FILE_SOURCE);
  };

  function showAddTab(tab) {
    addTab = tab;
    $('add-tab-url').setAttribute('aria-selected', tab === 'url');
    $('add-tab-bm').setAttribute('aria-selected', tab === 'bm');
    $('add-url').hidden = tab !== 'url';
    $('add-bm').hidden = tab !== 'bm';
    addDialog.classList.toggle('wide', tab === 'bm');
    addError.textContent = '';
    if (tab === 'bm' && !bm.sources && !bm.loading) loadSources();
    updateAddOk();
    setTimeout(() => (tab === 'url' ? addInput : $('bm-search')).focus());
  }
  $('add-tab-url').onclick = () => { if (addTab !== 'url') logAction('add dialog: Address tab'); showAddTab('url'); };
  $('add-tab-bm').onclick = () => { if (addTab !== 'bm') logAction('add dialog: Bookmarks tab'); showAddTab('bm'); };

  function openAddDialog(tab, { home = false } = {}) {
    closeDialog?.(null);   // one dialog at a time
    addHome = home;
    $('add-tabs').hidden = home;
    $('import-msg').hidden = !home;
    addInput.value = '';
    $('bm-search').value = '';
    Object.assign(bm, { sources: null, denied: [], file: null, source: null, loading: false });
    renderDenied();
    bm.request++;
    importPicker.setTree(null);
    setTarget(currentList());
    if (home) renderListSelect();
    renderSourceSelect();
    addDialog.hidden = false;
    showAddTab(tab);
    logAction(`add dialog opened (${home ? 'Import bookmarks on the Home' : '"+" in the bar'}, ` +
      `${tab === 'url' ? 'Address' : 'Bookmarks'} tab)`);

    return new Promise((resolve) => {
      closeDialog = (result) => {
        closeDialog = null;
        if (!result) logAction('add dialog cancelled');
        else if (result.url) logAction('add dialog: address confirmed');
        else {
          const source = bm.source === FILE_SOURCE ? 'file'
            : bm.sources?.find((s) => s.id === bm.source)?.browser ?? 'unknown source';
          logAction(`add dialog: ${result.bookmarks.length} bookmarks from ${source} confirmed for ${listRef(result.list)}`);
        }
        addDialog.hidden = true;
        addForm.onsubmit = null;
        bm.request++;
        importPicker.setTree(null);
        resolve(result || null);
      };
      addForm.onsubmit = (e) => {
        e.preventDefault();
        if (addTab === 'url') {
          if (!normalizeUrl(addInput.value)) { addError.textContent = t('site.invalidUrl'); addInput.focus(); return; }
          closeDialog({ url: addInput.value });
          return;
        }
        const chosen = importPicker.selected;
        if (!chosen.size) return;
        closeDialog({ bookmarks: [...chosen].map((url) => ({ url, title: bm.titles.get(url) })), list: bm.target });
      };
    });
  }
  $('add-cancel').onclick = () => closeDialog?.(null);
  addDialog.addEventListener('mousedown', (e) => { if (e.target === addDialog) closeDialog?.(null); });

  // ---------- export ----------
  //
  // "Export bookmarks..." on the Home: the sites of all the lists, one folder
  // per list (current one first, as on the Home), all selected at first.
  // The chosen ones are saved by the main process as an HTML bookmark file
  // (see bookmarks.js), with the same folders, which browsers can import.

  const exportDialog = $('export-dialog'), exportForm = $('export-form');
  const exportOk = $('export-ok'), exportError = $('export-error');

  const exportPicker = treePicker({
    container: $('ex-tree'),
    search: $('ex-search'),
    allBox: $('ex-all'),
    idOf: (n) => n.id,
    empty: () => t('exportDialog.empty'),
    onChange: () => updateExportOk(),
  });

  const hasSites = () => lists.some((l) => l.sites.length);

  function updateExportOk() {
    const n = exportPicker.selected.size;
    exportOk.textContent = n === 0 ? t('exportDialog.none') : t(n === 1 ? 'exportDialog.one' : 'exportDialog.other', { count: n });
    exportOk.disabled = n === 0;
  }

  function exportTree() {
    const cur = currentList();
    return [cur, ...lists.filter((l) => l !== cur)]
      .filter((l) => l.sites.length)
      .map((l) => ({ title: listName(l), children: l.sites.map((s) => ({ id: s.id, title: siteName(s), url: s.url })) }));
  }

  function openExportDialog() {
    closeDialog?.(null);   // one dialog at a time
    $('ex-search').value = '';
    exportError.textContent = '';
    exportPicker.setTree(exportTree(), { open: 'all', selectAll: true });
    exportDialog.hidden = false;
    setTimeout(() => $('ex-search').focus());

    return new Promise((resolve) => {
      closeDialog = (result) => {
        closeDialog = null;
        exportDialog.hidden = true;
        exportForm.onsubmit = null;
        exportPicker.setTree(null);
        resolve(!!result);
      };
      exportForm.onsubmit = async (e) => {
        e.preventDefault();
        const chosen = exportPicker.selected;
        const folders = exportPicker.tree
          .map((f) => ({ title: f.title, sites: f.children.filter((s) => chosen.has(s.id)).map(({ title, url }) => ({ title, url })) }))
          .filter((f) => f.sites.length);
        if (!folders.length) return;
        exportError.textContent = '';
        exportOk.disabled = true;
        const res = await window.overlay.exportBookmarks(folders);
        if (exportDialog.hidden) return;   // closed meanwhile
        updateExportOk();
        if (!res) return;                  // the save dialog was cancelled
        if (res.error) { exportError.textContent = t('exportDialog.error'); return; }
        closeDialog(true);
      };
    });
  }
  $('export-btn').onclick = openExportDialog;
  $('import-btn').onclick = importBookmarks;
  $('export-cancel').onclick = () => closeDialog?.(null);
  exportDialog.addEventListener('mousedown', (e) => { if (e.target === exportDialog) closeDialog?.(null); });

  // When the window gets focus, the keyboard goes to the open site
  // (otherwise it would stay on the page holding the tabs), unless
  // a dialog is open.
  window.addEventListener('focus', () => {
    if (isSite(active) && !closeDialog) webviews.get(active)?.focus();
  });

  homeBtn.onclick = () => activate(null);
  browseBtn.onclick = () => activate(BROWSE);
  settingsBtn.onclick = () => activate(SETTINGS);
  window.overlay.onSettings(() => activate(SETTINGS));
  $('add-tab').onclick = promptAddTab;
  window.overlay.onHome(() => activate(null));

  // ---------- shortcut ----------

  const shortcutEl = $('shortcut'), shortcutHint = $('shortcut-hint');
  const changeBtn = $('shortcut-change');
  let capturing = false;
  let currentShortcut = null;
  let defaultShortcut = null;   // the platform's, from main.js

  function showShortcut(acc, msg, isError) {
    shortcutEl.textContent = acc || t('shortcut.none');
    shortcutHint.textContent = msg || '';
    shortcutHint.classList.toggle('err', !!isError);
  }

  // Converts a KeyboardEvent into the key of an Electron accelerator.
  // e.code (physical key) is used so the result does not depend on the layout.
  const CODE_KEYS = {
    Space: 'Space', Tab: 'Tab', Enter: 'Enter', Backspace: 'Backspace',
    Insert: 'Insert', Delete: 'Delete', Home: 'Home', End: 'End',
    PageUp: 'PageUp', PageDown: 'PageDown',
    ArrowUp: 'Up', ArrowDown: 'Down', ArrowLeft: 'Left', ArrowRight: 'Right',
    Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']', Backslash: '\\',
    Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', Backquote: '`',
    NumpadAdd: 'numadd', NumpadSubtract: 'numsub', NumpadMultiply: 'nummult',
    NumpadDivide: 'numdiv', NumpadDecimal: 'numdec',
  };
  function keyFromCode(code) {
    let m;
    if ((m = code.match(/^Key([A-Z])$/))) return m[1];
    if ((m = code.match(/^Digit(\d)$/))) return m[1];
    if ((m = code.match(/^Numpad(\d)$/))) return 'num' + m[1];
    if (/^F([1-9]|1\d|2[0-4])$/.test(code)) return code;
    return CODE_KEYS[code] ?? null;
  }

  function startCapture() {
    capturing = true;
    window.overlay.suspendShortcut(true);
    shortcutEl.classList.add('capturing');
    showShortcut('…', t('shortcut.press'));
    changeBtn.disabled = true;
  }
  function endCapture() {
    capturing = false;
    shortcutEl.classList.remove('capturing');
    changeBtn.disabled = false;
  }
  // Cancels the capture and re-enables the current shortcut.
  function cancelCapture() {
    if (!capturing) return;
    endCapture();
    window.overlay.suspendShortcut(false);
    showShortcut(currentShortcut);
  }
  async function applyShortcut(acc) {
    const res = await window.overlay.setShortcut(acc);
    currentShortcut = res.shortcut;
    if (res.ok) showShortcut(res.shortcut, t('shortcut.updated'));
    else showShortcut(res.shortcut, res.error, true);
  }
  window.addEventListener('blur', cancelCapture);

  document.addEventListener('keydown', async (e) => {
    if (!capturing) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.code === 'Escape' && !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey) {
      cancelCapture();
      return;
    }
    const key = keyFromCode(e.code);
    if (!key) return;   // modifier alone or unsupported key: wait for the next one
    const mods = [];
    if (e.ctrlKey) mods.push('Ctrl');
    if (e.altKey) mods.push('Alt');
    if (e.shiftKey) mods.push('Shift');
    if (e.metaKey) mods.push('Super');
    // Without modifiers only function keys are allowed, so as not to
    // "steal" from the whole system a key normally used for typing.
    if (!mods.length && !/^F\d+$/.test(key)) {
      showShortcut('…', t('shortcut.needModifier'), true);
      return;
    }
    endCapture();
    await applyShortcut([...mods, key].join('+'));
  }, true);

  changeBtn.onclick = startCapture;
  $('shortcut-reset').onclick = () => { cancelCapture(); applyShortcut(defaultShortcut); };

  // ---------- options ----------
  //
  // Each checkbox is bound to a `settings` key in prefs.json and is applied
  // immediately. To add an option: an entry in OPTIONS and its default in
  // main.js (DEFAULT_SETTINGS).

  const OPTIONS = { hideOnBlur: $('opt-hide-on-blur'), checkUpdates: $('opt-check-updates'), verboseLog: $('opt-verbose-log') };
  $('show-log').onclick = () => window.overlay.showLog();
  $('clear-log').onclick = async () => {
    const ok = await openDialog({ message: t('settings.clearLogConfirm'), okLabel: t('settings.clearLog'), danger: true });
    if (!ok) return;
    const done = await window.overlay.clearLog();
    $('log-hint').textContent = t(done ? 'settings.logCleared' : 'settings.logClearError');
    $('log-hint').classList.toggle('err', !done);
  };

  function initOptions(settings) {
    for (const [key, input] of Object.entries(OPTIONS)) {
      input.checked = !!settings[key];
      input.onchange = () => window.overlay.setSetting(key, input.checked);
    }
  }

  // ---------- new versions ----------
  //
  // main.js checks the GitHub releases (see 'new versions' there) and sends
  // the newer version, or null: shown next to the app version on the
  // Settings page and as a strip below the navigation bar, until the user
  // closes the strip (`dismissed`: then on the Settings page only).

  let update = null;   // { version, url, dismissed } or null
  const updateBar = $('update');

  function renderUpdate() {
    updateBar.hidden = !update || update.dismissed;
    $('app-update').hidden = !update;
    if (!update) return;
    $('update-msg').textContent = t('update.available', { version: update.version });
    $('app-update-link').textContent = t('update.settings', { version: update.version });
  }
  $('update-open').onclick = () => window.overlay.openUpdate();
  $('app-update-link').onclick = (e) => { e.preventDefault(); window.overlay.openUpdate(); };
  $('update-close').onclick = () => window.overlay.dismissUpdate();
  window.overlay.onUpdate((u) => { update = u; renderUpdate(); });

  // ---------- start page of the free browsing tab ----------
  //
  // Saved when the field is left or Enter is pressed: empty (no start page)
  // or a valid address, otherwise the field is marked and nothing is saved.

  const browseStartInput = $('opt-browse-start'), browseStartHint = $('browse-start-hint');

  function initBrowseStart(value) {
    browseStart = value;
    browseStartInput.value = value;
    const commit = () => {
      const raw = browseStartInput.value.trim();
      const url = raw ? normalizeUrl(raw) : '';
      const invalid = url === null;
      browseStartInput.classList.toggle('invalid', invalid);
      browseStartHint.classList.toggle('err', invalid);
      browseStartHint.textContent = t(invalid ? 'settings.browseStartInvalid' : 'settings.browseStartDesc');
      if (invalid) return;
      browseStartInput.value = url;
      if (url === browseStart) return;
      browseStart = url;
      window.overlay.setSetting('browseStart', url);
    };
    browseStartInput.onchange = commit;
    browseStartInput.onkeydown = (e) => { if (e.key === 'Enter') commit(); };
  }

  // ---------- search engine of the free browsing tab ----------
  //
  // One of SEARCH_ENGINES, or a custom address with %s in place of the text
  // (shown only for 'custom'; saved like the start page, when valid).

  const searchSelect = $('opt-search'), searchCustomInput = $('opt-search-custom'), searchHint = $('search-hint');

  // A custom address: an http(s) address containing %s, normalized like the
  // sites' (https:// added if missing); null if invalid, '' if empty.
  function normalizeTemplate(raw) {
    const text = raw.trim();
    if (!text) return '';
    if (!text.includes('%s')) return null;
    const MARK = 'QUERY0SEARCH0TEXT';
    return normalizeUrl(text.replaceAll('%s', MARK))?.replaceAll(MARK, '%s') ?? null;
  }

  function renderSearch(invalid = false) {
    const options = Object.entries(SEARCH_ENGINES).map(([key, e]) => new Option(e.name, key));
    searchSelect.replaceChildren(...options, new Option(t('settings.searchCustom'), 'custom'));
    searchSelect.value = searchEngine;
    const custom = searchEngine === 'custom';
    searchCustomInput.hidden = searchHint.hidden = !custom;
    searchCustomInput.classList.toggle('invalid', invalid);
    searchHint.classList.toggle('err', invalid);
    searchHint.textContent = t(invalid ? 'settings.searchCustomInvalid' : 'settings.searchCustomDesc');
    updateNav();
  }

  function initSearch(settings) {
    searchEngine = settings.searchEngine;
    searchCustom = settings.searchCustom;
    searchCustomInput.value = searchCustom;
    searchSelect.onchange = () => {
      searchEngine = searchSelect.value;
      window.overlay.setSetting('searchEngine', searchEngine);
      renderSearch();
      if (searchEngine === 'custom' && !searchCustom) searchCustomInput.focus();
    };
    const commit = () => {
      const url = normalizeTemplate(searchCustomInput.value);
      if (url === null) { renderSearch(true); return; }
      searchCustomInput.value = url;
      renderSearch();
      if (url === searchCustom) return;
      searchCustom = url;
      window.overlay.setSetting('searchCustom', url);
      updateNav();
    };
    searchCustomInput.onchange = commit;
    searchCustomInput.onkeydown = (e) => { if (e.key === 'Enter') commit(); };
    renderSearch();
  }

  // ---------- fixed tabs: icon and name, or icon only ----------

  const fixedTabsSelect = $('opt-fixed-tabs');

  function applyFixedTabs(value) {
    document.body.classList.toggle('fixed-icons', value === 'icons');
    updateArrows();
  }

  function initFixedTabs(value) {
    fixedTabsSelect.value = value;
    applyFixedTabs(value);
    fixedTabsSelect.onchange = () => {
      applyFixedTabs(fixedTabsSelect.value);
      window.overlay.setSetting('fixedTabs', fixedTabsSelect.value);
    };
  }

  // ---------- opacity ----------
  //
  // The slider works in percent; the setting is a fraction (0.3–1). It is
  // applied while dragging: by the main process where the window is
  // translucent by itself, here via CSS where the platform requires it
  // (state.platform.opacity === 'css'). Hidden where neither is possible.

  const opacityGroup = $('opacity-setting');
  const opacityInput = $('opt-opacity'), opacityValue = $('opt-opacity-value');
  let opacityMode = 'none';

  function showOpacity(value) {
    opacityValue.textContent = `${Math.round(value * 100)}%`;
    if (opacityMode === 'css') document.documentElement.style.setProperty('--window-opacity', value);
  }

  function initOpacity(platform, value) {
    opacityMode = platform.opacity;
    opacityGroup.hidden = opacityMode === 'none';
    if (opacityMode === 'none') return;
    if (opacityMode === 'css') document.documentElement.classList.add('css-opacity');
    opacityInput.min = Math.round(platform.opacityRange.min * 100);
    opacityInput.max = Math.round(platform.opacityRange.max * 100);
    opacityInput.value = Math.round(value * 100);
    showOpacity(value);
    opacityInput.oninput = () => {
      const v = Number(opacityInput.value) / 100;
      showOpacity(v);
      window.overlay.setSetting('opacity', v);
    };
  }

  // ---------- accent color ----------
  //
  // Predefined palette: the setting holds the name (validated by main.js
  // against the same list), the page turns it into the CSS variables.
  // accent: base color (lines, backgrounds of the confirmation buttons);
  // text: lighter, readable as text on the dark background.

  const ACCENT_COLORS = {
    amber:  { accent: '#f0a030', text: '#f5b750' },
    orange: { accent: '#f07a3a', text: '#f79b66' },
    red:    { accent: '#e5484d', text: '#f2787b' },
    pink:   { accent: '#e5559a', text: '#f07fb3' },
    purple: { accent: '#9b6cf0', text: '#b796f6' },
    blue:   { accent: '#4a90f5', text: '#7db0ff' },
    cyan:   { accent: '#22b8c8', text: '#5fd3df' },
    green:  { accent: '#4cb85a', text: '#7acc84' },
  };
  const accentsEl = $('accents');
  let accentSetting = 'amber';

  function applyAccent(name) {
    accentSetting = ACCENT_COLORS[name] ? name : 'amber';
    const { accent, text } = ACCENT_COLORS[accentSetting];
    document.documentElement.style.setProperty('--accent', accent);
    document.documentElement.style.setProperty('--accent-text', text);
    for (const b of accentsEl.children) b.setAttribute('aria-checked', b.dataset.accent === accentSetting);
  }

  // Swatches, rebuilt when the language changes (their names are the tooltips).
  function renderAccents() {
    accentsEl.replaceChildren(...Object.entries(ACCENT_COLORS).map(([name, { accent }]) => {
      const b = el('button');
      b.type = 'button';
      b.dataset.accent = name;
      b.setAttribute('role', 'radio');
      b.title = t('accent.' + name);
      b.style.setProperty('--swatch', accent);
      b.onclick = () => { applyAccent(name); window.overlay.setSetting('accent', name); };
      return b;
    }));
    applyAccent(accentSetting);
  }

  // ---------- memory ----------
  //
  // On the Settings page, updated every 2 seconds while it is open and the
  // window is visible: total memory of the app and its split among the
  // processes. Each open page usually has a process of its own (pages of the
  // same site may share one); the pages of the other lists stay loaded too.
  // How it is measured depends on the platform (memoryUsage in platform/).

  const memoryTotal = $('memory-total'), memoryKind = $('memory-kind'), memoryTable = $('memory-table');
  const closeAllPagesBtn = $('memory-close-all');
  let memoryTimer = null;
  let memory = null;   // last measurement from main.js

  function formatBytes(bytes) {
    const mb = bytes / 1048576;
    const fmt = (v, digits) => v.toLocaleString(i18n.language, { minimumFractionDigits: digits, maximumFractionDigits: digits });
    return mb >= 1024 ? `${fmt(mb / 1024, 2)} GB` : `${fmt(mb, 0)} MB`;
  }

  // What a process hosts: the overlay's page, open sites (`pages`: their
  // ids), or else its type; null for the minor ones (added up in a single row).
  function memoryLabel(p, siteOfContents) {
    if (p.ui) return { label: t('memory.ui') };
    const ids = p.contents.map((id) => siteOfContents.get(id)).filter((id) => id === BROWSE || findSite(id));
    if (ids.length) {
      const label = ids.map((id) => {
        const min = minutesToUnload(id);
        const s = findSite(id);
        const label = s ? `${siteName(s)} · ${listName(listOfSite(id))}` : t('bar.browse');
        return min === null ? label : `${label} ${t('memory.unloadIn', { count: min })}`;
      }).join(', ');
      return { label, pages: ids };
    }
    if (p.type === 'Browser') return { label: t('memory.main') };
    if (p.type === 'GPU') return { label: t('memory.gpu') };
    return null;
  }

  // The table is rebuilt at every measurement: not while a button is being
  // pressed, or the click would be lost.
  let memoryPressed = false;
  memoryTable.addEventListener('pointerdown', () => { memoryPressed = true; });
  window.addEventListener('pointerup', () => { memoryPressed = false; }, true);
  window.addEventListener('pointercancel', () => { memoryPressed = false; }, true);

  function renderMemory() {
    if (!memory) return;
    const siteOfContents = new Map();
    for (const [id, wv] of webviews) {
      try { siteOfContents.set(wv.getWebContentsId(), id); } catch { /* not attached yet */ }
    }
    const rows = [];
    let total = 0, other = 0;
    for (const p of memory.processes) {
      total += p.bytes;
      const row = memoryLabel(p, siteOfContents);
      // A page just closed whose process has not ended yet: no longer listed.
      if (row?.pages) row.pages = row.pages.filter((id) => webviews.has(id));
      if (row) rows.push({ ...row, bytes: p.bytes });
      else other += p.bytes;
    }
    rows.sort((a, b) => b.bytes - a.bytes);
    if (other) rows.push({ label: t('memory.other'), bytes: other });
    memoryTotal.textContent = t('memory.total', { size: formatBytes(total) });
    memoryKind.textContent = t('memory.kind.' + memory.kind);
    closeAllPagesBtn.disabled = ![...webviews.keys()].some((id) => !inUse(id));
    if (memoryPressed) return;
    memoryTable.replaceChildren(...rows.map(({ label, bytes, pages }) => {
      const tr = el('tr');
      const name = el('td', null, label);
      name.title = label;
      const action = el('td', 'action');
      // Pages sharing a process are closed together: the memory is freed
      // only when all of them are.
      const closable = pages?.filter((id) => !inUse(id)) ?? [];
      if (closable.length) {
        const b = el('button', null, t('memory.close'));
        b.type = 'button';
        b.title = t(closable.length > 1 ? 'memory.closeShared' : 'memory.closeTitle');
        b.onclick = () => closePages(closable);
        action.append(b);
      }
      tr.append(name, el('td', 'size', formatBytes(bytes)), action);
      return tr;
    }));
  }

  closeAllPagesBtn.onclick = () => closePages([...webviews.keys()]);

  async function updateMemory() {
    if (document.visibilityState !== 'visible') return;
    memory = await window.overlay.memory();
    if (active === SETTINGS) renderMemory();
  }

  function watchMemory(on) {
    clearInterval(memoryTimer);
    memoryTimer = null;
    if (!on) return;
    updateMemory();
    memoryTimer = setInterval(updateMemory, 2000);
  }

  // ---------- language ----------
  //
  // Texts come from locales/*.json through the main process. Fixed texts are
  // marked in the HTML (data-i18n for the content, data-i18n-title and
  // data-i18n-placeholder for those attributes); the others use t() while
  // rendering. Changing language re-applies everything without reloading the
  // page, so the open tabs are kept.

  const languageSelect = $('opt-language');
  let i18n = { messages: {}, languages: [] };
  let languageSetting = 'system';

  function t(key, params = {}) {
    const text = i18n.messages[key] ?? key;
    return text.replace(/\{(\w+)\}/g, (m, name) => params[name] ?? m);
  }

  function renderLanguageSelect() {
    const nameOf = (code) => i18n.languages.find((l) => l.code === code)?.name ?? code;
    const choices = [
      { value: 'system', label: t('settings.languageSystem', { name: nameOf(i18n.system) }) },
      ...i18n.languages.map((l) => ({ value: l.code, label: l.name })),
    ];
    languageSelect.replaceChildren(...choices.map(({ value, label }) => new Option(label, value)));
    // A saved language no longer available counts as the system one.
    languageSelect.value = choices.some((c) => c.value === languageSetting) ? languageSetting : 'system';
  }

  function applyI18n(state) {
    i18n = state;
    document.documentElement.lang = i18n.language;
    for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
    for (const el of document.querySelectorAll('[data-i18n-title]')) el.title = t(el.dataset.i18nTitle);
    for (const el of document.querySelectorAll('[data-i18n-placeholder]')) el.placeholder = t(el.dataset.i18nPlaceholder);
    renderLanguageSelect();
    renderAccents();
  }

  languageSelect.onchange = async () => {
    languageSetting = languageSelect.value;
    applyI18n(await window.overlay.setLanguage(languageSetting));
    // Texts built while rendering, and messages still in the old language.
    showError();
    render();
    renderSearch(searchCustomInput.classList.contains('invalid'));
    renderMemory();
    renderUpdate();
    showUnloadAfter();
    if (!capturing) showShortcut(currentShortcut);
  };

  // ---------- startup ----------

  (async () => {
    const state = await window.overlay.loadState();
    initOpacity(state.platform, state.settings.opacity);
    browserBookmarks = state.platform.browserBookmarks;
    accentSetting = state.settings.accent;
    languageSetting = state.settings.language;
    applyI18n(state.i18n);
    lists = state.lists;
    pinnedId = state.pinnedList;
    presetsApplied = new Set(state.presetsApplied);
    context = contextOf(state.foregroundApp);
    renameContextList(state.foregroundApp);
    currentShortcut = state.shortcut;
    defaultShortcut = state.defaultShortcut;
    showShortcut(currentShortcut);
    initOptions(state.settings);
    initUnload(state.unloadRange, state.settings);
    initBrowseStart(state.settings.browseStart);
    initSearch(state.settings);
    initFixedTabs(state.settings.fixedTabs);
    $('app-version').textContent = `Overlay Browser ${state.version}`;
    $('app-repo').onclick = (e) => { e.preventDefault(); window.overlay.openRepo(); };
    $('check-updates-setting').hidden = !state.updates;
    update = state.update;
    renderUpdate();
    // No page is open yet: the current list starts from its first tab,
    // unless it was left on the Home or the Settings page.
    showCurrentList();
    lookupPreset();
    for (const l of lists) for (const site of l.sites) if (!site.title) resolveTitle(site);
  })();
</script>
</body>
</html>
