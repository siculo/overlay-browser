# Builds the packages for Windows, Linux and macOS when a version tag (v*) is
# pushed, and attaches them to a draft GitHub release (marked as pre-release
# when the version has a suffix, e.g. v1.0.0-beta.1). The draft is published
# by hand after checking the notes.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # macOS: ad-hoc signature from package.json, no certificate lookup
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Overlay Browser ${TAG#v}" \
            --draft $prerelease \
            --generate-notes
